<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Overlay Composer</title>
<!-- ★ Pixel fonts สำหรับ Pixel RPG theme -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen&family=Roboto:wght@700&family=Noto+Sans:wght@700&family=Chakra+Petch:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: 'Kanit', 'Segoe UI', sans-serif; }

  /* ═══════════════════════════════════════════════════
     Canvas — พื้นที่หลักที่ widget อยู่ (absolute positioning)
     ═══════════════════════════════════════════════════ */
  #canvas {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
  }
  /* ★ canvas-outer = กล่องที่มีขนาจริง = scaled (คำนวณใน JS)
     ทำหน้าที่เป็น "ตัวแทนขนาด" ใน layout flow → flex center จัดกึ่งกลางให้ */
  #canvas-outer {
    flex-shrink: 0;
    position: relative;
  }
  /* ★ canvas-wrap = กรอบหน้ากระดาษจริง (1920×1080) — ถูก scale ทั้งใบ
     transform-origin: top left + absolute ภายใน outer (ไม่กระทบ layout) */
  #canvas-wrap {
    transform-origin: top left;
    transition: transform 0.15s ease-out;
    position: absolute;
    top: 0;
    left: 0;
  }
  /* ★ zoom toolbar — อยู่ใน sidebar เหนือ tab Widgets (เดิมลอยขวาบนบังปุ่ม ✕ ASK) */
  #zoom-toolbar {
    display: none;
    background: #10182e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 6px 4px;
    margin: 0 0 10px 0;
    flex-wrap: wrap;
    justify-content: center;
    row-gap: 4px;
  }
  body.edit-mode #zoom-toolbar { display: flex; align-items: center; gap: 4px; }
  #zoom-toolbar button {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    width: 28px; height: 28px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  #zoom-toolbar button:hover { background: rgba(74,158,255,0.3); }
  #zoom-toolbar #zoom-level {
    color: #fff;
    font-size: 12px;
    min-width: 44px;
    text-align: center;
    font-family: monospace;
  }

  /* ═══════════════════════════════════════════════════
     Widget ทั่วไป — กล่อง absolute ที่ตำแหน่ง x/y/w/h/z
     ═══════════════════════════════════════════════════ */
  .widget {
    position: absolute;
    overflow: hidden;
    border: 1px solid transparent;
  }
  .widget-inner {
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;   /* overlay ปกติ: ไม่รับ mouse (กัน click-through) */
    display: flex;          /* ★ ต้องเป็น flex เสมอ — กัน vertical direction พัง */
    align-items: center;    /* ★ จัดกลางแนวตั้ง (ไม่ยุบ) */
    gap: 6px;               /* ★ ระยะห่างระหว่าง element ลูก */
    flex-wrap: wrap;        /* ★ ให้ wrap เมื่อแนวนอนแคบ */
  }
  .widget.viewer-direction-vertical .widget-inner {
    flex-wrap: nowrap;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }

  /* ── Chat widget ── */
  .widget.type-chat .widget-inner {
    display: flex;
    flex-direction: column-reverse;   /* ข้อความใหม่ด้านล่าง */
    gap: 4px;
    padding: 4px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 2px #000;
    line-height: 1.3;
    word-break: break-word;
  }
  .widget.type-chat .chat-line { opacity: 0; animation: fadeIn 0.3s forwards; }
  .widget.type-chat .chat-line .author { font-weight: 700; }
  .widget.type-chat .chat-line .sep { opacity: 0.6; margin: 0 4px; }
  .widget.type-chat .chat-line .logo { width: 1.2em; height: 1.2em; vertical-align: middle; margin-right: 4px; }
  .widget.type-chat .chat-line .time { opacity: 0.6; font-size: 0.8em; margin-right: 4px; }
  .widget.type-chat .chat-line .text-block { display: inline; }
  /* layout: stacked = สองบรรทัด */
  .widget.type-chat.layout-stacked .chat-line .meta-line { display: block; }
  .widget.type-chat.layout-stacked .chat-line .text-block { display: block; }
  .widget.type-chat.layout-stacked_no_logo .chat-line .meta-line { display: block; }
  .widget.type-chat.layout-stacked_no_logo .chat-line .text-block { display: block; }
  /* direction variants (set by JS) */
  .widget.type-chat.dir-top .widget-inner { flex-direction: column; }
  .widget.type-chat.dir-bottom .widget-inner { flex-direction: column-reverse; }
  /* ★ alignment variants — ชิดซ้าย/กลาง/ชิดขวา ของกรอบ chat */
  .widget.type-chat.align-left .widget-inner { text-align: left; align-items: flex-start; }
  .widget.type-chat.align-center .widget-inner { text-align: center; align-items: center; }
  .widget.type-chat.align-right .widget-inner { text-align: right; align-items: flex-end; }
  /* animations */
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 70% { transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
  .widget.type-chat.anim-fade .chat-line { animation: fadeIn 0.3s forwards; }
  .widget.type-chat.anim-slide .chat-line { animation: slideIn 0.3s forwards; }
  .widget.type-chat.anim-pop .chat-line { animation: popIn 0.3s forwards; }
  /* exit animations (auto-hide via JS) */
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes slideOut { to { opacity: 0; transform: translateX(20px); } }
  .widget.type-chat.exiting-fade_out .chat-line { animation: fadeOut 0.4s forwards; }
  .widget.type-chat.exiting-slide_out .chat-line { animation: slideOut 0.4s forwards; }

  /* ── Alert widget (iframe ภายนอก) ── */
  .widget.type-alert .widget-inner iframe {
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
  }

  /* ── Viewer count widget ── */
  .widget.type-viewer .widget-inner {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    flex-wrap: wrap;
    padding: 6px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px #000;
  }
  .widget.type-viewer .viewer-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,0.4);
    padding: 2px 8px;
    border-radius: 8px;
  }
  /* ★ ขนาดไอคอนกำหนดผ่าน inline style (iconSize) — ทั้ง SVG คนและ img แพลตฟอร์มใช้ขนาดเดียวกัน */
  .widget.type-viewer .viewer-total {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(80,140,255,0.5);
    padding: 4px 12px;
    border-radius: 8px;
  }

  /* ── Clock widget ── */
  .widget.type-clock .widget-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 4px #000;
    font-variant-numeric: tabular-nums;
    /* ★ default bg = solid dark (เข้ม 100% ไม่โปร่งใส) — แต่ละ theme สามารถ override ได้ */
    background: #000;
    padding: 4px 12px;
    border-radius: 6px;
  }
  .widget.type-clock .clock-date {
    font-size: 0.45em;
    font-weight: 500;
    opacity: 0.85;
  }
  /* ── Clock themes (12 แบบ) ── */
  .widget.clock-theme-default .widget-inner { color: #fff; text-shadow: 0 1px 4px #000; }
  .widget.clock-theme-neon .widget-inner {
    color: #00ffff; text-shadow: 0 0 5px #00ffff, 0 0 15px #00ffff, 0 0 25px #0099ff;
    font-family: 'Courier New', monospace;
  }
  .widget.clock-theme-cyberpunk .widget-inner {
    color: #ff00ff; text-shadow: 0 0 5px #ff00ff, 0 0 10px #00ff88, 2px 2px 0 #00ff88;
    font-family: 'Courier New', monospace;
  }
  .widget.clock-theme-digital .widget-inner {
    color: #00ff00; text-shadow: 0 0 8px #00ff00; background: #000;
    font-family: 'Courier New', monospace; padding: 4px 12px; border: 1px solid #00ff00;
  }
  .widget.clock-theme-glass .widget-inner {
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
    padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
  }
  .widget.clock-theme-sakura .widget-inner {
    color: #ff69b4; text-shadow: 0 1px 3px #fff, 0 0 8px #ffb6c1;
    font-style: italic;
  }
  .widget.clock-theme-gold .widget-inner {
    color: #ffd700; text-shadow: 0 1px 2px #8b6914, 0 0 8px #ffd700;
    font-family: Georgia, serif;
  }
  .widget.clock-theme-retro .widget-inner {
    color: #f4e04d; text-shadow: 2px 2px 0 #c44569, 4px 4px 0 rgba(0,0,0,0.3);
    font-family: 'Courier New', monospace;
  }
  .widget.clock-theme-pipboy .widget-inner {
    color: #14ff14; text-shadow: 0 0 5px #14ff14; background: rgba(0,20,0,0.6);
    font-family: 'Courier New', monospace; padding: 4px 10px;
    border: 1px solid #14ff14; border-radius: 2px;
  }
  .widget.clock-theme-minimal .widget-inner {
    color: #fff; text-shadow: none; font-weight: 400; letter-spacing: 2px;
  }
  .widget.clock-theme-outline .widget-inner {
    color: transparent; -webkit-text-stroke: 1.5px #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
  }
  .widget.clock-theme-shadow .widget-inner {
    color: #fff; text-shadow: 3px 3px 0 #000, 5px 5px 8px rgba(0,0,0,0.6);
  }
  /* ── clock themes ใหม่ (8 แบบ) ── */
  .widget.clock-theme-digital-red .widget-inner {
    color: #ff3030; text-shadow: 0 0 8px #ff3030; background: #000;
    font-family: 'Courier New', monospace; padding: 4px 12px; border: 1px solid #ff3030;
  }
  .widget.clock-theme-digital-amber .widget-inner {
    color: #ffb000; text-shadow: 0 0 8px #ffb000; background: #000;
    font-family: 'Courier New', monospace; padding: 4px 12px; border: 1px solid #ffb000;
  }
  .widget.clock-theme-matrix .widget-inner {
    color: #00ff41; text-shadow: 0 0 5px #00ff41, 0 0 10px #00ff41;
    font-family: 'Courier New', monospace;
  }
  .widget.clock-theme-vaporwave .widget-inner {
    color: #ff71ce; text-shadow: 0 0 8px #ff71ce, 2px 2px 0 #01cdfe;
    font-family: 'Courier New', monospace;
  }
  .widget.clock-theme-fire .widget-inner {
    color: #ff6b1a; text-shadow: 0 0 8px #ff4500, 0 0 16px #ff8c00;
  }
  .widget.clock-theme-ice .widget-inner {
    color: #b3e5fc; text-shadow: 0 0 8px #4fc3f7, 0 1px 3px #0277bd;
  }
  .widget.clock-theme-royal .widget-inner {
    color: #ffd700; text-shadow: 0 1px 3px #1a237e, 0 0 8px #ffd700;
    font-family: Georgia, serif;
    background: rgba(26,35,126,0.4); padding: 4px 12px; border: 1px solid #ffd700;
  }
  .widget.clock-theme-sunset .widget-inner {
    color: #ff6b6b; text-shadow: 0 0 8px #ff9a8b, 0 1px 3px #c44569;
  }
  /* ── clock themes ชุดใหม่ (10 แบบ) ── */
  .widget.clock-theme-hologram .widget-inner {
    color: #00ffff; text-shadow: 0 0 3px #ff00ff, 0 0 8px #00ffff;
    background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(255,0,255,0.1));
    padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(0,255,255,0.4);
  }
  .widget.clock-theme-led .widget-inner {
    color: #ff0000; text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000;
    font-family: 'Courier New', monospace; letter-spacing: 2px;
    background: rgba(20,0,0,0.6); padding: 4px 10px; border-radius: 2px;
  }
  .widget.clock-theme-led-green .widget-inner {
    color: #00ff00; text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00;
    font-family: 'Courier New', monospace; letter-spacing: 2px;
    background: rgba(0,20,0,0.6); padding: 4px 10px; border-radius: 2px;
  }
  .widget.clock-theme-led-blue .widget-inner {
    color: #0080ff; text-shadow: 0 0 5px #0080ff, 0 0 10px #0080ff;
    font-family: 'Courier New', monospace; letter-spacing: 2px;
    background: rgba(0,0,20,0.6); padding: 4px 10px; border-radius: 2px;
  }
  .widget.clock-theme-aqua .widget-inner {
    color: #7fffd4; text-shadow: 0 0 8px #40e0d0, 0 1px 2px #008080;
  }
  .widget.clock-theme-coral .widget-inner {
    color: #ff7f50; text-shadow: 0 0 8px #ff6347, 0 1px 3px #8b0000;
  }
  .widget.clock-theme-mint .widget-inner {
    color: #98ff98; text-shadow: 0 0 6px #00ff7f, 0 1px 2px #006400;
  }
  .widget.clock-theme-lavender .widget-inner {
    color: #e6e6fa; text-shadow: 0 0 8px #9370db, 0 1px 2px #4b0082;
  }
  .widget.clock-theme-bronze .widget-inner {
    color: #cd7f32; text-shadow: 0 1px 2px #8b4513, 0 0 6px #cd7f32;
    font-family: Georgia, serif;
  }
  .widget.clock-theme-platinum .widget-inner {
    color: #e5e4e2; text-shadow: 0 0 4px #b8b8b8, 0 1px 2px #808080;
  }
  .widget.clock-theme-neon-purple .widget-inner {
    color: #bf00ff; text-shadow: 0 0 5px #bf00ff, 0 0 10px #8000ff, 0 0 20px #bf00ff;
    font-family: 'Courier New', monospace;
  }

  /* 🎮 Pixel RPG — กล่องบทพูดเกม RPG โบราณ (ฟอนต์ dot pixel + ฉากดำ ขอบขาว pixelate) */
  .widget.clock-theme-pixel-rpg .widget-inner {
    /* ★ ฉากหลัง: ดำสนิท */
    background: #000 !important;
    /* ★ ขอบขาว pixelate: ขาวนอกหนา + ขาวในบาง (double border สไตล์ RPG) */
    border: 4px solid #fff !important;
    /* ★ box-shadow: ขอบดำด้านใน + เงาแบบ hard (ไม่เบลอ) */
    box-shadow:
      inset 0 0 0 2px #000,
      inset 0 0 0 4px #fff,
      4px 4px 0 #000 !important;
    padding: 8px 14px !important;
    border-radius: 0 !important;   /* ★ มุมตรง ไม่มน — สไตล์ pixel */
    /* ★ ฟอนต์ dot pixel จริง (VT323 = CRT terminal, Press Start 2P = 8-bit) */
    font-family: 'VT323', 'Press Start 2P', monospace !important;
    color: #ffffff;
    text-shadow: 2px 2px 0 #000 !important;
    font-weight: 400 !important;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -webkit-font-smoothing: none;
    font-smooth: never;
  }
  .widget.clock-theme-pixel-rpg .clock-time {
    /* ★ เวลา: สีขาวสว่าง + hard shadow ดำ (เหมือนเกม 8-bit)
       ไม่ใส่ !important ที่ color เพื่อให้ color picker ใน settings ทับได้ */
    color: #ffffff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000 !important;
    font-size: 1.4em !important;   /* ★ ใหญ่ขึ้นเพราะ VT323 เล็ก */
    letter-spacing: 2px;
  }
  .widget.clock-theme-pixel-rpg .clock-date {
    /* ★ วันที่: สีเขียวอ่อนแบบ RPG status bar (ไม่ใส่ !important ที่ color) */
    color: #94e44d;
    text-shadow: 1px 1px 0 #000 !important;
    font-size: 0.9em !important;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* ════════════════════════════════════════════════════════════════
     CLOCK STYLES (port 100% จาก mooncape source files)
     — Dot Clock (3) / Circle Clock (5×4=20) / Live Text (5) / FPS (3)
     — เมื่อเลือก style จะ lock ค่าทุกอย่างตามต้นฉบับ (ปรับไม่ได้)
     ════════════════════════════════════════════════════════════════ */

  /* ── Common: เมื่อมี clock-style → ล้างค่าเริ่มต้นทั้งหมด ── */
  .widget.clock-style-set .widget-inner {
    background: transparent !important; padding: 0 !important; border-radius: 0 !important;
    box-shadow: none !important; border: none !important; text-shadow: none !important;
    display: flex !important; flex-direction: row !important; gap: 0 !important;
  }

  /* ═══ DOT CLOCK (3 designs) — Silkscreen + double border + typing + blink ═══ */
  /* โครงสร้าง: .dot-outbox > .dot-inbox > (.dot-time + .dot-wait.blink) */
  .widget.clock-style-dot1 .widget-inner,
  .widget.clock-style-dot2 .widget-inner,
  .widget.clock-style-dot3 .widget-inner { justify-content: center !important; align-items: center !important; }
  .widget[class*="clock-style-dot"] .dot-outbox {
    position: relative; background: #fff; border: 1.6px solid #000; border-radius: 4px;
    display: inline-flex; box-sizing: border-box;
  }
  .widget[class*="clock-style-dot"] .dot-inbox {
    position: relative; background: #242424; border: 1.6px solid #000; border-radius: 4px;
    display: inline-flex; align-items: center; box-sizing: border-box;
    margin: 4px;
  }
  .widget[class*="clock-style-dot"] .dot-time {
    color: #fff; font-family: 'Silkscreen', 'Courier New', monospace; font-weight: 400;
    line-height: 1em; white-space: nowrap; letter-spacing: 1px;
    padding: 8px 0 8px 12px;
  }
  .widget[class*="clock-style-dot"] .dot-wait {
    color: #fff; font-family: 'Silkscreen', 'Courier New', monospace; font-weight: 400;
    padding: 0 12px 0 8px; align-self: center;
    animation: dot-blink 0.75s steps(2, jump-none) infinite alternate;
  }
  @keyframes dot-blink { 0% { opacity: 0; } 100% { opacity: 1; } }
  /* dot1: HH:MM (narrow) */
  .widget.clock-style-dot1 .dot-time { font-size: 28px; }
  .widget.clock-style-dot1 .dot-wait { font-size: 16px; }
  /* dot2: YYYY.MM.DD HH:MM (wide) */
  .widget.clock-style-dot2 .dot-time { font-size: 28px; }
  .widget.clock-style-dot2 .dot-wait { font-size: 16px; }
  /* dot3: DD.MM.YYYY HH:MM (wide) + ● cursor */
  .widget.clock-style-dot3 .dot-time { font-size: 28px; }
  .widget.clock-style-dot3 .dot-wait { font-size: 16px; }

  /* ═══ CIRCLE CLOCK (5 colors × 4 variants = 20) ═══ */
  /* โครงสร้าง: .cc-main > (.cc-oc + .cc-ic + .cc-t1 [+ .cc-t2 | .cc-live]) */
  /* ★ oc = วงกลมนอก (conic-gradient หมุนตามวินาที), ic = วงกลมใน (สีทึบ), t1 = เวลา */
  /* ★ ใช้ % ทั้งหมดเพื่อให้ scale ตาม widget size (responsive) */
  .widget[class*="clock-style-cc"] .widget-inner {
    justify-content: center !important; align-items: center !important;
    position: relative !important; overflow: visible !important;
    /* ★ aspect-ratio บังคับให้ widget เป็นวงกลม — ใช้ min(w,h) เป็นเส้นผ่านศูนย์กลาง */
  }
  .widget[class*="clock-style-cc"] .cc-main {
    position: relative; width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-family: 'Noto Sans', sans-serif; font-weight: 700;
    /* ★ กำหนดขนาดเป็น % ของ widget — ใช้ min(width,height) เป็น base */
    /* ผ่าน JS: cc-main จะถูกปรับขนาดตาม widget */
  }
  /* ★ วงกลมนอก — ขนาด = 100% ของ cc-main */
  .widget[class*="clock-style-cc"] .cc-oc {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; height: 100%; border-radius: 50%; pointer-events: none;
  }
  /* ★ วงกลมใน — ขนาด = 88% ของ cc-main (เผื่อขอบวงแหวน) */
  .widget[class*="clock-style-cc"] .cc-ic {
    position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
    width: 88%; height: 88%; border-radius: 50%; pointer-events: none;
  }

  /* ── Image & Slideshow widget ── */
  .widget.type-image .widget-inner {

    padding: 0;

  .widget.type-image .slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    will-change: opacity, transform;
  }
  .widget.type-image .slide.active { opacity: 1; }
  /* fit mode (กำหนดใน JS ผ่าน inline style แต่ละ slide) — fallback */

  .widget.type-image .slide-counter {

  /* ═══ Transition animations (ตอนเปลี่ยนรูป) ═══ */
  /* tr-fade: สลับ opacity */
  .widget.type-image.tr-fade .slide { transition: opacity 0.6s ease; }
  /* tr-none: เปลี่ยนทันที ไม่มี animation */
  .widget.type-image.tr-none .slide { transition: none; }
  /* tr-slide-left: รูปใหม่滑入จากขวา */
  .widget.type-image.tr-slide-left .slide { transform: translateX(100%); transition: transform 0.6s ease, opacity 0.6s ease; }
  .widget.type-image.tr-slide-left .slide.active { transform: translateX(0); }
  .widget.type-image.tr-slide-left .slide.exiting { transform: translateX(-100%); opacity: 1; }
  /* tr-slide-right: รูปใหม่滑入จากซ้าย */
  .widget.type-image.tr-slide-right .slide { transform: translateX(-100%); transition: transform 0.6s ease, opacity 0.6s ease; }
  .widget.type-image.tr-slide-right .slide.active { transform: translateX(0); }
  .widget.type-image.tr-slide-right .slide.exiting { transform: translateX(100%); opacity: 1; }
  /* tr-slide-up: รูปใหม่ขึ้นจากล่าง */
  .widget.type-image.tr-slide-up .slide { transform: translateY(100%); transition: transform 0.6s ease, opacity 0.6s ease; }
  .widget.type-image.tr-slide-up .slide.active { transform: translateY(0); }
  .widget.type-image.tr-slide-up .slide.exiting { transform: translateY(-100%); opacity: 1; }
  /* tr-slide-down: รูปใหม่ลงจากบน */
  .widget.type-image.tr-slide-down .slide { transform: translateY(-100%); transition: transform 0.6s ease, opacity 0.6s ease; }
  .widget.type-image.tr-slide-down .slide.active { transform: translateY(0); }
  .widget.type-image.tr-slide-down .slide.exiting { transform: translateY(100%); opacity: 1; }
  /* tr-zoom-in: รูปใหม่ซูมเข้า */
  .widget.type-image.tr-zoom-in .slide { transform: scale(0.3); transition: transform 0.6s ease, opacity 0.6s ease; }
  .widget.type-image.tr-zoom-in .slide.active { transform: scale(1); }
  /* tr-zoom-out: รูปใหม่ซูมออก */
  .widget.type-image.tr-zoom-out .slide { transform: scale(1.5); transition: transform 0.6s ease, opacity 0.6s ease; }
  .widget.type-image.tr-zoom-out .slide.active { transform: scale(1); }
  /* tr-flip: พลิก 3D */
  .widget.type-image .widget-inner { perspective: 1000px; }
  .widget.type-image.tr-flip .slide { transform: rotateY(90deg); transition: transform 0.6s ease, opacity 0.6s ease; backface-visibility: hidden; }
  .widget.type-image.tr-flip .slide.active { transform: rotateY(0); }

  /* ═══ Text widget ═══ */
  .widget.type-text .widget-inner {
    display: block;          /* ★ block แทน flex → text-align ทำงานได้ */
    overflow: hidden;
    background: transparent;
    padding: 0;
  }
  /* ★ schedule mode — parent เป็น relative เพื่อให้ text-line (absolute) จัดกลางได้ */
  .widget.type-text.text-schedule .widget-inner { position: relative; }
  .widget.type-text .text-content {
    width: 100%;
    text-align: var(--text-align, center);
    word-break: break-word;
    /* ★ จัดกลางแนวตั้งด้วย (สำหรับ static mode) */
    display: flex;
    align-items: center;
    min-height: 100%;
    justify-content: var(--text-justify, center);   /* left/center/right แบบ flex */
  }
  /* scroll mode — วิ่งซ้าย loop */
  /* scroll mode — ใช้ JS animation (ควบคุม delay + รอข้อความออกจากจอให้หมด) */
  .widget.type-text.text-scroll .widget-inner {
    justify-content: flex-start;
    position: relative;
  }
  .widget.type-text.text-scroll .text-content {
    white-space: nowrap;
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    will-change: left;
    /* ★ ชิดซ้ายเสมอใน scroll mode — ข้อความเริ่มที่ขอบขวาแล้วไหลเข้ามาทีละน้อย
       (เดิม inherit center จาก .text-content → ข้อความยาวกว่ากล่องโผล่กลางจอตอน reset
        และ scrollWidth วัดไม่ครบเพราะส่วนล้นซ้ายไม่ถูกนับ → timing loop คลาด) */
    text-align: left;
    justify-content: flex-start;
  }
  /* schedule mode — fadeIn/fadeOut transition */
  .widget.type-text.text-schedule .text-line {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: var(--text-justify, center);   /* ★ รับจาก align setting */
    padding: 0 8px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .widget.type-text.text-schedule .text-line.active {
    opacity: 1;
    transform: translateY(0);
  }

  .widget.ask-theme-forest   { --ask-accent:#16a34a; --ask-accent2:#86efac; --ask-bg:rgba(8,32,18,1);
                               --ask-card:rgba(15,55,32,1); --ask-border:rgba(134,239,172,0.45); --ask-win:#fbbf24; }
  .widget.ask-theme-ice      { --ask-accent:#38bdf8; --ask-accent2:#bae6fd; --ask-bg:rgba(15,30,50,1);
                               --ask-card:rgba(30,55,85,1); --ask-border:rgba(186,230,253,0.5);
                               --ask-text:#f0f9ff; --ask-dim:#bae6fd; --ask-win:#67e8f9; }
  .widget.ask-theme-candy    { --ask-accent:#d946ef; --ask-accent2:#f0abfc; --ask-bg:rgba(40,10,50,1);
                               --ask-card:rgba(70,20,85,1); --ask-border:rgba(232,121,249,0.5); --ask-win:#f0abfc; }
  .widget.ask-theme-steel    { --ask-accent:#64748b; --ask-accent2:#cbd5e1; --ask-bg:rgba(20,24,32,1);
                               --ask-card:rgba(38,44,56,1); --ask-border:rgba(148,163,184,0.45); --ask-win:#38bdf8; }
  .widget.ask-theme-fire     { --ask-accent:#ef4444; --ask-accent2:#fb923c; --ask-bg:rgba(45,10,5,1);
                               --ask-card:rgba(80,20,10,1); --ask-border:rgba(251,146,60,0.5); --ask-win:#fb923c; }
  .widget.ask-theme-cyberpunk{ --ask-accent:#facc15; --ask-accent2:#22d3ee; --ask-bg:rgba(12,12,20,1);
                               --ask-card:rgba(25,25,40,1); --ask-border:rgba(250,204,21,0.5);
                               --ask-text:#fefce8; --ask-dim:#a1a1aa; --ask-win:#22d3ee; }
  .widget.ask-theme-mint     { --ask-accent:#10b981; --ask-accent2:#6ee7b7; --ask-bg:rgba(5,40,35,1);
                               --ask-card:rgba(10,60,52,1); --ask-border:rgba(110,231,183,0.45);
                               --ask-text:#ecfdf5; --ask-dim:#a7f3d0; --ask-win:#fbbf24; }
  .widget.ask-theme-space    { --ask-accent:#6366f1; --ask-accent2:#a5b4fc; --ask-bg:rgba(10,10,35,1);
                               --ask-card:rgba(22,22,55,1); --ask-border:rgba(165,180,252,0.5); --ask-win:#c4b5fd; }
  /* ═══ ธีมพรีเมียม — มีเอฟเฟคพิเศษเพิ่ม (ไม่ใช่แค่เปลี่ยนสี) ═══ */
  /* 🌟 Aurora — ขอบไล่สีรุ้งเรืองแสง + glow ตอนโหวต */
  .widget.ask-theme-aurora {
    --ask-accent:#8b5cf6; --ask-accent2:#22d3ee; --ask-bg:rgba(12,12,30,1);
    --ask-card:rgba(25,25,55,1); --ask-border:transparent; --ask-win:#34d399;
    --ask-text:#f0fdfa; --ask-dim:#94a3b8;
  }
  .widget.ask-theme-aurora .ask-panel {
    border: 2px solid transparent;
    background: linear-gradient(160deg, rgba(12,12,30,0.97), rgba(20,20,45,0.97)) padding-box,
                linear-gradient(135deg, #8b5cf6, #22d3ee, #34d399, #8b5cf6) border-box;
    box-shadow: 0 0 20px rgba(139,92,246,0.3), 0 0 40px rgba(34,211,238,0.15);
  }
  .widget.ask-theme-aurora .ask-choice {
    border: 1px solid transparent;
    background: linear-gradient(160deg, rgba(25,25,55,0.9), rgba(35,35,70,0.9)) padding-box,
                linear-gradient(135deg, rgba(139,92,246,0.4), rgba(34,211,238,0.4)) border-box;
  }
  .widget.ask-theme-aurora .ask-bar {
    background: linear-gradient(90deg, #8b5cf6, #22d3ee, #34d399);
  }

  /* 💎 Crystal — กระจกเหลี่ยมมุมแหลม + แสงสะท้อนวิ่ง */
  .widget.ask-theme-crystal {
    --ask-accent:#60a5fa; --ask-accent2:#93c5fd; --ask-bg:rgba(15,20,35,0.95);
    --ask-card:rgba(30,40,65,0.85); --ask-border:rgba(147,197,253,0.6); --ask-win:#34d399;
    --ask-text:#e0f2fe; --ask-dim:#93c5fd;
  }
  .widget.ask-theme-crystal .ask-panel {
    border: 1px solid rgba(147,197,253,0.6);
    border-radius: 0;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    box-shadow: 0 0 15px rgba(96,165,250,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .widget.ask-theme-crystal .ask-panel::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
    animation: crystal-shine 4s ease-in-out infinite;
  }
  @keyframes crystal-shine {
    0%, 100% { transform: translateX(-100%); }
    50% { transform: translateX(100%); }
  }

  /* 🌋 Magma — ขอบลุกไหม้ + สั่นเบา ๆ ตอนโหวตเข้า */
  .widget.ask-theme-magma {
    --ask-accent:#f97316; --ask-accent2:#fbbf24; --ask-bg:rgba(25,8,5,1);
    --ask-card:rgba(55,18,10,1); --ask-border:rgba(249,115,22,0.7); --ask-win:#fbbf24;
    --ask-text:#fff7ed; --ask-dim:#fdba74;
  }
  .widget.ask-theme-magma .ask-panel {
    border: 2px solid rgba(249,115,22,0.7);
    box-shadow: 0 0 15px rgba(249,115,22,0.4), 0 0 30px rgba(251,191,36,0.2),
                inset 0 0 20px rgba(249,115,22,0.08);
    animation: magma-pulse 3s ease-in-out infinite;
  }
  @keyframes magma-pulse {
    0%, 100% { box-shadow: 0 0 15px rgba(249,115,22,0.4), 0 0 30px rgba(251,191,36,0.2), inset 0 0 20px rgba(249,115,22,0.08); }
    50% { box-shadow: 0 0 20px rgba(249,115,22,0.6), 0 0 40px rgba(251,191,36,0.3), inset 0 0 25px rgba(249,115,22,0.12); }
  }
  .widget.ask-theme-magma .ask-bar {
    background: linear-gradient(90deg, #dc2626, #f97316, #fbbf24);
  }

  /* 🕶️ Neon Frame — กรอบนีออนสว่างวาบ + เรืองแสงตอนโหวต */
  .widget.ask-theme-neonframe {
    --ask-accent:#ec4899; --ask-accent2:#f0abfc; --ask-bg:rgba(8,8,18,1);
    --ask-card:rgba(20,20,40,1); --ask-border:#ec4899; --ask-win:#22d3ee;
    --ask-text:#fdf4ff; --ask-dim:#c084fc;
  }
  .widget.ask-theme-neonframe .ask-panel {
    border: 2px solid #ec4899;
    box-shadow: 0 0 8px #ec4899, 0 0 20px rgba(236,72,153,0.5),
                inset 0 0 10px rgba(236,72,153,0.15);
  }
  .widget.ask-theme-neonframe .ask-choice {
    border: 1px solid rgba(236,72,153,0.5);
    box-shadow: inset 0 0 6px rgba(236,72,153,0.1);
  }
  .widget.ask-theme-neonframe .ask-choice.winner {
    border-color: #22d3ee;
    box-shadow: 0 0 12px #22d3ee, inset 0 0 8px rgba(34,211,238,0.2);
  }
  .widget.ask-theme-neonframe .ask-bar {
    background: linear-gradient(90deg, #ec4899, #8b5cf6, #22d3ee);
  }

  /* 🎭 Vintage — กรอบไม้/กระดาษเก่า + มุมโค้งใหญ่ */
  .widget.ask-theme-vintage {
    --ask-accent:#92400e; --ask-accent2:#d97706; --ask-bg:linear-gradient(165deg,#f5f0e1,#e8dcc5);
    --ask-card:rgba(180,160,120,0.3); --ask-border:#92400e; --ask-win:#059669;
    --ask-text:#3e2723; --ask-dim:#78716c;
  }
  .widget.ask-theme-vintage .ask-panel {
    border: 3px double #92400e;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(62,39,35,0.3), inset 0 0 0 1px rgba(146,64,14,0.2);
  }
  .widget.ask-theme-vintage .ask-choice {
    border: 1px solid rgba(146,64,14,0.4);
    border-radius: 4px;
    box-shadow: inset 0 1px 2px rgba(146,64,14,0.15);
  }
  .widget.ask-theme-vintage .ask-choice-key {
    border-radius: 2px;
    box-shadow: 1px 1px 2px rgba(62,39,35,0.3);
  }
  .widget.ask-theme-vintage .ask-bar {
    background: linear-gradient(90deg, #92400e, #d97706);
  }

  /* ⚡ Electric — ขอบสายฟ้า + จุดวิบวับ */
  .widget.ask-theme-electric {
    --ask-accent:#facc15; --ask-accent2:#a3e635; --ask-bg:rgba(10,12,8,1);
    --ask-card:rgba(25,30,18,1); --ask-border:#facc15; --ask-win:#a3e635;
    --ask-text:#fefce8; --ask-dim:#d9f99d;
  }
  .widget.ask-theme-electric .ask-panel {
    border: 2px solid #facc15;
    box-shadow: 0 0 10px #facc15, 0 0 25px rgba(250,204,21,0.4),
                inset 0 0 8px rgba(250,204,21,0.1);
    animation: electric-flicker 4s linear infinite;
  }
  @keyframes electric-flicker {
    0%, 92%, 96%, 100% { opacity: 1; }
    94% { opacity: 0.92; }
    95% { opacity: 0.97; }
  }
  .widget.ask-theme-electric .ask-choice-key {
    box-shadow: 0 0 6px #facc15, 0 1px 3px rgba(0,0,0,0.4);
  }
  .widget.ask-theme-electric .ask-bar {
    background: linear-gradient(90deg, #facc15, #a3e635, #22d3ee);
    box-shadow: 0 0 6px rgba(250,204,21,0.5);
  }

  /* ★ เฟรมเต็ม canvas โปร่งใส (ล็อคขนาด) */
  .widget.type-ask .widget-inner {
    position: absolute; inset: 0;
    display: block;
    background: transparent; border: none; padding: 0; gap: 0;
    font-family: "Kanit","Leelawadee UI","Segoe UI",sans-serif;
    color: var(--ask-text);
    overflow: hidden;
  }
  /* ── .ask-panel = แผงโพลจริง ── */
  .ask-panel {
    position: absolute;
    display: flex; flex-direction: column;
    opacity: var(--ask-opacity, 1);
    background: var(--ask-bg);
    border: 1px solid var(--ask-border);
    border-radius: calc(14px * var(--ask-scale));
    padding: calc(12px * var(--ask-scale)) calc(14px * var(--ask-scale));
    gap: calc(10px * var(--ask-scale));
    overflow: hidden;
    min-width: 0; min-height: 0;
  }
  /* เสาแนวตั้ง — สูงตามเนื้อหา ชิดบน กว้างตาม % */
  .widget.ask-mode-vleft  .ask-panel { top: 0; bottom: auto; max-height: 100%; left: 0; width: calc(var(--ask-extend) * 1%); }
  .widget.ask-mode-vright .ask-panel { top: 0; bottom: auto; max-height: 100%; right: 0; width: calc(var(--ask-extend) * 1%); }
  /* แถบแนวนอน — เต็มกว้าง สูงตาม % + บน/ล่าง */
  .widget.ask-mode-hband .ask-panel { left: 0; right: 0; height: calc(var(--ask-extend) * 1%); }
  .widget.ask-anchor-top    .ask-panel.hband-anchor { top: 0; }
  .widget.ask-anchor-bottom .ask-panel.hband-anchor { bottom: 0; }
  /* ★ Minimal — ย้ายอิสระ + ★ความกว้าง FIX ตามที่ user ตั้ง (ไม่ตามเนื้อหา —
     เดิม max-content ทำให้คำถามสั้น = กล่องหด ตำแหน่งทดสอบใน composer ไม่ตรงของจริง) */
  .widget.ask-mode-minimal .ask-panel {
    top: calc(var(--ask-py) * 1%); left: calc(var(--ask-px) * 1%);
    transform: translate(-50%, -50%);
    width: calc(var(--ask-minw, 340) * 1px);
    max-width: 92%;
    max-height: 92%;
  }
  /* ตอน JS วัดแล้วจะ override ด้วย px (--ask-min-fixed = จุดกึ่งกลางที่ clamp แล้ว) */
  .widget.ask-mode-minimal .ask-panel.ask-min-fixed { left: var(--ask-min-x); top: var(--ask-min-y); }
  /* ── ส่วนประกอบ ── */
  .ask-question {
    color: var(--ask-text);
    font-size: calc(var(--ask-qfs, 24) * 1px); font-weight: 700; text-align: center;
    line-height: 1.25; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    border-bottom: 1px solid var(--ask-border);
    padding-bottom: calc(8px * var(--ask-scale));
    /* ★ ยาวเกิน → JS marquee เลื่อน (เหมือน Now Playing) — สั้นพอก็จัดกึ่งกลางปกติ */
    white-space: nowrap; overflow: hidden;
  }
  .ask-question-text { display: inline-block; white-space: nowrap; will-change: transform; }
  .ask-choices { flex: 1; min-height: 0; align-content: center; overflow: hidden auto; }
  .widget.ask-mode-vleft .ask-choices, .widget.ask-mode-vright .ask-choices {
    display: flex; flex-direction: column; justify-content: center;
    gap: calc(10px * var(--ask-scale));
  }
  .widget.ask-mode-hband .ask-choices {
    display: flex; flex-direction: row; align-items: stretch;
    gap: calc(10px * var(--ask-scale));
  }
  .widget.ask-mode-minimal .ask-choices {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: calc(8px * var(--ask-scale));
  }
  .ask-choice {
    background: var(--ask-card);
    border: 1px solid var(--ask-border);
    border-radius: calc(10px * var(--ask-scale));
    padding: calc(10px * var(--ask-scale)) calc(12px * var(--ask-scale));
    display: flex; flex-direction: column; gap: calc(6px * var(--ask-scale));
    min-width: 0; flex: 1;
  }
  .widget.ask-mode-hband .ask-choice { justify-content: center; }
  .ask-choice-top { display: flex; align-items: center; gap: calc(8px * var(--ask-scale)); min-width: 0; }
  .ask-choice-key {
    background: var(--ask-accent); color: #fff; font-weight: 700;
    font-size: calc(14px * var(--ask-scale));
    white-space: nowrap;
    border-radius: calc(6px * var(--ask-scale));
    padding: calc(2px * var(--ask-scale)) calc(9px * var(--ask-scale)); flex-shrink: 0;
    /* ★ เงาดำฟุ้งๆ ด้านหลังตัวหนังสือ — กันกลืนกับฉาก (ไม่ยกตัวลอย) */
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .ask-choice-label {
    color: var(--ask-text);
    font-size: calc(var(--ask-cfs, 18) * 1px); font-weight: 600;
    line-height: 1.3;
    white-space: normal; overflow-wrap: break-word; word-break: break-word;
  }
  .ask-bar-wrap { background: rgba(0,0,0,0.45); border-radius: calc(4px * var(--ask-scale)); height: calc(11px * var(--ask-scale)); overflow: hidden; }
  .ask-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--ask-accent), var(--ask-accent2));
    transition: width 1.6s cubic-bezier(0.33, 1, 0.68, 1);  /* ★ easeOutCubic ยาว — ไหลต่อเนื่องระหว่างโหวต */ border-radius: calc(4px * var(--ask-scale)); }
  .ask-choice-count { color: var(--ask-accent2); font-size: calc(14px * var(--ask-scale)); font-weight: 700; margin-left: auto; }
  .ask-choice.winner { border-color: var(--ask-win); box-shadow: 0 0 calc(14px * var(--ask-scale)) var(--ask-win); }
  .ask-choice.winner .ask-choice-key { background: var(--ask-win); }
  .ask-choice.winner .ask-bar { background: linear-gradient(90deg, var(--ask-win), color-mix(in srgb, var(--ask-win) 60%, #fff)); }
  .ask-footer {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border-top: 1px solid var(--ask-border);
    padding-top: calc(8px * var(--ask-scale));
    color: var(--ask-dim); font-size: calc(14px * var(--ask-scale)); font-weight: 600;
    flex-shrink: 0;
  }
  .ask-countdown { color: #f59e0b; font-variant-numeric: tabular-nums; }
  .ask-timebar {
    height: calc(10px * var(--ask-scale));
    background: rgba(0, 0, 0, 0.45);
    border-radius: calc(999px * var(--ask-scale));
    overflow: hidden; margin-top: calc(4px * var(--ask-scale));
    flex-shrink: 0;
  }
  .ask-timebar-fill { height: 100%; width: 100%; border-radius: calc(999px * var(--ask-scale));
    transition: background-color 0.5s ease;  /* ★ width ไม่ transition — rAF อัปเดตทุกเฟรม สมูทสุด */ }
  .ask-timebar-fill.tb-green  { background: linear-gradient(90deg, #059669, #34d399); }
  .ask-timebar-fill.tb-yellow { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .ask-timebar-fill.tb-red    { background: linear-gradient(90deg, #dc2626, #f87171); }
  .ask-badge-ended {
    background: var(--ask-win); color: #fff; font-size: calc(12px * var(--ask-scale));
    font-weight: 700; border-radius: calc(4px * var(--ask-scale));
    padding: calc(1px * var(--ask-scale)) calc(8px * var(--ask-scale));
    margin-right: calc(6px * var(--ask-scale));
    /* ★ เงาดำฟุ้งๆ รอบกล่อง — กันกลืนกับฉาก (เหมือน ask-choice-key) */
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
    box-shadow: 0 0 6px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.4);
  }
  .ask-empty { color: #64748b; font-size: 13px; text-align: center; }

  /* ═══ Bar Styles — หลอดโหวต 6 แบบ (แยกจากธีม ผสมกันได้อิสระ) ═══ */
  .widget.ask-bar-classic .ask-bar-wrap { border-radius: 999px; }
  .widget.ask-bar-striped .ask-bar-wrap { border-radius: 4px; }
  .widget.ask-bar-striped .ask-bar {
    background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.2) 0 6px, transparent 6px 12px);
    background-size: 200% 100%;
    animation: bar-stripes 2s linear infinite;
  }
  @keyframes bar-stripes { 0% { background-position: 0 0; } 100% { background-position: 24px 0; } }
  .widget.ask-bar-segmented .ask-bar-wrap {
    border-radius: 4px;
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 14px, transparent 14px 18px);
    mask-image: repeating-linear-gradient(90deg, #000 0 14px, transparent 14px 18px);
  }
  .widget.ask-bar-glow .ask-bar-wrap { border-radius: 999px; background: rgba(0,0,0,0.35); }
  .widget.ask-bar-glow .ask-bar {
    border-radius: 999px;
    box-shadow: 0 0 8px var(--ask-accent), 0 0 16px var(--ask-accent2);
  }
  .widget.ask-bar-thin .ask-bar-wrap { border-radius: 999px; height: calc(5px * var(--ask-scale)) !important; }
  .widget.ask-bar-thin .ask-bar { border-radius: 999px; }
  .widget.ask-bar-blocks .ask-bar-wrap {
    border-radius: 0; background: transparent; height: calc(14px * var(--ask-scale)) !important;
    display: flex; gap: 2px; overflow: hidden;
  }
  .widget.ask-bar-blocks .ask-bar {
    border-radius: 2px;
    background-image: repeating-linear-gradient(90deg, var(--ask-accent) 0 16px, var(--ask-accent2) 16px 32px);
  }

  /* ── Bar styles เพิ่มเติม ── */
  /* wavy — คลื่นไหวตอนขยับ */
  .widget.ask-bar-wavy .ask-bar-wrap { border-radius: 999px; overflow: hidden; }
  .widget.ask-bar-wavy .ask-bar {
    border-radius: 999px;
    clip-path: polygon(0 20%, 3% 0, 6% 20%, 9% 0, 12% 20%, 15% 0, 18% 20%, 21% 0, 24% 20%, 27% 0, 30% 20%, 33% 0, 36% 20%, 39% 0, 42% 20%, 45% 0, 48% 20%, 51% 0, 54% 20%, 57% 0, 60% 20%, 63% 0, 66% 20%, 69% 0, 72% 20%, 75% 0, 78% 20%, 81% 0, 84% 20%, 87% 0, 90% 20%, 93% 0, 96% 20%, 100% 0, 100% 100%, 0 100%);
  }
  /* dots — จุดกลมเรียงแถว */
  .widget.ask-bar-dots .ask-bar-wrap {
    border-radius: 0; background: transparent; height: calc(14px * var(--ask-scale)) !important;
    display: flex; gap: 3px; overflow: hidden; align-items: center;
  }
  .widget.ask-bar-dots .ask-bar {
    border-radius: 0; height: 100%;
    background-image: radial-gradient(circle, var(--ask-accent) 3px, var(--ask-accent2) 3px, transparent 4px);
    background-size: 12px 100%;
    background-repeat: repeat-x;
  }
  /* neon-line — เส้นนีออนบางสว่าง */
  .widget.ask-bar-neonline .ask-bar-wrap {
    border-radius: 999px; background: rgba(0,0,0,0.3);
    height: calc(7px * var(--ask-scale)) !important;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }
  .widget.ask-bar-neonline .ask-bar {
    border-radius: 999px;
    box-shadow: 0 0 6px var(--ask-accent), 0 0 14px var(--ask-accent), 0 0 20px var(--ask-accent2);
    filter: saturate(1.4) brightness(1.2);
  }
  /* gradient-flow — ไล่สีไหลย้อนกลับ */
  .widget.ask-bar-gradientflow .ask-bar-wrap { border-radius: 999px; }
  .widget.ask-bar-gradientflow .ask-bar {
    border-radius: 999px;
    background-size: 200% 100%;
    animation: gradient-flow 3s ease infinite;
  }
  @keyframes gradient-flow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  /* chunky — บล็อกเหลี่ยมหนาช่องกว้าง */
  .widget.ask-bar-chunky .ask-bar-wrap {
    border-radius: 0; background: transparent; height: calc(16px * var(--ask-scale)) !important;
    display: flex; gap: 4px; overflow: hidden;
  }
  .widget.ask-bar-chunky .ask-bar {
    border-radius: 0;
    background-image: repeating-linear-gradient(90deg,
      var(--ask-accent) 0 20px, rgba(0,0,0,0.3) 20px 24px);
  }
  /* pulse — เต้นเป็นจังหวะ */
  .widget.ask-bar-pulse .ask-bar-wrap { border-radius: 999px; }
  .widget.ask-bar-pulse .ask-bar {
    border-radius: 999px;
    animation: bar-pulse-glow 2s ease-in-out infinite;
  }
  @keyframes bar-pulse-glow {
    0%, 100% { box-shadow: 0 0 4px var(--ask-accent); }
    50% { box-shadow: 0 0 12px var(--ask-accent), 0 0 20px var(--ask-accent2); }
  }

  /* ═══ Frame Styles — กรอบแผง 5 แบบ ═══ */
  .widget.ask-frame-sharp .ask-panel { border-radius: 0 !important; }
  .widget.ask-frame-sharp .ask-choice { border-radius: 0 !important; }
  .widget.ask-frame-sharp .ask-choice-key { border-radius: 0 !important; }
  .widget.ask-frame-floating .ask-panel {
    border: none !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
  }
  .widget.ask-frame-floating .ask-choice { border: none; }
  .widget.ask-frame-glow .ask-panel {
    border: 2px solid var(--ask-accent) !important;
    box-shadow: 0 0 12px var(--ask-accent), 0 0 30px rgba(0,0,0,0.4);
  }
  .widget.ask-frame-emboss .ask-panel {
    border: 1px solid rgba(255,255,255,0.15) !important;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), inset 0 -1px 2px rgba(255,255,255,0.08), 0 2px 8px rgba(0,0,0,0.3);
  }
  .widget.ask-frame-emboss .ask-choice { box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }

  /* ── Frame styles เพิ่มเติม ── */
  /* double — ขอบคู่เส้นบาง */
  .widget.ask-frame-double .ask-panel {
    border: 3px double var(--ask-border) !important;
    outline: 1px solid var(--ask-border);
    outline-offset: 2px;
  }
  /* rounded-lg — มุมโค้งใหญ่ */
  .widget.ask-frame-roundedlg .ask-panel { border-radius: 20px !important; }
  .widget.ask-frame-roundedlg .ask-choice { border-radius: 12px !important; }
  .widget.ask-frame-roundedlg .ask-choice-key { border-radius: 8px !important; }
  /* ticket — ขอบมีรอยปรุ๊น (แบบตั๋ว) */
  .widget.ask-frame-ticket .ask-panel {
    border-radius: 0 !important;
    -webkit-mask-image: radial-gradient(circle at 0 50%, transparent 8px, #000 8px),
                         radial-gradient(circle at 100% 50%, transparent 8px, #000 8px);
    -webkit-mask-composite: source-in;
    mask-image: radial-gradient(circle at 0 50%, transparent 8px, #000 8px),
                 radial-gradient(circle at 100% 50%, transparent 8px, #000 8px);
    mask-composite: intersect;
  }
  /* hologram — ขอบเรืองรุ้ง */
  .widget.ask-frame-hologram .ask-panel {
    border: 2px solid transparent !important;
    background: linear-gradient(160deg, var(--ask-bg), rgba(15,15,30,0.95)) padding-box,
                linear-gradient(135deg, #ff0080, #ff8c00, #40e0d0, #ff0080) border-box !important;
    box-shadow: 0 0 15px rgba(255,0,128,0.2), 0 0 25px rgba(64,224,208,0.15);
  }
  /* carbon — ลายเส้นทแยงเข้ม */
  .widget.ask-frame-carbon .ask-panel {
    background: linear-gradient(160deg, #1a1a1a, #0d0d0d) !important;
    border: 1px solid #333 !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 16px rgba(0,0,0,0.5);
  }
  .widget.ask-frame-carbon .ask-panel::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(255,255,255,0.03) 6px 8px);
  }
  .widget.ask-frame-carbon .ask-choice {
    background: linear-gradient(160deg, #222, #151515) !important;
    border-color: #444 !important;
  }
  /* idle — overlay หายทั้งแผง / editor = เส้นประเต็มจอ + ป้าย */
  .widget.type-ask .widget-inner.ask-idle .ask-panel { display: none; }
  body.edit-mode .widget.type-ask .widget-inner { border: 1px dashed rgba(148, 163, 184, 0.3); }
  body.edit-mode .widget.type-ask .widget-inner.ask-idle::after {
    content: '🗳️ ASK — เต็มจอ (ตั้งค่าที่ ⚙)';
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #64748b; font-size: 13px;
  }
  /* ── Animations (keyframes t-* ชุด Image Timer) ── */
  .widget.type-ask .widget-inner.a-anim-in,
  .widget.type-ask .widget-inner.a-anim-out {
    animation-duration: var(--ask-anim-dur, 1.2s);
    animation-fill-mode: both;
    animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .widget.type-ask .widget-inner.a-anim-in-fade   { animation-name: t-fade-in; }
  .widget.type-ask .widget-inner.a-anim-in-slide-up    { animation-name: t-slide-up-in; }
  .widget.type-ask .widget-inner.a-anim-in-slide-down  { animation-name: t-slide-down-in; }
  .widget.type-ask .widget-inner.a-anim-in-slide-left  { animation-name: t-slide-left-in; }
  .widget.type-ask .widget-inner.a-anim-in-slide-right { animation-name: t-slide-right-in; }
  .widget.type-ask .widget-inner.a-anim-in-corner-tl   { animation-name: t-corner-tl-in; }
  .widget.type-ask .widget-inner.a-anim-in-corner-tr   { animation-name: t-corner-tr-in; }
  .widget.type-ask .widget-inner.a-anim-in-corner-bl   { animation-name: t-corner-bl-in; }
  .widget.type-ask .widget-inner.a-anim-in-corner-br   { animation-name: t-corner-br-in; }
  .widget.type-ask .widget-inner.a-anim-out-fade   { animation-name: t-fade-out; }
  .widget.type-ask .widget-inner.a-anim-out-slide-up    { animation-name: t-slide-up-out; }
  .widget.type-ask .widget-inner.a-anim-out-slide-down  { animation-name: t-slide-down-out; }
  .widget.type-ask .widget-inner.a-anim-out-slide-left  { animation-name: t-slide-left-out; }
  .widget.type-ask .widget-inner.a-anim-out-slide-right { animation-name: t-slide-right-out; }
  .widget.type-ask .widget-inner.a-anim-out-corner-tl   { animation-name: t-corner-tl-out; }
  .widget.type-ask .widget-inner.a-anim-out-corner-tr   { animation-name: t-corner-tr-out; }
  .widget.type-ask .widget-inner.a-anim-out-corner-bl   { animation-name: t-corner-bl-out; }
  .widget.type-ask .widget-inner.a-anim-out-corner-br   { animation-name: t-corner-br-out; }

  /* ═══ Video widget ═══ */
  .widget.type-video .widget-inner {
    position: relative;
    overflow: hidden;
    background: transparent;
    padding: 0;
  }
  .widget.type-video .video-player {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .widget.type-video .video-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #64748b; font-size: 13px; text-align: center; padding: 12px;
    background: rgba(15,23,42,0.4);
    border: 2px dashed #334155;
  }

  /* ═══════════════════════════════════════════════════
     EDITOR MODE — UI สำหรับลาก widget จัดวาด
     ═══════════════════════════════════════════════════ */
  body.edit-mode {
    background: #1a1a2e;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  body.edit-mode #canvas {
    /* canvas = scroll container + flex center (ไม่ใส่กรอบ — กรอบอยู่ที่ canvas-wrap) */
    background: transparent;
  }
  /* ★ canvas-wrap ใน editor mode = กรอบหน้ากระดาษ (จะถูก scale ทั้งกรอบ) */
  body.edit-mode #canvas-wrap {
    background: rgba(0,0,0,0.4);
    border: 2px dashed rgba(255,255,255,0.25);
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }

  /* Editor — widget ในโหมด edit */
  body.edit-mode .widget {
    border: 1px solid rgba(100,180,255,0.6);
    cursor: move;
  }
  body.edit-mode .widget.selected {
    border-color: #4a9eff;
    box-shadow: 0 0 0 2px rgba(74,158,255,0.4);
  }
  body.edit-mode .widget-inner { pointer-events: auto; }
  /* ★ chat/alert/playroom widget มี iframe → ใน editor mode ต้อง pointer-events: none
     ไม่งั้น iframe บังการคลิกปุ่ม delete/settings/drag */
  body.edit-mode .widget.type-chat .widget-inner,
  body.edit-mode .widget.type-alert .widget-inner,
  body.edit-mode .widget.type-playroom .widget-inner,
  body.edit-mode .widget.type-webcam .widget-inner,
  body.edit-mode .widget.type-video .widget-inner { pointer-events: none; }
  /* ปุ่ม delete/settings/resize ต้อง pointer-events: auto เสมอ (อยู่เหนือ iframe) */
  body.edit-mode .widget .delete-btn,
  body.edit-mode .widget .settings-btn,
  body.edit-mode .widget .resize-handle { pointer-events: auto; }
  /* ★ ใน editor mode: widget เองต้องรับ mousedown เพื่อ drag —
     แต่ iframe ด้านในต้อง none เพื่อไม่บัง → ใช้ตัว widget (.widget) รับ event */
  body.edit-mode .widget { pointer-events: auto; }

  /* Resize handle (มุมขวาล่าง) — ใหญ่ขึ้น + มีกรอบ */
  .widget .resize-handle {
    display: none;
    position: absolute;
    right: 0; bottom: 0;
    width: 20px; height: 20px;
    cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 50%, #4a9eff 50%);
    border-left: 2px solid #fff;
    border-top: 2px solid #fff;
    z-index: 50;
  }
  body.edit-mode .widget.selected .resize-handle {
    display: block;
    animation: btn-pop 0.15s ease-out;
  }

  /* ปุ่มลบ widget — มุมขวาบน *ใน* กรอบ (กลืนกับเนื้อหาน้อยที่สุด) */
  .widget .delete-btn {
    display: none;
    position: absolute;
    top: 4px; right: 4px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #e74c3c;
    color: #fff;
    border: 2px solid #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  body.edit-mode .widget.selected .delete-btn {
    display: flex;
    animation: btn-pop 0.15s ease-out;
  }

  /* ═══════════════════════════════════════════════════
     Sidebar — list widget types ที่จะ add
     ═══════════════════════════════════════════════════ */
  #sidebar {
    display: none;
    position: fixed;
    top: 0; right: 0;
    width: 260px;
    height: 100vh;
    background: #16213e;
    color: #fff;
    padding: 20px 16px;
    overflow-y: auto;
    box-shadow: -4px 0 20px rgba(0,0,0,0.4);
    z-index: 1000;
  }
  body.edit-mode #sidebar { display: block; }
  body.edit-mode #canvas { width: calc(100% - 260px); padding: 20px; }
  body:not(.edit-mode) #canvas { padding: 0; }   /* overlay mode: ไม่มี padding */

  #sidebar h2 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #4a9eff;
  }
  #sidebar h3 {
    font-size: 13px;
    margin: 16px 0 8px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ★ grid 2 คอลัมน์ — ปุ่มแนวตั้ง icon บน / label ล่าง (ลดความยาวรายการ) */
  #tab-widgets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .widget-add-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: auto;
    padding: 10px 4px;
    margin-bottom: 0;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 11.5px;
    font-family: inherit;
    text-align: center;
    line-height: 1.25;
    transition: all 0.15s;
    min-width: 0;
  }
  .widget-add-btn:hover {
    background: rgba(74,158,255,0.2);
    border-color: #4a9eff;
  }
  .widget-add-btn .icon { font-size: 22px; line-height: 1; }

  /* ★ Layers Panel — จัดลำดับชั้น widget */
  #layers-panel { margin-top: 8px; }
  /* ★ Sidebar tabs */
  .sidebar-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .sidebar-tab {
    flex: 1; padding: 8px 4px; border: none; border-radius: 6px 6px 0 0;
    background: rgba(255,255,255,0.05); color: #aaa;
    cursor: pointer; font-size: 13px; font-family: inherit;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .sidebar-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .sidebar-tab.active {
    background: rgba(74,158,255,0.15); color: #4a9eff;
    border-bottom-color: #4a9eff;
  }
  #layers-list { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  .layer-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid transparent;
    cursor: grab; user-select: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .layer-row:hover { background: rgba(255,255,255,0.1); }
  .layer-row.selected { background: rgba(74,158,255,0.2); border-color: #4a9eff; }
  .layer-row.dragging { opacity: 0.4; }

  /* ★ Now Playing — marquee scroll animation สำหรับชื่อเพลงยาว */
  @keyframes np-marquee {
    0% { transform: translateX(0); }
    15% { transform: translateX(0); }
    85% { transform: translateX(var(--np-scroll-dist, -200px)); }
    100% { transform: translateX(var(--np-scroll-dist, -200px)); }
  }

  /* ★ Now Playing — 10 style patterns (ลวดลายกรอบ) */
  .np-style-overlay.np-style-flat { background: transparent; }
  .np-style-overlay.np-style-metal {
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 3px) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.4) !important;
  }
  .np-style-overlay.np-style-neon {
    box-shadow: 0 0 8px var(--np-accent, #1db954), 0 0 16px var(--np-accent, #1db954), inset 0 0 8px rgba(255,255,255,0.05) !important;
    border: 1px solid var(--np-accent, #1db954) !important;
  }
  .np-style-overlay.np-style-crt {
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px) !important;
    text-shadow: 0 0 2px currentColor !important;
  }
  .np-style-overlay.np-style-pixel {
    border: 3px solid var(--np-accent, #1db954) !important;
    border-radius: 0 !important;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5) !important;
    image-rendering: pixelated;
  }
  .np-style-overlay.np-style-glass {
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3) !important;
  }
  .np-style-overlay.np-style-vinyl {
    background-image: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.04) 0%, transparent 50%), repeating-radial-gradient(circle at 8px 50%, transparent 0px, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 3px) !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
  }
  .np-style-overlay.np-style-carbon {
    background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px, rgba(255,255,255,0.03) 4px, rgba(255,255,255,0.03) 6px, transparent 6px, transparent 8px) !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
  }
  .np-style-overlay.np-style-holo {
    background-image: linear-gradient(135deg, rgba(255,0,128,0.08) 0%, rgba(128,0,255,0.08) 25%, rgba(0,128,255,0.08) 50%, rgba(0,255,128,0.08) 75%, rgba(255,200,0,0.08) 100%) !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    box-shadow: 0 0 12px rgba(128,0,255,0.2) !important;
  }
  .np-style-overlay.np-style-wood {
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 8px, rgba(255,255,255,0.02) 8px, rgba(255,255,255,0.02) 9px, transparent 9px, transparent 16px) !important;
    border: 2px solid rgba(80,50,20,0.4) !important;
  }
  .np-style-overlay.np-style-cassette {
    background-image: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.15) 100%) !important;
    border-top: 2px solid rgba(255,255,255,0.15) !important;
    border-bottom: 3px solid rgba(0,0,0,0.3) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 6px rgba(0,0,0,0.4) !important;
  }
  /* ★ New styles 10 แบบ */
  .np-style-overlay.np-style-circuit {

      linear-gradient(90deg, transparent 19px, rgba(0,255,100,0.04) 20px, transparent 21px),
      linear-gradient(0deg, transparent 19px, rgba(0,255,100,0.04) 20px, transparent 21px),

  .np-style-overlay.np-style-diamond {

      repeating-linear-gradient(-45deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, transparent 2px, transparent 6px) !important;

  .np-style-overlay.np-style-marble {
    background-image:
      linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 30%),
      linear-gradient(45deg, rgba(200,200,220,0.05) 40%, transparent 60%),

  .np-style-overlay.np-style-stripes {

  }
  .np-style-overlay.np-style-dots {

  }
  .np-style-overlay.np-style-mesh {
    background-image:
      radial-gradient(at 20% 20%, rgba(100,200,255,0.1) 0px, transparent 50%),
      radial-gradient(at 80% 0%, rgba(255,100,200,0.1) 0px, transparent 50%),
      radial-gradient(at 0% 80%, rgba(200,255,100,0.1) 0px, transparent 50%) !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
  }
  .np-style-overlay.np-style-fire {
    background-image:

    <!-- ★ Content opacity slider — โปร่งใสเฉพาะเนื้อหาภายใน (ไม่ใช่กรอบ/ปุ่ม) -->
    <div id="modal-opacity-section" style="display:none;">
      <div class="section-title">🌫️ ความโปร่งใสเนื้อหา</div>
      <div class="fld"><label>Opacity <span class="slider-val" id="f-content_opacity-val">100%</span></label>
        <input type="range" id="f-content_opacity" min="0" max="100" step="1" value="100"

    <!-- ★ Common: Size & Position — แสดงทุก widget type (ขนาด/ตำแหน่ง + ล็อคสัดส่วน) -->
    <div id="modal-size-section" style="display:none;">

        <input type="number" id="f-w-x" style="width:80px;padding:4px 8px;background:#0a0e1a;color:#fff;border:1px solid #333;border-radius:4px;">
        <label style="font-size:12px;color:#aaa;min-width:30px;">Y</label>

        <input type="range" id="f-widget_scale" min="0.2" max="3" step="0.05" value="1"

    <div class="modal-btns">

    </div>
  </div>

<style>
/* ═══ Avatar widget animations ═══ */
@keyframes avatar-breathing {
  0%, 100% { transform: scale(1.0); }
  50%      { transform: scale(1.02); }
}
@keyframes avatar-sway {
  0%, 100% { transform: rotate(-1.2deg) translateY(0); }
  50%      { transform: rotate(1.2deg) translateY(-2px); }
}
@keyframes avatar-bounce {
  0%, 100% { transform: translateY(0); }
  25%      { transform: translateY(-4px); }
  75%      { transform: translateY(-2px); }
}
.avatar-stage.avatar-anim-breathing { animation: avatar-breathing 3.2s ease-in-out infinite; }
.avatar-stage.avatar-anim-sway      { animation: avatar-sway 4.5s ease-in-out infinite; }
.avatar-stage.avatar-anim-bounce    { animation: avatar-bounce 0.45s ease-in-out infinite; }
/* ★ breathing + sway ทำงานพร้อมกันได้ — ใช้ wrapper คนละชั้น
   (ตอนนี้ใส่ class เดียวกัน → browser เอาอันสุดท้าย)
   แก้โดยใช้ !important + combine — หรือใช้ transform composite ผ่าน CSS variables
   สำหรับความเรียบง่าย: breathing ใช้ scale, sway ใช้ rotate+translate, bounce ใช้ translateY
   แต่ transform แบบเดียวกันจะ override → เลือก priority: bounce > sway > breathing
   ถ้า bounce ทำงาน (talking) → breathing หยุด (ใช้ override) */
.avatar-stage.avatar-anim-breathing:not(.avatar-anim-bounce):not(.avatar-anim-sway) {
  animation: avatar-breathing 3.2s ease-in-out infinite;
}
.avatar-stage.avatar-anim-sway:not(.avatar-anim-bounce) {

</style>
