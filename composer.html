<script>
// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
let config = {
  canvas_size: '1080p',
  canvas_w: 1920,
  canvas_h: 1080,
  widgets: [],
  font_family: 'Kanit',
};
let isEditor = new URLSearchParams(location.search).has('edit');
let selectedWidget = null;
let ws = null;
let _lastWsConfigHash = '';  // ★ hash ของ config ล่าสุดจาก WS (กัน renderAll ซ้ำเมื่อ config เหมือนเดิม)

// ★ SVG ไอคอนคน (ใช้แทน emoji 👥 เพื่อให้ขนาด = iconSize เสมอ — เท่ากับไอคอนแพลตฟอร์ม)
// ประกาศไว้บนสุดเพราะใช้ในหลายฟังก์ชัน (renderWidgetContent + handleViewers)
const PEOPLE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
  <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
</svg>`;
// ★ helper: สร้าง <span> ไอคอนคน ด้วยขนาดที่กำหนด
function peopleIconSpan(iconSize) {
  return `<span style="display:inline-flex;align-items:center;width:${iconSize}px;height:${iconSize}px;flex-shrink:0;">${PEOPLE_ICON_SVG}</span>`;
}

// ════════════════════════════════════════════════════════════
// WebSocket — รับ config + message + viewers จาก server
// ════════════════════════════════════════════════════════════
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => {
    try { ws.send(JSON.stringify({type: 'hello', edit: isEditor})); } catch(e){}
  };
  ws.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch(e) { return; }
    if (data.type === 'config') {
      // ★ ถ้า modal settings เปิดอยู่ → ข้าม config push (กันทับค่าที่ user กำลังแก้)
      //    server จะ push ใหม่อีกครั้งหลัง modal ปิด + save
      const modalOpen = document.getElementById('settings-modal');
      if (modalOpen && modalOpen.classList.contains('active')) {
        return;   // ★ ข้าม — กันทับค่าที่กำลังแก้
      }
      // ★ hash check — ถ้า config เหมือนเดิมทุกบรรทัด → ข้าม (กัน renderAll → animation reset)
      const newHash = JSON.stringify(data.config);
      if (newHash === _lastWsConfigHash) return;
      _lastWsConfigHash = newHash;
      // ★ ถ้ากำลัง drag/resize หรือ เพิ่งแก้ของเอง (add/delete ภายใน 1.5s)
      //    → อย่าทับ config (กัน widget หดกลับ / ghost widget โผล่กลับ)
      //    เก็บ position/size ปัจจุบันไว้ + merge ค่าอื่นๆ จาก server + ข้าม renderAll
      const _inLocalEdit = (Date.now() - _lastLocalEditAt < 1500);
      if (_isDragging || _isResizing || (isEditor && _inLocalEdit)) {
        // เก็บ widget position/size ปัจจุบัน (ที่ผู้ใช้กำลัง drag/resize)
        const currentWidgets = {};
        (config.widgets || []).forEach(w => {
          currentWidgets[w.id] = { x: w.x, y: w.y, w: w.w, h: w.h };
        });
        // รับ config ใหม่ แต่คง position/size ปัจจุบันไว้
        config = data.config;
        (config.widgets || []).forEach(w => {
          if (currentWidgets[w.id]) {
            w.x = currentWidgets[w.id].x;
            w.y = currentWidgets[w.id].y;
            w.w = currentWidgets[w.id].w;
            w.h = currentWidgets[w.id].h;
          }
        });
        // ข้าม renderAll (กัน widget กระตุก)
        if (modalWidgetId) {
          if (typeof renderCharJobsList === 'function') renderCharJobsList();
          if (typeof renderDefaultImagePreview === 'function') renderDefaultImagePreview();
        }
      } else {
        // ปกติ → แทนที่ config
        // ★ overlay mode (OBS) → ใช้ config จาก server ตรงๆ (ย้ายตำแหน่งตาม editor ทันที)
        // ★ editor mode → เก็บแค่ position/size ปัจจุบันไว้ (กัน widget กระตุก)
        //   ★★★ แก้บั๊ก "editor ไม่ยอมอัปเดตค่า": เดิม merge ค่า local (non-empty) ทับ
        //   ค่า server ทุก field ตลอดกาล → ค่าเก่า (stale) ชนะตลอด เช่นเปลี่ยน ask_layout
        //   แล้ว editor ยังเรนเดอร์โหมดเก่า (ซ้อนกัน 2 แบบ) ขณะที่ OBS ถูก — เพราะค่าที่
        //   user เพิ่งเปลี่ยนถูกคุมด้วย local-edit window (1.5s) + modal-open guard อยู่แล้ว
        if (!isEditor) {
          config = data.config;
        } else {
          const currentWidgets2 = {};
          (config.widgets || []).forEach(w => {
            currentWidgets2[w.id] = { x: w.x, y: w.y, w: w.w, h: w.h };
          });
          config = data.config;
          (config.widgets || []).forEach(w => {
            if (currentWidgets2[w.id]) {
              w.x = currentWidgets2[w.id].x;
              w.y = currentWidgets2[w.id].y;
              w.w = currentWidgets2[w.id].w;
              w.h = currentWidgets2[w.id].h;
            }
          });
        }
        // ★ smart render — อัปเดตเฉพาะที่จำเป็น (ไม่ re-create widget ทั้งหมด)
        renderAll();
        if (modalWidgetId) {
          if (typeof renderCharJobsList === 'function') renderCharJobsList();
          if (typeof renderDefaultImagePreview === 'function') renderDefaultImagePreview();
        }
      }
    } else if (data.type === 'message') {
      handleChatMessage(data.message);
    } else if (data.type === 'viewers') {
      handleViewers(data);
    } else if (data.type === 'ask') {
      handleAskState(data);
    } else if (data.type === 'now_playing') {
      handleNowPlaying(data);
    } else if (data.type === 'emote_party') {
      handleEmoteParty(data.emotes || []);
    } else if (data.type === 'avatar_state') {
      handleAvatarState(data);
    } else if (data.type === 'donate_goal') {
      handleDonateGoal(data);
    } else if (data.type === 'mic_level') {
      handleMicLevel(data);
    } else if (data.type === 'mic_calibrated') {
      handleMicCalibrated(data);
    } else if (data.type === 'eval_js') {
      try { eval(data.js); } catch(e) {}
    }
  };
  // ★ WS reconnect — ถ้าล้มเหลวเกิน 3 ครั้ง (server ปิด) → reload ทั้งหน้า
  let _wsFailCount = 0;
  ws.onclose = () => {
    _wsFailCount++;
    if (_wsFailCount > 3) {
      // server ปิด → reload หน้า (จะได้เชื่อมใหม่ + โหลด HTML ใหม่)
      setTimeout(() => location.reload(), 2000);
      return;
    }
    setTimeout(connectWs, 1500);
  };
  ws.onopen = () => {
    _wsFailCount = 0;   // reset counter เมื่อเชื่อมสำเร็จ
    // ★ ขอ now playing state ล่าสุด (กัน Now Playing หายตอน refresh composer)
    fetch('/now-playing-state').then(r => r.json()).then(data => {
      if (data && data.title && !_lastNowPlayingData.title) {
        handleNowPlaying(data);
      }
    }).catch(() => {});
    // ★ ขอ avatar state ล่าสุด (กัน TTS avatar ค้าง talking ตอน reconnect)
    fetch('/avatar-state').then(r => r.json()).then(data => {
      if (data && typeof data === 'object') {
        _lastAvatarState = data;
        // apply ให้ avatar widgets ที่มีอยู่แล้ว
        for (const wid in data) {
          const inst = _avatarWidgets[wid];
          if (inst && inst.mode === 'tts') inst.setTalking(!!data[wid]);
        }
      }
    }).catch(() => {});
    // ★ ขอ donate goal state ล่าสุด (กัน goal bar ค้าง 0 ตอน reconnect)
    fetch('/donate-goal-state').then(r => r.json()).then(data => {
      if (data && typeof data === 'object') {
        for (const wid in data) {
          _lastDonateGoalData[wid] = data[wid];
          handleDonateGoal(data[wid]);
        }
      }
    }).catch(() => {});
  };
}

// ════════════════════════════════════════════════════════════
// Render — สร้าง widget ทั้งหมดบน canvas
// ════════════════════════════════════════════════════════════
// ★ zoom state — ย่อ/ขยาย "ทั้งกรอบ canvas" ด้วย transform: scale() + width/height
let zoomLevel = 1.0;

function applyZoom() {
  const outer = document.getElementById('canvas-outer');
  const wrap = document.getElementById('canvas-wrap');
  if (!outer || !wrap) return;
  // ★ outer = กล่องที่มีขนาจริงตาม scale (เป็นตัวแทนใน layout flow → flex center)
  const scaledW = Math.round(config.canvas_w * zoomLevel);
  const scaledH = Math.round(config.canvas_h * zoomLevel);
  outer.style.width = scaledW + 'px';
  outer.style.height = scaledH + 'px';
  // ★ wrap = กรอบหน้ากระดาษจริง (ขนาดเต็ม) + scale ทั้งใบ (absolute ใน outer)
  wrap.style.width = config.canvas_w + 'px';
  wrap.style.height = config.canvas_h + 'px';
  wrap.style.transform = `scale(${zoomLevel})`;
  const lbl = document.getElementById('zoom-level');
  if (lbl) lbl.textContent = Math.round(zoomLevel * 100) + '%';
}

function zoomFit() {
  // ★ fit canvas ทั้งกรอบให้พอดี viewport (เห็นขอบทั้ง 4 ด้าน)
  const canvasEl = document.getElementById('canvas');
  const vw = canvasEl.clientWidth - 40;   // หัก padding 20px×2
  const vh = canvasEl.clientHeight - 40;
  const sx = vw / config.canvas_w;
  const sy = vh / config.canvas_h;
  zoomLevel = Math.min(sx, sy, 1.0);
  // ปัดเศษเป็น 5%
  zoomLevel = Math.max(0.1, Math.round(zoomLevel * 20) / 20);
  applyZoom();
}

function renderAll() {
  const wrap = document.getElementById('canvas-wrap');
  // ★ editor mode: canvas-wrap เป็น relative container ของ widget (position absolute)
  wrap.style.position = 'relative';
  if (isEditor) {
    document.getElementById('canvas-size').value = config.canvas_size;
  }

  // ★ smart render — ไม่ล้างทั้งหมด (กัน chat widget iframe reload → แชทหาย)
  // 1. หา widget ที่มีอยู่แล้ว → update style/position + re-bind drag/resize (w reference เปลี่ยน)
  // 2. widget ใหม่ → create
  // 3. widget ที่ถูกลบ → remove
  const existingIds = new Set();
  config.widgets.forEach(w => {
    if (!w.enabled) return;
    const existing = wrap.querySelector(`.widget[data-id="${w.id}"]`);
    if (existing) {
      // ★ update + re-bind drag/resize (เพราะ w reference เปลี่ยนทุกครั้งที่ config = data.config)
      updateWidgetElement(existing, w);
      if (isEditor) rebindDragResize(existing, w);
      existingIds.add(w.id);
    } else {
      // สร้างใหม่
      const el = createWidgetElement(w);
      wrap.appendChild(el);
      existingIds.add(w.id);
    }
  });
  // ลบ widget ที่ไม่อยู่ใน config แล้ว
  wrap.querySelectorAll('.widget').forEach(el => {
    if (!existingIds.has(el.dataset.id)) el.remove();
  });

  applyZoom();   // ★ applyZoom จะตั้ง width/height/transform ทั้งหมด
  renderLayersList();  // ★ sync layers panel ทุกครั้งที่ render
}

// ★ update widget ที่มีอยู่แล้ว — เปลี่ยน style/position + className (theme) (ไม่ re-create content)
function updateWidgetElement(el, w) {
  // ★ อัปเดต widget reference (ใช้ใน enableDrag/enableResize ผ่าน el._widgetRef)
  el._widgetRef = w;
  // ★ อัปเดต className (เพื่อ refresh theme class — clock-theme-*, viewer-theme-*)
  const classes = [`widget`, `type-${w.type}`];
  if (w.type === 'chat') {
    const layout = w.layout || 'inline';
    if (layout === 'stacked' || layout === 'stacked_no_logo') classes.push('layout-stacked');
    classes.push('dir-' + (w.direction || 'bottom'));
    classes.push('anim-' + (w.animation || 'fade'));
    classes.push('align-' + (w.chat_align || 'left'));
  }
  if (w.type === 'clock') {
    classes.push('clock-theme-' + (w.clock_theme || 'default'));
    if (w.clock_style && w.clock_style !== 'none') {
      classes.push('clock-style-set');
      classes.push('clock-style-' + w.clock_style);
    }
  }
  if (w.type === 'ask') {
    classes.push(...askWidgetClasses(w));
  }
  if (w.type === 'viewer') {
    classes.push('viewer-theme-' + (w.viewer_theme || 'default'));
    classes.push('viewer-align-' + (w.viewer_align || 'left'));
    classes.push('viewer-direction-' + (w.viewer_direction || 'horizontal'));
  }
  if (w.type === 'image') {
    classes.push('tr-' + (w.transition || 'fade'));
  }
  if (w.type === 'webcam') {
    classes.push('webcam-theme-' + (w.webcam_theme || 'simple-white'));
    classes.push('ratio-' + (w.webcam_ratio || '16:9').replace(':', '-'));
  }
  if (w.type === 'text') {
    classes.push('text-' + (w.text_mode || 'static'));
  }
  // เก็บ class 'selected' ไว้ (กันปุ่ม delete/settings/resize หายตอน smart render)
  if (el.classList.contains('selected')) classes.push('selected');
  el.className = classes.join(' ');
  // position/size/opacity — แต่ถ้ากำลัง drag/resize widget นี้ → ข้าม (คงค่าปัจจุบัน)
  const isInteracting = (el._isDragging || el._isResizing);
  if (!isInteracting) {
    if (w.type === 'ask') {
      // ★ ASK = เต็ม canvas เสมอ (ล็อค — ลาก/ย่อไม่ได้)
      w.x = 0; w.y = 0; w.w = config.canvas_w || 1920; w.h = config.canvas_h || 1080;
    }
    el.style.left = w.x + 'px';
    el.style.top = w.y + 'px';
    el.style.width = w.w + 'px';
    // ★ webcam widget — height คำนวณจาก width + ratio (บังคับสัดส่วน)
    if (w.type === 'webcam') {
      el.style.height = computeRatioHeight(w.w, w.webcam_ratio) + 'px';
    } else {
      el.style.height = w.h + 'px';
    }
    el.style.zIndex = w.z || 1;
    el.style.opacity = (w.alpha != null ? w.alpha : 1.0);
    // ★ widget_scale — หด/ขยาย widget ทั้งอัน (transform: scale) โดยไม่ปรับค่าภายใน
    const ws = w.widget_scale != null ? w.widget_scale : 1.0;
    el.style.transform = (ws !== 1.0) ? `scale(${ws})` : '';
    el.style.transformOrigin = 'top left';
    // ★ editor buttons (⚙/✕/resize) — counter-scale กลับให้คงขนาดเดิมเสมอ
    //   (กันปุ่มหดจิ๋วตาม widget ตอน scale ต่ำ จนกดลำบาก)
    const _btnInv = (ws !== 1.0) ? `scale(${(1 / ws).toFixed(3)})` : '';
    el.querySelectorAll('.delete-btn, .settings-btn, .resize-handle').forEach(b => {
      b.style.transform = _btnInv;
      b.style.transformOrigin = 'center';
    });
    // ★ content opacity — โปร่งใสเฉพาะเนื้อหาภายใน (ไม่กรอบ/ปุ่ม)
    //    clock widget ใช้ style_opacity/theme_opacity แยกตามโหมด
    const _inner = el.querySelector('.widget-inner');
    if (_inner) {
      if (w.type === 'clock') {
        const hasStyle = w.clock_style && w.clock_style !== 'none';
        const op = hasStyle
          ? (w.style_opacity != null ? w.style_opacity : 1.0)
          : (w.theme_opacity != null ? w.theme_opacity : (w.content_opacity != null ? w.content_opacity : 1.0));
        _inner.style.opacity = op;
      } else {
        _inner.style.opacity = (w.content_opacity != null ? w.content_opacity : 1.0);
      }
    }
    // ★ Circle Clock — อัปเดตขนาดหลังตั้ง width/height (responsive)
    if (w.type === 'clock' && w.clock_style && w.clock_style.startsWith('cc')) {
      setTimeout(() => updateCircleClockSize(el), 0);
    }
  }
  // ★ chat widget → อย่า re-create iframe (config update ผ่าน WS ไป iframe อยู่แล้ว)
  //    ยกเว้น overlay_version เปลี่ยน (overlay.html ถูกแก้) → reload iframe ใหม่ทันที
  if (w.type === 'chat') {
    const iframe = el.querySelector('.widget-inner iframe');
    if (iframe) {
      const newVer = config.overlay_version || 0;
      const curVer = iframe.dataset.overlayVersion || 0;
      if (newVer && curVer && newVer != curVer) {
        // ★ overlay.html เปลี่ยน → reload iframe (เพื่อโหลด CSS/JS ใหม่)
        iframe.dataset.overlayVersion = newVer;
        iframe.src = `/chat-widget?id=${encodeURIComponent(w.id)}&_v=${newVer}&_t=${Date.now()}`;
      }
    }
    return;
  }
  // ★ image widget → อย่า re-create slides (กัน slideshow restart/flicker)
  //    อัปเดตเฉพาะเมื่อ images list / interval / fit mode / shuffle เปลี่ยน
  if (w.type === 'image') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      // เช็คว่า config เปลี่ยนไหน → re-setup เฉพาะเมื่อจำเป็น
      const sig = JSON.stringify({
        imgs: (w.images || []).map(i => i.id),
        iv: w.slide_interval, unit: w.slide_interval_unit,
        fit: w.fit_mode, shuf: w.shuffle, tr: w.transition,
        mode: w.image_mode, tw: w.timer_interval_sec, twu: w.timer_interval_unit,
        tsd: w.timer_slide_duration,
        tin: w.timer_anim_in, tout: w.timer_anim_out,
        tinms: w.timer_anim_in_ms, toutms: w.timer_anim_out_ms
      });
      if (inner.dataset.imgSig !== sig) {
        inner.dataset.imgSig = sig;
        setupImageWidget(inner, w);
      }
    }
    return;
  }
  // ★ playroom widget → อย่า re-create iframe (กัน video reload กลางคัน)
  //    ยกเว้นเมื่อ color key config เปลี่ยน → ต้อง reload iframe เพื่ออ่าน ck params ใหม่
  if (w.type === 'playroom') {
    const iframe = el.querySelector('iframe');
    if (iframe) {
      const expectedSrc = buildPlayroomSrc(w).split('&_t=')[0];  // ไม่นับ timestamp
      const currentSrc = (iframe.src || '').split('&_t=')[0].replace(/&ck=[^&]*/g, '').replace(/&ck_color=[^&]*/g, '').replace(/&ck_sim=[^&]*/g, '').replace(/&ck_smooth=[^&]*/g, '');
      // ★ เปรียบเทียบเฉพาะ ck params (ถ้าเปลี่ยน → reload iframe)
      const ckSig = JSON.stringify({ ck: w.ck_enabled, color: w.ck_color, sim: w.ck_similarity, smooth: w.ck_smoothness });
      if (iframe.dataset.ckSig !== ckSig) {
        iframe.dataset.ckSig = ckSig;
        iframe.src = buildPlayroomSrc(w);
      }
    }
    return;
  }
  // ★ webcam widget → re-render เฉพาะเมื่อ ratio/theme เปลี่ยน (กัน flicker)
  if (w.type === 'webcam') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      const sig = JSON.stringify({ ratio: w.webcam_ratio, theme: w.webcam_theme, bw: w.webcam_border_width });
      if (inner.dataset.wcSig !== sig) {
        inner.dataset.wcSig = sig;
        while (inner.firstChild) inner.removeChild(inner.firstChild);
        setupWebcamFrame(inner, w);
      }
    }
    return;
  }
  // ★ text widget → re-setup เฉพาะเมื่อ content/mode/interval/font เปลี่ยน
  if (w.type === 'text') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      const sig = JSON.stringify({
        content: w.text_content, mode: w.text_mode,
        iv: w.text_interval, unit: w.text_interval_unit,
        speed: w.text_scroll_speed,
        fs: w.font_size, fc: w.font_color, fw: w.font_weight,
        ts: w.text_stroke, tst: w.text_stroke_type, tsc: w.text_stroke_color, tsw: w.text_stroke_width,
        tsh: w.text_shadow, tshc: w.text_shadow_color, tshb: w.text_shadow_blur,
        align: w.text_align, ff: config.font_family,
        bg: w.text_bg_enabled, bgc: w.text_bg_color, bgo: w.text_bg_opacity, bgr: w.text_bg_radius
      });
      if (inner.dataset.textSig !== sig) {
        inner.dataset.textSig = sig;
        setupTextWidget(inner, w);
      } else {
        // font/style เหมือนเดิม → apply เฉพาะ style (position อาจเปลี่ยน)
        applyWidgetStyle(inner, w);
      }
    }
    return;
  }
  // ★ video widget → re-render เฉพาะเมื่อ URL เปลี่ยน (กัน video reload กลางคัน)
  if (w.type === 'video') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      const sig = JSON.stringify({ url: w.video_url });
      if (inner.dataset.videoSig !== sig) {
        inner.dataset.videoSig = sig;
        setupVideoWidget(inner, w);
      }
    }
    return;
  }
  // ★ avatar widget — re-create เมื่อ URL/fit/animations/mode เปลี่ยน
  if (w.type === 'avatar') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      const sig = JSON.stringify({
        preset: w.avatar_preset,
        idle: w.avatar_idle_url, talk: w.avatar_talk_url,
        bidle: w.avatar_blink_idle_url, btalk: w.avatar_blink_talk_url,
        fit: w.avatar_fit_mode, mode: w.avatar_mode,
        bounce: w.avatar_bounce, breathing: w.avatar_breathing, sway: w.avatar_sway,
        flipH: w.avatar_flip_h, flipV: w.avatar_flip_v,
        blinkRate: w.avatar_blink_rate, threshold: w.avatar_mic_threshold, device: w.avatar_mic_device,
      });
      if (inner.dataset.avSig !== sig) {
        inner.dataset.avSig = sig;
        setupAvatarWidget(inner, w);
      }
    }
    return;
  }
  // ★ donate_goal widget — re-create เสมอ (กัน alignment/theme ไม่อัปเดจใน overlay)
  if (w.type === 'donate_goal') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      setupDonateGoalWidget(inner, w);
    }
    return;
  }
  // clock/viewer/alert → re-create content เฉพาะเมื่อ signature เปลี่ยน
  //    ★ สำคัญ: ถ้า re-create ทุกครั้ง (เช่น poll config ทุก 2 วิ) → animation จะ reset
  //      - Circle Clock conic-gradient จะกระพริบ
  //      - Text scroll จะเริ่มใหม่
  //      - Now Playing scroll จะเริ่มใหม่
  //    เลยใช้ signature diff — ถ้าค่าที่กำหนดหน้าตาไม่เปลี่ยน → อย่าล้าง content
  const inner = el.querySelector('.widget-inner');
  if (inner) {
    if (w.type === 'ask') {
      // ★ เฟรมเต็มจอ — บังคับ geometry เสมอ (ล็อค แก้/ลากไม่ได้)
      w.x = 0; w.y = 0;
      w.w = config.canvas_w || 1920;
      w.h = config.canvas_h || 1080;
      el.style.left = '0px'; el.style.top = '0px';
      el.style.width = w.w + 'px'; el.style.height = w.h + 'px';
      const inner = el.querySelector('.widget-inner');
      if (inner) {
        inner.style.setProperty('--ask-scale', w.ask_scale != null ? w.ask_scale : 1);
        inner.style.setProperty('--ask-extend', w.ask_extend_pct != null ? w.ask_extend_pct : 20);
        inner.style.setProperty('--ask-px', w.ask_pos_x != null ? w.ask_pos_x : 85);
        inner.style.setProperty('--ask-py', w.ask_pos_y != null ? w.ask_pos_y : 12);
        inner.style.setProperty('--ask-opacity', (w.ask_opacity_pct != null ? w.ask_opacity_pct : 100) / 100);
        inner.style.setProperty('--ask-minw', w.ask_min_width != null ? w.ask_min_width : 340);
        inner.style.setProperty('--ask-qfs', w.ask_question_fs != null ? w.ask_question_fs : 24);
        inner.style.setProperty('--ask-cfs', w.ask_choice_fs != null ? w.ask_choice_fs : 18);
        renderAskInto(inner);
        // ★ ตำแหน่งเปลี่ยนผ่าน config (save จาก editor) → ต้อง re-clamp แผง Minimal
        //   ด้วย (เดิมแค่ set var แต่แผงถูก pin ด้วย px เก่า → OBS ไม่ขยับจน rebuild)
        askClampMinimal(el);
      }
    } else if (w.type === 'viewer') {
      const sig = JSON.stringify({
        mode: w.viewer_mode, theme: w.viewer_theme, align: w.viewer_align,
        direction: w.viewer_direction,
        icon: w.viewer_show_icon, iconSize: w.viewer_icon_size,
        fontFamily: config.font_family, fs: w.font_size, fc: w.font_color
      });
      if (inner.dataset.viewerSig !== sig) {
        inner.dataset.viewerSig = sig;
        while (inner.firstChild) inner.removeChild(inner.firstChild);
        // ★ ล้าง html signature ด้วย — ไม่งั้น handleViewers เทียบกับค่าเก่าแล้ว "เหมือนเดิม"
        //   (ตัวเลขไม่เปลี่ยน) → ข้ามการเขียน → widget ว่างเปล่า = หายไปจากจอ
        delete inner.dataset.viewerHtml;
        renderWidgetContent(inner, w);
        // ★ บังคับ viewer re-render ทันทีจาก cache (กันรอ WS push ใหม่ = ช้า)
        if (_lastViewersData) {
          handleViewers(_lastViewersData);
        }
      }
      // ★ sync theme/align/direction class บน .widget element (เคยบั๊ก: set แค่ตอน create → เปลี่ยน theme ไม่มีผล)
      const el = inner.closest('.widget');
      if (el) {
        el.classList.remove(...[...el.classList].filter(c =>
          c.startsWith('viewer-theme-') || c.startsWith('viewer-align-') || c.startsWith('viewer-direction-')));
        el.classList.add('viewer-theme-' + (w.viewer_theme || 'default'));
        el.classList.add('viewer-align-' + (w.viewer_align || 'left'));
        el.classList.add('viewer-direction-' + (w.viewer_direction || 'horizontal'));
      }
      applyWidgetStyle(inner, w);
    } else if (w.type === 'clock') {
      // ★ clock signature — ครอบคลุมทุกค่าที่มีผลต่อหน้าตา (theme/style/format/date/colors/font)
      const sig = JSON.stringify({
        theme: w.clock_theme, style: w.clock_style,
        fmt: w.clock_format, showDate: w.show_date,
        dateFmt: w.date_format, dateLang: w.date_lang,
        dateFs: w.date_font_size, dateColor: w.date_color,
        timeColor: w.time_color, fs: w.font_size,
        fontFamily: config.font_family
      });
      if (inner.dataset.clockSig !== sig) {
        inner.dataset.clockSig = sig;
        while (inner.firstChild) inner.removeChild(inner.firstChild);
        renderWidgetContent(inner, w);
      }
      applyWidgetStyle(inner, w);
    } else {
      // alert และ widget อื่นๆ → re-create (iframe ไม่มี animation state ที่จะ reset)
      while (inner.firstChild) inner.removeChild(inner.firstChild);
      renderWidgetContent(inner, w);
      applyWidgetStyle(inner, w);
    }
  }
}

// ════════════════════════════════════════════════════════════
// Image & Slideshow widget — setup + slideshow loop
// ════════════════════════════════════════════════════════════

// ★ แปลง interval + unit → milliseconds
function computeSlideIntervalMs(interval, unit) {
  const n = Math.max(1, parseInt(interval) || 10);
  if (unit === 'minutes') return n * 60 * 1000;
  if (unit === 'hours') return n * 60 * 60 * 1000;
  return n * 1000; // seconds (default)
}

// ★ setup image widget: สร้าง slides + เริ่ม slideshow loop
function setupImageWidget(inner, w) {
  // ★ clear ทุก timer (slideshow + timer mode)
  if (inner._slideTimer) { clearInterval(inner._slideTimer); inner._slideTimer = null; }
  if (inner._timerCycle) { clearInterval(inner._timerCycle); inner._timerCycle = null; }
  if (inner._timerSlide) { clearInterval(inner._timerSlide); inner._timerSlide = null; }
  if (inner._timerAnimTOs) { inner._timerAnimTOs.forEach(clearTimeout); inner._timerAnimTOs = []; }
  if (inner._timerRAF) { cancelAnimationFrame(inner._timerRAF); inner._timerRAF = null; }
  while (inner.firstChild) inner.removeChild(inner.firstChild);
  const _widgetEl = inner.closest('.widget');
  if (_widgetEl) _widgetEl.classList.remove('timer-hidden');

  const images = w.images || [];
  if (images.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'image-empty';
    empty.textContent = isEditor ? '📷 ยังไม่มีรูป — คลิก ⚙ เพื่ออัปโหลด' : '';
    inner.appendChild(empty);
    return;
  }

  const fitMode = w.fit_mode || 'cover';
  // ★ shuffle: สุ่มลำดับ (เก็บ original ไว้)
  let imgList = images.slice();
  if (w.shuffle) {
    for (let i = imgList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [imgList[i], imgList[j]] = [imgList[j], imgList[i]];
    }
  }

  // ★ สร้าง <img> slides ทั้งหมด (preload + cache-bust)
  const slides = imgList.map(img => {
    const el = document.createElement('img');
    el.className = 'slide';
    el.src = `/widget-image/${encodeURIComponent(w.id)}/${encodeURIComponent(img.id)}?t=${Date.now()}`;
    el.style.objectFit = fitMode;
    el.draggable = false;
    return el;
  });
  slides.forEach(s => inner.appendChild(s));

  // ★ slide counter (editor only)
  let counterEl = null;
  if (isEditor) {
    counterEl = document.createElement('div');
    counterEl.className = 'slide-counter';
    inner.appendChild(counterEl);
  }

  // ★ Timer mode → วงจร ขึ้นมา → เลื่อนภาพ → หายไป → รอรอบหน้า
  if (w.image_mode === 'timer') {
    setupImageTimer(inner, inner.closest('.widget'), slides, w, counterEl);
    return;
  }

  // ★ single image → ไม่ต้อง slideshow
  if (slides.length === 1) {
    slides[0].classList.add('active');
    if (counterEl) counterEl.textContent = '1/1';
    return;
  }

  // ★ slideshow loop
  let currentIdx = 0;
  slides[0].classList.add('active');
  if (counterEl) counterEl.textContent = `1/${slides.length}`;

  const intervalMs = computeSlideIntervalMs(w.slide_interval, w.slide_interval_unit);
  const transition = w.transition || 'fade';
  inner._slideTimer = setInterval(() => {
    const prev = slides[currentIdx];
    const nextIdx = (currentIdx + 1) % slides.length;
    const next = slides[nextIdx];
    // ★ transition: สลับ active class (CSS จัดการ animation)
    //    สำหรับ slide-* transitions → ต้องมี exiting class ชั่วคราว
    if (transition.startsWith('slide-')) {
      prev.classList.add('exiting');
      next.classList.add('active');
      // ลบ exiting หลัง transition จบ (0.6s)
      setTimeout(() => prev.classList.remove('active', 'exiting'), 650);
    } else {
      prev.classList.remove('active');
      next.classList.add('active');
    }
    currentIdx = nextIdx;
    if (counterEl) counterEl.textContent = `${nextIdx + 1}/${slides.length}`;
  }, intervalMs);
}


// ════════════════════════════════════════════════════════════
// ★ Image Timer Mode — setTimeout chain (ไม่ใช้ setInterval กัน drift)
//   โฟลว์: ซ่อน → [รอ waitSec] → anim IN → [แต่ละภาพ slideDurSec] → anim OUT → ซ่อน → วนซ้ำ
// ════════════════════════════════════════════════════════════
function setupImageTimer(inner, widgetEl, slides, w, counterEl) {
  if (!widgetEl) return;
  const TOs = [];
  inner._timerAnimTOs = TOs;
  const clearAll = () => {
    TOs.forEach(clearTimeout); TOs.length = 0;
    if (inner._timerSlide) { clearInterval(inner._timerSlide); inner._timerSlide = null; }
    if (inner._timerRAF) { cancelAnimationFrame(inner._timerRAF); inner._timerRAF = null; }
  };

  // ★ config
  const waitSec = Math.max(1, Number(w.timer_interval_sec) || 600);   // รอกี่วิหลังหายไป
  const slideDurSec = Math.max(1, Number(w.timer_slide_duration) || 10); // แต่ละภาพกี่วิ
  const animIn = w.timer_anim_in || 'fade';
  // ★ auto = กลับทางเดิมอัตโนมัติ (ใช้ทางเดียวกับ entrance)
  const animOut = (!w.timer_anim_out || w.timer_anim_out === 'auto') ? animIn : w.timer_anim_out;
  const ANIM_IN_MS = Math.max(100, Number(w.timer_anim_in_ms) || 2000);
  const ANIM_OUT_MS = Math.max(100, Number(w.timer_anim_out_ms) || 2000);
  // ★ set CSS var ให้ animation duration ตรงกับที่ตั้ง
  inner.style.setProperty('--t-anim-in-dur', (ANIM_IN_MS / 1000) + 's');
  inner.style.setProperty('--t-anim-out-dur', (ANIM_OUT_MS / 1000) + 's');
  const TRANS_SEC = 0.5; // transition ระหว่างภาพ

  // ★ progress bar
  const progWrap = document.createElement('div');
  progWrap.className = 't-progress-wrap';
  const progBar = document.createElement('div');
  progBar.className = 't-progress-bar';
  progWrap.appendChild(progBar);
  progWrap.style.display = 'none';
  inner.appendChild(progWrap);

  let rafId = null;
  function startProgress(totalMs) {
    if (rafId) cancelAnimationFrame(rafId);
    const t0 = performance.now();
    progWrap.style.display = '';
    progBar.style.width = '0%';
    function tick() {
      const pct = Math.min(100, ((performance.now() - t0) / totalMs) * 100);
      progBar.style.width = pct + '%';
      if (pct < 100) rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
    inner._timerRAF = rafId;
  }
  function stopProgress() {
    if (rafId) cancelAnimationFrame(rafId);
    progWrap.style.display = 'none';
  }

  function hide() {
    widgetEl.classList.add('timer-hidden');
    inner.style.opacity = '0';
    inner.className = 'widget-inner';
    stopProgress();
    // ★ หลังหาย → รอ waitSec → กลับมาอีกครั้ง
    TOs.push(setTimeout(showCycle, waitSec * 1000));
  }

  function showCycle() {
    clearAll();
    // ★ entrance animation
    widgetEl.classList.remove('timer-hidden');
    inner.style.opacity = '';
    inner.className = 'widget-inner';
    inner.classList.add('t-anim-in', 't-anim-in-' + animIn);
    slides.forEach(s => s.classList.remove('active', 'exiting'));
    slides[0].classList.add('active');
    if (counterEl) counterEl.textContent = `1/${slides.length}`;
    let idx = 0;

    // ★ หลัง anim IN เสร็จ → เริ่มเลื่อนภาพ + progress
    TOs.push(setTimeout(() => {
      inner.classList.remove('t-anim-in', 't-anim-in-' + animIn);

      // เวลาแสดงทั้งหมด = ภาพแรก (slideDurSec) + transition ต่อ (slides.length - 1) ภาพ × (TRANS_SEC + slideDurSec)
      const totalShowMs = (slideDurSec + (slides.length - 1) * (TRANS_SEC + slideDurSec)) * 1000;
      startProgress(totalShowMs);

      if (slides.length > 1) {
        inner._timerSlide = setInterval(() => {
          const prev = slides[idx];
          idx = idx + 1;
          if (idx >= slides.length) {
            // ★ ครบทุกภาพแล้ว — หยุด ไม่วนกลับภาพ 1 (ให้ exit timer ทำงานต่อ)
            clearInterval(inner._timerSlide);
            return;
          }
          const next = slides[idx];
          const trans = w.transition || 'fade';
          if (trans.startsWith('slide-')) {
            prev.classList.add('exiting');
            next.classList.add('active');
            setTimeout(() => prev.classList.remove('active', 'exiting'), 650);
          } else {
            prev.classList.remove('active');
            next.classList.add('active');
          }
          if (counterEl) counterEl.textContent = `${idx + 1}/${slides.length}`;
        }, (slideDurSec + TRANS_SEC) * 1000);
      }

      // ★ exit — หลังแสดงครบทุกภาพ
      const exitTO = setTimeout(() => {
        if (inner._timerSlide) clearInterval(inner._timerSlide);
        stopProgress();
        inner.classList.add('t-anim-out', 't-anim-out-' + animOut);
        TOs.push(setTimeout(() => hide(), ANIM_OUT_MS + 100));
      }, totalShowMs + ANIM_IN_MS);
      TOs.push(exitTO);
    }, ANIM_IN_MS + 100));
  }

  // ★ เริ่ม: ซ่อน → รอ 1 วิ → รอบแรก
  widgetEl.classList.add('timer-hidden');
  inner.style.opacity = '0';
  TOs.push(setTimeout(showCycle, 1000));
}

// ════════════════════════════════════════════════════════════
// Webcam Frame widget — กรอบตกแต่งล้วน (ไม่มี video)
// ════════════════════════════════════════════════════════════

// ★ คำนวณ height จาก width + ratio (บังคับสัดส่วน)
function computeRatioHeight(width, ratio) {
  const w = parseInt(width) || 480;
  if (ratio === '1:1') return w;           // 1:1 → height = width
  if (ratio === '4:3') return Math.round(w * 3 / 4);   // 4:3 → height = width * 0.75
  return Math.round(w * 9 / 16);           // 16:9 → height = width * 0.5625
}

function setupWebcamFrame(inner, w) {
  while (inner.firstChild) inner.removeChild(inner.firstChild);
  // ★ ความหนาขอบ — CSS variable ที่ .webcam-frame สืบทอด
  const bw = w.webcam_border_width || 4;
  inner.style.setProperty('--wc-border-width', bw + 'px');
  // ★ กรอบ — CSS theme คุมลวดลาย (webcam-theme-*)
  const frame = document.createElement('div');
  frame.className = 'webcam-frame';
  inner.appendChild(frame);
  // ★ placeholder ตอน editor (บอกว่าวาง webcam ตรงนี้)
  if (isEditor) {
    const ph = document.createElement('div');
    ph.className = 'webcam-placeholder';
    ph.textContent = '📷 วาง Webcam ที่นี่ (ใน OBS)';
    inner.appendChild(ph);
  }
}

// ════════════════════════════════════════════════════════════
// Text widget — static / scroll loop / schedule
// ════════════════════════════════════════════════════════════
function setupTextWidget(inner, w) {
  // clear timer + content
  // ★ clear timer (รองรับทั้ง setInterval สำหรับ schedule + requestAnimationFrame/timeout สำหรับ scroll)
  if (inner._textCleanup) { inner._textCleanup(); inner._textCleanup = null; }
  if (inner._textTimer) {
    clearInterval(inner._textTimer);
    cancelAnimationFrame(inner._textTimer);
    clearTimeout(inner._textTimer);
    inner._textTimer = null;
  }
  while (inner.firstChild) inner.removeChild(inner.firstChild);

  const mode = w.text_mode || 'static';
  const content = w.text_content || '';
  const ff = (config.font_family || 'Kanit');
  const fs = (w.font_size || 24);
  const fc = (w.font_color || '#ffffff');
  const fw = (w.font_weight || '600');
  const align = (w.text_align || 'center');
  // stroke
  const ts = w.text_stroke !== false;
  const tsw = w.text_stroke_width || 2;
  const tsc = w.text_stroke_color || '#000000';
  const strokeType = w.text_stroke_type || 'inner';
  // shadow
  const tsh = w.text_shadow !== false;
  const tshb = w.text_shadow_blur || 3;
  const tshc = w.text_shadow_color || '#000000';

  // ★ Stroke: Inner = -webkit-text-stroke | Outer = text-shadow 8 ทิศทาง
  let webkitStroke = '0 transparent';
  let outerStrokeShadows = '';
  if (ts) {
    if (strokeType === 'inner') {
      webkitStroke = `${tsw}px ${tsc}`;
    } else {
      // ★ Outer stroke — สร้างเงา 8 ทิศทางล้อมรอบตัวอักษร
      const dirs = [
        `${tsw}px 0`, `-${tsw}px 0`, `0 ${tsw}px`, `0 -${tsw}px`,
        `${tsw}px ${tsw}px`, `-${tsw}px -${tsw}px`, `${tsw}px -${tsw}px`, `-${tsw}px ${tsw}px`
      ];
      outerStrokeShadows = dirs.map(d => `${d} 0 ${tsc}`).join(', ');
    }
  }

  // ★ รวม shadow: outer stroke + regular shadow
  const allShadows = [
    outerStrokeShadows,
    tsh ? `0 1px ${tshb}px ${tshc}` : ''
  ].filter(s => s).join(', ') || 'none';

  // ★ inline style (apply ทั้งหมด — กัน theme CSS ทับ)
  const textStyle = `
    font-family: "${ff}", "Leelawadee UI", "Segoe UI", sans-serif;
    font-size: ${fs}px;
    color: ${fc};
    font-weight: ${fw};
    -webkit-text-stroke: ${webkitStroke};
    text-shadow: ${allShadows};
    --text-align: ${align};
  `;
  inner.style.setProperty('--text-align', align);
  // ★ map align → justify-content (flex-start/center/flex-end)
  const justify = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center';
  inner.style.setProperty('--text-justify', justify);

  // ★ Text widget background (ถ้าเปิดใช้) — apply ที่ widget element (parent) เพื่อให้แน่ใจว่าแสดง
  const widgetEl = inner.closest('.widget');
  if (w.text_bg_enabled) {
    const bgColor = w.text_bg_color || '#1a1a2e';
    const bgOpacity = w.text_bg_opacity !== undefined ? w.text_bg_opacity : 1.0;
    const bgRadius = w.text_bg_radius !== undefined ? w.text_bg_radius : 8;
    // ★ แปลง hex + opacity → rgba (alpha=1 → solid hex เพื่อกันปัญหา compositing ใน OBS)
    let bgCss;
    if (bgOpacity >= 0.999) {
      bgCss = bgColor;  // ★ solid hex — ทึบ 100%
    } else {
      const r = parseInt(bgColor.slice(1,3), 16) || 0;
      const g = parseInt(bgColor.slice(3,5), 16) || 0;
      const b = parseInt(bgColor.slice(5,7), 16) || 0;
      bgCss = `rgba(${r},${g},${b},${bgOpacity})`;
    }
    // ★ apply ที่ทั้ง widget + inner (กัน CSS rule background:transparent ทับ)
    if (widgetEl) widgetEl.style.background = bgCss;
    inner.style.background = bgCss;
    inner.style.borderRadius = bgRadius + 'px';
    inner.style.padding = '8px 16px';
  } else {
    if (widgetEl) widgetEl.style.background = '';
    inner.style.background = '';
    inner.style.borderRadius = '';
    inner.style.padding = '';
  }

  if (mode === 'scroll') {
    // ★ scroll loop — JS animation (วิ่งซ้ายจนหมดจอ → delay 2s → เริ่มใหม่)
    const el = document.createElement('div');
    el.className = 'text-content';
    el.style.cssText = textStyle;
    el.textContent = content;
    inner.appendChild(el);
    // ★ speed: 1-20 → pixels per second (ระบบพิกัด canvas)
    //   ใช้ px/วิ + timestamp → ไม่ขึ้นกับ frame rate และไม่ขึ้นกับ zoom
    //   → ความเร็วเท่ากันทุก mode (Editor / Overlay / OBS)
    //   ก่อนหน้านี้คำนวณเป็น px/frame และหารด้วย zoomLevel → ใน Editor เร็วกว่า OBS 3-5 เท่า
    //   ค่าคงที่: speed 1 = 30 px/วิ (อ่านสบาย), speed 10 = 300 px/วิ, speed 20 = 600 px/วิ
    const speed = w.text_scroll_speed || 10;
    const pxPerSec = Math.max(30, speed * 30);   // px/วิ (ขั้นต่ำ 30 px/วิ)
    // ★ Timing ในการเริ่ม Loop ข้อความ (หน่วยวินาที — default 2 วิ)
    const delayMs = Math.max(0.5, Number(w.text_scroll_delay) || 2) * 1000;
    // ★ animation loop — วัดความกว้างจริงหลัง render (double rAF)
    let scrollPos = 0;
    let isPaused = false;
    let animId = null;
    let lastTs = 0;
    function startScrollLoop() {
      const containerW = inner.offsetWidth || 400;
      // ★ วัด textW จริง — ใช้ scrollWidth เพราะ absolute + nowrap อาจให้ offsetWidth ผิด
      const textW = el.scrollWidth || el.offsetWidth || 200;
      scrollPos = containerW;   // เริ่มที่ขอบขวา (มองไม่เห็น)
      el.style.left = scrollPos + 'px';
      lastTs = 0;
      function step(ts) {
        if (isPaused) return;
        if (!lastTs) lastTs = ts;
        const dt = (ts - lastTs) / 1000;   // วินาที
        lastTs = ts;
        scrollPos -= pxPerSec * dt;        // เลื่อนตามเวลาจริง (px/วิ × วิ)
        el.style.left = scrollPos + 'px';
        // ★ ข้อความออกจากจอซ้ายหมดแล้ว = ขอบขวาของข้อความ (left + textW) น้อยกว่า 0
        if (scrollPos + textW <= 0) {
          isPaused = true;
          // ★ ซ่อนทันทีที่ออกจากจอ (กัน flash ตอน reset)
          el.style.visibility = 'hidden';
          animId = setTimeout(() => {
            isPaused = false;
            startScrollLoop();
            // ★ โชว์หลังจัดตำแหน่งที่ขอบขวาเรียบร้อยแล้ว
            requestAnimationFrame(() => { el.style.visibility = ''; });
          }, delayMs);
          return;
        }
        animId = requestAnimationFrame(step);
      }
      animId = requestAnimationFrame(step);
    }
    inner._textTimer = animId;
    // ★ double rAF — รอ 2 frames ให้ browser layout เสร็จก่อนวัดความกว้าง
    requestAnimationFrame(() => requestAnimationFrame(() => {
      // เก็บ cleanup function ไว้ใน inner._textCleanup
      inner._textCleanup = () => {
        if (animId) { cancelAnimationFrame(animId); clearTimeout(animId); animId = null; }
      };
      startScrollLoop();
    }));
  } else if (mode === 'schedule') {
    // ★ schedule — หลายข้อความ → สลับตาม interval (เหมือน slideshow)
    const lines = content.split('\n').map(s => s.trim()).filter(s => s);
    if (lines.length === 0) {
      const el = document.createElement('div');
      el.className = 'text-content';
      el.style.cssText = textStyle;
      el.textContent = '📝 พิมพ์ข้อความ (1 บรรทัด = 1 ข้อความ)';
      el.style.color = '#64748b';
      inner.appendChild(el);
      return;
    }
    // สร้างทุกบรรทัด
    lines.forEach((line, i) => {
      const el = document.createElement('div');
      el.className = 'text-line' + (i === 0 ? ' active' : '');
      el.style.cssText = textStyle;
      el.textContent = line;
      inner.appendChild(el);
    });
    // ถ้ามีแค่ 1 บรรทัด → ไม่ต้อง timer
    if (lines.length > 1) {
      let idx = 0;
      const intervalMs = computeSlideIntervalMs(w.text_interval, w.text_interval_unit);
      inner._textTimer = setInterval(() => {
        const allLines = inner.querySelectorAll('.text-line');
        allLines.forEach(l => l.classList.remove('active'));
        idx = (idx + 1) % lines.length;
        if (allLines[idx]) allLines[idx].classList.add('active');
      }, intervalMs);
    }
  } else {
    // ★ static — แสดงข้อความเดียวตรงกลาง
    const el = document.createElement('div');
    el.className = 'text-content';
    el.style.cssText = textStyle;
    el.textContent = content || '📝 Text widget';
    if (!content) el.style.color = '#64748b';
    inner.appendChild(el);
  }
}

// ════════════════════════════════════════════════════════════
// Video widget — <video> loop (webcam frame animation ฯลฯ)
// ════════════════════════════════════════════════════════════
function setupVideoWidget(inner, w) {
  // ★ หยุด color key เดิมก่อน (ถ้ามี)
  stopColorKey(w.id);
  while (inner.firstChild) inner.removeChild(inner.firstChild);
  const url = w.video_url || '';
  if (!url) {
    const empty = document.createElement('div');
    empty.className = 'video-empty';
    empty.textContent = '🎬 ยังไม่มีวิดีโอ — คลิก ⚙ เพื่ออัปโหลด';
    inner.appendChild(empty);
    return;
  }
  const video = document.createElement('video');
  video.className = 'video-player';
  video.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.setAttribute('muted', '');
  inner.appendChild(video);
  // ★ force play (กัน autoplay policy บาง browser)
  video.play().catch(() => {});
  // ★ color key — เริ่มหลัง video พร้อมเล่น
  if (w.ck_enabled) {
    const startCk = () => {
      if (video.readyState >= 1) {
        startColorKey(inner, w);
      } else {
        setTimeout(startCk, 200);
      }
    };
    startCk();
  }
}

// ★ เปิด file picker → upload video
function openVideoPicker(widgetId) {
  const w = config.widgets.find(x => x.id === widgetId);
  if (!w) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/mp4,video/webm,video/quicktime';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      alert('ไฟล์ใหญ่เกิน 50MB — แนะนำให้บีบอัดก่อน');
      return;
    }
    const fd = new FormData();
    fd.append('widget_id', widgetId);
    fd.append('video', file);
    try {
      const r = await fetch('/upload-widget-video', { method: 'POST', body: fd });
      const data = await r.json();
      if (data.ok) {
        w.video_url = data.url;
        applySettingsLive();
      } else {
        alert('อัปโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
      }
    } catch (e) {
      alert('อัปโหลดผิดพลาด: ' + e.message);
    }
  };
  input.click();
}

// ★ re-bind drag/resize โดยใช้ el._widgetRef (เปลี่ยนทุกครั้งที่ config update)
function rebindDragResize(el, w) {
  el._widgetRef = w;
}

// ★ helper: ดึง widget reference ปัจจุบันของ element
function getWidgetRef(el) {
  // หาใน config.widgets (ใหม่ที่สุด)
  const wid = el.dataset.id;
  return config.widgets.find(x => x.id === wid) || el._widgetRef;
}

// ★ render content ของ widget ลง inner (แยกจาก createWidgetElement เพื่อ reuse)
function renderWidgetContent(inner, w) {
  if (w.type === 'chat') {
    // chat widget = iframe (ไม่ render ที่นี่ — อยู่ใน createWidgetElement)
    return;
  } else if (w.type === 'alert' && w.url) {
    const iframe = document.createElement('iframe');
    iframe.src = w.url;
    iframe.allow = 'autoplay; fullscreen';
    // ★ no-referrer: StreamLabs บล็อกการฝังจาก origin อื่นด้วย Referer check
    // → ถ้าส่ง Referer http://localhost มาจะตอบ 404 "page not found"
    // → ใช้ referrerpolicy=no-referrer เพื่อไม่ส่ง Referer เลย จะได้ 200 OK
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    inner.appendChild(iframe);
  } else if (w.type === 'ask') {
    // ★ ASK โพล — เนื้อหามาจาก state สด (push ผ่าน WS) ไม่ใช่ config
    // ★ ต้อง set CSS vars ตั้งแต่สร้างครั้งแรก (กัน widget ใหม่/OBS ใช้ default CSS
    //   แทนค่าจริง — เคยทำให้กล่องโผล่ผิดตำแหน่ง/ผิดขนาดจนกว่าจะมี push รอบสอง)
    inner.style.setProperty('--ask-scale', w.ask_scale != null ? w.ask_scale : 1);
    inner.style.setProperty('--ask-extend', w.ask_extend_pct != null ? w.ask_extend_pct : 20);
    inner.style.setProperty('--ask-px', w.ask_pos_x != null ? w.ask_pos_x : 85);
    inner.style.setProperty('--ask-py', w.ask_pos_y != null ? w.ask_pos_y : 12);
    inner.style.setProperty('--ask-qfs', w.ask_question_fs != null ? w.ask_question_fs : 24);
    inner.style.setProperty('--ask-cfs', w.ask_choice_fs != null ? w.ask_choice_fs : 18);
    inner.style.setProperty('--ask-opacity', (w.ask_opacity_pct != null ? w.ask_opacity_pct : 100) / 100);
    inner.style.setProperty('--ask-minw', w.ask_min_width != null ? w.ask_min_width : 340);
    inner.innerHTML = '<div class="ask-empty">' +
      (isEditor ? '🗳️ รอคำสั่งเริ่มโหวตจากโปรแกรม (ปุ่ม ASK)' : '') +
      '</div>';
    renderAskInto(inner);
  } else if (w.type === 'viewer') {
    const iconSize = w.viewer_icon_size || 20;
    const showIcon = w.viewer_show_icon !== false;
    // ★ ถ้ามี viewers data ล่าสุด → re-apply (กันกลับเป็น 👥 0 ตอน re-create)
    if (_lastViewersData) {
      // หา widget id ของ inner นี้
      const widgetEl = inner.closest('.widget');
      const wid = widgetEl ? widgetEl.dataset.id : null;
      if (wid) {
        const wcfg = config.widgets.find(x => x.id === wid);
        if (wcfg) {
          // re-render เฉพาะ widget นี้ด้วย data ล่าสุด
          handleViewers(_lastViewersData);
          return;
        }
      }
    }
    inner.innerHTML = `<span class="viewer-total">${showIcon ? peopleIconSpan(iconSize) : ''}0</span>`;
  } else if (w.type === 'clock') {
    // ★ ถ้ามี clock_style → ใช้ renderClockStyle (ระบบ Style ใหม่)
    if (w.clock_style && w.clock_style !== 'none') {
      renderClockStyle(inner, w);
    } else {
      // ── ระบบ theme เดิม (legacy) ──
      const theme = w.clock_theme || 'default';
      const isCircle = theme.startsWith('cc');
      if (isCircle) {
        const ringOuter = document.createElement('div');
        ringOuter.className = 'clock-ring-outer';
        inner.appendChild(ringOuter);
        const ringInner = document.createElement('div');
        ringInner.className = 'clock-ring-inner';
        inner.appendChild(ringInner);
      }
      const timeEl = document.createElement('div');
      timeEl.className = 'clock-time';
      timeEl.textContent = '--:--';
      inner.appendChild(timeEl);
      const dateEl = document.createElement('div');
      dateEl.className = 'clock-date';
      dateEl.textContent = '--';
      dateEl.style.display = (w.show_date) ? '' : 'none';
      inner.appendChild(dateEl);
      inner.style.flexDirection = 'column';
      inner.style.gap = '2px';
      updateClock(inner);
    }
  } else if (w.type === 'image') {
    // ★ image widget = native <img> slides + setInterval slideshow (ไม่ใช้ iframe)
    setupImageWidget(inner, w);
  } else if (w.type === 'playroom') {
    // ★ playroom widget = iframe ไปยัง /playroom-widget (serve playroom.html ผ่าน composer)
    // ★ ส่ง widget id ผ่าน URL เพื่อให้ playroom.html ระบุตัวเองใน WS hello (per-widget triggers)
    const iframe = document.createElement('iframe');
    iframe.src = buildPlayroomSrc(w);
    iframe.allow = 'autoplay; fullscreen';
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    iframe.dataset.ckSig = JSON.stringify({ ck: w.ck_enabled, color: w.ck_color, sim: w.ck_similarity, smooth: w.ck_smoothness });
    inner.appendChild(iframe);
  } else if (w.type === 'webcam') {
    // ★ webcam frame = กรอบตกแต่งล้วน (ไม่มี video — user เอา webcam ไปวางใน OBS เอง)
    setupWebcamFrame(inner, w);
  } else if (w.type === 'text') {
    // ★ text widget = native DOM + โหมด static/scroll/schedule
    setupTextWidget(inner, w);
  } else if (w.type === 'video') {
    // ★ video widget = <video> loop (สำหรับ webcam frame animation)
    setupVideoWidget(inner, w);
  } else if (w.type === 'now_playing') {
    // ★ restore ข้อมูลล่าสุดที่มีจริง (ไม่ใช่ placeholder)
    if (_lastNowPlayingData && _lastNowPlayingData.title) {
      updateNowPlayingWidget(inner, _lastNowPlayingData, w.id);
    } else {
      inner.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.4);font-size:13px;">🎵 Now Playing</div>';
    }
  } else if (w.type === 'emote_party') {
    setupEmoteParty(inner, w);
  } else if (w.type === 'avatar') {
    setupAvatarWidget(inner, w);
  } else if (w.type === 'donate_goal') {
    setupDonateGoalWidget(inner, w);
  }
}

function createWidgetElement(w) {
  const el = document.createElement('div');
  // ★ เพิ่ม class ตาม layout/direction/animation (chat) + clock theme
  const classes = [`widget`, `type-${w.type}`];
  if (w.type === 'chat') {
    const layout = w.layout || 'inline';
    if (layout === 'stacked' || layout === 'stacked_no_logo') classes.push('layout-stacked');
    classes.push('dir-' + (w.direction || 'bottom'));
    classes.push('anim-' + (w.animation || 'fade'));
    classes.push('align-' + (w.chat_align || 'left'));
  }
  if (w.type === 'clock') {
    classes.push('clock-theme-' + (w.clock_theme || 'default'));
    // ★ clock_style — port จาก mooncape source (Dot/Circle/LiveText/FPS)
    if (w.clock_style && w.clock_style !== 'none') {
      classes.push('clock-style-set');
      classes.push('clock-style-' + w.clock_style);
    }
  }
  if (w.type === 'ask') {
    classes.push(...askWidgetClasses(w));
  }
  if (w.type === 'viewer') {
    classes.push('viewer-theme-' + (w.viewer_theme || 'default'));
    classes.push('viewer-align-' + (w.viewer_align || 'left'));
    classes.push('viewer-direction-' + (w.viewer_direction || 'horizontal'));
  }
  if (w.type === 'image') {
    // ★ transition class (tr-fade, tr-slide-left, ...) คุม animation ตอนเปลี่ยนรูป
    classes.push('tr-' + (w.transition || 'fade'));
  }
  if (w.type === 'webcam') {
    classes.push('webcam-theme-' + (w.webcam_theme || 'simple-white'));
    classes.push('ratio-' + (w.webcam_ratio || '16:9').replace(':', '-'));
  }
  if (w.type === 'text') {
    classes.push('text-' + (w.text_mode || 'static'));
  }
  el.className = classes.join(' ');
  el.dataset.id = w.id;
  // ★ ASK — บังคับเต็ม canvas ตั้งแต่สร้าง element (กัน config ภายนอก เช่น import
  //   profile ส่งขนาดเก่าเข้ามา แล้วโชว์เป็นกล่องเล็กจนกว่าจะ renderAll รอบหน้า)
  if (w.type === 'ask') {
    w.x = 0; w.y = 0;
    w.w = config.canvas_w || 1920;
    w.h = config.canvas_h || 1080;
  }
  el.style.left = w.x + 'px';
  el.style.top = w.y + 'px';
  el.style.width = w.w + 'px';
  // ★ webcam widget — height คำนวณจาก width + ratio (บังคับสัดส่วน)
  if (w.type === 'webcam') {
    el.style.height = computeRatioHeight(w.w, w.webcam_ratio) + 'px';
  } else {
    el.style.height = w.h + 'px';
  }
  el.style.zIndex = w.z || 1;
  el.style.opacity = (w.alpha != null ? w.alpha : 1.0);
  // ★ widget_scale — หด/ขยาย widget ทั้งอัน (transform: scale) โดยไม่ปรับค่าภายใน
  const ws0 = w.widget_scale != null ? w.widget_scale : 1.0;
  el.style.transform = (ws0 !== 1.0) ? `scale(${ws0})` : '';
  el.style.transformOrigin = 'top left';
  // ★ editor buttons counter-scale (คงขนาดเดิมเสมอ) — ใช้ที่จุดสร้าง widget ใหม่ด้วย
  const _btnInv0 = (ws0 !== 1.0) ? `scale(${(1 / ws0).toFixed(3)})` : '';
  el.querySelectorAll('.delete-btn, .settings-btn, .resize-handle').forEach(b => {
    b.style.transform = _btnInv0;
    b.style.transformOrigin = 'center';
  });

  const inner = document.createElement('div');
  inner.className = 'widget-inner';
  // ★ content opacity — โปร่งใสเฉพาะเนื้อหาภายใน (ไม่กรอบ/ปุ่ม)
  //    clock widget ใช้ style_opacity/theme_opacity แยกตามโหมด
  if (w.type === 'clock') {
    const hasStyle = w.clock_style && w.clock_style !== 'none';
    inner.style.opacity = hasStyle
      ? (w.style_opacity != null ? w.style_opacity : 1.0)
      : (w.theme_opacity != null ? w.theme_opacity : (w.content_opacity != null ? w.content_opacity : 1.0));
  } else {
    inner.style.opacity = (w.content_opacity != null ? w.content_opacity : 1.0);
  }
  el.appendChild(inner);

  // ★ apply per-widget style
  applyWidgetStyle(inner, w);

  // เนื้อหาเริ่มต้นตาม type
  if (w.type === 'chat') {
    // ★ chat widget = iframe ที่โหลด overlay.html (reuse theme/balloon/character เดิม 100%)
    // config เฉพาะ widget ส่งผ่าน ?id={widget_id} → overlay.html fetch /chat-config?id=...
    // _v = overlay_version (mtime ของ overlay.html) → เมื่อแก้ไฟล์, version เปลี่ยน → iframe reload อัตโนมัติ
    const ov = config.overlay_version || 0;
    const iframe = document.createElement('iframe');
    iframe.src = `/chat-widget?id=${encodeURIComponent(w.id)}&_v=${ov}&_t=${Date.now()}`;
    iframe.allow = 'autoplay; fullscreen';
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    iframe.dataset.overlayVersion = ov;
    inner.appendChild(iframe);
  } else if (w.type === 'alert' && w.url) {
    const iframe = document.createElement('iframe');
    iframe.src = w.url;
    iframe.allow = 'autoplay; fullscreen';
    // ★ no-referrer: StreamLabs บล็อกการฝังจาก origin อื่น (Referer localhost → 404)
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    inner.appendChild(iframe);
  } else if (w.type === 'viewer') {
    const vIconSize = w.viewer_icon_size || 20;
    const vShowIcon = w.viewer_show_icon !== false;
    inner.innerHTML = `<span class="viewer-total">${vShowIcon ? peopleIconSpan(vIconSize) : ''}0</span>`;
  } else if (w.type === 'clock') {
    // ★ ถ้ามี clock_style → ใช้ renderClockStyle (ระบบ Style ใหม่)
    if (w.clock_style && w.clock_style !== 'none') {
      renderClockStyle(inner, w);
    } else {
      // ── ระบบ theme เดิม (legacy) ──
      const theme = w.clock_theme || 'default';
      if (theme.startsWith('cc')) {
        const ringOuter = document.createElement('div');
        ringOuter.className = 'clock-ring-outer';
        inner.appendChild(ringOuter);
        const ringInner = document.createElement('div');
        ringInner.className = 'clock-ring-inner';
        inner.appendChild(ringInner);
      }
      const timeEl = document.createElement('div');
      timeEl.className = 'clock-time';
      timeEl.textContent = '--:--';
      inner.appendChild(timeEl);
      const dateEl = document.createElement('div');
      dateEl.className = 'clock-date';
      dateEl.textContent = '--';
      dateEl.style.display = (w.show_date) ? '' : 'none';
      inner.appendChild(dateEl);
      inner.style.flexDirection = 'column';
      inner.style.gap = '2px';
      updateClock(inner);
    }
  } else if (w.type === 'image') {
    // ★ image widget = native <img> slides + setInterval slideshow
    setupImageWidget(inner, w);
  } else if (w.type === 'playroom') {
    // ★ playroom widget = iframe ไปยัง /playroom-widget
    // ★ ส่ง widget id ผ่าน URL เพื่อให้ playroom.html ระบุตัวเองใน WS hello (per-widget triggers)
    const iframe = document.createElement('iframe');
    iframe.src = buildPlayroomSrc(w);
    iframe.allow = 'autoplay; fullscreen';
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    iframe.dataset.ckSig = JSON.stringify({ ck: w.ck_enabled, color: w.ck_color, sim: w.ck_similarity, smooth: w.ck_smoothness });
    inner.appendChild(iframe);
  } else if (w.type === 'webcam') {
    setupWebcamFrame(inner, w);
  } else if (w.type === 'text') {
    setupTextWidget(inner, w);
  } else if (w.type === 'video') {
    setupVideoWidget(inner, w);
  } else if (w.type === 'now_playing') {
    if (_lastNowPlayingData && _lastNowPlayingData.title) {
      updateNowPlayingWidget(inner, _lastNowPlayingData, w.id);
    } else {
      inner.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.4);font-size:13px;">🎵 Now Playing</div>';
    }
  } else if (w.type === 'emote_party') {
    setupEmoteParty(inner, w);
  } else if (w.type === 'avatar') {
    setupAvatarWidget(inner, w);
  } else if (w.type === 'donate_goal') {
    setupDonateGoalWidget(inner, w);
  }

  // editor mode — เพิ่ม handle + ปุ่มลบ + ปุ่ม settings
  if (isEditor) {
    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); deleteWidget(w.id); };
    el.appendChild(del);

    // ★ ปุ่ม settings (gear) — เปิด popup ปรับ style
    const gear = document.createElement('button');
    gear.className = 'settings-btn';
    gear.textContent = '⚙';
    gear.onclick = (e) => { e.stopPropagation(); openSettingsModal(w.id); };
    el.appendChild(gear);

    // ★ ASK = เต็ม canvas ล็อค — ไม่มี resize handle / ลากไม่ได้ (แก้ที่ ⚙ เท่านั้น)
    if (w.type !== 'ask') {
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      el.appendChild(handle);
      enableDrag(el, w);
      enableResize(el, handle, w);
    }
    el.onclick = (e) => {
      e.stopPropagation();
      selectWidget(w.id);
    };
  }

  return el;
}

// ════════════════════════════════════════════════════════════
// Clock Style — สร้าง DOM content ตาม clock_style (port จาก mooncape)
// ════════════════════════════════════════════════════════════
// ★ Circle Clock color schemes (c2=active arc, c3=inactive arc) — ตรงกับต้นฉบับ clock_01-05.js
const CC_COLOR_SCHEMES = {
  1: ['#FF5D5D', '#FFC3C3'],  // แดงชมพู
  2: ['#1363DF', '#DFF6FF'],  // ฟ้าน้ำเงิน
  3: ['#07D01D', '#E0F3D2'],  // เขียว
  4: ['#F77E21', '#FEF9A7'],  // ส้มทอง
  5: ['#8D8DAA', '#F7F5F2'],  // ขาวเทา
};
const CC_DAY_NAMES = ['Sun.', 'Mon.', 'Tue.', 'Wed.', 'Thu.', 'Fri.', 'Sat.'];

// ★ FPS SVG shapes (port จาก fps_clock02/03/04)
const FPS_SVGS = {
  // fps2: hexagon (pointed ends)
  2: '<svg viewBox="0 0 300 50" preserveAspectRatio="none"><g class="fps-bg"><path d="M645.64,0H360.36L356,7.45,379.93,50H626.07L650,7.45Z" transform="translate(-353)"/></g><g class="fps-frame"><path d="M360.36,0h-3L353,7.45,376.93,50h3L356,7.45ZM648.64,0h-3L650,7.45,626.07,50h3L653,7.45Z" transform="translate(-353)"/></g></svg>',
  // fps3: rectangle (notched corners)
  3: '<svg viewBox="0 0 244 50" preserveAspectRatio="none"><g class="fps-bg"><path d="M355.53-102.22h-220l-10-10v-26l10-10h220l10,10v26Z" transform="translate(-123.53 150.22)"/></g><g class="fps-frame"><path d="M128.53-150.22h68l2,2h-63l-10,10v26l-2-2v-31Zm237,12v26l-10,10h-63l2,2h68l5-5v-31Z" transform="translate(-123.53 150.22)"/></g></svg>',
  // fps4: octagon (angled sides)
  4: '<svg viewBox="0 0 300 50" preserveAspectRatio="none"><g class="fps-bg"><polygon points="5.44 49 1.18 42.19 26.92 1 294.56 1 298.82 7.81 273.08 49 5.44 49"/></g><g class="fps-frame"><path d="M1914-64.15l3.63,5.82-25.12,40.18H1626L1622.36-24l25.12-40.19H1914m1.11-2H1646.37L1620-24l4.88,7.81h268.75L1920-58.33l-4.88-7.82Z" transform="translate(-1620 66.15)"/></g></svg>',
};

// ★ อัปเดตขนาด Circle Clock ให้พอดีกับ widget (responsive)
function updateCircleClockSize(el) {
  const main = el.querySelector('.cc-main');
  if (!main) return;
  const ww = el.offsetWidth || 180;
  const wh = el.offsetHeight || 180;
  const size = Math.min(ww, wh);
  main.style.width = size + 'px';
  main.style.height = size + 'px';
  const fontSize = Math.round(size * 0.23);
  const t1 = main.querySelector('.cc-t1');
  if (t1) t1.style.fontSize = fontSize + 'px';
  const t2 = main.querySelector('.cc-t2');
  if (t2) t2.style.fontSize = Math.round(fontSize * 0.48) + 'px';
  const live = main.querySelector('.cc-live');
  if (live) live.style.fontSize = Math.round(fontSize * 0.52) + 'px';
}

function renderClockStyle(inner, w) {
  const style = w.clock_style || 'none';
  if (style === 'none') return false; // ไม่มี style → ใช้ระบบ theme เดิม

  inner.innerHTML = ''; // ล้าง content เดิม
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const yr = now.getFullYear();
  const mo = String(now.getMonth() + 1).padStart(2, '0');
  const dy = String(now.getDate()).padStart(2, '0');

  // ── DOT CLOCK

  // ── DOT CLOCK (dot1=HH:MM, dot2=YYYY.MM.DD HH:MM, dot3=DD.MM.YYYY HH:MM) ──
  if (style === 'dot1' || style === 'dot2' || style === 'dot3') {
    const outbox = document.createElement('div'); outbox.className = 'dot-outbox';
    const inbox = document.createElement('div'); inbox.className = 'dot-inbox';
    const timeEl = document.createElement('span'); timeEl.className = 'dot-time';
    const waitEl = document.createElement('span'); waitEl.className = 'dot-wait';
    if (style === 'dot1') {
      timeEl.textContent = `${h}:${m}`;
      waitEl.textContent = '▼';
    } else if (style === 'dot2') {
      timeEl.textContent = `${yr}.${mo}.${dy} ${h}:${m}`;
      waitEl.textContent = '▼';
    } else { // dot3
      timeEl.textContent = `${dy}.${mo}.${yr} ${h}:${m}`;
      waitEl.textContent = '●';
    }
    inbox.appendChild(timeEl);
    inbox.appendChild(waitEl);
    outbox.appendChild(inbox);
    inner.appendChild(outbox);
    return true;
  }

  // ── CIRCLE CLOCK (cc{1-5}, cclive{1-5}, ccdate{1-5}, ccsec{1-5}) ──
  if (style.startsWith('cc')) {
    const colorNum = parseInt(style.replace(/[^0-9]/g, '')) || 1;
    const variant = style.startsWith('ccdate') ? 'date' :
                    style.startsWith('cclive') ? 'live' :
                    style.startsWith('ccsec') ? 'sec' : 'normal';
    const main = document.createElement('div'); main.className = 'cc-main';
    const oc = document.createElement('div'); oc.className = 'cc-oc';
    const ic = document.createElement('div'); ic.className = 'cc-ic';
    const t1 = document.createElement('div'); t1.className = 'cc-t1';
    t1.textContent = `${h}:${m}`;
    main.appendChild(oc); main.appendChild(ic); main.appendChild(t1);
    if (variant === 'date') {
      const t2 = document.createElement('div'); t2.className = 'cc-t2';
      t2.textContent = `${mo}/${dy} ${CC_DAY_NAMES[now.getDay()]}`;
      main.appendChild(t2);
    } else if (variant === 'live') {
      const live = document.createElement('div'); live.className = 'cc-live';
      live.textContent = 'LIVE';
      main.appendChild(live);
    } else if (variant === 'sec') {
      const t2 = document.createElement('div'); t2.className = 'cc-t2';
      t2.textContent = s;
      main.appendChild(t2);
    }
    inner.appendChild(main);
    // ★ ปรับขนาด cc-main ให้เป็นวงกลมที่ใหญ่ที่สุดที่พอดีกับ widget
    const widgetEl = inner.closest('.widget');
    if (widgetEl) updateCircleClockSize(widgetEl);
    return true;
  }

  // ── CLOCK WITH LIVE TEXT (lt1-lt5) ──
  if (style.startsWith('lt')) {
    const nowtime = document.createElement('div'); nowtime.className = 'lt-nowtime';
    if (style === 'lt1') {
      // LIVE (bolt + text) + time(underline) + date
      const live = document.createElement('div'); live.className = 'lt-live'; live.textContent = 'LIVE';
      const time = document.createElement('div'); time.className = 'lt-time';
      time.innerHTML = `${h}<span class="lt-colon">:</span>${m}`;
      const date = document.createElement('div'); date.className = 'lt-date';
      date.textContent = `${mo}/${dy} ${CC_DAY_NAMES[now.getDay()]}`;
      nowtime.appendChild(live); nowtime.appendChild(time); nowtime.appendChild(date);
    } else if (style === 'lt2') {
      // bolt + time(underline) + date
      const time = document.createElement('div'); time.className = 'lt-time';
      time.innerHTML = `${h}<span class="lt-colon">:</span>${m}`;
      const date = document.createElement('div'); date.className = 'lt-date';
      date.textContent = `${mo}/${dy} ${CC_DAY_NAMES[now.getDay()]}`;
      nowtime.appendChild(time); nowtime.appendChild(date);
    } else if (style === 'lt3') {
      // bolt + time only
      const time = document.createElement('div'); time.className = 'lt-time';
      time.innerHTML = `${h}<span class="lt-colon">:</span>${m}`;
      nowtime.appendChild(time);
    } else if (style === 'lt4') {
      // bolt + time + seconds inline
      const time = document.createElement('div'); time.className = 'lt-time';
      time.innerHTML = `${h}<span class="lt-colon">:</span>${m}`;
      const sec = document.createElement('span'); sec.className = 'lt-sec'; sec.textContent = s;
      nowtime.appendChild(time); nowtime.appendChild(sec);
    } else if (style === 'lt5') {
      // time + ⚡LIVE (rotating bolt svg)
      const time = document.createElement('div'); time.className = 'lt-time';
      time.innerHTML = `${h}<span class="lt-colon">:</span>${m}`;
      const bolt = document.createElement('span'); bolt.className = 'lt-bolt-svg';
      bolt.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 30"><polygon points="12.4 0 1 18 9.2 18 7.617 30 19 12 10.8 12 12.4 0"/></svg>';
      const live = document.createElement('span'); live.className = 'lt-live-inline'; live.textContent = 'LIVE';
      live.style.fontSize = '22px'; live.style.letterSpacing = '5px';
      nowtime.appendChild(time); nowtime.appendChild(bolt); nowtime.appendChild(live);
    }
    inner.appendChild(nowtime);
    return true;
  }

  // ── FPS CLOCK (fps2-fps4) ──
  if (style.startsWith('fps')) {
    const fpsNum = parseInt(style.replace(/[^0-9]/g, '')) || 2;
    const overlay = document.createElement('div'); overlay.className = 'fps-overlay';
    const svgWrap = document.createElement('div'); svgWrap.className = 'fps-svg';
    svgWrap.innerHTML = FPS_SVGS[fpsNum] || FPS_SVGS[2];
    const time = document.createElement('div'); time.className = 'fps-time';
    time.innerHTML = `${h}<span class="fps-colon">:</span>${m}<span class="fps-colon">:</span>${s}`;
    overlay.appendChild(svgWrap); overlay.appendChild(time);
    inner.appendChild(overlay);
    return true;
  }

  return false;
}

// ★ อัปเดต dynamic parts ของ clock style (conic-gradient ring, seconds) — เรียกทุกวินาที
function updateClockStyle(el, w, now) {
  const style = w.clock_style || 'none';
  if (style === 'none') return false;

  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');

  // Circle Clock — อัปเดต conic-gradient ring + เวลา
  if (style.startsWith('cc')) {
    const colorNum = parseInt(style.replace(/[^0-9]/g, '')) || 1;
    const colors = CC_COLOR_SCHEMES[colorNum];
    const oc = el.querySelector('.cc-oc');
    if (oc && colors) {
      const ms = now.getMilliseconds();
      const deg = 6 * (now.getSeconds() + ms / 1000);
      // ★ สลับสีทุกนาที (เหมือนต้นฉบับ — state inversion ทุก 60 วินาที)
      const phase = Math.floor(now.getMinutes()) % 2;
      const [active, inactive] = phase === 0 ? colors : [colors[1], colors[0]];
      oc.style.background = `conic-gradient(${active} 0deg ${deg}deg, ${inactive} ${deg}deg 360deg)`;
    }
    const t1 = el.querySelector('.cc-t1');
    if (t1) t1.textContent = `${h}:${m}`;
    const t2 = el.querySelector('.cc-t2');
    if (t2) {
      if (style.startsWith('ccsec')) {
        t2.textContent = s;
      } else if (style.startsWith('ccdate')) {
        const mo = String(now.getMonth() + 1).padStart(2, '0');
        const dy = String(now.getDate()).padStart(2, '0');
        t2.textContent = `${mo}/${dy} ${CC_DAY_NAMES[now.getDay()]}`;
      }
    }
    return true;
  }

  // FPS Clock — อัปเดตเวลา (มีวินาที)
  if (style.startsWith('fps')) {
    const time = el.querySelector('.fps-time');
    if (time) time.innerHTML = `${h}<span class="fps-colon">:</span>${m}<span class="fps-colon">:</span>${s}`;
    return true;
  }

  // Live Text 4 — อัปเดตวินาที
  if (style === 'lt4') {
    const sec = el.querySelector('.lt-sec');
    if (sec) sec.textContent = s;
    return true;
  }

  // Dot Clock — อัปเดตเฉพาะเวลา (ไม่ re-type เพื่อ performance)
  if (style === 'dot1' || style === 'dot2' || style === 'dot3') {
    const timeEl = el.querySelector('.dot-time');
    if (timeEl) {
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const dy = String(now.getDate()).padStart(2, '0');
      if (style === 'dot1') timeEl.textContent = `${h}:${m}`;
      else if (style === 'dot2') timeEl.textContent = `${yr}.${mo}.${dy} ${h}:${m}`;
      else timeEl.textContent = `${dy}.${mo}.${yr} ${h}:${m}`;
    }
    return true;
  }

  // Live Text 1/2/3/5 — อัปเดตเวลา
  if (style.startsWith('lt')) {
    const time = el.querySelector('.lt-time');
    if (time) time.innerHTML = `${h}<span class="lt-colon">:</span>${m}`;
    return true;
  }

  return false;
}

// ════════════════════════════════════════════════════════════
// Clock — อัปเดตทุกวินาที
// ════════════════════════════════════════════════════════════
function updateClock(el) {
  const now = new Date();
  const widget = el.closest('.widget');
  const wid = widget ? widget.dataset.id : null;
  const w = wid ? config.widgets.find(x => x.id === wid) : null;

  // ★ ถ้ามี clock_style → ใช้ updateClockStyle (ระบบใหม่)
  if (w && w.clock_style && w.clock_style !== 'none') {
    updateClockStyle(el, w, now);
    return;
  }

  // ── ระบบ theme เดิม (legacy) ──
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const fmt = (w && w.clock_format) || 'HH:MM';
  const timeStr = fmt === 'HH:MM:SS' ? `${h}:${m}:${s}` : `${h}:${m}`;
  const timeEl = el.querySelector('.clock-time') || el;
  timeEl.textContent = timeStr;
  if (w && w.time_color) timeEl.style.color = w.time_color;
  const dateEl = el.querySelector('.clock-date');
  if (dateEl) {
    if (w && w.show_date) {
      dateEl.textContent = formatDate(now, w.date_format || 'short', w.date_lang || 'th');
      dateEl.style.display = '';
      if (w.date_font_size) dateEl.style.fontSize = w.date_font_size + 'px';
      if (w.date_color) dateEl.style.color = w.date_color;
    } else {
      dateEl.style.display = 'none';
    }
  }
  // ★ Circle Clock — อัปเดตวงกลมนอก (conic-gradient หมุนตามวินาที)
  const ringOuter = el.querySelector('.clock-ring-outer');
  if (ringOuter && w) {
    const theme = w.clock_theme || 'default';
    const ccColors = {
      'cc1': ['#FF5D5D', '#FFC3C3'],
      'cc2': ['#1363DF', '#DFF6FF'],
      'cc3': ['#07D01D', '#E0F3D2'],
      'cc4': ['#F77E21', '#FEF9A7'],
      'cc5': ['#8D8DAA', '#F7F5F2'],
    };
    const colors = ccColors[theme];
    if (colors) {
      const ms = now.getMilliseconds();
      const deg = 6 * (now.getSeconds() + ms / 1000);
      const phase = Math.floor(now.getMinutes()) % 2;
      const [active, inactive] = phase === 0 ? colors : [colors[1], colors[0]];
      ringOuter.style.background = `conic-gradient(${active} 0deg ${deg}deg, ${inactive} ${deg}deg 360deg)`;
    }
  }
}

// ฟอร์แมตวันที่เป็นภาษาไทย
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THAI_MONTHS_LONG = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const EN_MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EN_MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const EN_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EN_DAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function formatDate(d, fmt, lang) {
  const day = d.getDate();
  const month = d.getMonth();
  const year = d.getFullYear();
  const isEn = (lang === 'en');
  const dayName = isEn ? EN_DAYS[d.getDay()] : THAI_DAYS[d.getDay()];
  const dayNameLong = isEn ? EN_DAYS_LONG[d.getDay()] : THAI_DAYS[d.getDay()];
  if (fmt === 'long') {
    const mLong = isEn ? EN_MONTHS_LONG[month] : THAI_MONTHS_LONG[month];
    return `${dayNameLong} ${day} ${mLong} ${year}`;
  } else if (fmt === 'iso') {
    return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  } else if (fmt === 'weekday') {
    const mShort = isEn ? EN_MONTHS_SHORT[month] : THAI_MONTHS_SHORT[month];
    const yr = isEn ? year : String(year+543).slice(-2);
    return `${dayName} ${day} ${mShort} ${yr}`;
  }
  // short (default)
  const mShort = isEn ? EN_MONTHS_SHORT[month] : THAI_MONTHS_SHORT[month];
  const yr = isEn ? year : String(year+543).slice(-2);
  return `${day} ${mShort} ${yr}`;
}
// ★ Circle Clock ต้นฉบับใช้ 50ms interval เพื่อ smooth animation (conic-gradient หมุนตาม ms)
// → แยก interval: 50ms สำหรับ cc* (smooth), 1000ms สำหรับนาฬิกาทั่วไป
setInterval(() => {
  document.querySelectorAll('.widget.type-clock .widget-inner').forEach(el => {
    const widget = el.closest('.widget');
    const wid = widget ? widget.dataset.id : null;
    const w = wid ? config.widgets.find(x => x.id === wid) : null;
    // ★ cc* styles → smooth 50ms (conic-gradient + seconds)
    if (w && w.clock_style && (w.clock_style.startsWith('cc') || w.clock_style.startsWith('fps'))) {
      updateClock(el);
    }
  });
}, 50);
setInterval(() => {
  document.querySelectorAll('.widget.type-clock .widget-inner').forEach(el => {
    const widget = el.closest('.widget');
    const wid = widget ? widget.dataset.id : null;
    const w = wid ? config.widgets.find(x => x.id === wid) : null;
    // ★ นาฬิกาทั่วไป (ไม่ใช่ cc*/fps*) → อัปเดตทุก 1 วินาที
    if (!(w && w.clock_style && (w.clock_style.startsWith('cc') || w.clock_style.startsWith('fps')))) {
      updateClock(el);
    }
  });
}, 1000);
