// Chat message handler
// ════════════════════════════════════════════════════════════
function handleChatMessage(msg) {
  if (!msg) return;
  const text = msg.text || msg.display_text || '';
  const author = msg.author || msg.display_name || '';
  if (!text && !author) return;

  document.querySelectorAll('.widget.type-chat').forEach(widget => {
    const inner = widget.querySelector('.widget-inner');
    const wid = widget.dataset.id;
    const wcfg = wid ? config.widgets.find(x => x.id === wid) : null;
    const layout = (wcfg && wcfg.layout) || 'inline';
    const showLogo = wcfg ? wcfg.show_logo !== false : true;
    const showTs = wcfg ? wcfg.show_timestamp === true : false;
    const anim = (wcfg && wcfg.animation) || 'fade';
    const noLogo = (layout === 'inline_no_logo' || layout === 'stacked_no_logo' || layout === 'message_only' || !showLogo);
    const messageOnly = (layout === 'message_only');

    const line = document.createElement('div');
    line.className = 'chat-line';
    const color = msg.color || '#fff';
    const plat = msg.platform || '';

    // ★ timestamp (ถ้าเปิด)
    if (showTs && !messageOnly) {
      const now = new Date();
      const ts = document.createElement('span');
      ts.className = 'time';
      ts.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      line.appendChild(ts);
    }

    // ★ meta line (logo + author) — ซ่อนถ้า message_only หรือไม่มี author
    if (!messageOnly && author) {
      const meta = document.createElement('span');
      meta.className = 'meta-line';
      // logo (ถ้า layout ไม่ใช่ no_logo + เปิด show_logo + มี platform)
      if (!noLogo && plat) {
        const logo = document.createElement('img');
        logo.className = 'logo';
        logo.src = '/logo/' + plat;
        logo.alt = '';
        logo.onerror = function() { this.style.display = 'none'; };
        meta.appendChild(logo);
      }
      const authorEl = document.createElement('span');
      authorEl.className = 'author';
      authorEl.style.color = color;
      authorEl.textContent = author;
      meta.appendChild(authorEl);
      // separator (inline เท่านั้น — stacked ไม่ต้องมี)
      if (layout === 'inline' || layout === 'inline_no_logo') {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = ':';
        meta.appendChild(sep);
      }
      line.appendChild(meta);
    }

    // ★ text block
    const textEl = document.createElement('span');
    textEl.className = 'text-block';
    textEl.textContent = text;
    line.appendChild(textEl);

    // ★ animation class (ตาม wcfg.animation)
    // (CSS จะเลือก .anim-fade/.anim-slide/.anim-pop — เพิ่มที่ widget ไม่ใช่ line)
    // ตอนนี้ widget มี class anim-* อยู่แล้วจาก renderAll → line สืบทอด

    // ★ direction: bottom = ใหม่ล่าง (insertFirst + column-reverse) / top = ใหม่บน (appendChild + column)
    if ((wcfg && wcfg.direction) === 'top') {
      inner.appendChild(line);
    } else {
      inner.insertBefore(line, inner.firstChild);
    }

    // ★ cap ตาม max_messages
    const maxMsg = (wcfg && wcfg.max_messages) || 30;
    while (inner.children.length > maxMsg) {
      // ลบฝั่งตรงข้ามของข้อความใหม่ (เก่าสุด)
      if ((wcfg && wcfg.direction) === 'top') {
        inner.removeChild(inner.firstChild);
      } else {
        inner.removeChild(inner.lastChild);
      }
    }
  });
}

// ════════════════════════════════════════════════════════════
// Viewer count handler
// ════════════════════════════════════════════════════════════
// ★ SVG ไอคอนคน (ประกาศไว้บนสุดของ script — ใช้ร่วมกับ renderWidgetContent)
// (PEOPLE_ICON_SVG + peopleIconSpan ประกาศไว้ที่ด้านบนของ script แล้ว)

// ★ เก็บ viewers data ล่าสุด → ใช้ re-render ตอน viewer widget ถูก re-create (signature เปลี่ยน)
//    กันปัญหา: เปลี่ยน icon size → re-create → innerHTML กลับเป็น initial 👥 0 → รอ WS ใหม่
let _lastViewersData = null;

function handleViewers(data) {
  _lastViewersData = data;  // ★ cache ไว้
  document.querySelectorAll('.widget.type-viewer').forEach(widget => {
    const inner = widget.querySelector('.widget-inner');
    const wid = widget.dataset.id;
    const w = wid ? config.widgets.find(x => x.id === wid) : null;
    const mode = (w && w.viewer_mode) || 'both';
    const showIcon = w ? w.viewer_show_icon !== false : true;
    const iconSize = (w && w.viewer_icon_size) || 20;
    // ★ iconStyle ใช้กับทั้ง SVG (คน) และ <img> (แพลตฟอร์ม) → ขนาดเท่ากันเสมอ
    const iconStyle = `display:inline-flex;align-items:center;width:${iconSize}px;height:${iconSize}px;flex-shrink:0;`;
    const peopleIcon = showIcon ? peopleIconSpan(iconSize) : '';
    const platIcon = (plat) => showIcon ? `<img src="/logo/${plat}" alt="${plat}" style="${iconStyle}object-fit:contain;">` : '';

    let html = '';
    // total
    if (mode === 'total' || mode === 'both') {
      html += `<span class="viewer-total">${peopleIcon}${(data.total || 0).toLocaleString()}</span>`;
    }
    // per-platform
    if ((mode === 'per_platform' || mode === 'both') && data.platforms) {
      // ★ both + per_platform → แสดงทุก platform ที่เชื่อมไว้เสมอ (แม้ count=0 — เดี๋ยวอัปเดตเอง)
      for (const [plat, count] of Object.entries(data.platforms)) {
        html += `<span class="viewer-chip">${platIcon(plat)} ${(count || 0).toLocaleString()}</span>`;
      }
    }
    // ★ fallback: ถ้าไม่มีข้อมูล (ยังไม่ได้รับ update / ทุก platform count=0) → แสดงตามโหมด
    //    - total/both → ไอคอนคน + 0
    //    - per_platform → ไอคอนแพลตฟอร์มที่เชื่อมไว้ + 0 (ถ้ารู้ platforms) หรือ ไอคอนคน + 0 (ถ้าไม่รู้)
    if (!html) {
      if (mode === 'per_platform' && data.platforms) {
        // แสดงทุก platform ที่เชื่อมไว้ พร้อม count=0
        for (const plat of Object.keys(data.platforms)) {
          html += `<span class="viewer-chip">${platIcon(plat)} 0</span>`;
        }
      }
      if (!html) {
        html = `<span class="viewer-total">${peopleIcon}0</span>`;
      }
    }
    // ★ signature diff — ถ้า HTML เหมือนเดิม → อย่าเขียนใหม่ (กัน flicker)
    //   แต่ถ้า DOM ว่างอยู่ → เขียนเสมอ (กัน widget หายหลัง clear children จากการเปลี่ยน theme)
    if (inner.dataset.viewerHtml !== html || !inner.firstElementChild) {
      inner.dataset.viewerHtml = html;
      inner.innerHTML = html;
    }
  });
}

// ASK Widget — โพล/แบบสอบถาม (state สดจากโปรแกรม ผ่าน WS type='ask')

// ★ escape HTML กัน script injection จากคำถาม/คำตอบที่ streamer/editor พิมพ์
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function handleAskState(data) {
  const wasActive = !!( _lastAskData && _lastAskData.active);
  _lastAskData = data && data.active ? data : null;
  const nowActive = !!(_lastAskData && _lastAskData.active);
  // ★ sync ปุ่ม demo ใน editor ตาม auto-flow ของ server (โหวต→สรุปผล→หาย)
  //   (guard typeof — หน้า overlay ไม่มีตัวแปรพวกนี้)
  if (typeof _askDemoMode !== 'undefined' && _askDemoMode !== 'off') {
    if (!nowActive) { _askDemoMode = 'off'; if (typeof updateAskDemoButtons === 'function') updateAskDemoButtons(); }
    else if (_lastAskData.phase === 'ended' && _askDemoMode === 'vote') {
      _askDemoMode = 'result'; if (typeof updateAskDemoButtons === 'function') updateAskDemoButtons();
    }
  }
  document.querySelectorAll('.widget.type-ask').forEach(el => {
    const inner = el.querySelector('.widget-inner');
    if (!inner) return;
    const w = config.widgets.find(x => x.id === el.dataset.id) || {};
    // ★ self-heal className — กันโหมด/ธีมค้างรุ่นเก่า (เช่น renderAll ถูกข้ามช่วง local-edit
    //   window → className เดิมไม่ถูก rebuild → panel ใหม่เรนเดอร์ผิดโหมด)
    const _keepSel = el.classList.contains('selected') ? ['selected'] : [];
    el.className = ['widget', 'type-ask', ...askWidgetClasses(w), ..._keepSel].join(' ');
    inner.style.setProperty('--ask-scale', w.ask_scale != null ? w.ask_scale : 1);
    inner.style.setProperty('--ask-extend', w.ask_extend_pct != null ? w.ask_extend_pct : 20);
    inner.style.setProperty('--ask-px', w.ask_pos_x != null ? w.ask_pos_x : 85);
    inner.style.setProperty('--ask-py', w.ask_pos_y != null ? w.ask_pos_y : 12);
    inner.style.setProperty('--ask-opacity', (w.ask_opacity_pct != null ? w.ask_opacity_pct : 100) / 100);
    inner.style.setProperty('--ask-minw', w.ask_min_width != null ? w.ask_min_width : 340);
    inner.style.setProperty('--ask-qfs', w.ask_question_fs != null ? w.ask_question_fs : 24);
    inner.style.setProperty('--ask-cfs', w.ask_choice_fs != null ? w.ask_choice_fs : 18);
    askClampMinimal(el);  // ★ re-clamp ทันที (แผง Minimal pin ด้วย px — var เดียวไม่ขยับ)
    // ★ animation IN/OUT — ตอนโพลเริ่ม / ปิด (เหมือน Image Timer — เลือกทิศได้)
    if (!wasActive && nowActive) {
      playAskAnim(el, w, 'in');
      renderAskInto(inner);
    } else if (wasActive && !nowActive) {
      // ★ anim-out: เก็บ content เดิมไว้เล่นจน animation จบ ค่อยเคลียร์
      //   (เดิม renderAskInto → innerHTML='' ทันที → หน้าหายก่อน animation เล่น)
      const _ms = w.ask_anim_out_ms != null ? w.ask_anim_out_ms : (w.ask_anim_ms != null ? w.ask_anim_ms : 1200);
      playAskAnim(el, w, 'out');
      setTimeout(() => {
        // ยังไม่มีโพลใหม่เข้ามา → เคลียร์เป็น idle
        if (!_lastAskData || !_lastAskData.active) renderAskInto(inner);
      }, _ms + 50);
    } else {
      renderAskInto(inner);
    }
  });
}

function playAskAnim(widgetEl, w, kind) {
  try {
    const inner = widgetEl.querySelector('.widget-inner');
    if (!inner) return;
    const dir = w['ask_anim_' + kind] || 'fade';
    // ★ ความเร็วแยก in/out (เหมือน Image Timer) — fallback ยังอ่าน ask_anim_ms เดิม
    const ms = (kind === 'in')
      ? (w.ask_anim_in_ms != null ? w.ask_anim_in_ms : (w.ask_anim_ms != null ? w.ask_anim_ms : 1200))
      : (w.ask_anim_out_ms != null ? w.ask_anim_out_ms : (w.ask_anim_ms != null ? w.ask_anim_ms : 1200));
    // เคลียร์ class animation เก่า + reflow เพื่อรีสตาร์ท
    inner.classList.remove(...[...inner.classList].filter(c => c.startsWith('a-anim-')));
    inner.style.setProperty('--ask-anim-dur', ms + 'ms');
    void inner.offsetWidth;
    inner.classList.add('a-anim-' + kind, 'a-anim-' + kind + '-' + dir);
  } catch (e) { /* ไม่ให้ animation พังการ render */ }
}

function fmtAskCountdown(secLeft) {
  if (secLeft < 0) secLeft = 0;
  const m = Math.floor(secLeft / 60);
  const s = Math.floor(secLeft % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ★ หัวข้อคำถามยาว → marquee เลื่อนซ้าย (หยุด 1.5 วิทั้งสองปลาย — แบบเดียวกับ np-title)
function setupAskTitleScroll(inner) {
  const wrapEl = inner.querySelector('.ask-question');
  const textEl = inner.querySelector('.ask-question-text');
  if (!wrapEl || !textEl) return;
  if (textEl._askQAnim) cancelAnimationFrame(textEl._askQAnim);
  textEl.style.transform = 'translateX(0)';
  requestAnimationFrame(function() {
    const containerW = wrapEl.clientWidth || 0;
    const textW = textEl.scrollWidth || 0;
    if (textW <= containerW + 5) return;  // สั้นพอ — จัดกึ่งกลางอยู่แล้ว
    const dist = textW - containerW + 20;
    const pauseStart = 1500, pauseEnd = 1500, speed = 30;  // px/วิ
    const scrollDur = (dist / speed) * 1000;
    const totalDur = pauseStart + scrollDur + pauseEnd;
    let startT = null;
    function frame(ts) {
      if (!textEl.isConnected) { cancelAnimationFrame(textEl._askQAnim); return; }  // โพลจบ/เปลี่ยน → หยุด
      if (!startT) startT = ts;
      const t = (ts - startT) % totalDur;
      let x = 0;
      if (t < pauseStart) x = 0;
      else if (t < pauseStart + scrollDur) x = -((t - pauseStart) / scrollDur) * dist;
      else x = -dist;
      textEl.style.transform = 'translateX(' + x + 'px)';
      textEl._askQAnim = requestAnimationFrame(frame);
    }
    textEl._askQAnim = requestAnimationFrame(frame);
  });
}

// ★ อัปเดตเฉพาะตัวเลข/แถบ/winner โดยไม่ rebuild DOM (marquee หัวข้อเลื่อนต่อเนื่อง)
function updateAskDynamic(inner, d, ctx) {
  try {
    const { ended, showCounts, counts, total, maxI, maxC, tie } = ctx;
    // เรียงลำดับเดียวกับตอนสร้าง (ended = มาก→น้อย / voting = ลำดับเดิม)
    let order = (d.choices || []).map((_, i) => i);
    if (ended) {
      order = order.slice().sort((a, b) => (counts[b] || 0) - (counts[a] || 0));
    }
    const choiceEls = inner.querySelectorAll('.ask-choice');
    order.forEach((i, pos) => {
      const el = choiceEls[pos];
      if (!el) return;
      const c = counts[i] || 0;
      const pct = total > 0 ? Math.round(c / total * 100) : 0;
      const win = ended && maxI === i && maxC > 0 && !tie;
      el.classList.toggle('winner', win);
      const cntEl = el.querySelector('.ask-choice-count');
      if (cntEl) cntEl.textContent = c;
      const barEl = el.querySelector('.ask-bar');
      if (barEl) barEl.style.width = pct + '%';
    });
    // footer — ยอดรวม
    const footer = inner.querySelector('.ask-footer span');
    if (footer) {
      footer.innerHTML = (ended ? '<span class="ask-badge-ended">จบโหวต</span>' : '') +
        'โหวตแล้ว ' + total + ' คน';
    }
  } catch (e) { /* ไม่ให้พัง render */ }
}

function renderAskInto(inner) {
  const d = _lastAskData;
  const idle = !d || !d.active;
  // ★ idle → ซ่อนแผง (overlay หายทั้งก้อน / editor เห็นเส้นประเต็มจอ + ป้าย)
  inner.classList.toggle('ask-idle', idle);
  if (idle) {
    inner.innerHTML = '';
    delete inner.dataset.askSig;  // ★ โพลจบ → เคลียร์ (โพลใหม่ rebuild ใหม่)
    return;
  }
  // ★ config ของ widget (โหมด/สไตล์ countdown)
  const _wEl = inner.closest ? inner.closest('.widget') : null;
  const _w = (_wEl && typeof config !== 'undefined' && config.widgets)
    ? (config.widgets.find(x => x.id === _wEl.dataset.id) || {}) : {};
  const _mode = { card: 'minimal', bar: 'hband', tower: 'vright' }[_w.ask_layout] || _w.ask_layout || 'vright';
  const cdStyle = _w.ask_countdown_style || 'text';

  const ended = d.phase === 'ended';
  const showCounts = ended || d.realtime;
  const counts = d.counts || [];
  const total = d.total_voters || 0;
  let maxI = -1, maxC = 0, tie = false;
  if (ended) {
    for (let i = 0; i < counts.length; i++) {
      if (counts[i] > maxC) { maxC = counts[i]; maxI = i; tie = false; }
      else if (counts[i] === maxC && maxC > 0) { tie = true; }
    }
  }
  let html = '';
  // ★ แผงโพลจริง — anchor class แยกตามโหมด (hband ใช้ top/middle/bottom, minimal ใช้มุม)
  html += '<div class="ask-panel ' + (_mode === 'hband' ? 'hband-anchor' : '') +
          (_mode === 'minimal' ? ' min-anchor' : '') + '">';
  html += '<div class="ask-question"><span class="ask-question-text">' + (ended ? 'ผลสรุป : ' : '') + esc(d.question || '') + '</span></div>';
  html += '<div class="ask-choices">';
  // ★ หน้าสรุปผล — เรียงจากโหวตเยอะสุด → น้อยสุด (ไม่เรียง A B C)
  //   ระหว่างโหวตคงลำดับเดิม
  let order = (d.choices || []).map((_, i) => i);
  if (ended) {
    order = order.slice().sort((a, b) => (counts[b] || 0) - (counts[a] || 0));
  }
  order.forEach((i) => {
    const label = d.choices[i];
    const key = (d.keys && d.keys[i]) ? d.keys[i] : String.fromCharCode(65 + i);
    const c = counts[i] || 0;
    const pct = total > 0 ? Math.round(c / total * 100) : 0;
    const win = ended && maxI === i && maxC > 0 && !tie;
    html += '<div class="ask-choice' + (win ? ' winner' : '') + '">';
    // ★ บรรทัด 1: ป้ายวิธีโหวต [พิมพ์ "A"] ซ้าย + ยอดโหวตขวา
    html += '<div class="ask-choice-top">';
    html += '<span class="ask-choice-key">พิมพ์ &quot;' + esc(key) + '&quot;</span>';
    if (showCounts) html += '<span class="ask-choice-count">' + c + '</span>';
    html += '</div>';
    // ★ บรรทัด 2: เนื้อหาช้อยส์ (responsive wrap เต็มข้อความ ไม่มี ...)
    html += '<div class="ask-choice-label">' + esc(label) + '</div>';
    if (showCounts) html += '<div class="ask-bar-wrap"><div class="ask-bar" style="width:' + pct + '%"></div></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="ask-footer">';
  html += '<span>' + (ended ? '<span class="ask-badge-ended">จบโหวต</span>' : '') +
          'โหวตแล้ว ' + total + ' คน</span>';
  let timebar = '';
  if (ended) {
    // ★ คำว่า "ผลสรุป" ย้ายไปหน้าคำถามแล้ว — footer ขวาเว้นว่าง (ซ้ายมี badge จบโหวต+ยอดรวม)
  } else if (d.end_ts) {
    if (cdStyle === 'text' || cdStyle === 'both') {
      html += '<span class="ask-countdown" data-endts="' + d.end_ts + '">จะหมดเวลาในอีก --:--</span>';
    } else {
      html += '<span>จะหมดเวลาในอีก...</span>';
    }
    if (cdStyle === 'bar' || cdStyle === 'both') {
      // ★ สร้างหลอดที่ค่าถูกต้องเลยตั้งแต่ตอน rebuild (ทุกโหวต = rebuild ทั้งแผง)
      //   เดิมเกิดที่ 100% เขียวแล้วดีดไปค่าจริงผ่าน transition = กระตุก
      const _dur = d.duration_sec || 0;
      const _left = d.end_ts - (Date.now() / 1000);
      const _pct = _dur > 0 ? Math.max(0, Math.min(100, (_left / _dur) * 100)) : 0;
      const _cls = _pct <= 10 ? 'tb-red' : (_pct <= 50 ? 'tb-yellow' : 'tb-green');
      timebar = '<div class="ask-timebar" data-endts="' + d.end_ts +
        '" data-dur="' + _dur + '">' +
        '<div class="ask-timebar-fill ' + _cls + '" style="width:' + _pct + '%"></div></div>';
    }
  } else {
    html += '<span>ไม่จำกัดเวลา</span>';
  }
  html += '</div>';
  html += timebar;
  html += '</div>';  // /.ask-panel

  // ★ ถ้าเป็นแค่ "โหวตเพิ่ม" (คำถาม+ช้อยส์+phase เดิม) → อัปเดตเฉพาะตัวเลข/แถบ
  //   ไม่ rebuild ทั้งแผง → marquee หัวข้อไม่ถูกรีเซ็ต + ไม่กระพริบ
  const _prevKey = inner.dataset.askSig || '';
  const _thisKey = [d.question, d.choices.join('|'), d.phase, _mode].join('§');
  if (_prevKey === _thisKey) {
    updateAskDynamic(inner, d, { ended, showCounts, counts, total, maxI, maxC, tie });
    return;  // ★ ไม่แตะ innerHTML → marquee ยังเลื่อนต่อเนื่อง
  }
  inner.dataset.askSig = _thisKey;

  inner.innerHTML = html;
  setupAskTitleScroll(inner);  // ★ หัวข้อยาว → marquee (เหมือน Now Playing — ครั้งแรกเท่านั้น)
  askClampMinimal(_wEl);  // ★ Minimal — clamp กึ่งกลางกล่องกันล้นครึ่งตัวออกนอกขอบ
  tickAskCountdowns();
}

// ★ Minimal — clamp กึ่งกลางกล่องให้อยู่ใน canvas เสมอ (ไม่ให้ล้นครึ่งตัวออกนอกขอบ)
//   เรียกทั้งตอนสร้างแผง (renderAskInto) และตอนลาก slider ตำแหน่งสด (askLivePos)
//   ovX/ovY = ค่าจาก slider ตอนนี้ (override ค่าใน config — ยังไม่ได้กดบันทึก)
function askClampMinimal(wEl, ovX, ovY) {
  if (!wEl) return;
  const inner = wEl.querySelector('.widget-inner');
  if (!inner) return;
  const _w = (typeof config !== 'undefined' && config.widgets)
    ? (config.widgets.find(x => x.id === wEl.dataset.id) || {}) : {};
  const _mode = { card: 'minimal', bar: 'hband', tower: 'vright' }[_w.ask_layout] || _w.ask_layout || 'vright';
  if (_mode !== 'minimal') return;
  const panel = inner.querySelector('.ask-panel');
  if (!panel) return;
  const cw = inner.offsetWidth || 1920, ch = inner.offsetHeight || 1080;
  const pw = panel.offsetWidth, ph = panel.offsetHeight;
  const px = (ovX != null) ? ovX : (_w.ask_pos_x != null ? _w.ask_pos_x : 85);
  const py = (ovY != null) ? ovY : (_w.ask_pos_y != null ? _w.ask_pos_y : 12);
  const cx = Math.min(Math.max(px / 100 * cw, pw / 2), cw - pw / 2);
  const cy = Math.min(Math.max(py / 100 * ch, ph / 2), ch - ph / 2);
  panel.style.setProperty('--ask-min-x', cx + 'px');
  panel.style.setProperty('--ask-min-y', cy + 'px');
  panel.classList.add('ask-min-fixed');
}

// ★ ASK widget classes — theme/bar/frame/mode/anchor (ใช้ร่วม update/create + self-heal)
function askWidgetClasses(w) {
  // ★ legacy: glass/mono ถูกถอดออก — map ไปธีมใกล้เคียงให้อัตโนมัติ
  const _th = { glass: 'ice', mono: 'steel' }[w.ask_theme] || w.ask_theme || 'violet';
  // ★ โหมดวาง (vleft/vright/hband/minimal) — เดิม card/bar/tower map ให้อัตโนมัติ
  const _mode = { card: 'minimal', bar: 'hband', tower: 'vright' }[w.ask_layout] || w.ask_layout || 'vright';
  const _anchor = w.ask_anchor || (_mode === 'hband' ? 'middle' : 'tr');
  return [
    'ask-theme-' + _th,
    'ask-bar-' + (w.ask_bar_style || 'classic'),
    'ask-frame-' + (w.ask_frame_style || 'classic'),
    'ask-mode-' + _mode,
    'ask-anchor-' + _anchor,
  ];
}

// ★ live preview — ลาก slider ตำแหน่ง X/Y (Minimal) แล้วแผงขยับทันทีบน editor canvas
//   เดิมต้องหยุดเดโมแล้วเปิดใหม่ถึงเห็น เพราะแผงถูก pin ด้วย px ตอนสร้าง
//   + signature เปรียบเทียบ rebuild ไม่รวมค่าตำแหน่ง → เปลี่ยน config ก็ไม่ rebuild
function askLivePos() {
  const ex = document.getElementById('f-ask_pos_x');
  const ey = document.getElementById('f-ask_pos_y');
  const ew = document.getElementById('f-ask_min_width');
  const px = ex ? parseFloat(ex.value) : null;
  const py = ey ? parseFloat(ey.value) : null;
  document.querySelectorAll('.widget.type-ask').forEach(el => {
    const inner = el.querySelector('.widget-inner');
    if (!inner) return;
    if (px != null) inner.style.setProperty('--ask-px', px);
    if (py != null) inner.style.setProperty('--ask-py', py);
    if (ew) inner.style.setProperty('--ask-minw', parseFloat(ew.value));
    askClampMinimal(el, px, py);
  });
}

function tickAskCountdowns() {
  // ★ อัปเดตเฉพาะ "ตัวเลข" นับถอยหลัง (เปลี่ยนทุก 1 วิ — พอ)
  const now = Date.now() / 1000;
  document.querySelectorAll('.ask-countdown[data-endts]').forEach(el => {
    const left = parseFloat(el.dataset.endts) - now;
    if (left <= 0) {
      el.textContent = 'กำลังปิดโหวต...';
    } else {
      el.textContent = 'จะหมดเวลาในอีก ' + fmtAskCountdown(left);
    }
  });
}
setInterval(tickAskCountdowns, 1000);

// ★ หลอดเวลา — rAF ทุกเฟรม (สมูทจริง ไม่สเต็ปรายวินาที) + สี: เขียว>50 / เหลือง≤50 / แดง≤10
function askTimebarFrame() {
  const now = Date.now() / 1000;
  document.querySelectorAll('.ask-timebar[data-endts]').forEach(el => {
    const left = parseFloat(el.dataset.endts) - now;
    const dur = parseFloat(el.dataset.dur || 0);
    const pct = dur > 0 ? Math.max(0, Math.min(100, (left / dur) * 100)) : 0;
    const fill = el.querySelector('.ask-timebar-fill');
    if (fill) {
      fill.style.width = pct + '%';
      fill.classList.remove('tb-green', 'tb-yellow', 'tb-red');
      fill.classList.add(pct <= 10 ? 'tb-red' : (pct <= 50 ? 'tb-yellow' : 'tb-green'));
    }
  });
  requestAnimationFrame(askTimebarFrame);
}
requestAnimationFrame(askTimebarFrame);

// ════════════════════════════════════════════════════════════
// Now Playing handler (Windows System Media)
// ════════════════════════════════════════════════════════════
let _lastNowPlayingData = {};

function handleNowPlaying(data) {
  var isFullUpdate = !!data.title;  // มี title = full update (เปลี่ยนเพลง)

  if (isFullUpdate) {
    _lastNowPlayingData = data;
    // ★ เคลียร์ timer เก่าทั้งหมด (กันนับต่อจากเพลงเก่า)
    Object.keys(_npClientTimers).forEach(function(k) {
      clearInterval(_npClientTimers[k]);
      delete _npClientTimers[k];
    });
    // ★ full re-render (เปลี่ยนเพลง → สร้าง DOM ใหม่ + เริ่ม scroll + timer ใหม่)
    document.querySelectorAll('.widget.type-now_playing').forEach(function(el) {
      var inner = el.querySelector('.widget-inner');
      if (!inner) return;
      updateNowPlayingWidget(inner, _lastNowPlayingData, el.dataset.id);
      // ★ เริ่ม timer ใหม่ทันทีหลัง full re-render (sync position ใหม่)
      updateNowPlayingPosition(inner, _lastNowPlayingData);
    });
  } else {
    // ★ position update → แก้แค่ text/bar ไม่ re-render DOM (กัน scroll reset)
    if (_lastNowPlayingData.title) {
      _lastNowPlayingData.position = data.position ?? _lastNowPlayingData.position;
      _lastNowPlayingData.duration = data.duration ?? _lastNowPlayingData.duration;
      _lastNowPlayingData.is_playing = data.is_playing ?? _lastNowPlayingData.is_playing;
    } else {
      _lastNowPlayingData = data;
    }
    // ★ update เฉพาะ time + bar fill (ไม่ทำลาย scroll animation)
    document.querySelectorAll('.widget.type-now_playing').forEach(function(el) {
      var inner = el.querySelector('.widget-inner');
      if (!inner) return;
      updateNowPlayingPosition(inner, _lastNowPlayingData);
    });
  }
}

// ★ update เฉพาะ position/time/bar — ไม่ re-render DOM (กัน scroll reset)
// ★ ใช้ client-side timer นับทุก 250ms (สมูท + ตรงเวลาจริง)
var _npClientTimers = {};  // widgetId → interval

function updateNowPlayingPosition(inner, d) {
  var pos = d.position || 0;
  var dur = d.duration || 0;
  var playing = d.is_playing !== false;

  // ★ อ่าน sync_mode จาก widget config
  var widgetId = inner.closest('.widget')?.dataset?.id || '_default';
  var w = (config.widgets || []).find(function(x) { return x.id === widgetId; }) || {};
  var syncMode = w.np_sync_mode || 'browser';

  function fmt(s) {
    s = Math.floor(s || 0);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function renderPos() {
    var pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;
    var timeEl = inner.querySelector('.np-time');
    if (timeEl) timeEl.textContent = fmt(pos);
    var durEl = inner.querySelector('.np-dur');
    if (durEl) durEl.textContent = fmt(dur);
    var fillEl = inner.querySelector('.np-bar-fill');
    if (fillEl) fillEl.style.width = pct + '%';
    var container = inner.querySelector('.np-container');
    if (container) container.style.opacity = playing ? '' : '0.6';
  }
  renderPos();

  // ยกเลิก timer เก่า
  if (_npClientTimers[widgetId]) clearInterval(_npClientTimers[widgetId]);

  // ★ precise mode = ไม่ต้อง interpolate (Python push ทุก 1 วิ แล้ว)
  if (syncMode === 'precise') return;

  // ★ browser mode = interpolate จาก timestamp จริง
  if (playing && dur > 0) {
    var refPos = pos;
    var refTime = Date.now();
    _npClientTimers[widgetId] = setInterval(function() {
      var elapsed = (Date.now() - refTime) / 1000;
      pos = refPos + elapsed;
      if (pos >= dur) {
        pos = dur;
        clearInterval(_npClientTimers[widgetId]);
      }
      renderPos();
    }, 250);
  }
}

function updateNowPlayingWidget(inner, d, widgetId) {
  // find widget config
  var w = (config.widgets || []).find(function(x) { return x.id === widgetId; }) || {};
  var showArt = w.np_show_art !== false;
  var showProgress = w.np_show_progress !== false;
  var scrollTitle = w.np_scroll_title !== false;
  var fontSize = w.np_font_size || 14;
  var textColor = w.np_text_color || '#ffffff';
  var accentColor = w.np_accent_color || '#1db954';
  var bgColor = w.np_bg_color || '#1a1a2e';
  var bgOpacity = w.np_bg_opacity ?? 1.0;
  var radius = w.np_radius ?? 8;
  var artRadius = w.np_art_radius ?? 6;
  var artSize = w.np_art_size ?? 48;  // ★ ขนาด thumbnail ปรับได้

  var title = d.title || '';
  var artist = d.artist || '';
  var pos = d.position || 0;
  var dur = d.duration || 0;
  var playing = d.is_playing !== false;
  var artUrl = d.thumbnail_url || '';

  // convert hex bg + opacity to rgba (ใช้ solid hex เมื่อ opacity = 100% เพื่อกันปัญหา compositing)
  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1,3), 16) || 26;
    var g = parseInt(hex.slice(3,5), 16) || 26;
    var b = parseInt(hex.slice(5,7), 16) || 46;
    // ★ alpha = 1.0 → ใช้ solid hex เลย (บางเบราว์เซอร์มีปัญหา rgba ที่ alpha=1 โดยเฉพาะ OBS)
    if (alpha >= 0.999) return '#' + hex.slice(1,7);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  var bgRgba = hexToRgba(bgColor, bgOpacity);

  // format time M:SS
  function fmt(s) {
    s = Math.floor(s || 0);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  var pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;

  // ★ กรอบ + พื้นหลัง — bg color เป็น solid base (ไม่โปร่งเมื่อ opacity=100%)
  // style pattern เป็น overlay (เพิ่มลวดลาย ไม่ทับ bg หลัก)
  var styleName = w.np_style || 'flat';
  var html = '<div class="np-container" style="--np-accent:' + accentColor + ';position:relative;display:flex;align-items:center;gap:10px;width:100%;height:100%;padding:8px 10px;box-sizing:border-box;border-radius:' + radius + 'px;background:' + bgRgba + ';overflow:hidden;' + (playing ? '' : 'opacity:0.6;') + '">';
  // ★ overlay สำหรับ style pattern (อยู่เหนือ bg แต่ใต้ content)
  html += '<div class="np-style-overlay np-style-' + styleName + '" style="position:absolute;inset:0;pointer-events:none;border-radius:' + radius + 'px;"></div>';

  // ★ thumbnail — ขนาดปรับได้ + มุมมนตามกรอบ + ไม่ล้น
  if (showArt) {
    // art ใช้ height: 100% ของ container (หัก padding) + width ปรับได้แต่ไม่เกิน height
    html += '<div class="np-art" style="height:' + artSize + 'px;width:' + artSize + 'px;flex-shrink:0;border-radius:' + artRadius + 'px;overflow:hidden;background:rgba(255,255,255,0.1);">';
    if (artUrl) html += '<img src="' + artUrl + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
    else html += '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;">🎵</div>';
    html += '</div>';
  }
  html += '<div class="np-info" style="flex:1;min-width:0;overflow:hidden;">';
  // ★ scroll title — JS driven (หากเปิดไว้ + ข้อความยาวเกิน container)
  html += '<div class="np-title-wrap" style="overflow:hidden;white-space:nowrap;position:relative;">';
  html += '<span class="np-title-text" data-np-scroll="' + (scrollTitle ? '1' : '0') + '" style="display:inline-block;font-size:' + fontSize + 'px;font-weight:600;color:' + textColor + ';white-space:nowrap;will-change:transform;">' + escapeHtml(title || 'ไม่มีเพลง') + '</span>';
  html += '</div>';
  var artistFontSize = w.np_artist_font_size || 12;
  var timeFontSize = w.np_time_font_size || 10;
  html += '<div class="np-artist" style="font-size:' + artistFontSize + 'px;color:rgba(255,255,255,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(artist) + '</div>';
  if (showProgress) {
    html += '<div class="np-progress-row" style="display:flex;align-items:center;gap:6px;margin-top:4px;">';
    html += '<span class="np-time" style="font-size:' + timeFontSize + 'px;color:rgba(255,255,255,0.5);min-width:30px;">' + fmt(pos) + '</span>';
    html += '<div class="np-bar" style="flex:1;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;">';
    html += '<div class="np-bar-fill" style="width:' + pct + '%;height:100%;background:' + accentColor + ';border-radius:2px;transition:width 0.5s linear;"></div>';
    html += '</div>';
    html += '<span class="np-dur" style="font-size:' + timeFontSize + 'px;color:rgba(255,255,255,0.5);min-width:30px;text-align:right;">' + fmt(dur) + '</span>';
    html += '</div>';
  }
  html += '</div></div>';

  inner.innerHTML = html;

  // ★ JS marquee scroll — วัดจริง + เลื่อนสมูท (หยุด 2 วิทั้งสองฝั่ง)
  var wrapEl = inner.querySelector('.np-title-wrap');
  var textEl = inner.querySelector('.np-title-text');
  if (wrapEl && textEl) {
    // ยกเลิก animation เก่า
    if (textEl._npAnim) cancelAnimationFrame(textEl._npAnim);
    textEl.style.transform = 'translateX(0)';

    var doScroll = textEl.getAttribute('data-np-scroll') === '1';
    if (doScroll) {
      requestAnimationFrame(function() {
        var containerW = wrapEl.offsetWidth;
        var textW = textEl.scrollWidth;
        if (textW > containerW + 5) {
          var dist = textW - containerW + 20;  // ระยะเลื่อน + padding
          var pauseStart = 1500;   // หยุด 1.5 วิที่จุดเริ่ม
          var pauseEnd = 1500;     // หยุด 1.5 วิที่ท้าย
          var speed = 30;          // px/วิ (ช้าพออ่านได้)
          var scrollDur = (dist / speed) * 1000;  // ms
          var totalDur = pauseStart + scrollDur + pauseEnd;
          var startT = null;

          function animFrame(ts) {
            if (!startT) startT = ts;
            var elapsed = ts - startT;
            var x = 0;
            if (elapsed < pauseStart) {
              x = 0;  // หยุดที่เริ่ม
            } else if (elapsed < pauseStart + scrollDur) {
              var progress = (elapsed - pauseStart) / scrollDur;
              x = -(progress * dist);  // เลื่อน
            } else if (elapsed < totalDur) {
              x = -dist;  // หยุดที่ท้าย
            } else {
              startT = ts;  // รีสตาร์ท
              x = 0;
            }
            textEl.style.transform = 'translateX(' + x + 'px)';
            textEl._npAnim = requestAnimationFrame(animFrame);
          }
          textEl._npAnim = requestAnimationFrame(animFrame);
        }
      });
    }
  }
}

// ════════════════════════════════════════════════════════════
// Emote Party — ดัก emote จากทุกแพลตฟอร์ม + animation engine
// ════════════════════════════════════════════════════════════
// active emote elements: {el, widgetId, animType, born, ttl, ...physics}
const _epActive = [];   // รายการ emote ที่กำลังแสดงอยู่
let _epRafId = null;     // requestAnimationFrame id (single global loop)

function setupEmoteParty(inner, w) {
  // ★ Emote Party = โปร่งใสเสมอ (ไม่มีพื้นหลัง — emote overlay ปกติไม่ต้องมี bg)
  inner.innerHTML = '';
  inner.style.position = 'relative';
  inner.style.overflow = 'hidden';
  // ★ sync existing active emotes' size ถ้า config เปลี่ยน
  _epActive.forEach(item => {
    if (item.widgetId === w.id && item.config) {
      item.config.ep_emote_size = w.ep_emote_size || 64;
    }
  });
}

// ★ ปุ่มจาก server → handleEmoteParty([{url,text,source}, ...])
function handleEmoteParty(emotes) {
  if (!emotes || !emotes.length) return;
  // ★ หา widget emote_party ที่เปิดอยู่ (อาจมีหลายตัว)
  const epWidgets = (config.widgets || []).filter(w => w.type === 'emote_party' && w.enabled !== false);
  if (!epWidgets.length) return;
  epWidgets.forEach(w => {
    const wid = w.id;
    const maxEmotes = w.ep_max_emotes || 15;
    const emojiEnabled = w.ep_emoji_enabled !== false;
    const inner = document.querySelector('.widget[data-id="' + wid + '"] .widget-inner');
    if (!inner) return;
    // ★ เก็บ reference ไว้ใช้ตอน animate
    emotes.forEach(em => {
      // ข้าม emoji ถ้าปิดอยู่
      if (!em.url && em.text && !emojiEnabled) return;
      // ★ จำกัดจำนวน — เอาเก่าที่สุดออกก่อน
      const mine = _epActive.filter(x => x.widgetId === wid);
      while (mine.length >= maxEmotes) {
        const oldest = _epActive.find(x => x.widgetId === wid);
        if (!oldest) break;
        _removeEmote(oldest);
      }
      _spawnEmote(inner, w, em);
    });
    _ensureRafRunning();
  });
}

// ★ สร้าง emote element + ตั้งค่า physics ตาม animation type
function _spawnEmote(inner, w, em) {
  const size = w.ep_emote_size || 64;
  const animType = w.ep_animation || 'float';
  const ttl = (w.ep_duration || 5) * 1000;  // ms
  const now = performance.now();
  const rect = inner.getBoundingClientRect();
  const W = rect.width || 400;
  const H = rect.height || 300;

  const el = document.createElement('div');
  el.style.cssText = 'position:absolute;will-change:transform,opacity;pointer-events:none;display:flex;align-items:center;justify-content:center;';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  // ★ content — image หรือ text (emoji)
  if (em.url) {
    const img = document.createElement('img');
    img.src = em.url;
    // ★ width/height 100% บังคับให้รูปเต็ม container (ตาม ep_emote_size)
    //    ใช้ max-width/max-height อย่างเดียวไม่พอ — รูปเล็กจะไม่ถูกขยาย
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;';
    img.onerror = () => { try { el.remove(); } catch(e){} };
    el.appendChild(img);
  } else if (em.text) {
    el.textContent = em.text;
    el.style.fontSize = (size * 0.8) + 'px';
    el.style.lineHeight = '1';
  } else {
    return;  // ไม่มี content → skip
  }
  inner.appendChild(el);

  // ★ วัดขนาดจริง (หลัง append) เพื่อคำนวณ physics แบบแม่นยำ
  const ew = el.offsetWidth || size;
  const eh = el.offsetHeight || size;

  // ★ ตั้งค่า physics ตาม animation type
  let item = {
    el: el,
    widgetId: w.id,
    animType: animType,
    born: now,
    ttl: ttl,
    config: w,
  };

  if (animType === 'float') {
    // 🎈 Float — เริ่มจากด้านล่าง ลอยขึ้นบน + แกว่งซ้ายขวา
    item.x = Math.random() * Math.max(1, W - ew);
    item.y = H;  // เริ่มใต้กรอบ
    item.vx = (Math.random() - 0.5) * 30;   // px/s แนวนอน
    item.vy = -(40 + Math.random() * 30);    // px/s ขึ้นบน
    item.swayPhase = Math.random() * Math.PI * 2;
    item.swayAmp = 20 + Math.random() * 20;
  } else if (animType === 'dvd') {
    // 📺 DVD Bounce — เริ่มกลางจอ + ความเร็วคงที่ เด้งติดผนัง
    item.x = (W - ew) / 2 + (Math.random() - 0.5) * Math.min(W * 0.3, 100);
    item.y = (H - eh) / 2 + (Math.random() - 0.5) * Math.min(H * 0.3, 100);
    const speed = 80 + Math.random() * 40;
    const angle = Math.random() * Math.PI * 2;
    item.vx = Math.cos(angle) * speed;
    item.vy = Math.sin(angle) * speed;
    item.W = W; item.H = H; item.ew = ew; item.eh = eh;
  } else if (animType === 'drop') {
    // 💥 Pop & Drop — โผล่กลางจอ (pop) แล้วตกลงข้างล่าง (gravity)
    item.x = Math.random() * Math.max(1, W - ew);
    item.y = Math.random() * Math.max(1, H * 0.4);  // เริ่มด้านบน
    item.vx = (Math.random() - 0.5) * 20;
    item.vy = 0;
    item.gravity = 200;  // px/s²
    item.bounceDamping = 0.5;
    item.W = W; item.H = H; item.ew = ew; item.eh = eh;
    item.popStart = now;
    item.popDur = 200;  // ms — ขยายจาก 0 → 1
  } else if (animType === 'shake') {
    // 🌀 Shake/Spin — สุ่มตำแหน่ง + หมุน + สั่น
    item.x = Math.random() * Math.max(1, W - ew);
    item.y = Math.random() * Math.max(1, H - eh);
    item.rot = 0;
    item.vrot = (Math.random() - 0.5) * 360;  // deg/s
    item.shakePhase = Math.random() * Math.PI * 2;
    item.shakeAmpX = 5 + Math.random() * 10;
    item.shakeAmpY = 5 + Math.random() * 10;
    item.shakeFreq = 8 + Math.random() * 6;  // Hz
  }

  // ★ วาดตำแหน่งเริ่มต้น
  _drawEmote(item, now);
  _epActive.push(item);
}

// ★ วาด emote ตาม physics state (ปัจจุบัน)
function _drawEmote(item, now) {
  const age = now - item.born;
  const lifeRatio = age / item.ttl;
  let opacity = 1;
  // ★ fade-in 10% แรก, fade-out 20% สุดท้าย
  if (lifeRatio < 0.1) opacity = lifeRatio / 0.1;
  else if (lifeRatio > 0.8) opacity = Math.max(0, (1 - lifeRatio) / 0.2);

  let tx = item.x || 0;
  let ty = item.y || 0;
  let rot = item.rot || 0;
  let scale = 1;

  if (item.animType === 'shake') {
    // ★ เพิ่ม shake offset
    const t = (now - item.born) / 1000;
    tx += Math.sin(t * item.shakeFreq * Math.PI + item.shakePhase) * item.shakeAmpX;
    ty += Math.cos(t * item.shakeFreq * Math.PI + item.shakePhase) * item.shakeAmpY;
  }

  if (item.animType === 'drop') {
    // ★ pop-in (scale 0→1) ตอนเริ่ม
    if (item.popStart != null) {
      const popAge = now - item.popStart;
      if (popAge < item.popDur) {
        scale = popAge / item.popDur;
      }
    }
  }

  item.el.style.opacity = opacity.toFixed(3);
  item.el.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg) scale(' + scale.toFixed(3) + ')';
}

// ★ update physics ตามเวลาที่ผ่านไป (dt = seconds)
function _updatePhysics(item, dt, now) {
  if (item.animType === 'float') {
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    // ★ sway แนวนอน
    const swayT = (now - item.born) / 1000;
    const sway = Math.sin(swayT * 2 + item.swayPhase) * item.swayAmp;
    item.el.style.transform = 'translate(' + (item.x + sway).toFixed(1) + 'px,' + item.y.toFixed(1) + 'px)';
  } else if (item.animType === 'dvd') {
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    // ★ เด้งติดผนัง
    if (item.x <= 0) { item.x = 0; item.vx = Math.abs(item.vx); }
    else if (item.x >= item.W - item.ew) { item.x = item.W - item.ew; item.vx = -Math.abs(item.vx); }
    if (item.y <= 0) { item.y = 0; item.vy = Math.abs(item.vy); }
    else if (item.y >= item.H - item.eh) { item.y = item.H - item.eh; item.vy = -Math.abs(item.vy); }
  } else if (item.animType === 'drop') {
    item.vy += item.gravity * dt;
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    // ★ เด้งพื้น (ครั้งเดียว — หลังจากนั้นให้หยุด)
    if (item.y >= item.H - item.eh) {
      item.y = item.H - item.eh;
      if (Math.abs(item.vy) > 30) {
        item.vy = -item.vy * item.bounceDamping;
      } else {
        item.vy = 0;
        item.vx *= 0.8;  // เสียดทาน
      }
    }
  } else if (item.animType === 'shake') {
    item.rot += item.vrot * dt;
  }
}

// ★ main animation loop — เรียก requestAnimationFrame เดียวรันทุก emote
function _epTick(now) {
  const dt = Math.min(0.05, (now - (_epLastTime || now)) / 1000);  // จำกัด dt กันกระตุก
  _epLastTime = now;
  // ★ update ทุก emote
  for (let i = _epActive.length - 1; i >= 0; i--) {
    const item = _epActive[i];
    const age = now - item.born;
    // ★ หมดอายุ → เอาออก
    if (age >= item.ttl) {
      _removeEmote(item);
      _epActive.splice(i, 1);
      continue;
    }
    _updatePhysics(item, dt, now);
    _drawEmote(item, now);
  }
  // ★ ถ้ายังมี emote → รันต่อ
  if (_epActive.length > 0) {
    _epRafId = requestAnimationFrame(_epTick);
  } else {
    _epRafId = null;
  }
}
let _epLastTime = 0;

function _ensureRafRunning() {
  if (_epRafId === null) {
    _epLastTime = performance.now();
    _epRafId = requestAnimationFrame(_epTick);
  }
}

function _removeEmote(item) {
  if (item && item.el) {
    try { item.el.remove(); } catch (e) {}
  }
}

// ════════════════════════════════════════════════════════════
// ★ Avatar widget — PNGTuber-style 4-image avatar (idle/talk/blink-idle/blink-talk)
// ════════════════════════════════════════════════════════════
// 4 ภาพสลับกันด้วย opacity transition:
//   idle        = ตาเปิด + ปากปิด (default)
//   talk        = ตาเปิด + ปากเปิด (กำลังพูด)
//   blink-idle  = ตาปิด + ปากปิด (กระพริบ ตอนไม่พูด)
//   blink-talk  = ตาปิด + ปากเปิด (กระพริบ ตอนกำลังพูด)
// blink กับ talk อิสระ → กระพริบได้ขณะพูด (ตามมาตรฐาน PNGTuber)
//
// Animations (CSS):
//   - bounce:    ขยับขึ้นลงตอนพูด (ตามระดับเสียง)
//   - breathing: scale 1.0↔1.02 ช้าๆ ตลอดเวลา (3s loop)
//   - sway:      แกว่งซ้ายขวาเบาๆ ตอน idle (4s loop)
//
// 2 โหมด:
//   - tts: รอ WS push {type:"avatar_state", widget_id, talking} จากโปรแกรม
//   - mic: วัด RMS จาก getUserMedia + AnalyserNode ใน JS เอง (ไม่ต้องรอ push)
const _avatarWidgets = {};  // {widget_id: {state, imgs, timers, ...}}

function setupAvatarWidget(inner, w) {
  // ★ cleanup instance เดิม (ถ้ามี) — กัน leak timer/mic stream
  if (_avatarWidgets[w.id]) _destroyAvatarInstance(w.id);
  inner.innerHTML = '';

  const fitMode = w.avatar_fit_mode || 'contain';
  // ★ resolve URLs — ถ้า avatar_preset != "" ใช้ URL จาก preset แทน (man/girl default)
  const preset = w.avatar_preset || '';
  let idleUrl, talkUrl, blinkIdleUrl, blinkTalkUrl;
  if (preset && (preset === 'man' || preset === 'girl')) {
    idleUrl = `/avatar-preset/${preset}/idle`;
    talkUrl = `/avatar-preset/${preset}/talk`;
    blinkIdleUrl = `/avatar-preset/${preset}/blink_idle`;
    blinkTalkUrl = `/avatar-preset/${preset}/blink_talk`;
  } else {
    idleUrl = w.avatar_idle_url || '';
    talkUrl = w.avatar_talk_url || '';
    blinkIdleUrl = w.avatar_blink_idle_url || '';
    blinkTalkUrl = w.avatar_blink_talk_url || '';
  }

  // placeholder ถ้ายังไม่มีภาพ
  if (!idleUrl && !talkUrl) {
    inner.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.4);font-size:13px;text-align:center;padding:12px;">😊 Avatar<br><span style="font-size:11px;opacity:0.7;">กด ⚙ เพื่ออัปรูป</span></div>';
    return;
  }

  // ★ สร้าง stage + 4 imgs ซ้อนกัน (absolute ทั้งหมด → ใช้ opacity สลับ)
  const stage = document.createElement('div');
  stage.className = 'avatar-stage';
  if (w.avatar_breathing !== false) stage.classList.add('avatar-anim-breathing');
  if (w.avatar_sway !== false) stage.classList.add('avatar-anim-sway');
  stage.style.cssText = 'position:relative;width:100%;height:100%;';

  function _mkImg(url, cls) {
    const img = document.createElement('img');
    img.className = 'avatar-img ' + cls;
    // ★ ใช้ visibility แทน opacity — สลับทันที ไม่มี transition (กัน blink ดำระหว่าง fade)
    //   PNGTuber ต้องการการสลับที่ฉับพลัน ไม่ใช่ cross-fade
    img.style.cssText = `position:absolute;inset:0;width:100%;height:100%;object-fit:${fitMode};opacity:1;visibility:hidden;pointer-events:none;user-select:none;-webkit-user-drag:none;`;
    if (url) {
      img.src = url;
      img.alt = '';
      // ★ mark ว่ายังโหลดไม่เสร็จ (กัน blink ดำตอนสลับภาพ)
      img.dataset.loaded = '0';
      img.onload = () => { img.dataset.loaded = '1'; };
      // ★ error → mark loaded anyway (กันค้าง)
      img.onerror = () => { img.dataset.loaded = '1'; };
    } else {
      img.style.display = 'none';  // ไม่มีภาพนี้ → ซ่อน (fallback ใช้ idle แทน)
      img.dataset.loaded = '1';
    }
    return img;
  }

  const imgIdle = _mkImg(idleUrl, 'av-idle');
  const imgTalk = _mkImg(talkUrl, 'av-talk');
  const imgBlinkIdle = _mkImg(blinkIdleUrl, 'av-blink-idle');
  const imgBlinkTalk = _mkImg(blinkTalkUrl, 'av-blink-talk');
  // ★ default — แสดง idle เฉพาะตอนโหลดเสร็จแล้ว (กัน blink ดำตอนเริ่ม)
  if (imgIdle.dataset.loaded === '1') imgIdle.style.visibility = 'visible';
  else imgIdle.onload = () => { imgIdle.dataset.loaded = '1'; imgIdle.style.visibility = 'visible'; };
  stage.appendChild(imgIdle);
  stage.appendChild(imgTalk);
  stage.appendChild(imgBlinkIdle);
  stage.appendChild(imgBlinkTalk);
  // ★ flip wrapper — ห่อ stage เพื่อสะท้อนภาพ (ไม่ขัดกับ breathing/sway/bounce animation)
  const flipWrap = document.createElement('div');
  flipWrap.className = 'avatar-flip-wrap';
  flipWrap.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
  const flipX = w.avatar_flip_h ? -1 : 1;
  const flipY = w.avatar_flip_v ? -1 : 1;
  if (flipX !== 1 || flipY !== 1) {
    flipWrap.style.transform = `scale(${flipX}, ${flipY})`;
  }
  flipWrap.appendChild(stage);
  inner.appendChild(flipWrap);

  // ★ instance state
  const inst = {
    widgetId: w.id,
    mode: w.avatar_mode || 'tts',
    imgs: { idle: imgIdle, talk: imgTalk, 'blink-idle': imgBlinkIdle, 'blink-talk': imgBlinkTalk },
    urls: { idle: idleUrl, talk: talkUrl, 'blink-idle': blinkIdleUrl, 'blink-talk': blinkTalkUrl },
    state: { talking: false, blinking: false },
    blinkRate: w.avatar_blink_rate || 4,
    bounceEnabled: w.avatar_bounce !== false,
    blinkTimer: null,
    talkTimer: null,
    micStream: null,
    micCtx: null,
    micRaf: null,
    micThreshold: (w.avatar_mic_threshold != null) ? w.avatar_mic_threshold : 30,
    micDeviceId: w.avatar_mic_device || '',
  };
  _avatarWidgets[w.id] = inst;

  // ★ เลือกภาพที่จะแสดงจาก state {talking, blinking}
  // ★ helper — แสดงภาพ target โดยไม่เกิดช่องว่างดำ
  //   ★ ใช้ visibility แทน opacity — สลับทันที ไม่มี transition (กัน blink ดำระหว่าง fade)
  //   ถ้า target ยังโหลดไม่เสร็จ → ถือภาพเก่าไว้ (กัน blink ดำ)
  function _showOnly(targetKey) {
    const targetImg = inst.imgs[targetKey];
    // ★ ถ้า target ยังโหลดไม่เสร็จ → อย่าสลับ (ถือภาพเดิมไว้ กัน blink ดำ)
    if (targetImg && targetImg.dataset.loaded !== '1') return;
    // ★ สลับ visibility ทันที — ไม่มี transition จึงไม่มีช่องว่างดำ
    for (const k in inst.imgs) {
      inst.imgs[k].style.visibility = (k === targetKey) ? 'visible' : 'hidden';
    }
  }

  function _pickImage() {
    const { talking, blinking } = inst.state;
    let key;
    if (blinking && talking) key = 'blink-talk';
    else if (blinking && !talking) key = 'blink-idle';
    else if (!blinking && talking) key = 'talk';
    else key = 'idle';
    // ★ fallback: ถ้าไม่มีภาพ blink ให้ใช้ภาพหลัก (idle/talk)
    if (!inst.urls[key]) {
      key = talking ? 'talk' : 'idle';
    }
    // ★ ถ้าไม่มี talk ด้วย → ใช้ idle
    if (!inst.urls[key]) key = 'idle';
    _showOnly(key);
    // ★ bounce class — ตอน talking ถ้าเปิดไว้
    if (inst.bounceEnabled && talking) {
      stage.classList.add('avatar-anim-bounce');
    } else {
      stage.classList.remove('avatar-anim-bounce');
    }
  }

  // ★ auto-blink — schedule สุ่ม blinkRate ± 2s → blink 150ms → idle ใหม่
  function _scheduleBlink() {
    const base = inst.blinkRate;
    const delay = Math.max(800, (base + (Math.random() * 4 - 2)) * 1000);
    inst.blinkTimer = setTimeout(() => {
      inst.state.blinking = true;
      _pickImage();
      setTimeout(() => {
        inst.state.blinking = false;
        _pickImage();
        _scheduleBlink();
      }, 150);
    }, delay);
  }
  _scheduleBlink();

  // ★ talk animation — ตอน talking=true สลับ idle↔talk ทุก ~150ms (ดูเหมือนปากพะงาบ)
  //   ทำงานเฉพาะตอน talking — สร้างความรู้สึกว่ากำลังพูด (ไม่ใช่ภาพปากเปิดนิ่งๆ)
  //   ★ ใช้ _showOnly (cross-fade safe — กัน blink ดำ)
  function _startTalkFlicker() {
    if (inst.talkTimer) return;
    let toggle = false;
    inst.talkTimer = setInterval(() => {
      if (!inst.state.talking) return;
      toggle = !toggle;
      const { blinking } = inst.state;
      const key = toggle ? (blinking ? 'blink-talk' : 'talk') : (blinking ? 'blink-idle' : 'idle');
      const fallback = toggle ? 'talk' : 'idle';
      const finalKey = inst.urls[key] ? key : fallback;
      _showOnly(finalKey);
    }, 150);
  }
  function _stopTalkFlicker() {
    if (inst.talkTimer) { clearInterval(inst.talkTimer); inst.talkTimer = null; }
  }

  // ★ set talking state (จาก WS push หรือ mic RMS)
  inst.setTalking = function(talking) {
    talking = !!talking;
    if (inst.state.talking === talking) return;  // no change
    inst.state.talking = talking;
    if (talking) _startTalkFlicker();
    else _stopTalkFlicker();
    _pickImage();
  };

  // ★ Mic mode — Python (PyAudio) วัดเสียงแล้ว push talking state มาทาง WS
  //   เหมือน TTS mode ทุกอย่าง — browser ไม่ต้องทำอะไร (ลดความซับซ้อน)
  //   ★ editor mode — แสดง badge ว่า Python กำลังวัดเสียง
  if (inst.mode === 'mic' && isEditor) {
    const badge = document.createElement('div');
    badge.style.cssText = 'position:absolute;bottom:6px;left:6px;right:6px;background:rgba(59,130,246,0.9);color:#fff;font-size:10px;padding:4px 8px;border-radius:4px;text-align:center;pointer-events:none;';
    badge.textContent = '🎤 Python วัดเสียง — ดูระดับได้ใน ⚙ Settings';
    stage.appendChild(badge);
  }

  // ★ ถ้ามี last avatar state สำหรับ widget นี้ (TTS/Mic mode reconnect) → restore
  if (_lastAvatarState && _lastAvatarState[w.id]) {
    inst.setTalking(true);
  }
}

// ★ WS handler — รับ push จากโปรแกรม (ทั้ง TTS mode และ Mic mode)
//   ★ Mic mode ใช้ Python วัดเสียงแล้ว push talking state มาทางนี้
//     (แก้ปัญหา OBS Browser Source เข้าถึงไมค์ไม่ได้)
let _lastAvatarState = {};  // {widget_id: talking} — restore ตอน reconnect
let _lastMicLevel = -60;    // last dB level (สำหรับ settings meter)
function handleAvatarState(data) {
  const wid = data.widget_id;
  const talking = !!data.talking;
  _lastAvatarState[wid] = talking;
  const inst = _avatarWidgets[wid];
  if (inst) {  // ★ รับทุก mode (tts + mic) — Mic mode push จาก Python
    inst.setTalking(talking);
  }
}

// ★ handle mic level push (สำหรับ settings meter — แสดง dB real-time)
function handleMicLevel(data) {
  if (data && typeof data.level === 'number') {
    _lastMicLevel = data.level;
    // ★ update meter UI (ถ้า settings modal เปิดอยู่)
    const lvlEl = document.getElementById('av-mic-level');
    const meterEl = document.getElementById('av-mic-meter');
    if (lvlEl) lvlEl.textContent = data.level.toFixed(0);
    if (meterEl) {
      const pct = Math.max(0, Math.min(100, (data.level + 60) / 60 * 100));
      meterEl.style.width = pct + '%';
    }
    // ★ debug — log ทุก 20 pushes
    if (!handleMicLevel._counter) handleMicLevel._counter = 0;
    handleMicLevel._counter++;
    if (handleMicLevel._counter % 20 === 1) {
      console.log('[mic_level]', data.level.toFixed(1), 'dB — meter element:', !!lvlEl);
    }
  }
}

// ★ handle auto-calibration result — ปรับ threshold slider + แสดงข้อความ
function handleMicCalibrated(data) {
  const thrSlider = document.getElementById('f-avatar_mic_threshold');
  const hintEl = document.getElementById('av-mic-hint');
  const mark = document.getElementById('av-mic-threshold-mark');
  if (thrSlider && typeof data.threshold === 'number') {
    thrSlider.value = data.threshold;
  }
  if (mark && typeof data.threshold === 'number') {
    const pct = Math.max(0, Math.min(100, (data.threshold + 60) / 60 * 100));
    mark.style.left = pct + '%';
  }
  if (hintEl && typeof data.noise_floor === 'number') {
    hintEl.innerHTML = `✅ <b style="color:#10b981;">ปรับอัตโนมัติ</b> — noise floor: ${data.noise_floor.toFixed(0)} dB → threshold: ${data.threshold.toFixed(0)} dB`;
    hintEl.style.color = '#10b981';
  }
}

// ★ cleanup instance — หยุด timer + ปิด mic stream
function _destroyAvatarInstance(widgetId) {
  const inst = _avatarWidgets[widgetId];
  if (!inst) return;
  if (inst.blinkTimer) clearTimeout(inst.blinkTimer);
  if (inst.talkTimer) clearInterval(inst.talkTimer);
  if (inst.micRaf) cancelAnimationFrame(inst.micRaf);
  if (inst.micStream) {
    inst.micStream.getTracks().forEach(t => t.stop());
  }
  if (inst.micCtx) {
    try { inst.micCtx.close(); } catch(e) {}
  }
  delete _avatarWidgets[widgetId];
}

// ════════════════════════════════════════════════════════════
// ★ Donate Goal widget — EasyDonate API
// ════════════════════════════════════════════════════════════
let _lastDonateGoalData = {};  // {widget_id: {current, goal, ...}}

function setupDonateGoalWidget(inner, w) {
  inner.innerHTML = '';
  const theme = w.dg_theme || 'neon';
  const barColor = w.dg_bar_color || '#10b981';
  const bgColor = w.dg_bg_color || '#1a1a2e';
  const fontColor = w.dg_font_color || '#e5e7eb';
  const currentColor = w.dg_current_color || '#10b981';
  const goalColor = w.dg_goal_color || '#9ca3af';
  const currency = w.dg_currency || '฿';
  const goal = w.dg_goal_amount || 1000;
  const goalTitle = w.dg_goal_title || '';
  const fs = w.dg_font_size || 16;
  const opacity = (w.dg_opacity != null ? w.dg_opacity : 100) / 100;
  const showDonor = w.dg_show_donor !== false;

  // ★ restore จาก last data
  const startAmount = w.dg_start_amount || 0;
  const lastData = _lastDonateGoalData[w.id];
  const donated = lastData ? lastData.current : 0;
  const current = startAmount + donated;  // ★ ยอดเริ่มต้น + ยอดโดเนทใหม่
  const percent = (current / Math.max(1, goal)) * 100;
  const lastDonor = lastData ? lastData.last_donor : '';
  const lastAmount = lastData ? lastData.last_amount : 0;
  const achieved = current >= goal;
  const overflow = current > goal ? current - goal : 0;

  // ★ gradient bar color (สวยกว่า solid)
  const gradFrom = barColor;
  const gradTo = achieved ? '#fbbf24' : _lightenColor(barColor, 20);

  const wrap = document.createElement('div');
  wrap.className = `dg-wrap dg-theme-${theme} ${achieved ? 'dg-achieved' : ''}`;
  // ★ default theme ใช้สีจาก settings, theme อื่นๆ ใช้ CSS class (override ใน <style>)
  wrap.style.cssText = `--dg-bar:${barColor};--dg-bg:${bgColor};width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 14px;background:${bgColor};border-radius:10px;box-sizing:border-box;font-family:${config.font_family || 'Kanit'},sans-serif;opacity:${opacity};${achieved ? `box-shadow:0 0 16px ${barColor}44;` : ''}`;

  // ★ header — title + percent
  const header = document.createElement('div');
  header.className = 'dg-header';
  const titleAlign = w.dg_title_align || 'left';
  const titleAlignMap = { left: 'flex-start', center: 'center', right: 'flex-end' };
  header.style.cssText = `display:flex;justify-content:${titleAlignMap[titleAlign] || 'flex-start'};align-items:center;font-size:${fs}px;color:${fontColor || 'inherit'};font-weight:600;`;
  const titleEl = document.createElement('span');
  titleEl.className = 'dg-title';
  if (achieved) {
    titleEl.innerHTML = overflow > 0
      ? `🎉 ${goalTitle || 'ครบเป้าหมาย'}! <span style="font-size:0.8em;color:#fbbf24;">(+${overflow.toLocaleString()}${currency})</span>`
      : `🎉 ${goalTitle || 'ครบเป้าหมายแล้ว'}!`;
  } else {
    titleEl.textContent = goalTitle || 'เป้าหมาย';
  }
  header.appendChild(titleEl);
  wrap.appendChild(header);

  // ★ progress bar — แต่ละ theme มีความสูงต่างกัน
  const barHeight = theme === 'minimal' ? 6 : (theme === 'cute' ? 18 : (theme === 'liquid' ? 22 : 14));
  const barBg = document.createElement('div');
  barBg.className = 'dg-bar-bg';
  barBg.style.cssText = `position:relative;width:100%;height:${barHeight}px;background:rgba(255,255,255,0.1);overflow:hidden;`;
  const barFill = document.createElement('div');
  barFill.className = 'dg-bar-fill';
  barFill.style.cssText = `height:100%;width:${Math.min(100, percent)}%;background:linear-gradient(90deg, ${gradFrom}, ${gradTo});transition:width 0.6s cubic-bezier(0.4,0,0.2,1);position:relative;`;
  barBg.appendChild(barFill);
  wrap.appendChild(barBg);

  // ★ footer — amounts (พร้อม %) + last donor
  const amountAlign = w.dg_amount_align || 'left';
  const footer = document.createElement('div');
  const alignMap = { left: 'flex-start', center: 'center', right: 'flex-end' };
  footer.style.cssText = `display:flex;justify-content:${alignMap[amountAlign] || 'flex-start'};align-items:center;gap:12px;font-size:${Math.max(11, fs - 3)}px;color:${fontColor || 'inherit'};font-weight:600;`;
  const amountEl = document.createElement('span');
  amountEl.className = 'dg-amount';
  amountEl.innerHTML = `<b style="${currentColor ? `color:${achieved ? '#fbbf24' : currentColor};` : ''}font-size:${fs}px;font-weight:800;">${current.toLocaleString()}</b> <span style="${goalColor ? `color:${goalColor};` : ''}font-weight:600;">/ ${goal.toLocaleString()} ${currency}</span> <span style="font-weight:700;opacity:0.9;">(${percent.toFixed(0)}%)</span>`;
  footer.appendChild(amountEl);
  if (showDonor && lastDonor) {
    const donorEl = document.createElement('span');
    donorEl.className = 'dg-donor';
    donorEl.style.cssText = 'opacity:0.7;';
    donorEl.innerHTML = `• ล่าสุด: <b style="color:#cbd5e1;">${lastDonor}</b> <span style="color:${barColor};">+${lastAmount}${currency}</span>`;
    footer.appendChild(donorEl);
  }
  wrap.appendChild(footer);

  inner.appendChild(wrap);
}

// ★ helper — ทำสีอ่อนขึ้น (สำหรับ gradient)
function _lightenColor(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, (num >> 16) + Math.round(255 * percent / 100));
  const g = Math.min(255, ((num >> 8) & 0xff) + Math.round(255 * percent / 100));
  const b = Math.min(255, (num & 0xff) + Math.round(255 * percent / 100));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function handleDonateGoal(data) {
  const wid = data.widget_id;
  _lastDonateGoalData[wid] = data;
  // ★ อัปเดตทุก widget ที่ match
  document.querySelectorAll('.widget.type-donate_goal').forEach(el => {
    if (el.dataset.id !== wid) return;
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      // ★ re-render เพื่ออัปเดต bar + text (ใช้ widget config + data ใหม่)
      const w = config.widgets.find(x => x.id === wid);
      if (w) setupDonateGoalWidget(inner, w);
    }
  });
}

// ════════════════════════════════════════════════════════════
// Color Key (Chroma Key) — ตัดสีพื้นหลังผ่าน Canvas pixel processing
// ════════════════════════════════════════════════════════════
// active color key instances: {widgetId, canvas, ctx, video, rafId, config}
const _ckInstances = {};

// ★ เริ่ม color key สำหรับ widget — สร้าง canvas ซ้อนเหนือ video ต้นฉบับ
function startColorKey(inner, w) {
  const wid = w.id;
  // ★ หยุด instance เดิมก่อน (ถ้ามี)
  stopColorKey(wid);
  // ★ config
  const hex = (w.ck_color || '#00ff00');
  const target = hexToRgb(hex);
  const similarity = w.ck_similarity != null ? w.ck_similarity : 50;
  const smoothness = w.ck_smoothness != null ? w.ck_smoothness : 30;
  // threshold = 0-442 (max RGB distance)
  const threshold = (similarity / 100) * 442;
  const smoothRange = (smoothness / 100) * Math.max(threshold * 0.4, 20);

  // ★ หา video ต้นฉบับใน inner
  const video = inner.querySelector('video');
  if (!video) return;

  // ★ สร้าง canvas (willReadFrequently เพื่อ performance)
  const canvas = document.createElement('canvas');
  canvas.className = 'ck-canvas';
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;';
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  inner.appendChild(canvas);

  // ★ ซ่อน video ต้นฉบับ (แต่ยังเล่นเบื้องหลัง)
  video.style.opacity = '0';
  video.style.position = 'absolute';
  video.style.pointerEvents = 'none';

  const inst = { widgetId: wid, canvas, ctx, video, target, threshold, smoothRange, rafId: null };
  _ckInstances[wid] = inst;

  // ★ resize canvas ตามขนาด widget
  function resizeCanvas() {
    const rect = inner.getBoundingClientRect();
    canvas.width = Math.min(1920, Math.round(rect.width));
    canvas.height = Math.min(1080, Math.round(rect.height));
  }
  resizeCanvas();
  inst.resize = resizeCanvas;

  // ★ animation loop — ประมวลผลทุกเฟรม
  function processFrame() {
    if (video.readyState >= 2 && canvas.width > 0 && canvas.height > 0) {
      // drawImage video → canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      // ดึง pixel data
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const tr = inst.target.r, tg = inst.target.g, tb = inst.target.b;
      const thr = inst.threshold;
      const sr = inst.smoothRange;
      // ★ ประมวลผล pixel — ตัดสีที่ใกล้เคียง
      for (let i = 0; i < data.length; i += 4) {
        const dr = data[i] - tr;
        const dg = data[i + 1] - tg;
        const db = data[i + 2] - tb;
        const dist = Math.sqrt(dr * dr + dg * dg + db * db);
        if (dist < thr - sr) {
          data[i + 3] = 0;  // ตัดเต็มที่
        } else if (dist < thr) {
          // smooth edge — alpha ลดลงตามระยะ
          data[i + 3] = Math.round(((dist - (thr - sr)) / sr) * 255);
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }
    inst.rafId = requestAnimationFrame(processFrame);
  }
  processFrame();
}

// ★ หยุด color key — คืน video ต้นฉบับ + ลบ canvas
function stopColorKey(widgetId) {
  const inst = _ckInstances[widgetId];
  if (!inst) return;
  if (inst.rafId) cancelAnimationFrame(inst.rafId);
  try { inst.canvas.remove(); } catch (e) {}
  // ★ คืน video ต้นฉบับ
  if (inst.video) {
    inst.video.style.opacity = '';
    inst.video.style.position = '';
    inst.video.style.pointerEvents = '';
  }
  delete _ckInstances[widgetId];
}

// ★ อัปเดต color key config (เมื่อ settings เปลี่ยน — ไม่ต้อง restart)
function updateColorKeyConfig(w) {
  const inst = _ckInstances[w.id];
  if (!inst) return;
  const hex = (w.ck_color || '#00ff00');
  inst.target = hexToRgb(hex);
  const similarity = w.ck_similarity != null ? w.ck_similarity : 50;
  const smoothness = w.ck_smoothness != null ? w.ck_smoothness : 30;
  inst.threshold = (similarity / 100) * 442;
  inst.smoothRange = (smoothness / 100) * Math.max(inst.threshold * 0.4, 20);
}

// ★ Eyedropper — เปิดโหมดคลิกที่ canvas เพื่อเก็บสี
function enableColorKeyEyedropper(widgetId, onPick) {
  const inst = _ckInstances[widgetId];
  if (!inst || !inst.canvas) return;
  inst.canvas.style.pointerEvents = 'auto';
  inst.canvas.style.cursor = 'crosshair';
  const handler = (e) => {
    const rect = inst.canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) * inst.canvas.width / rect.width);
    const y = Math.round((e.clientY - rect.top) * inst.canvas.height / rect.height);
    try {
      const px = inst.ctx.getImageData(x, y, 1, 1).data;
      const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
      if (onPick) onPick(hex);
    } catch (err) {}
    // ปิด eyedropper mode
    inst.canvas.style.pointerEvents = 'none';
    inst.canvas.style.cursor = '';
    inst.canvas.removeEventListener('click', handler);
  };
  inst.canvas.addEventListener('click', handler);
}

// ★ helper — hex → {r, g, b}
function hexToRgb(hex) {
  const h = (hex || '#00ff00').replace('#', '');
  return {
    r: parseInt(h.slice(0, 2), 16) || 0,
    g: parseInt(h.slice(2, 4), 16) || 255,
    b: parseInt(h.slice(4, 6), 16) || 0,
  };
}

// ★ render Color Key section HTML (ใช้ใน Video + Playroom settings modal)
function renderColorKeySection(w) {
  const enabled = w.ck_enabled === true;
  const color = w.ck_color || '#00ff00';

  let html = '<div class="section-title">🎨 Color Key (Chroma Key)</div>';
  html += '<p class="hint-text">ตัดสีพื้นหลังออก (เช่น green screen) ทำให้ widget โปร่งใสตรงสีที่เลือก</p>';
  // toggle
  html += fldRow('เปิด Color Key', enabled, 'f-ck_enabled');
  // color picker + eyedropper button (side by side)
  html += '<div class="fld row"><label>สีที่จะตัด</label><div style="display:flex;gap:6px;align-items:center;">'
    + '<input type="color" id="f-ck_color" value="' + color + '" style="width:60px;height:32px;border:1px solid #333;border-radius:6px;background:#1a1a2e;flex-shrink:0;">'
    + '<button type="button" id="f-ck-eyedropper-btn" style="flex:1;padding:8px;background:#4a9eff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;">🎯 คลิกเพื่อเก็บสีจากวิดีโอ</button>'
    + '</div></div>';

  html += fldSlider('Smoothness (ความนุ่มของขอบ)', 'f-ck_smoothness', smoothness, 0, 100, 1, '%');
  return html;
