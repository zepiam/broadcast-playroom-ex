// ★ bind eyedropper button — เปิดโหมดคลิกที่ canvas เพื่อเก็บสี
function bindColorKeyEyedropper(w) {
  const btn = document.getElementById('f-ck-eyedropper-btn');
  if (!btn) return;
  btn.onclick = () => {
    // ★ ต้องเปิด color key ก่อนถึงจะมี canvas ให้คลิก
    if (!w.ck_enabled) {
      const cb = document.getElementById('f-ck_enabled');
      if (cb) { cb.checked = true; }
      // trigger readModalFields + re-render
      if (typeof readModalFields === 'function' && typeof renderAll === 'function') {
        readModalFields(w);
        renderAll();
      }
    }
    // ★ รอ render แล้วเปิด eyedropper
    setTimeout(() => {
      enableColorKeyEyedropper(w.id, (hex) => {
        const colorInput = document.getElementById('f-ck_color');
        if (colorInput) colorInput.value = hex;
        // update config + re-process
        w.ck_color = hex;
        updateColorKeyConfig(w);
        // อัปเดต URL params สำหรับ playroom iframe (ถ้าเป็น playroom)
        if (w.type === 'playroom') refreshPlayroomIframe(w);
        btn.textContent = '✓ เก็บสีแล้ว: ' + hex;
        setTimeout(() => { btn.textContent = '🎯 คลิกเพื่อเก็บสีจากวิดีโอ'; }, 2000);
      });
    }, 300);
  };
}

// ★ สร้าง URL สำหรับ playroom iframe (รวม color key params ถ้าเปิดอยู่)
function buildPlayroomSrc(w) {
  let src = `/playroom-widget?id=${encodeURIComponent(w.id)}&_t=${Date.now()}`;
  // ★ color key params (ถ้าเปิดอยู่ → playroom.html จะเปิด canvas processing)
  if (w.ck_enabled) {
    src += '&ck=1';
    src += '&ck_color=' + encodeURIComponent(w.ck_color || '#00ff00');
    src += '&ck_sim=' + (w.ck_similarity != null ? w.ck_similarity : 50);
    src += '&ck_smooth=' + (w.ck_smoothness != null ? w.ck_smoothness : 30);
  }
  return src;
}

// ★ refresh playroom iframe (เมื่อ ck config เปลี่ยน — ต้อง reload iframe เพื่ออ่าน URL params ใหม่)
function refreshPlayroomIframe(w) {
  const el = document.querySelector('.widget[data-id="' + w.id + '"]');
  if (!el) return;
  const iframe = el.querySelector('iframe');
  if (!iframe) return;
  iframe.src = buildPlayroomSrc(w);
}

// ★ selectWidget — เลือก + highlight เท่านั้น (ไม่เปลี่ยน z-index)
//    ใช้ตอนคลิก layer row หรือคลิก widget บน canvas
function selectWidget(id) {
  document.querySelectorAll('.widget.selected').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`.widget[data-id="${id}"]`);
  if (el) {
    el.classList.add('selected');
    selectedWidget = id;
  }
  renderLayersList();
}

// ★ bringToFront — เลือก + ย้าย widget ไปบนสุด (z-index สูงสุด)
//    ใช้ตอนเริ่มลาก widget เท่านั้น
function bringToFront(id) {
  selectWidget(id);
  const w = config.widgets.find(x => x.id === id);
  if (w) {
    // ★ reindex z ทั้งหมดให้ต่อเนื่อง — ย้าย widget นี้ไปท้าย array แล้ว z = 1,2,3,...
    const others = config.widgets.filter(x => x.id !== id);
    others.forEach((x, i) => { x.z = i + 1; });
    w.z = others.length + 1;
    // ★ apply z-index ทันที
    document.querySelectorAll('.widget').forEach(el => {
      const wid = el.dataset.id;
      const ww = config.widgets.find(x => x.id === wid);
      if (ww) el.style.zIndex = ww.z;
    });
  }
  renderLayersList();
}

// ★ บันทึก layout ทันทีไม่หน่วง (ยิง POST เลย) — ใช้ตอน add/delete widget
//   เพื่อให้ Overlay OBS ได้รับ widget ใหม่/ที่ลบ ทันทีผ่าน config push
//   ★ แก้บั๊ก: เดิมตอน "เพิ่ม" widget ไม่ได้ save เลย → กด Demo เลยไม่มีอะไรขึ้น
//   บน OBS จนกว่าจะเข้า ⚙ แก้ค่า + บันทึกครั้งแรก
function saveLayoutNow() {
  _markLocalEdit();
  if (_liveSaveTimer) clearTimeout(_liveSaveTimer);
  // ★ Job ที่ไม่มีรูป = ไม่ถูกบันทึก (ตามสเปก Character Talk)
  const _jobsToSave = (config.character_jobs || []).filter(j => j.image);
  if ((config.character_jobs || []).length !== _jobsToSave.length) {
    // แจ้งเตือนเบาๆ ใน list (ไม่ block การเซฟส่วนอื่น)
    console.warn('[CharJobs] ข้าม ' + ((config.character_jobs || []).length - _jobsToSave.length) + ' job ที่ไม่มีรูป');
  }
  const snapshot = JSON.parse(JSON.stringify({
    widgets: config.widgets,
    canvas_size: config.canvas_size,
    character_jobs: _jobsToSave,
    character_default_image: config.character_default_image || ''
  }));
  fetch('/save?t=' + Date.now(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(snapshot),
  }).catch(() => {});
}

function deleteWidget(id) {
  // ★ cleanup avatar widget instance (stop timer + mic stream)
  if (_avatarWidgets[id]) _destroyAvatarInstance(id);
  config.widgets = config.widgets.filter(w => w.id !== id);
  renderAll();
  // ★ ghost-widget guard: stamp local edit (กัน WS push เก่า render widget ที่ลบแล้วกลับมา)
  //   + save ทันที
  saveLayoutNow();
}

// ═══════════════════════════════════════════════════════════════
// ★ Layers Panel — จัดลำดับชั้น widget (drag เพื่อสลับ z-index)
// ═══════════════════════════════════════════════════════════════
const WIDGET_ICONS = {
  chat:'💬', alert:'🔔', viewer:'👥', clock:'🕐',
  image:'🖼️', playroom:'🎮', webcam:'📷', text:'📝', video:'🎬', now_playing:'🎵', emote_party:'🎉', avatar:'😊', donate_goal:'🎯'
};
const WIDGET_LABELS = {
  chat:'Chat', alert:'Custom URL', viewer:'Viewer Count', clock:'Clock',
  image:'Image', playroom:'Playroom', webcam:'Webcam', text:'Text', video:'Video', now_playing:'Now Playing', emote_party:'Emote Party', avatar:'Avatar', donate_goal:'Donate Goal'
};

function renderLayersList() {
  const list = document.getElementById('layers-list');
  const count = document.getElementById('layers-count');
  if (!list) return;
  list.innerHTML = '';
  // sort by z descending (highest z = top layer = first in list)
  const sorted = [...config.widgets].sort((a, b) => (b.z || 0) - (a.z || 0));
  count.textContent = `(${sorted.length})`;
  sorted.forEach((w, idx) => {
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.dataset.id = w.id;
    row.draggable = true;
    if (selectedWidget === w.id) row.classList.add('selected');
    // ★ ใช้ custom name ถ้ามี ไม่งั้นใช้ type label
    const displayName = w.name || WIDGET_LABELS[w.type] || w.type;
    row.innerHTML = '<span class="layer-icon">' + (WIDGET_ICONS[w.type] || '▣') + '</span>'
      + '<span class="layer-name" title="ดับเบิ้ลคลิกเพื่อเปลี่ยนชื่อ">' + escapeHtml(displayName)
      + '<span class="sub">z:' + (w.z || 1) + '</span></span>'
      + '<button class="layer-settings-btn" title="ตั้งค่า Widget">⚙</button>'
      + '<button class="layer-vis-btn" title="show/hide">' + (w.enabled === false ? '🚫' : '👁') + '</button>'
      + '<button class="layer-up-btn" title="เลื่อนขึ้นหนึ่งชั้น"' + (idx === 0 ? ' disabled' : '') + '>▲</button>'
      + '<button class="layer-down-btn" title="เลื่อนลงหนึ่งชั้น"' + (idx === sorted.length - 1 ? ' disabled' : '') + '>▼</button>';
    // click row → select widget (ไม่เปลี่ยน z-index)
    // ★ ใช้ timer แยก single click จาก double click (กัน renderLayersList ทำลาย dblclick)
    let _clickTimer = null;
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('layer-vis-btn')) return;
      if (e.target.classList.contains('layer-settings-btn')) return;
      if (e.target.classList.contains('layer-name')) return; // ★ ปล่อยให้ dblclick จัดการ
      if (_clickTimer) { clearTimeout(_clickTimer); _clickTimer = null; }
      _clickTimer = setTimeout(() => { selectWidget(w.id); _clickTimer = null; }, 200);
    });
    // ★ double-click name → rename
    const nameEl = row.querySelector('.layer-name');
    if (nameEl) {
      nameEl.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        startLayerRename(w, nameEl, row);
      });
    }
    // ★ settings button → open settings modal
    const settingsBtn = row.querySelector('.layer-settings-btn');
    if (settingsBtn) {
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectWidget(w.id);
        openSettingsModal(w.id);
      });
    }
    // visibility toggle
    row.querySelector('.layer-vis-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleWidgetVisibility(w.id);
    });
    // ★ ปุ่มลูกศร — เลื่อนชั้นขึ้น/ลงทีละหนึ่ง (บนสุดกดขึ้นไม่ได้ / ล่างสุดกดลงไม่ได้)
    const upBtn = row.querySelector('.layer-up-btn');
    const downBtn = row.querySelector('.layer-down-btn');
    if (upBtn) upBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveLayerByOne(w.id, -1);
    });
    if (downBtn) downBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveLayerByOne(w.id, +1);
    });
    // HTML5 drag-and-drop
    enableLayerDrag(row);
    list.appendChild(row);
  });
}

// ★ inline rename — ดับเบิ้ลคลิก layer name → text input
function startLayerRename(w, nameEl, row) {
  const oldName = w.name || WIDGET_LABELS[w.type] || w.type;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = oldName;
  input.className = 'layer-rename-input';
  input.style.cssText = 'flex:1;background:#0a0e1a;color:#fff;border:1px solid #4a9eff;border-radius:3px;padding:1px 4px;font-size:12px;font-family:inherit;';
  nameEl.replaceWith(input);
  input.focus();
  input.select();
  let saved = false;
  const save = () => {
    if (saved) return;
    saved = true;
    const newName = input.value.trim();
    w.name = (newName && newName !== (WIDGET_LABELS[w.type] || w.type)) ? newName : '';
    saveLayoutDebounced();
    renderLayersList();
  };
  input.addEventListener('blur', save);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    else if (e.key === 'Escape') { saved = true; renderLayersList(); }
  });
}

function enableLayerDrag(row) {
  row.addEventListener('dragstart', (e) => {
    row.classList.add('dragging');
    e.dataTransfer.setData('text/plain', row.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    document.querySelectorAll('.layer-row').forEach(r => r.classList.remove('drag-over'));
  });
  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.layer-row').forEach(r => r.classList.remove('drag-over'));
    row.classList.add('drag-over');
  });
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const targetId = row.dataset.id;
    if (draggedId === targetId) return;
    // ★ ครึ่งบนของแถว = แทรกก่อน / ครึ่งล่าง = แทรกหลัง (ทำให้ลากไปเป็นแถวล่างสุดได้)
    const rect = row.getBoundingClientRect();
    const insertAfter = (e.clientY - rect.top) > rect.height / 2;
    reorderLayers(draggedId, targetId, insertAfter);
  });
}

// ★ เลื่อน layer ขึ้น/ลงทีละ 1 ชั้น (ปุ่ม ▲▼) — dir: -1 = ขึ้น, +1 = ลง
function moveLayerByOne(id, dir) {
  const sorted = [...config.widgets].sort((a, b) => (b.z || 0) - (a.z || 0));
  const idx = sorted.findIndex(w => w.id === id);
  if (idx < 0) return;
  const target = idx + dir;
  if (target < 0 || target >= sorted.length) return;  // บนสุด/ล่างสุด → ไม่ทำ
  // สลับตำแหน่ง → reassign z ใหม่ทั้งชุด (index 0 = z สูงสุด)
  [sorted[idx], sorted[target]] = [sorted[target], sorted[idx]];
  const total = sorted.length;
  sorted.forEach((w, i) => { w.z = total - i; });
  // เรียง config.widgets ตาม z (ต่ำ→สูง) ให้ตรงกับที่ server จัด
  config.widgets.sort((a, b) => (a.z || 0) - (b.z || 0));
  // apply z-index ทันทีบน canvas
  document.querySelectorAll('.widget').forEach(el => {
    const ww = config.widgets.find(x => x.id === el.dataset.id);
    if (ww) el.style.zIndex = ww.z;
  });
  renderLayersList();
  saveLayoutDebounced();
}

function reorderLayers(draggedId, targetId, insertAfter = false) {
  // อ่านลำดับจาก DOM (บน→ล่าง = z สูง→ต่ำ)
  const list = document.getElementById('layers-list');
  const draggedRow = list.querySelector(`[data-id="${draggedId}"]`);
  const targetRow = list.querySelector(`[data-id="${targetId}"]`);
  if (!draggedRow || !targetRow) return;
  // ย้าย dragged ตามตำแหน่ง drop (ก่อน/หลัง target)
  list.insertBefore(draggedRow, insertAfter ? targetRow.nextSibling : targetRow);
  // ★ reassign z ตามลำดับใหม่ (index 0 = บนสุด = z สูงสุด)
  const newRows = [...list.querySelectorAll('.layer-row')];
  const total = newRows.length;
  // ★ reorder config.widgets array ให้ตรงกับลำดับใหม่ (z ต่ำ→สูง = index สูง→ต่ำ)
  //    สำคัญ: saveLayoutDebounced ส่ง config.widgets ไป server → server reassign z ตาม array order
  //    ถ้า array order ไม่ตรงกับ z ที่ตั้ง → server จะ override z กลับเป็นเดิม
  const newWidgetsOrder = [];
  newRows.forEach((r, i) => {
    const w = config.widgets.find(x => x.id === r.dataset.id);
    if (w) {
      w.z = total - i;
      newWidgetsOrder.push(w);
    }
  });
  // ★ แทนที่ config.widgets ด้วยลำดับใหม่ (เรียง z ต่ำ→สูง เพื่อให้ server reassign ถูก)
  //    DOM list เรียง z สูง→ต่ำ → กลับด้านเป็นต่ำ→สูง ก่อนเก็บ
  config.widgets = newWidgetsOrder.slice().reverse();
  renderAll();           // อัปเดต z-index บน canvas
  renderLayersList();    // อัปเดต label z:N
  _markLocalEdit();
  saveLayoutDebounced(); // persist
}

function toggleWidgetVisibility(id) {
  const w = config.widgets.find(x => x.id === id);
  if (!w) return;
  w.enabled = w.enabled === false ? true : false;
  renderAll();
  renderLayersList();
  _markLocalEdit();
  saveLayoutDebounced();
}

// ★ snap distance — ระยะที่ลากใกล้ขอบแล้ว "ดูด" ติด
const SNAP_PX = 12;

// ★ Smart Guides — แสดงเส้นจัดกึ่งกลางตอนลาก widget (เหมือน Photoshop)
// ★ threshold อ้างอิงจากขนาดจอจริง (screen px) แปลงเป็น canvas px โดยหารด้วย zoom
const GUIDE_THRESHOLD_SCREEN = 6; // screen px — ระยะที่เมาส์ต้องอยู่ใกล้กว่านี้ถึงจะ snap
function clearSmartGuides() {
  const sg = document.getElementById('smart-guides');
  if (sg) { sg.innerHTML = ''; sg.style.display = 'none'; }
}
function showGuideLine(x1, y1, x2, y2, isVertical) {
  const sg = document.getElementById('smart-guides');
  if (!sg) return;
  const line = document.createElement('div');
  // ★ ใช้ canvas coordinate (อยู่ใน canvas-wrap ที่ถูก scale อยู่แล้ว)
  line.style.cssText = isVertical
    ? `position:absolute;left:${x1}px;top:0;width:1px;height:${config.canvas_h}px;background:#4a9eff;box-shadow:0 0 3px #4a9eff;pointer-events:none;`
    : `position:absolute;left:0;top:${y1}px;width:${config.canvas_w}px;height:1px;background:#4a9eff;box-shadow:0 0 3px #4a9eff;pointer-events:none;`;
  sg.appendChild(line);
}
function checkSmartGuides(wRef, visW, visH) {
  clearSmartGuides();
  // ★ threshold ใน canvas coordinate = screen threshold / zoom (ตอน zoom เล็ก threshold ใหญ่ขึ้น)
  const threshold = GUIDE_THRESHOLD_SCREEN / Math.max(0.1, zoomLevel);
  const myCx = wRef.x + visW / 2;
  const myCy = wRef.y + visH / 2;
  const cw = config.canvas_w;
  const ch = config.canvas_h;
  const canvasCx = cw / 2;
  const canvasCy = ch / 2;
  let snappedX = null, snappedY = null;
  const guides = document.getElementById('smart-guides');
  if (!guides) return { snappedX, snappedY };

  // ★ เช็ค center ของ canvas
  if (Math.abs(myCx - canvasCx) < threshold) {
    snappedX = canvasCx - visW / 2;
    guides.style.display = 'block';
    showGuideLine(canvasCx, 0, canvasCx, ch, true);
  }
  if (Math.abs(myCy - canvasCy) < threshold) {
    snappedY = canvasCy - visH / 2;
    guides.style.display = 'block';
    showGuideLine(0, canvasCy, cw, canvasCy, false);
  }

  // ★ เช็ค center + edges ของ widget อื่นๆ
  config.widgets.forEach(other => {
    if (other.id === wRef.id || !other.enabled) return;
    const oWs = other.widget_scale != null ? other.widget_scale : 1.0;
    const oW = other.w * oWs;
    const oH = other.h * oWs;
    const oCx = other.x + oW / 2;
    const oCy = other.y + oH / 2;
    // center alignment
    if (snappedX === null && Math.abs(myCx - oCx) < threshold) {
      snappedX = oCx - visW / 2;
      guides.style.display = 'block';
      showGuideLine(oCx, 0, oCx, ch, true);
    }
    if (snappedY === null && Math.abs(myCy - oCy) < threshold) {
      snappedY = oCy - visH / 2;
      guides.style.display = 'block';
      showGuideLine(0, oCy, cw, oCy, false);
    }
    // left edge alignment
    if (snappedX === null && Math.abs(wRef.x - other.x) < threshold) {
      snappedX = other.x;
      guides.style.display = 'block';
      showGuideLine(other.x, 0, other.x, ch, true);
    }
    if (snappedY === null && Math.abs(wRef.y - other.y) < threshold) {
      snappedY = other.y;
      guides.style.display = 'block';
      showGuideLine(0, other.y, cw, other.y, false);
    }
    // right edge alignment
    if (snappedX === null && Math.abs((wRef.x + visW) - (other.x + oW)) < threshold) {
      snappedX = other.x + oW - visW;
      guides.style.display = 'block';
      showGuideLine(other.x + oW, 0, other.x + oW, ch, true);
    }
    if (snappedY === null && Math.abs((wRef.y + visH) - (other.y + oH)) < threshold) {
      snappedY = other.y + oH - visH;
      guides.style.display = 'block';
      showGuideLine(0, other.y + oH, cw, other.y + oH, false);
    }
  });

  return { snappedX, snappedY };
}

function enableDrag(el, w) {
  let startX, startY, origX, origY, dragging = false;
  el.addEventListener('mousedown', (e) => {
    // ไม่ drag ถ้าคลิกที่ handle หรือปุ่มลบ/settings
    if (e.target.classList.contains('resize-handle') ||
        e.target.classList.contains('delete-btn') ||
        e.target.classList.contains('settings-btn')) return;
    const wRef = getWidgetRef(el);   // ★ ใช้ reference ล่าสุดเสมอ
    dragging = true;
    el._isDragging = true;
    el._dragStarted = false;   // ★ reset — รอขยับเกิน threshold ค่อยนับเป็นลากจริง
    _isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    origX = wRef.x;
    origY = wRef.y;
    // ★ คลิกแล้วอย่าเด้งขึ้นบนสุด — คลิกธรรมดา (มือขยับนิดหน่อย) ต้องไม่ถือว่าลาก
    //   bringToFront จะทำงานเมื่อขยับเกิน 5px จริงเท่านั้น (ดู mousemove ด้านล่าง)
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const wRef = getWidgetRef(el);   // ★ reference ล่าสุด
    // ★ threshold 5px — ยังไม่ขยับถือว่าคลิก (ไม่ reorder layer, ไม่ขยับตำแหน่ง)
    if (!el._dragStarted) {
      if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) return;
      el._dragStarted = true;
      bringToFront(wRef.id);   // ★ ลากจริงครั้งแรกเท่านั้นที่ขึ้นบนสุด
    }
    let nx = origX + (e.clientX - startX);
    let ny = origY + (e.clientY - startY);
    // ★ จำกัดไม่ให้เลยขอบ canvas — คำนึงถึง widget_scale (ขนาดจริงบนจอ = w * scale)
    const ws = wRef.widget_scale != null ? wRef.widget_scale : 1.0;
    const visW = wRef.w * ws;
    const visH = wRef.h * ws;
    nx = Math.max(0, Math.min(nx, config.canvas_w - visW));
    ny = Math.max(0, Math.min(ny, config.canvas_h - visH));
    // ★ snap ขอบ canvas
    if (nx <= SNAP_PX) nx = 0;
    else if (nx >= config.canvas_w - visW - SNAP_PX) nx = config.canvas_w - visW;
    if (ny <= SNAP_PX) ny = 0;
    else if (ny >= config.canvas_h - visH - SNAP_PX) ny = config.canvas_h - visH;
    wRef.x = nx;   // ★ เขียนลง reference ล่าสุด (config.widgets ปัจจุบัน)
    wRef.y = ny;
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
    // ★ Smart Guides — เช็ค alignment และ snap
    if (isEditor) {
      const guides = checkSmartGuides(wRef, visW, visH);
      if (guides.snappedX !== null) {
        wRef.x = guides.snappedX;
        el.style.left = guides.snappedX + 'px';
      }
      if (guides.snappedY !== null) {
        wRef.y = guides.snappedY;
        el.style.top = guides.snappedY + 'px';
      }
    }
  });
  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false; el._isDragging = false; _isDragging = false;
      clearSmartGuides();   // ★ ล้างเส้น guide ตอนวาง
      _markLocalEdit();
      saveLayoutDebounced();
    }
  });
}

function enableResize(el, handle, w) {
  let startX, startY, origW, origH, resizing = false;
  handle.addEventListener('mousedown', (e) => {
    const wRef = getWidgetRef(el);   // ★ reference ล่าสุด
    resizing = true;
    el._isResizing = true;
    _isResizing = true;
    startX = e.clientX;
    startY = e.clientY;
    origW = wRef.w;
    origH = wRef.h;
    e.preventDefault();
    e.stopPropagation();
  });
  document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const wRef = getWidgetRef(el);   // ★ reference ล่าสุด
    let nw = Math.max(50, origW + (e.clientX - startX));
    let nh = Math.max(30, origH + (e.clientY - startY));

    if (wRef.type === 'webcam') {
      // webcam — บังคับ ratio ตาม webcam_ratio
      nw = Math.min(nw, config.canvas_w - wRef.x);
      nh = computeRatioHeight(nw, wRef.webcam_ratio);
    } else if (wRef.lock_ratio && wRef.h > 0 && origH > 0 && origW > 0) {
      // ★ ratio lock — คำนวณ ratio จากขนาดเริ่มต้น (ปลอดภัย ไม่พึ่ง _lock_ratio)
      var ratio = origW / origH;
      let deltaX = e.clientX - startX;
      let deltaY = e.clientY - startY;
      let scaleX = (origW + deltaX) / origW;
      let scaleY = (origH + deltaY) / origH;
      let scale = (Math.abs(deltaX) > Math.abs(deltaY)) ? scaleX : scaleY;
      if (scale < 0.15) scale = 0.15;  // อย่าให้เล็กเกินไป
      nw = Math.max(50, Math.round(origW * scale));
      nh = Math.max(30, Math.round(nw / ratio));
      // จำกัดขอบ canvas
      nw = Math.min(nw, config.canvas_w - wRef.x);
      nh = Math.min(nh, config.canvas_h - wRef.y);
      // snap
      if (nw >= config.canvas_w - wRef.x - SNAP_PX) nw = config.canvas_w - wRef.x;
      if (nh >= config.canvas_h - wRef.y - SNAP_PX) nh = config.canvas_h - wRef.y;
      // ปรับให้ตรง ratio หลัง clamp — ใช้ ratio ที่คำนวณ (ไม่ใช้ _lock_ratio)
      nh = Math.max(30, Math.round(nw / ratio));
    } else {
      // อิสระ (ไม่ล็อค ratio)
      nw = Math.min(nw, config.canvas_w - wRef.x);
      nh = Math.min(nh, config.canvas_h - wRef.y);
      if (nw >= config.canvas_w - wRef.x - SNAP_PX) nw = config.canvas_w - wRef.x;
      if (nh >= config.canvas_h - wRef.y - SNAP_PX) nh = config.canvas_h - wRef.y;
    }

    wRef.w = nw;
    wRef.h = nh;
    el.style.width = nw + 'px';
    el.style.height = nh + 'px';
    // ★ Circle Clock — อัปเดตขนาดทันที (responsive resize)
    if (wRef.type === 'clock' && wRef.clock_style && wRef.clock_style.startsWith('cc')) {
      const main = el.querySelector('.cc-main');
      if (main) {
        const size = Math.min(nw, nh);
        main.style.width = size + 'px';
        main.style.height = size + 'px';
        const t1 = main.querySelector('.cc-t1');
        if (t1) t1.style.fontSize = Math.round(size * 0.23) + 'px';
        const t2 = main.querySelector('.cc-t2');
        if (t2) t2.style.fontSize = Math.round(size * 0.23 * 0.48) + 'px';
        const live = main.querySelector('.cc-live');
        if (live) live.style.fontSize = Math.round(size * 0.23 * 0.52) + 'px';
      }
    }
  });
  document.addEventListener('mouseup', () => {
    if (resizing) { resizing = false; el._isResizing = false; _isResizing = false; _markLocalEdit(); saveLayoutDebounced(); }
  });
}

document.querySelectorAll('.widget-add-btn').forEach(btn => {
  btn.onclick = () => {
    const type = btn.dataset.type;
    const id = 'w' + Date.now();
    const size = DEFAULT_SIZE[type] || { w: 300, h: 200 };
    const w = {
      id, type,
      x: 50 + (config.widgets.length * 20),
      y: 50 + (config.widgets.length * 20),
      w: size.w, h: size.h,
      z: (config.widgets.length + 1),
      url: type === 'alert' ? '' : '',
      alpha: 1.0,
      enabled: true,
    };

    // ★ Now Playing — ถามแหล่งเพลงก่อนเพิ่ม widget
    if (type === 'now_playing') {
      var choice = showSourcePicker();
      if (!choice) return;  // user ยกเลิก
      w.np_source = choice;
      // ตั้ง theme ตรงกับ source
      if (choice === 'spotify') w.np_theme = 'spotify';
      else if (choice === 'ytmusic') w.np_theme = 'ytmusic';
      else if (choice === 'browser') w.np_theme = 'dark';
    }

    // ★ Text widget — default no stroke no shadow
    if (type === 'text') {
      w.text_stroke = false;
      w.text_shadow = false;
      w.text_bg_enabled = false;
    }

    // ★ ASK — เต็ม canvas ตั้งแต่ยังไม่วางลง canvas (เดิมเกิดเป็นกล่องเล็กแล้ว
    //   ต้องเข้า settings บันทึกก่อนถึงเต็มจอ — เพราะกฎบังคับอยู่แค่ updateWidgetElement)
    if (type === 'ask') {

      w.w = config.canvas_w || 1920;
      w.h = config.canvas_h || 1080;
    }

    config.widgets.push(w);

    selectWidget(id);
    // ★ ghost guard + save ทันที — กัน Overlay OBS ไม่มี widget ใหม่จนกว่าจะบันทึก
    //   ครั้งแรก (เคยทำให้กด Demo เลยไม่มีอะไรขึ้นบน OBS หลังเพิ่ม ASK)
    saveLayoutNow();

// ★ Popup เลือกแหล่งเพลงตอนเพิ่ม Now Playing widget
function showSourcePicker() {
  // สร้าง modal ถาม
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.display = 'flex';
  overlay.style.zIndex = '2000';
  var box = document.createElement('div');
  box.className = 'modal-box';
  box.style.maxWidth = '400px';
  box.innerHTML =
    '<h3 style="margin:0 0 12px;color:#f59e0b;">🎵 เพิ่ม Now Playing</h3>' +
    '<p style="color:#aaa;font-size:13px;margin-bottom:16px;">คุณเล่นเพลงผ่านโปรแกรมอะไร?</p>' +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">' +
      '<button class="np-pick-btn" data-src="spotify" style="padding:12px 16px;background:rgba(29,215,96,0.15);border:1px solid #1ed760;border-radius:8px;color:#1ed760;cursor:pointer;font-size:14px;text-align:left;">🟢 Spotify <span style="color:#666;font-size:12px;">(แอป Spotify)</span></button>' +
      '<button class="np-pick-btn" data-src="ytmusic" style="padding:12px 16px;background:rgba(255,0,0,0.1);border:1px solid #ff0000;border-radius:8px;color:#ff4444;cursor:pointer;font-size:14px;text-align:left;">🔴 YouTube Music <span style="color:#666;font-size:12px;">(ytmdesktop)</span></button>' +
      '<button class="np-pick-btn" data-src="browser" style="padding:12px 16px;background:rgba(100,149,237,0.1);border:1px solid #6495ed;border-radius:8px;color:#6495ed;cursor:pointer;font-size:14px;text-align:left;">🌐 เบราว์เซอร์ <span style="color:#666;font-size:12px;">(Chrome/Edge — YouTube, SoundCloud)</span></button>' +
      '<button class="np-pick-btn" data-src="auto" style="padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid #333;border-radius:8px;color:#aaa;cursor:pointer;font-size:14px;text-align:left;">⚡ อัตโนมัติ <span style="color:#666;font-size:12px;">(จับอันที่กำลังเล่น)</span></button>' +
    '</div>' +
    '<button id="np-pick-cancel" style="padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid #333;border-radius:6px;color:#666;cursor:pointer;font-size:13px;width:100%;">ยกเลิก</button>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  var result = null;
  var buttons = box.querySelectorAll('.np-pick-btn');
  buttons.forEach(function(b) {
    b.onmouseenter = function() { b.style.filter = 'brightness(1.3)'; };
    b.onmouseleave = function() { b.style.filter = ''; };
    b.onclick = function() {
      result = b.dataset.src;
      overlay.remove();
    };
  });
  box.querySelector('#np-pick-cancel').onclick = function() {
    overlay.remove();
  };
  // click นอก box = ยกเลิก
  overlay.onclick = function(e) {
    if (e.target === overlay) overlay.remove();
  };

  // ★ synchronous — ใช้ while loop รอจนกว่า user จะเลือก (block UI)
  // ไม่สมบูรณ์แบบ แต่ใช้ได้กับ composer editor
  // ทางที่ดีกว่า: ใช้ callback แต่ต้อง refactor onclick ทั้งหมด
  // ตอนนี้ใช้วิธี return ค่าจากการรอ
  var start = Date.now();
  while (result === null && Date.now() - start < 100) {
    // ไม่สามารถ block ได้ใน browser — ต้องใช้ async pattern
    break;
  }
  // fallback: ถ้ายังไม่ได้เลือก (async) → default auto
  return result || 'auto';
}

document.getElementById('save-btn').onclick = () => {
  const btn = document.getElementById('save-btn');
  const origText = btn.textContent;
  btn.textContent = '⏳ กำลังบันทึก...';
  btn.disabled = true;
  // ★ ใช้ saveLayoutDebounced ที่ส่งข้อมูลครบ (widgets + canvas + character_jobs)
  //    แต่ cancel debounce แล้วส่งทันทีเพื่อให้ได้ feedback ทันที
  if (_liveSaveTimer) clearTimeout(_liveSaveTimer);
  // ★ Job ที่ไม่มีรูป = ไม่ถูกบันทึก (ตามสเปก Character Talk)
  const _jobsToSave = (config.character_jobs || []).filter(j => j.image);
  if ((config.character_jobs || []).length !== _jobsToSave.length) {
    // แจ้งเตือนเบาๆ ใน list (ไม่ block การเซฟส่วนอื่น)
    console.warn('[CharJobs] ข้าม ' + ((config.character_jobs || []).length - _jobsToSave.length) + ' job ที่ไม่มีรูป');
  }
  const snapshot = JSON.parse(JSON.stringify({
    widgets: config.widgets,
    canvas_size: config.canvas_size,
    character_jobs: _jobsToSave,
    character_default_image: config.character_default_image || ''
  }));
  fetch('/save?t=' + Date.now(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(snapshot),
  })
  .then(r => r.json())
  .then(data => {
    if (data.ok) {
      btn.textContent = '✅ บันทึกแล้ว!';
      btn.style.background = '#10b981';
    } else {
      btn.textContent = '❌ บันทึกไม่สำเร็จ';
      btn.style.background = '#ef4444';
    }
    setTimeout(() => {
      btn.textContent = origText;
      btn.style.background = '';
      btn.disabled = false;
    }, 1500);
  })
  .catch(err => {
    btn.textContent = '❌ บันทึกไม่สำเร็จ';
    btn.style.background = '#ef4444';
    setTimeout(() => {
      btn.textContent = origText;
      btn.style.background = '';
      btn.disabled = false;
    }, 2000);
  });
};

let _isResizing = false;

// ════════════════════════════════════════════════════════════
// Per-widget style — apply จาก widget config → CSS
// ════════════════════════════════════════════════════════════
function applyWidgetStyle(inner, w) {
  if (!w) return;
  const fs = w.font_size || 16;
  const fc = w.font_color || '#ffffff';
  const fw = w.font_weight || '600';
  const stroke = w.text_stroke !== false
    ? `0 ${w.text_stroke_width || 2}px ${w.text_stroke_color || '#000000'}, 0 0 2px ${w.text_stroke_color || '#000000'}`
    : 'none';
  if (w.type === 'chat') {
    inner.style.fontSize = fs + 'px';
    inner.style.fontWeight = fw;
    inner.style.color = fc;
    inner.style.textShadow = stroke;
    // พื้นหลัง (ถ้ามี opacity > 0)
    if (w.bg_opacity > 0) {
      const hex = w.bg_color || '#000000';
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      inner.style.background = `rgba(${r},${g},${b},${w.bg_opacity})`;
    }
  } else if (w.type === 'viewer') {
    inner.style.fontSize = fs + 'px';
    inner.style.fontWeight = fw;
    inner.style.color = fc;
    inner.style.textShadow = stroke;
  } else if (w.type === 'text') {
    // ★ text widget — apply bg (ถ้า signature เหมือนเดิม แต่ bg เปลี่ยน)
    const _textWidgetEl = inner.closest('.widget');
    if (w.text_bg_enabled) {
      const bgColor = w.text_bg_color || '#1a1a2e';
      const bgOpacity = w.text_bg_opacity !== undefined ? w.text_bg_opacity : 1.0;
      const bgRadius = w.text_bg_radius !== undefined ? w.text_bg_radius : 8;
      let bgCss;
      if (bgOpacity >= 0.999) {
        bgCss = bgColor;
      } else {
        const r = parseInt(bgColor.slice(1,3), 16) || 0;
        const g = parseInt(bgColor.slice(3,5), 16) || 0;
        const b = parseInt(bgColor.slice(5,7), 16) || 0;
        bgCss = `rgba(${r},${g},${b},${bgOpacity})`;
      }
      if (_textWidgetEl) _textWidgetEl.style.background = bgCss;
      inner.style.background = bgCss;
      inner.style.borderRadius = bgRadius + 'px';
      inner.style.padding = '8px 16px';
    } else {
      if (_textWidgetEl) _textWidgetEl.style.background = '';
      inner.style.background = '';
      inner.style.borderRadius = '';
      inner.style.padding = '';
    }
  } else if (w.type === 'clock') {
    // ★ ถ้ามี clock_style → lock ค่าทุกอย่างตามต้นฉบับ (ไม่ apply inline style ใดๆ)
    if (w.clock_style && w.clock_style !== 'none') {
      inner.style.fontSize = '';
      inner.style.fontWeight = '';
      inner.style.color = '';
      inner.style.textShadow = '';
    } else {
      // ── ระบบ theme เดิม ──
      const theme = w.clock_theme || 'default';
      inner.style.fontSize = fs + 'px';
      if (theme === 'default') {
        inner.style.fontWeight = fw;
        inner.style.color = fc;
        inner.style.textShadow = stroke;
      } else {
        inner.style.color = '';
        inner.style.textShadow = '';
        inner.style.fontWeight = '';
      }
      const timeEl = inner.querySelector('.clock-time');
      if (timeEl && w.time_color) timeEl.style.color = w.time_color;
      const dateEl = inner.querySelector('.clock-date');
      if (dateEl && w.date_color) dateEl.style.color = w.date_color;
    }
  }
}

// ★ helper: สร้าง HTML สำหรับแต่ละ type ของ input
function fld(label, html, id) {
  const idAttr = id ? ` data-fld="${id}"` : '';
  return `<div class="fld"${idAttr}><label>${label}</label>${html}</div>`;
}
function fldRow(label, checked, id) {
  const idAttr = id ? ` data-fld="${id}"` : '';
  return `<div class="fld row"${idAttr}><label>${label}</label><input type="checkbox" id="${id || ''}" ${checked ? 'checked' : ''}></div>`;
}
// ★ slider helper — แสดงค่าปัจจุบันข้าง slider + live update
function fldSlider(label, id, value, min, max, step, unit) {
  const u = unit || '';
  const v = (value != null) ? value : min;
  return `<div class="fld"><label>${label} <span class="slider-val" id="${id}-val">${v}${u}</span></label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step || 1}" value="${v}"
      oninput="document.getElementById('${id}-val').textContent=this.value+'${u}'">
  </div>`;
}
// ★ section wrapper — มี id เพื่อ show/hide ตาม mode
function section(id, title, innerHtml) {
  return `<div id="${id}" class="section-block"><div class="section-title">${title}</div>${innerHtml}</div>`;
}

function updateChatModeSections() {
  const modeSel = document.getElementById('f-appearance_mode');
  const mode = modeSel ? modeSel.value : 'default';
  const show = (id, condition) => {
    const el = document.getElementById(id);
    if (el) el.style.display = condition ? '' : 'none';
  };
  const dt = (mode === 'default' || mode === 'theme');
  // Theme picker = เฉพาะโหมด Theme
  show('sec-t-theme', mode === 'theme');
  // เนื้อหา/ตัวอักษร/อนิเมชั่น = Default + Theme (Layout บรรทัดเดียวล็อคเฉพาะ Default)

  show('sec-dt-font', dt);
  show('sec-dt-anim', dt);

// ★ error trap — ถ้า build settings พังกลางทาง ให้โชว์ error ตรงใน modal
//   (แทนอาการ "หายเงียบๆ เหลือแต่ Opacity/Size" ที่ debug ยาก)
function openSettingsModal(id) {
  try {
    _openSettingsModalInner(id);
  } catch (e) {
    console.error('[SettingsModal]', e);
    const el = document.getElementById('modal-fields');
    if (el) el.innerHTML = '<pre style="color:#f87171;font-size:12px;white-space:pre-wrap;padding:12px;">⚠️ Settings Error — ส่งภาพหน้าจอนี้ให้ทีมพัฒนา:\n\n' + (e && e.stack ? e.stack : String(e)) + '</pre>';
    document.getElementById('settings-overlay').classList.add('active');
    document.getElementById('settings-modal').classList.add('active');
  }
}

function _openSettingsModalInner(id) {
  const w = config.widgets.find(x => x.id === id);
  if (!w) return;
  modalWidgetId = id;
  document.getElementById('modal-title').textContent = `⚙️ ${w.type.toUpperCase()} Settings`;
  // ★ string buffer — กัน innerHTML += ทั้ง 135 จุด re-parse DOM รอบแรก (ทำให้ modal ค้างตอนเปิด)
  //    สะสม HTML ใน string แล้ว flush ลง DOM จริงครั้งเดียวตอน showModal
  const _fieldsEl = document.getElementById('modal-fields');
  let _fieldsHtml = '';
  const fields = {
    get innerHTML() { return _fieldsHtml; },
    set innerHTML(v) { _fieldsHtml = v; },
  };

  // ★ flush buffer ลง DOM จริง + show modal (แทน classList.add ตรงๆ ทั้ง 13 จุด)
  function _showSettingsModal() {
    _fieldsEl.innerHTML = _fieldsHtml;
    document.getElementById('settings-overlay').classList.add('active');
    document.getElementById('settings-modal').classList.add('active');
  }

  // ★ Content opacity section — แสดงทุก widget type ยกเว้น clock (clock มี opacity แยกตามโหมด)
  const opSection = document.getElementById('modal-opacity-section');
  const opSlider = document.getElementById('f-content_opacity');
  const opVal = document.getElementById('f-content_opacity-val');
  if (opSection && opSlider && opVal) {
    if (w.type === 'clock') {
      // ★ clock ใช้ style_opacity/theme_opacity แยกกัน (อยู่ในแต่ละ section) — ซ่อน global
      opSection.style.display = 'none';
    } else {
      const co = Math.round((w.content_opacity != null ? w.content_opacity : 1.0) * 100);

      opVal.textContent = co + '%';
      opSection.style.display = 'block';

  }

  // ★ Common: Size & Position — แสดงทุก widget type
  const sizeSection = document.getElementById('modal-size-section');

    _dgHtml += `<button type="button" id="f-dg_reset_colors" title="รีเซ็ตสีเป็นค่าเริ่มต้นของ theme" style="margin-left:auto;align-self:flex-end;padding:4px 10px;background:#374151;color:#e5e7eb;border:1px solid #4b5563;border-radius:4px;cursor:pointer;font-size:11px;">↻ รีเซ็ต</button>`;

    const _dgStatusEl = document.getElementById('f-dg-status');

    // ★ helper — เชื่อมต่อ EasyDonate (ไม่ส่ง key → ส่ง widget_id ให้ server ใช้ key เดิม)
    function _dgTestKey(apiKey) {
      _dgStatusEl.textContent = 'กำลังตรวจสอบ...';
      _dgStatusEl.style.color = '#f59e0b';
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      const payload = apiKey ? {api_key: apiKey} : {widget_id: w.id};
      return fetch('/easydonate-test', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
        signal: ctrl.signal
      }).then(r => {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(res => {
        if (res.ok) {
          _dgStatusEl.innerHTML = `✅ เชื่อมต่อแล้ว — <b>${res.username}</b>`;
          _dgStatusEl.style.color = '#10b981';
        } else {
          _dgStatusEl.textContent = '❌ ' + (res.error || 'เชื่อมต่อไม่ได้');
          _dgStatusEl.style.color = '#ef4444';
        }
      }).catch(e => {
        clearTimeout(timer);
        const msg = e.name === 'AbortError' ? 'หมดเวลารอ' : e.message;
        _dgStatusEl.textContent = '❌ ' + msg;
        _dgStatusEl.style.color = '#ef4444';
      });
    }

    // ★ auto-check ถ้ามี API key อยู่แล้ว (masked = มี key เดิม → เทสผ่าน widget_id)

        return;

      _dgConnBtn.textContent = '⏳ ...';

  // ═══ THEME : กล่องหลังข้อความ ═══

// ★ render default image preview
function renderDefaultImagePreview() {
  const container = document.getElementById('default-img-preview');
  if (!container) return;
  const imgPath = config.character_default_image || '';
  if (imgPath) {
    // ★ ใช้ /character/default จาก server (resolve_character_default_image จะจัดการ)
    container.innerHTML = `<img src="/character/default?t=${Date.now()}" title="คลิกเพื่อเปลี่ยน" onclick="openDefaultImagePicker()">` +
      `<div style="flex:1;"><div style="color:#e2e8f0;font-size:13px;font-weight:500;">ภาพที่กำหนดเอง</div><div style="color:#64748b;font-size:11px;">${escapeHtml(imgPath.split(/[/\\]/).pop())}</div></div>`;
  } else {
    container.innerHTML = `<img src="/character/default?t=${Date.now()}" title="คลิกเพื่อเปลี่ยน" onclick="openDefaultImagePicker()">` +
      `<div style="flex:1;"><div style="color:#e2e8f0;font-size:13px;font-weight:500;">avatar.png (default)</div><div style="color:#64748b;font-size:11px;">ภาพ default ของแอป</div></div>`;
  }
}

// ★ เปิด file picker สำหรับ default image
function openDefaultImagePicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/gif';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('job_name', 'default');
    fd.append('image', file);
    try {
      const r = await fetch('/upload-character-image', { method: 'POST', body: fd });
      const data = await r.json();
      if (data.ok) {
        config.character_default_image = data.path;
        renderDefaultImagePreview();
        applySettingsLive();
      } else {
        alert('อัพโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
      }
    } catch (e) {
      alert('อัพโหลดผิดพลาด: ' + e.message);
    }
  };
  input.click();
}

// ★ เปิด file picker (เลือกหลายรูปพร้อมกัน) → upload ทีละรูป
function openImagePicker(widgetId) {
  const w = config.widgets.find(x => x.id === widgetId);
  if (!w) return;
  if (!Array.isArray(w.images)) w.images = [];
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/gif';
  input.multiple = true;
  input.onchange = async () => {
    const files = Array.from(input.files || []);
    if (files.length === 0) return;
    let added = 0;
    for (const file of files) {
      if (w.images.length >= 20) {
        alert('ครบจำนวนสูงสุด 20 รูปแล้ว');
        break;
      }
      const fd = new FormData();
      fd.append('widget_id', widgetId);
      fd.append('image', file);
      try {
        const r = await fetch('/upload-widget-image', { method: 'POST', body: fd });
        const data = await r.json();
        if (data.ok) {
          w.images.push({ id: data.image_id, ext: data.ext });
          added++;
        } else {
          alert('อัพโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
        }
      } catch (e) {
        alert('อัพโหลดผิดพลาด: ' + e.message);
      }
    }
    if (added > 0) {
      // ★ อัปเดต counter + grid + live preview + save
      const titleEl = document.querySelector('#modal-fields .section-title');
      if (titleEl) titleEl.textContent = `🖼️ รูปภาพ (${w.images.length}/20)`;
      renderImageGrid(w);
      applySettingsLive();
    }
  };
  input.click();
}

  grid.innerHTML = images.map((img, i) => {
    const src = `/widget-image/${encodeURIComponent(w.id)}/${encodeURIComponent(img.id)}?t=${Date.now()}`;
    return `<div class="image-grid-item">
      <img src="${src}" alt="รูปที่ ${i+1}">
      <button type="button" class="image-grid-del" data-idx="${i}" title="ลบรูปนี้">✕</button>
      <span class="image-grid-idx">${i+1}</span>
    </div>`;
  }).join('');
  // ★ bind delete buttons
  grid.querySelectorAll('.image-grid-del').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.idx);
      const img = w.images[idx];
      if (!img) return;
      // ★ ลบจาก disk
      try {
        await fetch('/delete-widget-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ widget_id: w.id, image_id: img.id, ext: img.ext || '.png' }),
        });
      } catch (e) {}
      // ★ ลบจาก config
      w.images.splice(idx, 1);
      const titleEl = document.querySelector('#modal-fields .section-title');
      if (titleEl) titleEl.textContent = `🖼️ รูปภาพ (${w.images.length}/20)`;
      renderImageGrid(w);
      applySettingsLive();
    };
  });
}

// ★ render job list ใน modal (character mode)
function renderCharJobsList() {
  const container = document.getElementById('char-jobs-list');
  if (!container) return;
  const jobs = config.character_jobs || [];
  if (jobs.length === 0) {
    container.innerHTML = `<p class="hint-text">ยังไม่มี Job — เพิ่มได้ด้านล่าง</p>`;
    return;
  }
  let html = '';
  for (let i = 0; i < jobs.length; i++) {
    const job = jobs[i];
    const noImg = !job.image;
    // ★ preview รูป — ใช้ cache-bust เพื่อกัน browser cache รูปเก่า
    // (ถ้า job.image เป็น local path → browser ไม่สามารถโหลดได้ → ใช้ placeholder)
    // ★ จริงๆ ต้องใช้ /character/{job} จาก server (เหมือน overlay.html)
    const imgUrl = `/character/${encodeURIComponent(job.name || 'default')}?t=${Date.now()}`;
    const imgHtml = `<div class="char-job-preview" data-job-idx="${i}" title="คลิกเพื่อเปลี่ยนรูป" style="width:48px;height:48px;border-radius:6px;border:2px solid #334155;overflow:hidden;cursor:pointer;position:relative;flex-shrink:0;">
      <img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.innerHTML+='<div style=\\'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:9px;\\'>no img</div>';">
    </div>`;
    html += `<div class="char-job-row" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1e293b;${noImg ? 'outline:1px dashed #ef4444;outline-offset:-4px;border-radius:6px;' : ''}">
      ${imgHtml}
      <span style="flex:1;color:#e2e8f0;font-size:13px;font-weight:500;">${escapeHtml(job.name || '')}${noImg ? '<br><span style="color:#ef4444;font-size:10px;font-weight:400;">⚠ ยังไม่มีรูป — จะไม่ถูกบันทึก</span>' : ''}</span>
      <button type="button" data-job-idx="${i}" class="upload-job-btn" title="อัพโหลดรูป" style="background:#10b981;color:#fff;border:none;border-radius:4px;padding:5px 9px;cursor:pointer;font-size:12px;">📁</button>
      <button type="button" data-job-idx="${i}" class="del-job-btn" title="ลบ Job" style="background:#ef4444;color:#fff;border:none;border-radius:4px;padding:5px 9px;cursor:pointer;font-size:12px;">🗑</button>
    </div>`;
  }
  container.innerHTML = html;
  // bind upload buttons + preview click
  container.querySelectorAll('.upload-job-btn, .char-job-preview').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.jobIdx);
      if (!isNaN(idx)) openJobImagePicker(idx);
    });
  });
  // bind delete buttons
  container.querySelectorAll('.del-job-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.jobIdx);
      if (!isNaN(idx) && config.character_jobs) {
        config.character_jobs.splice(idx, 1);
        renderCharJobsList();
        applySettingsLive();
      }
    });
  });
}

// ★ เปิด file picker สำหรับอัพโหลดรูป Job → POST /upload-character-image
function openJobImagePicker(idx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/gif';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const job = (config.character_jobs || [])[idx];
    if (!job) return;
    // สร้าง FormData สำหรับ multipart upload
    const fd = new FormData();
    fd.append('job_name', job.name);
    fd.append('image', file);
    try {
      const r = await fetch('/upload-character-image', { method: 'POST', body: fd });
      const data = await r.json();
      if (data.ok) {
        // อัปเดต job.image เป็น path ใหม่
        job.image = data.path;
        renderCharJobsList();
        applySettingsLive();
      } else {
        alert('อัพโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
      }
    } catch (e) {
      alert('อัพโหลดผิดพลาด: ' + e.message);
    }
  };
  input.click();
}

// ★ add job จาก modal input
function addCharJobFromModal() {
  const input = document.getElementById('f-new-job-name');
  if (!input || !input.value.trim()) return;
  const name = input.value.trim().toLowerCase();
  if (name === 'reset' || name === 'default') { alert('ชื่อ reserved ห้ามใช้'); return; }
  if (!config.character_jobs) config.character_jobs = [];
  if (config.character_jobs.some(j => j.name === name)) { alert('Job นี้มีอยู่แล้ว'); return; }
  if (config.character_jobs.length >= 20) { alert('เพิ่มได้สูงสุด 20 Job'); return; }
  config.character_jobs.push({ name, image: '' });
  input.value = '';
  renderCharJobsList();
  applySettingsLive();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ★ modal drag — ลากย้าย modal โดยจับที่ header
(function() {
  const header = document.getElementById('modal-header');
  const modal = document.getElementById('settings-modal');
  if (!header || !modal) return;
  let dragging = false, startX, startY, origLeft, origTop;
  header.addEventListener('mousedown', (e) => {
    // ไม่ drag ถ้าคลิกที่ปุ่ม
    if (e.target.tagName === 'BUTTON') return;
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = modal.getBoundingClientRect();
    origLeft = rect.left;
    origTop = rect.top;
    // ยกเลิก transform (กัน centering รบกวน)
    modal.style.transform = 'none';
    modal.style.left = origLeft + 'px';
    modal.style.top = origTop + 'px';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    let nx = origLeft + (e.clientX - startX);
    let ny = origTop + (e.clientY - startY);
    // จำกัดไม่ให้ออกจอ
    nx = Math.max(0, Math.min(nx, window.innerWidth - 100));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 60));
    modal.style.left = nx + 'px';
    modal.style.top = ny + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; });
})();

function closeSettingsModal() {
  document.getElementById('settings-overlay').classList.remove('active');
  const modal = document.getElementById('settings-modal');
  modal.classList.remove('active');
  // ★ reset position กลับกึ่งกลาง (ครั้งต่อไปที่เปิด)
  modal.style.transform = 'translateX(-50%)';
  modal.style.left = '';
  modal.style.top = '60px';
  modalWidgetId = null;
  // ★ ASK demo ค้างอยู่ → หยุดอัตโนมัติ (กันลืมปิดจน demo ค้างบน Overlay OBS)
  if (typeof _askDemoMode !== 'undefined' && _askDemoMode !== 'off') {
    askDemoToggle(_askDemoMode);
  }
}

// ★ อ่านค่าจาก modal fields → เขียนลง widget config (ใช้ทั้งใน live update + save)
function readModalFields(w) {
  const get = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
  const getNum = (id, def) => { const v = get(id); return v !== null ? parseFloat(v) : def; };
  const getChecked = (id) => { const el = document.getElementById(id); return el ? el.checked : true; };

  // ★ content opacity — อ่านจาก slider (ใช้ได้ทุก widget type ยกเว้น clock)
  //    clock ใช้ style_opacity/theme_opacity แยกกันตามโหมด
  if (w.type !== 'clock' && get('f-content_opacity') !== null) {
    w.content_opacity = getNum('f-content_opacity', 100) / 100;
  }

  if (w.type === 'alert') {
    w.url = get('f-url') || '';
  } else if (w.type === 'clock') {
    // ★ อ่าน clock_mode จาก radio — ถ้าเลือก Theme → clear clock_style
    const modeRadio = document.querySelector('input[name="clock_mode"]:checked');
    const clockMode = modeRadio ? modeRadio.value : 'theme';
    if (clockMode === 'theme') {
      w.clock_style = 'none'; // ★ clear style เมื่อใช้ Theme
    } else {
      w.clock_style = get('f-clock_style') || 'none';
    }
    // ★ opacity แยกตามโหมด — Style ใช้ style_opacity, Theme ใช้ theme_opacity
    if (get('f-style_opacity') !== null) {
      w.style_opacity = getNum('f-style_opacity', 100) / 100;
    }
    if (get('f-theme_opacity') !== null) {
      w.theme_opacity = getNum('f-theme_opacity', 100) / 100;
    }
    w.clock_format = get('f-clock_format') || 'HH:MM';
    w.clock_theme = get('f-clock_theme') || 'default';
    w.show_date = getChecked('f-show_date');
    w.date_format = get('f-date_format') || 'short';
    w.date_lang = get('f-date_lang') || 'th';
    w.date_font_size = getNum('f-date_font_size', 14);
    w.date_color = get('f-date_color') || '#cccccc';
    w.time_color = get('f-time_color') || '#ffffff';
    w.font_size = getNum('f-font_size', 28);
  } else if (w.type === 'ask') {
    // ★ ASK — ต้องอยู่ branch ของตัวเอง (เคยแทรกพลาดใน viewer branch → ค่าไม่เซฟ!)
    if (get('f-ask_bar_style') !== null) w.ask_bar_style = get('f-ask_bar_style') || 'classic';
    if (get('f-ask_frame_style') !== null) w.ask_frame_style = get('f-ask_frame_style') || 'classic';
    if (get('f-ask_countdown_style') !== null) w.ask_countdown_style = get('f-ask_countdown_style') || 'text';
    if (get('f-ask_layout') !== null) {
      const _lay = get('f-ask_layout') || 'vertical';
      if (_lay === 'vertical') {
        // ★ เสาแนวตั้ง — ฝั่งมาจาก select แยก (เก็บเป็น vleft/vright ใน config เหมือนเดิม)
        w.ask_layout = (get('f-ask_side') === 'left') ? 'vleft' : 'vright';
      } else {
        w.ask_layout = _lay;
      }
    }
    if (get('f-ask_extend_pct') !== null) w.ask_extend_pct = Math.max(20, Math.min(30, getNum('f-ask_extend_pct', 20)));
    if (get('f-ask_anchor') !== null) w.ask_anchor = get('f-ask_anchor') || 'top';
    if (get('f-ask_min_width') !== null) w.ask_min_width = getNum('f-ask_min_width', 340);

    if (get('f-ask_theme') !== null) w.ask_theme = get('f-ask_theme') || 'violet';

    if (get('f-ask_anim_in') !== null) w.ask_anim_in = get('f-ask_anim_in') || 'fade';
    if (get('f-ask_anim_out') !== null) w.ask_anim_out = get('f-ask_anim_out') || 'fade';
    if (get('f-ask_anim_in_ms') !== null) w.ask_anim_in_ms = getNum('f-ask_anim_in_ms', 1200);

        w.show_timestamp = getChecked('f-show_timestamp');
        const _dir = document.querySelector('input[name="f-direction"]:checked');
        if (_dir) w.direction = _dir.value;
        const _al = document.querySelector('input[name="f-chat_align"]:checked');
        if (_al) w.chat_align = _al.value;
        // ★ Default = บรรทัดเดียวเท่านั้น + ไม่มีกล่อง / Theme = layout เลือกได้ + มีกล่อง
        if (_m === 'default') { w.layout = 'inline'; w.box_enabled = false; }
        if (_m === 'theme')   { w.layout = get('f-layout') || 'inline'; w.box_enabled = true; }
      }

      w.character_show_logo = getChecked('f-character_show_logo');
    }
  }

  // ★ Common size & position (ทุก widget type)
  if (get('f-w-width') !== null) {
    const newW = Math.max(20, parseInt(get('f-w-width')) || w.w);
    const newH = Math.max(20, parseInt(get('f-w-height')) || w.h);
    w.w = newW;

    w.y = parseInt(get('f-w-y'));

    if (w.lock_ratio && newH > 0) {
      w._lock_ratio = newW / newH;
    } else if (!w.lock_ratio) {
      delete w._lock_ratio;
    }
    // ★ sync ลง config.widgets ด้วย (resize handler อ่านจาก getWidgetRef)
    var wIdx = config.widgets.findIndex(function(x) { return x.id === w.id; });
    if (wIdx >= 0) {
      config.widgets[wIdx].lock_ratio = w.lock_ratio;
      if (w._lock_ratio) config.widgets[wIdx]._lock_ratio = w._lock_ratio;
      else delete config.widgets[wIdx]._lock_ratio;
    }
  }
  // ★ widget_scale — หด/ขยาย widget ทั้งอัน (live update)
  if (get('f-widget_scale') !== null) {
    w.widget_scale = getNum('f-widget_scale', 1.0);

function saveSettingsModal() {
  if (!modalWidgetId) return;
  const w = config.widgets.find(x => x.id === modalWidgetId);
  if (!w) return;
  readModalFields(w);
  _markLocalEdit();
  saveLayoutDebounced();   // persist ลง server
  closeSettingsModal();
  renderAll();
}

// ★ live preview — เปลี่ยนค่าใน modal → apply ทันที + debounced save
let _liveSaveTimer = null;
// ★ applySettingsLive แบบ debounce — กัน renderAll รัวๆ ตอนพิมพ์ (ทำให้ modal กระตุก)
//    พิมพ์เร็วๆ → รอ 250ms หยุดพิมพ์ค่อย render ครั้งเดียว
let _liveRenderTimer = null;
// ★ live preview ทุกช่อง + เปิด/ปิดกลุ่ม [] (checkbox เปิดถึงเห็นลูก)
(function bindModalLivePreview() {
  const mf = document.getElementById('modal-fields');
  if (!mf) return;
  mf.addEventListener('input', () => applySettingsLive());
  mf.addEventListener('change', (e) => {
    // ★ กลุ่ม [] — toggle ตาม checkbox ที่ผูกไว้ (data-grp ตรง id)
    if (e.target && e.target.id) {
      const g = mf.querySelector('[data-grp="' + e.target.id + '"]');
      if (g) g.style.display = e.target.checked ? '' : 'none';
    }
    applySettingsLive();
  });
})();

function applySettingsLive() {
  if (!modalWidgetId) return;
  if (_liveRenderTimer) clearTimeout(_liveRenderTimer);
  _liveRenderTimer = setTimeout(() => {
    _liveRenderTimer = null;
    const w = config.widgets.find(x => x.id === modalWidgetId);
    if (!w) return;
    readModalFields(w);
    renderAll();
    // re-select widget หลัง render (เพราะ renderAll สร้าง element ใหม่)
    selectWidget(modalWidgetId);
    // debounced save — เหมือน settings auto-save ของแอป
    saveLayoutDebounced();
  }, 250);
}

// ★ บังคับเซฟทันทีก่อนปิดหน้า (กัน auto-save debounce ค้างทำให้ข้อมูลหาย)
window.addEventListener('beforeunload', () => {
  if (_liveSaveTimer) {
    clearTimeout(_liveSaveTimer);
    _liveSaveTimer = null;
    const _jobs = (config.character_jobs || []).filter(j => j.image);
    const snap = JSON.stringify({
      widgets: config.widgets,
      canvas_size: config.canvas_size,
      character_jobs: _jobs,
      character_default_image: config.character_default_image || ''
    });
    navigator.sendBeacon('/save?t=' + Date.now(), new Blob([snap], {type: 'application/json'}));
  }
});

function saveLayoutDebounced() {
  if (_liveSaveTimer) clearTimeout(_liveSaveTimer);
  // ★ snapshot ค่าตอนนี้ (กัน WS push config ทับก่อน POST ส่งออก)
  // ★ Job ที่ไม่มีรูป = ไม่ถูกบันทึก (ตามสเปก Character Talk)
  const _jobsToSave = (config.character_jobs || []).filter(j => j.image);
  if ((config.character_jobs || []).length !== _jobsToSave.length) {
    // แจ้งเตือนเบาๆ ใน list (ไม่ block การเซฟส่วนอื่น)
    console.warn('[CharJobs] ข้าม ' + ((config.character_jobs || []).length - _jobsToSave.length) + ' job ที่ไม่มีรูป');
  }
  const snapshot = JSON.parse(JSON.stringify({
    widgets: config.widgets,
    canvas_size: config.canvas_size,
    character_jobs: _jobsToSave,
    character_default_image: config.character_default_image || ''
  }));
  _liveSaveTimer = setTimeout(() => {
    fetch('/save?t=' + Date.now(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(snapshot),
    }).catch(() => {});
  }, 200);
}

// ★ Export Profile — ดาวน์โหลด layout เป็นไฟล์ JSON
document.getElementById('btn-export-profile').onclick = () => {
  fetch('/export-profile')
    .then(r => r.json())
    .then(data => {
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const now = new Date();
      const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
      a.download = `composer-profile_${ts}.json`;
      a.click();
      URL.revokeObjectURL(url);
    })
    .catch(e => alert('Export ไม่สำเร็จ: ' + e));
};

// ★ Import Profile — โหลด layout จากไฟล์ JSON
document.getElementById('btn-import-profile').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.widgets) { alert('ไฟล์ไม่ถูกต้อง — ไม่มี widgets'); return; }
        fetch('/import-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
        .then(r => r.json())
        .then(result => {
          if (result.ok) {
            // ★ reload page เพื่อ render layout ใหม่
            location.reload();
          } else {
            alert('Import ไม่สำเร็จ: ' + (result.error || 'unknown'));
          }
        })
        .catch(e => alert('Import ไม่สำเร็จ: ' + e));
      } catch (e) {
        alert('ไฟล์ไม่ถูกต้อง: ' + e);
      }
    };
    reader.readAsText(file);
  };
  input.click();
};

// ★ wheel zoom (Ctrl + scroll) — เหมือน Figma/Photoshop
document.getElementById('canvas').addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;   // ต้องกด Ctrl + scroll (กัน scroll ปกติ)
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  zoomLevel = Math.max(0.1, Math.min(2.0, Math.round((zoomLevel + delta) * 10) / 10));
  applyZoom();
}, { passive: false });

// ════════════════════════════════════════════════════════════
document.getElementById('preview-toggle-btn').onclick = () => {
  const btn = document.getElementById('preview-toggle-btn');
  const isPreview = document.body.classList.toggle('preview-mode');
  if (isPreview) {
    btn.textContent = '✏️ แก้ไข';
    btn.classList.add('active');
  } else {
    btn.textContent = '👁 Preview';
    btn.classList.remove('active');
  }
};

// ════════════════════════════════════════════════════════════
// Keyboard nudge — ขยับ widget ด้วยปุ่มลูกศร (1px / Shift = 20px)
// ════════════════════════════════════════════════════════════
if (isEditor) {
  document.addEventListener('keydown', (e) => {
    // ★ ข้ามถ้ากำลังพิมพ์ใน input/textarea/select หรือ modal เปิดอยู่
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    const modal = document.getElementById('settings-modal');
    if (modal && modal.classList.contains('active')) return;
    // ★ ข้ามถ้าไม่มี widget ที่เลือก
    if (!selectedWidget) return;
    const arrows = { ArrowLeft: true, ArrowRight: true, ArrowUp: true, ArrowDown: true };
    if (!arrows[e.key]) return;
    e.preventDefault();
    const step = e.shiftKey ? 20 : 1;
    const w = config.widgets.find(x => x.id === selectedWidget);
    if (!w) return;
    if (e.key === 'ArrowLeft') w.x = Math.max(0, w.x - step);
    else if (e.key === 'ArrowRight') w.x = Math.min(config.canvas_w - w.w, w.x + step);
    else if (e.key === 'ArrowUp') w.y = Math.max(0, w.y - step);
    else if (e.key === 'ArrowDown') w.y = Math.min(config.canvas_h - w.h, w.y + step);
    // ★ อัปเดต DOM ทันที (ไม่รอ renderAll)
    const el = document.querySelector(`.widget[data-id="${selectedWidget}"]`);
    if (el) { el.style.left = w.x + 'px'; el.style.top = w.y + 'px'; }
    saveLayoutDebounced();
  });
}

// ════════════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════════════
if (isEditor) {
  document.body.classList.add('edit-mode');
} else {
  // ★ overlay mode (OBS) — ซ่อน editor UI ทั้งหมด (กัน cache ค้าง)
  const previewBtn = document.getElementById('preview-toggle-btn');
  if (previewBtn) previewBtn.style.display = 'none';
}
// โหลด config ครั้งแรก
fetch('/config').then(r => r.json()).then(c => {
  config = c;
  renderAll();
  // ★ editor mode → auto fit หลังโหลด (กัน canvas ใหญ่เกิน viewport)
  if (isEditor) setTimeout(zoomFit, 100);
}).catch(() => { renderAll(); });
connectWs();
// ★ overlay mode (OBS) — auto-fetch config เป็น backup (กรณี WS push ไม่ถึง)
//   ★ poll เร็ว 700ms — ให้การย้าย widget ใน editor ตามทันเกือบทันที (เดิม 2s ช้าเกิน)
//     ปลอดภัยต่อ animation เพราะมี hash check + signature diff (render เฉพาะที่หน้าตาเปลี่ยน)
//   ★ พร้อมเช็ค WS health — ถ้า WS หลุดกลางคัน เชื่อมใหม่ทันที (กัน "บางทีนิ่งไปเลย ต้องกดรีเฟรช")
if (!isEditor) {
  let _lastConfigHash = '';
  let _wsReconnectTries = 0;
  setInterval(() => {
    // ★ WS health — readyState 1 = OPEN; ถ้าไม่ → เชื่อมใหม่ (จำกัด 10 ครั้ง/ช่วง กัน loop รัว)
    if (typeof ws !== 'undefined' && ws && ws.readyState !== 1 && _wsReconnectTries < 10) {
      _wsReconnectTries++;
      try { connectWs(); } catch (e) {}
    } else if (ws && ws.readyState === 1) {
      _wsReconnectTries = 0;
    }
    fetch('/config?t=' + Date.now()).then(r => r.json()).then(c => {
      const hash = JSON.stringify(c);
      if (hash === _lastConfigHash) return;
      _lastConfigHash = hash;
      config = c;
      renderAll();
    }).catch(() => {});
  }, 700);
}
</script>
</body>
</html>
