<script>
// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
let config = {
  canvas_size: '1080p',
  canvas_w: 1920,
  canvas_h: 1080,
  widgets: [],
  font_family: 'Kanit',
};
let isEditor = new URLSearchParams(location.search).has('edit');
let selectedWidget = null;
let ws = null;

// ★ SVG ไอคอนคน (ใช้แทน emoji 👥 เพื่อให้ขนาด = iconSize เสมอ — เท่ากับไอคอนแพลตฟอร์ม)
// ประกาศไว้บนสุดเพราะใช้ในหลายฟังก์ชัน (renderWidgetContent + handleViewers)
const PEOPLE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
  <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
</svg>`;
// ★ helper: สร้าง <span> ไอคอนคน ด้วยขนาดที่กำหนด
function peopleIconSpan(iconSize) {
  return `<span style="display:inline-flex;align-items:center;width:${iconSize}px;height:${iconSize}px;flex-shrink:0;">${PEOPLE_ICON_SVG}</span>`;
}

// ════════════════════════════════════════════════════════════
// WebSocket — รับ config + message + viewers จาก server
// ════════════════════════════════════════════════════════════
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => {
    try { ws.send(JSON.stringify({type: 'hello', edit: isEditor})); } catch(e){}
  };
  ws.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch(e) { return; }
    if (data.type === 'config') {
      // ★ ถ้า modal settings เปิดอยู่ → ข้าม config push (กันทับค่าที่ user กำลังแก้)
      //    server จะ push ใหม่อีกครั้งหลัง modal ปิด + save
      const modalOpen = document.getElementById('settings-modal');
      if (modalOpen && modalOpen.classList.contains('active')) {
        return;   // ★ ข้าม — กันทับค่าที่กำลังแก้
      }
      // ★ ถ้ากำลัง drag/resize → อย่าทับ config (กัน widget หดกลับระหว่าง操作)
      //    เก็บ position/size ปัจจุบันไว้ + merge ค่าอื่นๆ จาก server
      if (_isDragging || _isResizing) {
        // เก็บ widget position/size ปัจจุบัน (ที่ผู้ใช้กำลัง drag/resize)
        const currentWidgets = {};
        (config.widgets || []).forEach(w => {
          currentWidgets[w.id] = { x: w.x, y: w.y, w: w.w, h: w.h };
        });
        // รับ config ใหม่ แต่คง position/size ปัจจุบันไว้
        config = data.config;
        (config.widgets || []).forEach(w => {
          if (currentWidgets[w.id]) {
            w.x = currentWidgets[w.id].x;
            w.y = currentWidgets[w.id].y;
            w.w = currentWidgets[w.id].w;
            w.h = currentWidgets[w.id].h;
          }
        });
        // ข้าม renderAll (กัน widget กระตุก)
        if (modalWidgetId) {
          if (typeof renderCharJobsList === 'function') renderCharJobsList();
          if (typeof renderDefaultImagePreview === 'function') renderDefaultImagePreview();
        }
      } else {
        // ปกติ → แทนที่ config + renderAll
        config = data.config;
        renderAll();
        if (modalWidgetId) {
          if (typeof renderCharJobsList === 'function') renderCharJobsList();
          if (typeof renderDefaultImagePreview === 'function') renderDefaultImagePreview();
        }
      }
    } else if (data.type === 'message') {
      handleChatMessage(data.message);
    } else if (data.type === 'viewers') {
      handleViewers(data);
    } else if (data.type === 'now_playing') {
      handleNowPlaying(data);
    } else if (data.type === 'emote_party') {
      handleEmoteParty(data.emotes || []);
    } else if (data.type === 'eval_js') {
      try { eval(data.js); } catch(e) {}
    }
  };
  // ★ WS reconnect — ถ้าล้มเหลวเกิน 3 ครั้ง (server ปิด) → reload ทั้งหน้า
  let _wsFailCount = 0;
  ws.onclose = () => {
    _wsFailCount++;
    if (_wsFailCount > 3) {
      // server ปิด → reload หน้า (จะได้เชื่อมใหม่ + โหลด HTML ใหม่)
      setTimeout(() => location.reload(), 2000);
      return;
    }
    setTimeout(connectWs, 1500);
  };
  ws.onopen = () => {
    _wsFailCount = 0;   // reset counter เมื่อเชื่อมสำเร็จ
    // ★ ขอ now playing state ล่าสุด (กัน Now Playing หายตอน refresh composer)
    fetch('/now-playing-state').then(r => r.json()).then(data => {
      if (data && data.title && !_lastNowPlayingData.title) {
        handleNowPlaying(data);
      }
    }).catch(() => {});
  };
}

// ════════════════════════════════════════════════════════════
// Render — สร้าง widget ทั้งหมดบน canvas
// ════════════════════════════════════════════════════════════
// ★ zoom state — ย่อ/ขยาย "ทั้งกรอบ canvas" ด้วย transform: scale() + width/height
let zoomLevel = 1.0;

function applyZoom() {
  const outer = document.getElementById('canvas-outer');
  const wrap = document.getElementById('canvas-wrap');
  if (!outer || !wrap) return;
  // ★ outer = กล่องที่มีขนาจริงตาม scale (เป็นตัวแทนใน layout flow → flex center)
  const scaledW = Math.round(config.canvas_w * zoomLevel);
  const scaledH = Math.round(config.canvas_h * zoomLevel);
  outer.style.width = scaledW + 'px';
  outer.style.height = scaledH + 'px';
  // ★ wrap = กรอบหน้ากระดาษจริง (ขนาดเต็ม) + scale ทั้งใบ (absolute ใน outer)
  wrap.style.width = config.canvas_w + 'px';
  wrap.style.height = config.canvas_h + 'px';
  wrap.style.transform = `scale(${zoomLevel})`;
  const lbl = document.getElementById('zoom-level');
  if (lbl) lbl.textContent = Math.round(zoomLevel * 100) + '%';
}

function zoomFit() {
  // ★ fit canvas ทั้งกรอบให้พอดี viewport (เห็นขอบทั้ง 4 ด้าน)
  const canvasEl = document.getElementById('canvas');
  const vw = canvasEl.clientWidth - 40;   // หัก padding 20px×2
  const vh = canvasEl.clientHeight - 40;
  const sx = vw / config.canvas_w;
  const sy = vh / config.canvas_h;
  zoomLevel = Math.min(sx, sy, 1.0);
  // ปัดเศษเป็น 5%
  zoomLevel = Math.max(0.1, Math.round(zoomLevel * 20) / 20);
  applyZoom();
}

function renderAll() {
  const wrap = document.getElementById('canvas-wrap');
  // ★ editor mode: canvas-wrap เป็น relative container ของ widget (position absolute)
  wrap.style.position = 'relative';
  if (isEditor) {
    document.getElementById('canvas-size').value = config.canvas_size;
  }

  // ★ smart render — ไม่ล้างทั้งหมด (กัน chat widget iframe reload → แชทหาย)
  // 1. หา widget ที่มีอยู่แล้ว → update style/position + re-bind drag/resize (w reference เปลี่ยน)
  // 2. widget ใหม่ → create
  // 3. widget ที่ถูกลบ → remove
  const existingIds = new Set();
  config.widgets.forEach(w => {
    if (!w.enabled) return;
    const existing = wrap.querySelector(`.widget[data-id="${w.id}"]`);
    if (existing) {
      // ★ update + re-bind drag/resize (เพราะ w reference เปลี่ยนทุกครั้งที่ config = data.config)
      updateWidgetElement(existing, w);
      if (isEditor) rebindDragResize(existing, w);
      existingIds.add(w.id);
    } else {
      // สร้างใหม่
      const el = createWidgetElement(w);
      wrap.appendChild(el);
      existingIds.add(w.id);
    }
  });
  // ลบ widget ที่ไม่อยู่ใน config แล้ว
  wrap.querySelectorAll('.widget').forEach(el => {
    if (!existingIds.has(el.dataset.id)) el.remove();
  });

  applyZoom();   // ★ applyZoom จะตั้ง width/height/transform ทั้งหมด
  renderLayersList();  // ★ sync layers panel ทุกครั้งที่ render
}

// ★ update widget ที่มีอยู่แล้ว — เปลี่ยน style/position + className (theme) (ไม่ re-create content)
function updateWidgetElement(el, w) {
  // ★ อัปเดต widget reference (ใช้ใน enableDrag/enableResize ผ่าน el._widgetRef)
  el._widgetRef = w;
  // ★ อัปเดต className (เพื่อ refresh theme class — clock-theme-*, viewer-theme-*)
  const classes = [`widget`, `type-${w.type}`];
  if (w.type === 'chat') {
    const layout = w.layout || 'inline';
    if (layout === 'stacked' || layout === 'stacked_no_logo') classes.push('layout-stacked');
    classes.push('dir-' + (w.direction || 'bottom'));
    classes.push('anim-' + (w.animation || 'fade'));
  }
  if (w.type === 'clock') classes.push('clock-theme-' + (w.clock_theme || 'default'));
  if (w.type === 'viewer') {
    classes.push('viewer-theme-' + (w.viewer_theme || 'default'));
    classes.push('viewer-align-' + (w.viewer_align || 'left'));
    classes.push('viewer-direction-' + (w.viewer_direction || 'horizontal'));
  }
  if (w.type === 'image') {
    classes.push('tr-' + (w.transition || 'fade'));
  }
  if (w.type === 'webcam') {
    classes.push('webcam-theme-' + (w.webcam_theme || 'simple-white'));
    classes.push('ratio-' + (w.webcam_ratio || '16:9').replace(':', '-'));
  }
  if (w.type === 'text') {
    classes.push('text-' + (w.text_mode || 'static'));
  }
  // เก็บ class 'selected' ไว้ (กันปุ่ม delete/settings/resize หายตอน smart render)
  if (el.classList.contains('selected')) classes.push('selected');
  el.className = classes.join(' ');
  // position/size/opacity — แต่ถ้ากำลัง drag/resize widget นี้ → ข้าม (คงค่าปัจจุบัน)
  const isInteracting = (el._isDragging || el._isResizing);
  if (!isInteracting) {
    el.style.left = w.x + 'px';
    el.style.top = w.y + 'px';
    el.style.width = w.w + 'px';
    // ★ webcam widget — height คำนวณจาก width + ratio (บังคับสัดส่วน)
    if (w.type === 'webcam') {
      el.style.height = computeRatioHeight(w.w, w.webcam_ratio) + 'px';
    } else {
      el.style.height = w.h + 'px';
    }
    el.style.zIndex = w.z || 1;
    el.style.opacity = (w.alpha != null ? w.alpha : 1.0);
    // ★ content opacity — โปร่งใสเฉพาะเนื้อหาภายใน (ไม่กรอบ/ปุ่ม)
    const _inner = el.querySelector('.widget-inner');
    if (_inner) _inner.style.opacity = (w.content_opacity != null ? w.content_opacity : 1.0);
  }
  // ★ chat widget → อย่า re-create iframe (config update ผ่าน WS ไป iframe อยู่แล้ว)
  //    ยกเว้น overlay_version เปลี่ยน (overlay.html ถูกแก้) → reload iframe ใหม่ทันที
  if (w.type === 'chat') {
    const iframe = el.querySelector('.widget-inner iframe');
    if (iframe) {
      const newVer = config.overlay_version || 0;
      const curVer = iframe.dataset.overlayVersion || 0;
      if (newVer && curVer && newVer != curVer) {
        // ★ overlay.html เปลี่ยน → reload iframe (เพื่อโหลด CSS/JS ใหม่)
        iframe.dataset.overlayVersion = newVer;
        iframe.src = `/chat-widget?id=${encodeURIComponent(w.id)}&_v=${newVer}&_t=${Date.now()}`;
      }
    }
    return;
  }
  // ★ image widget → อย่า re-create slides (กัน slideshow restart/flicker)
  //    อัปเดตเฉพาะเมื่อ images list / interval / fit mode / shuffle เปลี่ยน
  if (w.type === 'image') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      // เช็คว่า config เปลี่ยนไหน → re-setup เฉพาะเมื่อจำเป็น
      const sig = JSON.stringify({
        imgs: (w.images || []).map(i => i.id),
        iv: w.slide_interval, unit: w.slide_interval_unit,
        fit: w.fit_mode, shuf: w.shuffle, tr: w.transition
      });
      if (inner.dataset.imgSig !== sig) {
        inner.dataset.imgSig = sig;
        setupImageWidget(inner, w);
      }
    }
    return;
  }
  // ★ playroom widget → อย่า re-create iframe (กัน video reload กลางคัน)
  //    ยกเว้นเมื่อ color key config เปลี่ยน → ต้อง reload iframe เพื่ออ่าน ck params ใหม่
  if (w.type === 'playroom') {
    const iframe = el.querySelector('iframe');
    if (iframe) {
      const expectedSrc = buildPlayroomSrc(w).split('&_t=')[0];  // ไม่นับ timestamp
      const currentSrc = (iframe.src || '').split('&_t=')[0].replace(/&ck=[^&]*/g, '').replace(/&ck_color=[^&]*/g, '').replace(/&ck_sim=[^&]*/g, '').replace(/&ck_smooth=[^&]*/g, '');
      // ★ เปรียบเทียบเฉพาะ ck params (ถ้าเปลี่ยน → reload iframe)
      const ckSig = JSON.stringify({ ck: w.ck_enabled, color: w.ck_color, sim: w.ck_similarity, smooth: w.ck_smoothness });
      if (iframe.dataset.ckSig !== ckSig) {
        iframe.dataset.ckSig = ckSig;
        iframe.src = buildPlayroomSrc(w);
      }
    }
    return;
  }
  // ★ webcam widget → re-render เฉพาะเมื่อ ratio/theme เปลี่ยน (กัน flicker)
  if (w.type === 'webcam') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      const sig = JSON.stringify({ ratio: w.webcam_ratio, theme: w.webcam_theme, bw: w.webcam_border_width });
      if (inner.dataset.wcSig !== sig) {
        inner.dataset.wcSig = sig;
        while (inner.firstChild) inner.removeChild(inner.firstChild);
        setupWebcamFrame(inner, w);
      }
    }
    return;
  }
  // ★ text widget → re-setup เฉพาะเมื่อ content/mode/interval/font เปลี่ยน
  if (w.type === 'text') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      const sig = JSON.stringify({
        content: w.text_content, mode: w.text_mode,
        iv: w.text_interval, unit: w.text_interval_unit,
        speed: w.text_scroll_speed,
        fs: w.font_size, fc: w.font_color, fw: w.font_weight,
        ts: w.text_stroke, tsc: w.text_stroke_color, tsw: w.text_stroke_width,
        tsh: w.text_shadow, tshc: w.text_shadow_color, tshb: w.text_shadow_blur,
        align: w.text_align, ff: config.font_family
      });
      if (inner.dataset.textSig !== sig) {
        inner.dataset.textSig = sig;
        setupTextWidget(inner, w);
      } else {
        // font/style เหมือนเดิม → apply เฉพาะ style (position อาจเปลี่ยน)
        applyWidgetStyle(inner, w);
      }
    }
    return;
  }
  // ★ video widget → re-render เฉพาะเมื่อ URL เปลี่ยน (กัน video reload กลางคัน)
  if (w.type === 'video') {
    const inner = el.querySelector('.widget-inner');
    if (inner) {
      const sig = JSON.stringify({ url: w.video_url });
      if (inner.dataset.videoSig !== sig) {
        inner.dataset.videoSig = sig;
        setupVideoWidget(inner, w);
      }
    }
    return;
  }
  // clock/viewer/alert → re-create content (เป็น native element ไม่มี reload issue)
  //    แต่ ★ viewer ต้องเก็บ state (ยอดคนดูล่าสุด) — ถ้า re-create ทุกครั้ง ยอดจะหาย
  //    เลย re-create เฉพาะเมื่อ signature เปลี่ยน (theme/align/mode/icon/iconsize)
  //    ถ้าไม่เปลี่ยน → อัปเดตเฉพาะ style (font-size ฯลฯ) ไม่ล้างเนื้อหา
  const inner = el.querySelector('.widget-inner');
  if (inner) {
    if (w.type === 'viewer') {
      const sig = JSON.stringify({
        mode: w.viewer_mode, theme: w.viewer_theme, align: w.viewer_align,
        direction: w.viewer_direction,
        icon: w.viewer_show_icon, iconSize: w.viewer_icon_size,
        fontFamily: config.font_family, fs: w.font_size, fc: w.font_color
      });
      if (inner.dataset.viewerSig !== sig) {
        inner.dataset.viewerSig = sig;
        while (inner.firstChild) inner.removeChild(inner.firstChild);
        renderWidgetContent(inner, w);
      }
      applyWidgetStyle(inner, w);
    } else {
      while (inner.firstChild) inner.removeChild(inner.firstChild);
      renderWidgetContent(inner, w);
      applyWidgetStyle(inner, w);
    }
  }
}

// ════════════════════════════════════════════════════════════
// Image & Slideshow widget — setup + slideshow loop
// ════════════════════════════════════════════════════════════

// ★ แปลง interval + unit → milliseconds
function computeSlideIntervalMs(interval, unit) {
  const n = Math.max(1, parseInt(interval) || 10);
  if (unit === 'minutes') return n * 60 * 1000;
  if (unit === 'hours') return n * 60 * 60 * 1000;
  return n * 1000; // seconds (default)
}

// ★ setup image widget: สร้าง slides + เริ่ม slideshow loop
function setupImageWidget(inner, w) {
  // clear เก่า + clear timer
  if (inner._slideTimer) { clearInterval(inner._slideTimer); inner._slideTimer = null; }
  while (inner.firstChild) inner.removeChild(inner.firstChild);

  const images = w.images || [];
  if (images.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'image-empty';
    empty.textContent = isEditor ? '📷 ยังไม่มีรูป — คลิก ⚙ เพื่ออัปโหลด' : '';
    inner.appendChild(empty);
    return;
  }

  const fitMode = w.fit_mode || 'cover';
  // ★ shuffle: สุ่มลำดับ (เก็บ original ไว้)
  let imgList = images.slice();
  if (w.shuffle) {
    for (let i = imgList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [imgList[i], imgList[j]] = [imgList[j], imgList[i]];
    }
  }

  // ★ สร้าง <img> slides ทั้งหมด (preload + cache-bust)
  const slides = imgList.map(img => {
    const el = document.createElement('img');
    el.className = 'slide';
    el.src = `/widget-image/${encodeURIComponent(w.id)}/${encodeURIComponent(img.id)}?t=${Date.now()}`;
    el.style.objectFit = fitMode;
    el.draggable = false;
    return el;
  });
  slides.forEach(s => inner.appendChild(s));

  // ★ slide counter (editor only)
  let counterEl = null;
  if (isEditor) {
    counterEl = document.createElement('div');
    counterEl.className = 'slide-counter';
    inner.appendChild(counterEl);
  }

  // ★ single image → ไม่ต้อง slideshow
  if (slides.length === 1) {
    slides[0].classList.add('active');
    if (counterEl) counterEl.textContent = '1/1';
    return;
  }

  // ★ slideshow loop
  let currentIdx = 0;
  slides[0].classList.add('active');
  if (counterEl) counterEl.textContent = `1/${slides.length}`;

  const intervalMs = computeSlideIntervalMs(w.slide_interval, w.slide_interval_unit);
  const transition = w.transition || 'fade';
  inner._slideTimer = setInterval(() => {
    const prev = slides[currentIdx];
    const nextIdx = (currentIdx + 1) % slides.length;
    const next = slides[nextIdx];
    // ★ transition: สลับ active class (CSS จัดการ animation)
    //    สำหรับ slide-* transitions → ต้องมี exiting class ชั่วคราว
    if (transition.startsWith('slide-')) {
      prev.classList.add('exiting');
      next.classList.add('active');
      // ลบ exiting หลัง transition จบ (0.6s)
      setTimeout(() => prev.classList.remove('active', 'exiting'), 650);
    } else {
      prev.classList.remove('active');
      next.classList.add('active');
    }
    currentIdx = nextIdx;
    if (counterEl) counterEl.textContent = `${nextIdx + 1}/${slides.length}`;
  }, intervalMs);
}

// ════════════════════════════════════════════════════════════
// Webcam Frame widget — กรอบตกแต่งล้วน (ไม่มี video)
// ════════════════════════════════════════════════════════════

// ★ คำนวณ height จาก width + ratio (บังคับสัดส่วน)
function computeRatioHeight(width, ratio) {
  const w = parseInt(width) || 480;
  if (ratio === '1:1') return w;           // 1:1 → height = width
  if (ratio === '4:3') return Math.round(w * 3 / 4);   // 4:3 → height = width * 0.75
  return Math.round(w * 9 / 16);           // 16:9 → height = width * 0.5625
}

function setupWebcamFrame(inner, w) {
  while (inner.firstChild) inner.removeChild(inner.firstChild);
  // ★ ความหนาขอบ — CSS variable ที่ .webcam-frame สืบทอด
  const bw = w.webcam_border_width || 4;
  inner.style.setProperty('--wc-border-width', bw + 'px');
  // ★ กรอบ — CSS theme คุมลวดลาย (webcam-theme-*)
  const frame = document.createElement('div');
  frame.className = 'webcam-frame';
  inner.appendChild(frame);
  // ★ placeholder ตอน editor (บอกว่าวาง webcam ตรงนี้)
  if (isEditor) {
    const ph = document.createElement('div');
    ph.className = 'webcam-placeholder';
    ph.textContent = '📷 วาง Webcam ที่นี่ (ใน OBS)';
    inner.appendChild(ph);
  }
}

// ════════════════════════════════════════════════════════════
// Text widget — static / scroll loop / schedule
// ════════════════════════════════════════════════════════════
function setupTextWidget(inner, w) {
  // clear timer + content
  // ★ clear timer (รองรับทั้ง setInterval สำหรับ schedule + requestAnimationFrame/timeout สำหรับ scroll)
  if (inner._textCleanup) { inner._textCleanup(); inner._textCleanup = null; }
  if (inner._textTimer) {
    clearInterval(inner._textTimer);
    cancelAnimationFrame(inner._textTimer);
    clearTimeout(inner._textTimer);
    inner._textTimer = null;
  }
  while (inner.firstChild) inner.removeChild(inner.firstChild);

  const mode = w.text_mode || 'static';
  const content = w.text_content || '';
  const ff = (config.font_family || 'Kanit');
  const fs = (w.font_size || 24);
  const fc = (w.font_color || '#ffffff');
  const fw = (w.font_weight || '600');
  const align = (w.text_align || 'center');
  // stroke
  const ts = w.text_stroke !== false;
  const tsw = w.text_stroke_width || 2;
  const tsc = w.text_stroke_color || '#000000';
  const strokeStr = ts ? `${tsw}px ${tsc}, 0 0 ${tsw}px ${tsc}` : 'none';
  // shadow
  const tsh = w.text_shadow !== false;
  const tshb = w.text_shadow_blur || 3;
  const tshc = w.text_shadow_color || '#000000';
  const shadowStr = tsh ? `0 1px ${tshb}px ${tshc}` : 'none';

  // ★ inline style (apply ทั้งหมด — กัน theme CSS ทับ)
  const textStyle = `
    font-family: "${ff}", "Leelawadee UI", "Segoe UI", sans-serif;
    font-size: ${fs}px;
    color: ${fc};
    font-weight: ${fw};
    -webkit-text-stroke: ${ts ? `${tsw}px ${tsc}` : '0 transparent'};
    text-shadow: ${tsh ? `0 1px ${tshb}px ${tshc}` : 'none'};
    --text-align: ${align};
  `;
  inner.style.setProperty('--text-align', align);
  // ★ map align → justify-content (flex-start/center/flex-end)
  const justify = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center';
  inner.style.setProperty('--text-justify', justify);

  if (mode === 'scroll') {
    // ★ scroll loop — JS animation (วิ่งซ้ายจนหมดจอ → delay 2s → เริ่มใหม่)
    const el = document.createElement('div');
    el.className = 'text-content';
    el.style.cssText = textStyle;
    el.textContent = content;
    inner.appendChild(el);
    // ★ speed: 1-20 → pixels per frame (speed สูง = เร็ว)
    const speed = w.text_scroll_speed || 10;
    // ★ ใน Editor: canvas ถูก scale ด้วย zoom → ความเร็วดูเร็วกว่าจริง → หารด้วย zoom
    const zoom = (typeof zoomLevel !== 'undefined' && zoomLevel > 0) ? zoomLevel : 1;
    const pxPerFrame = Math.max(0.2, (speed * 0.05) / zoom);
    const delayMs = 2000;   // ★ ดีเลย์ 2 วินาทีหลังข้อความออกจากจอ
    // ★ animation loop — วัดความกว้างจริงหลัง render (double rAF)
    let scrollPos = 0;
    let isPaused = false;
    let animId = null;
    function startScrollLoop() {
      const containerW = inner.offsetWidth || 400;
      // ★ วัด textW จริง — ใช้ scrollWidth เพราะ absolute + nowrap อาจให้ offsetWidth ผิด
      const textW = el.scrollWidth || el.offsetWidth || 200;
      scrollPos = containerW;   // เริ่มที่ขอบขวา (มองไม่เห็น)
      el.style.left = scrollPos + 'px';
      function step() {
        if (isPaused) return;
        scrollPos -= pxPerFrame;
        el.style.left = scrollPos + 'px';
        // ★ ข้อความออกจากจอซ้ายหมดแล้ว = ขอบขวาของข้อความ (left + textW) น้อยกว่า 0
        if (scrollPos + textW <= 0) {
          isPaused = true;
          animId = setTimeout(() => {
            isPaused = false;
            startScrollLoop();
          }, delayMs);
          return;
        }
        animId = requestAnimationFrame(step);
      }
      animId = requestAnimationFrame(step);
    }
    inner._textTimer = animId;
    // ★ double rAF — รอ 2 frames ให้ browser layout เสร็จก่อนวัดความกว้าง
    requestAnimationFrame(() => requestAnimationFrame(() => {
      // เก็บ cleanup function ไว้ใน inner._textCleanup
      inner._textCleanup = () => {
        if (animId) { cancelAnimationFrame(animId); clearTimeout(animId); animId = null; }
      };
      startScrollLoop();
    }));
  } else if (mode === 'schedule') {
    // ★ schedule — หลายข้อความ → สลับตาม interval (เหมือน slideshow)
    const lines = content.split('\n').map(s => s.trim()).filter(s => s);
    if (lines.length === 0) {
      const el = document.createElement('div');
      el.className = 'text-content';
      el.style.cssText = textStyle;
      el.textContent = '📝 พิมพ์ข้อความ (1 บรรทัด = 1 ข้อความ)';
      el.style.color = '#64748b';
      inner.appendChild(el);
      return;
    }
    // สร้างทุกบรรทัด
    lines.forEach((line, i) => {
      const el = document.createElement('div');
      el.className = 'text-line' + (i === 0 ? ' active' : '');
      el.style.cssText = textStyle;
      el.textContent = line;
      inner.appendChild(el);
    });
    // ถ้ามีแค่ 1 บรรทัด → ไม่ต้อง timer
    if (lines.length > 1) {
      let idx = 0;
      const intervalMs = computeSlideIntervalMs(w.text_interval, w.text_interval_unit);
      inner._textTimer = setInterval(() => {
        const allLines = inner.querySelectorAll('.text-line');
        allLines.forEach(l => l.classList.remove('active'));
        idx = (idx + 1) % lines.length;
        if (allLines[idx]) allLines[idx].classList.add('active');
      }, intervalMs);
    }
  } else {
    // ★ static — แสดงข้อความเดียวตรงกลาง
    const el = document.createElement('div');
    el.className = 'text-content';
    el.style.cssText = textStyle;
    el.textContent = content || '📝 Text widget';
    if (!content) el.style.color = '#64748b';
    inner.appendChild(el);
  }
}

// ════════════════════════════════════════════════════════════
// Video widget — <video> loop (webcam frame animation ฯลฯ)
// ════════════════════════════════════════════════════════════
function setupVideoWidget(inner, w) {
  // ★ หยุด color key เดิมก่อน (ถ้ามี)
  stopColorKey(w.id);
  while (inner.firstChild) inner.removeChild(inner.firstChild);
  const url = w.video_url || '';
  if (!url) {
    const empty = document.createElement('div');
    empty.className = 'video-empty';
    empty.textContent = '🎬 ยังไม่มีวิดีโอ — คลิก ⚙ เพื่ออัปโหลด';
    inner.appendChild(empty);
    return;
  }
  const video = document.createElement('video');
  video.className = 'video-player';
  video.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.setAttribute('muted', '');
  inner.appendChild(video);
  // ★ force play (กัน autoplay policy บาง browser)
  video.play().catch(() => {});
  // ★ color key — เริ่มหลัง video พร้อมเล่น
  if (w.ck_enabled) {
    const startCk = () => {
      if (video.readyState >= 1) {
        startColorKey(inner, w);
      } else {
        setTimeout(startCk, 200);
      }
    };
    startCk();
  }
}

// ★ เปิด file picker → upload video
function openVideoPicker(widgetId) {
  const w = config.widgets.find(x => x.id === widgetId);
  if (!w) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/mp4,video/webm,video/quicktime';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      alert('ไฟล์ใหญ่เกิน 50MB — แนะนำให้บีบอัดก่อน');
      return;
    }
    const fd = new FormData();
    fd.append('widget_id', widgetId);
    fd.append('video', file);
    try {
      const r = await fetch('/upload-widget-video', { method: 'POST', body: fd });
      const data = await r.json();
      if (data.ok) {
        w.video_url = data.url;
        applySettingsLive();
      } else {
        alert('อัปโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
      }
    } catch (e) {
      alert('อัปโหลดผิดพลาด: ' + e.message);
    }
  };
  input.click();
}

// ★ re-bind drag/resize โดยใช้ el._widgetRef (เปลี่ยนทุกครั้งที่ config update)
function rebindDragResize(el, w) {
  el._widgetRef = w;
}

// ★ helper: ดึง widget reference ปัจจุบันของ element
function getWidgetRef(el) {
  // หาใน config.widgets (ใหม่ที่สุด)
  const wid = el.dataset.id;
  return config.widgets.find(x => x.id === wid) || el._widgetRef;
}

// ★ render content ของ widget ลง inner (แยกจาก createWidgetElement เพื่อ reuse)
function renderWidgetContent(inner, w) {
  if (w.type === 'chat') {
    // chat widget = iframe (ไม่ render ที่นี่ — อยู่ใน createWidgetElement)
    return;
  } else if (w.type === 'alert' && w.url) {
    const iframe = document.createElement('iframe');
    iframe.src = w.url;
    iframe.allow = 'autoplay; fullscreen';
    // ★ no-referrer: StreamLabs บล็อกการฝังจาก origin อื่นด้วย Referer check
    // → ถ้าส่ง Referer http://localhost มาจะตอบ 404 "page not found"
    // → ใช้ referrerpolicy=no-referrer เพื่อไม่ส่ง Referer เลย จะได้ 200 OK
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    inner.appendChild(iframe);
  } else if (w.type === 'viewer') {
    const iconSize = w.viewer_icon_size || 20;
    const showIcon = w.viewer_show_icon !== false;
    // ★ ถ้ามี viewers data ล่าสุด → re-apply (กันกลับเป็น 👥 0 ตอน re-create)
    if (_lastViewersData) {
      // หา widget id ของ inner นี้
      const widgetEl = inner.closest('.widget');
      const wid = widgetEl ? widgetEl.dataset.id : null;
      if (wid) {
        const wcfg = config.widgets.find(x => x.id === wid);
        if (wcfg) {
          // re-render เฉพาะ widget นี้ด้วย data ล่าสุด
          handleViewers(_lastViewersData);
          return;
        }
      }
    }
    inner.innerHTML = `<span class="viewer-total">${showIcon ? peopleIconSpan(iconSize) : ''}0</span>`;
  } else if (w.type === 'clock') {
    const timeEl = document.createElement('div');
    timeEl.className = 'clock-time';
    timeEl.textContent = '--:--';
    inner.appendChild(timeEl);
    const dateEl = document.createElement('div');
    dateEl.className = 'clock-date';
    dateEl.textContent = '--';
    dateEl.style.display = (w.show_date) ? '' : 'none';
    inner.appendChild(dateEl);
    inner.style.flexDirection = 'column';
    inner.style.gap = '2px';
    updateClock(inner);
  } else if (w.type === 'image') {
    // ★ image widget = native <img> slides + setInterval slideshow (ไม่ใช้ iframe)
    setupImageWidget(inner, w);
  } else if (w.type === 'playroom') {
    // ★ playroom widget = iframe ไปยัง /playroom-widget (serve playroom.html ผ่าน composer)
    // ★ ส่ง widget id ผ่าน URL เพื่อให้ playroom.html ระบุตัวเองใน WS hello (per-widget triggers)
    const iframe = document.createElement('iframe');
    iframe.src = buildPlayroomSrc(w);
    iframe.allow = 'autoplay; fullscreen';
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    iframe.dataset.ckSig = JSON.stringify({ ck: w.ck_enabled, color: w.ck_color, sim: w.ck_similarity, smooth: w.ck_smoothness });
    inner.appendChild(iframe);
  } else if (w.type === 'webcam') {
    // ★ webcam frame = กรอบตกแต่งล้วน (ไม่มี video — user เอา webcam ไปวางใน OBS เอง)
    setupWebcamFrame(inner, w);
  } else if (w.type === 'text') {
    // ★ text widget = native DOM + โหมด static/scroll/schedule
    setupTextWidget(inner, w);
  } else if (w.type === 'video') {
    // ★ video widget = <video> loop (สำหรับ webcam frame animation)
    setupVideoWidget(inner, w);
  } else if (w.type === 'now_playing') {
    // ★ restore ข้อมูลล่าสุดที่มีจริง (ไม่ใช่ placeholder)
    if (_lastNowPlayingData && _lastNowPlayingData.title) {
      updateNowPlayingWidget(inner, _lastNowPlayingData, w.id);
    } else {
      inner.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.4);font-size:13px;">🎵 Now Playing</div>';
    }
  } else if (w.type === 'emote_party') {
    setupEmoteParty(inner, w);
  }
}

function createWidgetElement(w) {
  const el = document.createElement('div');
  // ★ เพิ่ม class ตาม layout/direction/animation (chat) + clock theme
  const classes = [`widget`, `type-${w.type}`];
  if (w.type === 'chat') {
    const layout = w.layout || 'inline';
    if (layout === 'stacked' || layout === 'stacked_no_logo') classes.push('layout-stacked');
    classes.push('dir-' + (w.direction || 'bottom'));
    classes.push('anim-' + (w.animation || 'fade'));
  }
  if (w.type === 'clock') {
    classes.push('clock-theme-' + (w.clock_theme || 'default'));
  }
  if (w.type === 'viewer') {
    classes.push('viewer-theme-' + (w.viewer_theme || 'default'));
    classes.push('viewer-align-' + (w.viewer_align || 'left'));
    classes.push('viewer-direction-' + (w.viewer_direction || 'horizontal'));
  }
  if (w.type === 'image') {
    // ★ transition class (tr-fade, tr-slide-left, ...) คุม animation ตอนเปลี่ยนรูป
    classes.push('tr-' + (w.transition || 'fade'));
  }
  if (w.type === 'webcam') {
    classes.push('webcam-theme-' + (w.webcam_theme || 'simple-white'));
    classes.push('ratio-' + (w.webcam_ratio || '16:9').replace(':', '-'));
  }
  if (w.type === 'text') {
    classes.push('text-' + (w.text_mode || 'static'));
  }
  el.className = classes.join(' ');
  el.dataset.id = w.id;
  el.style.left = w.x + 'px';
  el.style.top = w.y + 'px';
  el.style.width = w.w + 'px';
  // ★ webcam widget — height คำนวณจาก width + ratio (บังคับสัดส่วน)
  if (w.type === 'webcam') {
    el.style.height = computeRatioHeight(w.w, w.webcam_ratio) + 'px';
  } else {
    el.style.height = w.h + 'px';
  }
  el.style.zIndex = w.z || 1;
  el.style.opacity = (w.alpha != null ? w.alpha : 1.0);

  const inner = document.createElement('div');
  inner.className = 'widget-inner';
  // ★ content opacity — โปร่งใสเฉพาะเนื้อหาภายใน (ไม่กรอบ/ปุ่ม)
  inner.style.opacity = (w.content_opacity != null ? w.content_opacity : 1.0);
  el.appendChild(inner);

  // ★ apply per-widget style
  applyWidgetStyle(inner, w);

  // เนื้อหาเริ่มต้นตาม type
  if (w.type === 'chat') {
    // ★ chat widget = iframe ที่โหลด overlay.html (reuse theme/balloon/character เดิม 100%)
    // config เฉพาะ widget ส่งผ่าน ?id={widget_id} → overlay.html fetch /chat-config?id=...
    // _v = overlay_version (mtime ของ overlay.html) → เมื่อแก้ไฟล์, version เปลี่ยน → iframe reload อัตโนมัติ
    const ov = config.overlay_version || 0;
    const iframe = document.createElement('iframe');
    iframe.src = `/chat-widget?id=${encodeURIComponent(w.id)}&_v=${ov}&_t=${Date.now()}`;
    iframe.allow = 'autoplay; fullscreen';
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    iframe.dataset.overlayVersion = ov;
    inner.appendChild(iframe);
  } else if (w.type === 'alert' && w.url) {
    const iframe = document.createElement('iframe');
    iframe.src = w.url;
    iframe.allow = 'autoplay; fullscreen';
    // ★ no-referrer: StreamLabs บล็อกการฝังจาก origin อื่น (Referer localhost → 404)
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    inner.appendChild(iframe);
  } else if (w.type === 'viewer') {
    const vIconSize = w.viewer_icon_size || 20;
    const vShowIcon = w.viewer_show_icon !== false;
    inner.innerHTML = `<span class="viewer-total">${vShowIcon ? peopleIconSpan(vIconSize) : ''}0</span>`;
  } else if (w.type === 'clock') {
    // ★ clock: time + date element (เสมอ — updateClock จะจัดการ show/hide)
    const timeEl = document.createElement('div');
    timeEl.className = 'clock-time';
    timeEl.textContent = '--:--';
    inner.appendChild(timeEl);
    const dateEl = document.createElement('div');
    dateEl.className = 'clock-date';
    dateEl.textContent = '--';
    dateEl.style.display = (w.show_date) ? '' : 'none';
    inner.appendChild(dateEl);
    // ปรับ layout
    inner.style.flexDirection = 'column';
    inner.style.gap = '2px';
    updateClock(inner);
  } else if (w.type === 'image') {
    // ★ image widget = native <img> slides + setInterval slideshow
    setupImageWidget(inner, w);
  } else if (w.type === 'playroom') {
    // ★ playroom widget = iframe ไปยัง /playroom-widget
    // ★ ส่ง widget id ผ่าน URL เพื่อให้ playroom.html ระบุตัวเองใน WS hello (per-widget triggers)
    const iframe = document.createElement('iframe');
    iframe.src = buildPlayroomSrc(w);
    iframe.allow = 'autoplay; fullscreen';
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:transparent;';
    iframe.dataset.ckSig = JSON.stringify({ ck: w.ck_enabled, color: w.ck_color, sim: w.ck_similarity, smooth: w.ck_smoothness });
    inner.appendChild(iframe);
  } else if (w.type === 'webcam') {
    setupWebcamFrame(inner, w);
  } else if (w.type === 'text') {
    setupTextWidget(inner, w);
  } else if (w.type === 'video') {
    setupVideoWidget(inner, w);
  } else if (w.type === 'now_playing') {
    if (_lastNowPlayingData && _lastNowPlayingData.title) {
      updateNowPlayingWidget(inner, _lastNowPlayingData, w.id);
    } else {
      inner.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.4);font-size:13px;">🎵 Now Playing</div>';
    }
  } else if (w.type === 'emote_party') {
    setupEmoteParty(inner, w);
  }

  // editor mode — เพิ่ม handle + ปุ่มลบ + ปุ่ม settings
  if (isEditor) {
    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); deleteWidget(w.id); };
    el.appendChild(del);

    // ★ ปุ่ม settings (gear) — เปิด popup ปรับ style
    const gear = document.createElement('button');
    gear.className = 'settings-btn';
    gear.textContent = '⚙';
    gear.onclick = (e) => { e.stopPropagation(); openSettingsModal(w.id); };
    el.appendChild(gear);

    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    el.appendChild(handle);

    enableDrag(el, w);
    enableResize(el, handle, w);
    el.onclick = (e) => {
      e.stopPropagation();
      selectWidget(w.id);
    };
  }

  return el;
}

// ════════════════════════════════════════════════════════════
// Clock — อัปเดตทุกวินาที
// ════════════════════════════════════════════════════════════
function updateClock(el) {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  // ★ อ่าน format + show_date + lang + colors จาก widget config
  const widget = el.closest('.widget');
  const wid = widget ? widget.dataset.id : null;
  const w = wid ? config.widgets.find(x => x.id === wid) : null;
  const fmt = (w && w.clock_format) || 'HH:MM';
  const timeStr = fmt === 'HH:MM:SS' ? `${h}:${m}:${s}` : `${h}:${m}`;
  // อัปเดต time element + color
  const timeEl = el.querySelector('.clock-time') || el;
  timeEl.textContent = timeStr;
  if (w && w.time_color) timeEl.style.color = w.time_color;
  // อัปเดต date element (ถ้ามี)
  const dateEl = el.querySelector('.clock-date');
  if (dateEl) {
    if (w && w.show_date) {
      dateEl.textContent = formatDate(now, w.date_format || 'short', w.date_lang || 'th');
      dateEl.style.display = '';
      // ปรับ font-size + color ของวันที่
      if (w.date_font_size) dateEl.style.fontSize = w.date_font_size + 'px';
      if (w.date_color) dateEl.style.color = w.date_color;
    } else {
      dateEl.style.display = 'none';
    }
  }
}

// ฟอร์แมตวันที่เป็นภาษาไทย
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THAI_MONTHS_LONG = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const EN_MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EN_MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const EN_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EN_DAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function formatDate(d, fmt, lang) {
  const day = d.getDate();
  const month = d.getMonth();
  const year = d.getFullYear();
  const isEn = (lang === 'en');
  const dayName = isEn ? EN_DAYS[d.getDay()] : THAI_DAYS[d.getDay()];
  const dayNameLong = isEn ? EN_DAYS_LONG[d.getDay()] : THAI_DAYS[d.getDay()];
  if (fmt === 'long') {
    const mLong = isEn ? EN_MONTHS_LONG[month] : THAI_MONTHS_LONG[month];
    return `${dayNameLong} ${day} ${mLong} ${year}`;
  } else if (fmt === 'iso') {
    return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  } else if (fmt === 'weekday') {
    const mShort = isEn ? EN_MONTHS_SHORT[month] : THAI_MONTHS_SHORT[month];
    const yr = isEn ? year : String(year+543).slice(-2);
    return `${dayName} ${day} ${mShort} ${yr}`;
  }
  // short (default)
  const mShort = isEn ? EN_MONTHS_SHORT[month] : THAI_MONTHS_SHORT[month];
  const yr = isEn ? year : String(year+543).slice(-2);
  return `${day} ${mShort} ${yr}`;
}
setInterval(() => {
  document.querySelectorAll('.widget.type-clock .widget-inner').forEach(updateClock);
}, 1000);

// ════════════════════════════════════════════════════════════
// Chat message handler
// ════════════════════════════════════════════════════════════
function handleChatMessage(msg) {
  if (!msg) return;
  const text = msg.text || msg.display_text || '';
  const author = msg.author || msg.display_name || '';
  if (!text && !author) return;

  document.querySelectorAll('.widget.type-chat').forEach(widget => {
    const inner = widget.querySelector('.widget-inner');
    const wid = widget.dataset.id;
    const wcfg = wid ? config.widgets.find(x => x.id === wid) : null;
    const layout = (wcfg && wcfg.layout) || 'inline';
    const showLogo = wcfg ? wcfg.show_logo !== false : true;
    const showTs = wcfg ? wcfg.show_timestamp === true : false;
    const anim = (wcfg && wcfg.animation) || 'fade';
    const noLogo = (layout === 'inline_no_logo' || layout === 'stacked_no_logo' || layout === 'message_only' || !showLogo);
    const messageOnly = (layout === 'message_only');

    const line = document.createElement('div');
    line.className = 'chat-line';
    const color = msg.color || '#fff';
    const plat = msg.platform || '';

    // ★ timestamp (ถ้าเปิด)
    if (showTs && !messageOnly) {
      const now = new Date();
      const ts = document.createElement('span');
      ts.className = 'time';
      ts.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      line.appendChild(ts);
    }

    // ★ meta line (logo + author) — ซ่อนถ้า message_only หรือไม่มี author
    if (!messageOnly && author) {
      const meta = document.createElement('span');
      meta.className = 'meta-line';
      // logo (ถ้า layout ไม่ใช่ no_logo + เปิด show_logo + มี platform)
      if (!noLogo && plat) {
        const logo = document.createElement('img');
        logo.className = 'logo';
        logo.src = '/logo/' + plat;
        logo.alt = '';
        logo.onerror = function() { this.style.display = 'none'; };
        meta.appendChild(logo);
      }
      const authorEl = document.createElement('span');
      authorEl.className = 'author';
      authorEl.style.color = color;
      authorEl.textContent = author;
      meta.appendChild(authorEl);
      // separator (inline เท่านั้น — stacked ไม่ต้องมี)
      if (layout === 'inline' || layout === 'inline_no_logo') {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = ':';
        meta.appendChild(sep);
      }
      line.appendChild(meta);
    }

    // ★ text block
    const textEl = document.createElement('span');
    textEl.className = 'text-block';
    textEl.textContent = text;
    line.appendChild(textEl);

    // ★ animation class (ตาม wcfg.animation)
    // (CSS จะเลือก .anim-fade/.anim-slide/.anim-pop — เพิ่มที่ widget ไม่ใช่ line)
    // ตอนนี้ widget มี class anim-* อยู่แล้วจาก renderAll → line สืบทอด

    // ★ direction: bottom = ใหม่ล่าง (insertFirst + column-reverse) / top = ใหม่บน (appendChild + column)
    if ((wcfg && wcfg.direction) === 'top') {
      inner.appendChild(line);
    } else {
      inner.insertBefore(line, inner.firstChild);
    }

    // ★ cap ตาม max_messages
    const maxMsg = (wcfg && wcfg.max_messages) || 30;
    while (inner.children.length > maxMsg) {
      // ลบฝั่งตรงข้ามของข้อความใหม่ (เก่าสุด)
      if ((wcfg && wcfg.direction) === 'top') {
        inner.removeChild(inner.firstChild);
      } else {
        inner.removeChild(inner.lastChild);
      }
    }
  });
}

// ════════════════════════════════════════════════════════════
// Viewer count handler
// ════════════════════════════════════════════════════════════
// ★ SVG ไอคอนคน (ประกาศไว้บนสุดของ script — ใช้ร่วมกับ renderWidgetContent)
// (PEOPLE_ICON_SVG + peopleIconSpan ประกาศไว้ที่ด้านบนของ script แล้ว)

// ★ เก็บ viewers data ล่าสุด → ใช้ re-render ตอน viewer widget ถูก re-create (signature เปลี่ยน)
//    กันปัญหา: เปลี่ยน icon size → re-create → innerHTML กลับเป็น initial 👥 0 → รอ WS ใหม่
let _lastViewersData = null;

function handleViewers(data) {
  _lastViewersData = data;  // ★ cache ไว้
  document.querySelectorAll('.widget.type-viewer').forEach(widget => {
    const inner = widget.querySelector('.widget-inner');
    const wid = widget.dataset.id;
    const w = wid ? config.widgets.find(x => x.id === wid) : null;
    const mode = (w && w.viewer_mode) || 'both';
    const showIcon = w ? w.viewer_show_icon !== false : true;
    const iconSize = (w && w.viewer_icon_size) || 20;
    // ★ iconStyle ใช้กับทั้ง SVG (คน) และ <img> (แพลตฟอร์ม) → ขนาดเท่ากันเสมอ
    const iconStyle = `display:inline-flex;align-items:center;width:${iconSize}px;height:${iconSize}px;flex-shrink:0;`;
    const peopleIcon = showIcon ? peopleIconSpan(iconSize) : '';
    const platIcon = (plat) => showIcon ? `<img src="/logo/${plat}" alt="${plat}" style="${iconStyle}object-fit:contain;">` : '';

    let html = '';
    // total
    if (mode === 'total' || mode === 'both') {
      html += `<span class="viewer-total">${peopleIcon}${(data.total || 0).toLocaleString()}</span>`;
    }
    // per-platform
    if ((mode === 'per_platform' || mode === 'both') && data.platforms) {
      // ★ ในโหมด per_platform → แสดงทุก platform ที่เชื่อมไว้เสมอ (แม้ count=0)
      //    ในโหมด both → แสดงเฉพาะ platform ที่ count > 0 (กันรก)
      const showAll = (mode === 'per_platform');
      for (const [plat, count] of Object.entries(data.platforms)) {
        if (!showAll && !count) continue;
        html += `<span class="viewer-chip">${platIcon(plat)} ${(count || 0).toLocaleString()}</span>`;
      }
    }
    // ★ fallback: ถ้าไม่มีข้อมูล (ยังไม่ได้รับ update / ทุก platform count=0) → แสดงตามโหมด
    //    - total/both → ไอคอนคน + 0
    //    - per_platform → ไอคอนแพลตฟอร์มที่เชื่อมไว้ + 0 (ถ้ารู้ platforms) หรือ ไอคอนคน + 0 (ถ้าไม่รู้)
    if (!html) {
      if (mode === 'per_platform' && data.platforms) {
        // แสดงทุก platform ที่เชื่อมไว้ พร้อม count=0
        for (const plat of Object.keys(data.platforms)) {
          html += `<span class="viewer-chip">${platIcon(plat)} 0</span>`;
        }
      }
      if (!html) {
        html = `<span class="viewer-total">${peopleIcon}0</span>`;
      }
    }
    inner.innerHTML = html;
  });
}

// ════════════════════════════════════════════════════════════
// Now Playing handler (Windows System Media)
// ════════════════════════════════════════════════════════════
let _lastNowPlayingData = {};

function handleNowPlaying(data) {
  var isFullUpdate = !!data.title;  // มี title = full update (เปลี่ยนเพลง)

  if (isFullUpdate) {
    _lastNowPlayingData = data;
    // ★ เคลียร์ timer เก่าทั้งหมด (กันนับต่อจากเพลงเก่า)
    Object.keys(_npClientTimers).forEach(function(k) {
      clearInterval(_npClientTimers[k]);
      delete _npClientTimers[k];
    });
    // ★ full re-render (เปลี่ยนเพลง → สร้าง DOM ใหม่ + เริ่ม scroll + timer ใหม่)
    document.querySelectorAll('.widget.type-now_playing').forEach(function(el) {
      var inner = el.querySelector('.widget-inner');
      if (!inner) return;
      updateNowPlayingWidget(inner, _lastNowPlayingData, el.dataset.id);
      // ★ เริ่ม timer ใหม่ทันทีหลัง full re-render (sync position ใหม่)
      updateNowPlayingPosition(inner, _lastNowPlayingData);
    });
  } else {
    // ★ position update → แก้แค่ text/bar ไม่ re-render DOM (กัน scroll reset)
    if (_lastNowPlayingData.title) {
      _lastNowPlayingData.position = data.position ?? _lastNowPlayingData.position;
      _lastNowPlayingData.duration = data.duration ?? _lastNowPlayingData.duration;
      _lastNowPlayingData.is_playing = data.is_playing ?? _lastNowPlayingData.is_playing;
    } else {
      _lastNowPlayingData = data;
    }
    // ★ update เฉพาะ time + bar fill (ไม่ทำลาย scroll animation)
    document.querySelectorAll('.widget.type-now_playing').forEach(function(el) {
      var inner = el.querySelector('.widget-inner');
      if (!inner) return;
      updateNowPlayingPosition(inner, _lastNowPlayingData);
    });
  }
}

// ★ update เฉพาะ position/time/bar — ไม่ re-render DOM (กัน scroll reset)
// ★ ใช้ client-side timer นับทุก 250ms (สมูท + ตรงเวลาจริง)
var _npClientTimers = {};  // widgetId → interval

function updateNowPlayingPosition(inner, d) {
  var pos = d.position || 0;
  var dur = d.duration || 0;
  var playing = d.is_playing !== false;

  // ★ อ่าน sync_mode จาก widget config
  var widgetId = inner.closest('.widget')?.dataset?.id || '_default';
  var w = (config.widgets || []).find(function(x) { return x.id === widgetId; }) || {};
  var syncMode = w.np_sync_mode || 'browser';

  function fmt(s) {
    s = Math.floor(s || 0);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function renderPos() {
    var pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;
    var timeEl = inner.querySelector('.np-time');
    if (timeEl) timeEl.textContent = fmt(pos);
    var durEl = inner.querySelector('.np-dur');
    if (durEl) durEl.textContent = fmt(dur);
    var fillEl = inner.querySelector('.np-bar-fill');
    if (fillEl) fillEl.style.width = pct + '%';
    var container = inner.querySelector('.np-container');
    if (container) container.style.opacity = playing ? '' : '0.6';
  }
  renderPos();

  // ยกเลิก timer เก่า
  if (_npClientTimers[widgetId]) clearInterval(_npClientTimers[widgetId]);

  // ★ precise mode = ไม่ต้อง interpolate (Python push ทุก 1 วิ แล้ว)
  if (syncMode === 'precise') return;

  // ★ browser mode = interpolate จาก timestamp จริง
  if (playing && dur > 0) {
    var refPos = pos;
    var refTime = Date.now();
    _npClientTimers[widgetId] = setInterval(function() {
      var elapsed = (Date.now() - refTime) / 1000;
      pos = refPos + elapsed;
      if (pos >= dur) {
        pos = dur;
        clearInterval(_npClientTimers[widgetId]);
      }
      renderPos();
    }, 250);
  }
}

function updateNowPlayingWidget(inner, d, widgetId) {
  // find widget config
  var w = (config.widgets || []).find(function(x) { return x.id === widgetId; }) || {};
  var showArt = w.np_show_art !== false;
  var showProgress = w.np_show_progress !== false;
  var scrollTitle = w.np_scroll_title !== false;
  var fontSize = w.np_font_size || 14;
  var textColor = w.np_text_color || '#ffffff';
  var accentColor = w.np_accent_color || '#1db954';
  var bgColor = w.np_bg_color || '#1a1a2e';
  var bgOpacity = w.np_bg_opacity ?? 0.85;
  var radius = w.np_radius ?? 8;
  var artRadius = w.np_art_radius ?? 6;
  var artSize = w.np_art_size ?? 48;  // ★ ขนาด thumbnail ปรับได้

  var title = d.title || '';
  var artist = d.artist || '';
  var pos = d.position || 0;
  var dur = d.duration || 0;
  var playing = d.is_playing !== false;
  var artUrl = d.thumbnail_url || '';

  // convert hex bg + opacity to rgba (ใช้ solid hex เมื่อ opacity = 100% เพื่อกันปัญหา compositing)
  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1,3), 16) || 26;
    var g = parseInt(hex.slice(3,5), 16) || 26;
    var b = parseInt(hex.slice(5,7), 16) || 46;
    // ★ alpha = 1.0 → ใช้ solid hex เลย (บางเบราว์เซอร์มีปัญหา rgba ที่ alpha=1 โดยเฉพาะ OBS)
    if (alpha >= 0.999) return '#' + hex.slice(1,7);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  var bgRgba = hexToRgba(bgColor, bgOpacity);

  // format time M:SS
  function fmt(s) {
    s = Math.floor(s || 0);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  var pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;

  // ★ กรอบ + พื้นหลัง — bg color เป็น solid base (ไม่โปร่งเมื่อ opacity=100%)
  // style pattern เป็น overlay (เพิ่มลวดลาย ไม่ทับ bg หลัก)
  var styleName = w.np_style || 'flat';
  var html = '<div class="np-container" style="--np-accent:' + accentColor + ';position:relative;display:flex;align-items:center;gap:10px;height:100%;padding:8px 10px;box-sizing:border-box;border-radius:' + radius + 'px;background:' + bgRgba + ';overflow:hidden;' + (playing ? '' : 'opacity:0.6;') + '">';
  // ★ overlay สำหรับ style pattern (อยู่เหนือ bg แต่ใต้ content)
  html += '<div class="np-style-overlay np-style-' + styleName + '" style="position:absolute;inset:0;pointer-events:none;border-radius:' + radius + 'px;"></div>';

  // ★ thumbnail — ขนาดปรับได้ + มุมมนตามกรอบ + ไม่ล้น
  if (showArt) {
    // art ใช้ height: 100% ของ container (หัก padding) + width ปรับได้แต่ไม่เกิน height
    html += '<div class="np-art" style="height:' + artSize + 'px;width:' + artSize + 'px;flex-shrink:0;border-radius:' + artRadius + 'px;overflow:hidden;background:rgba(255,255,255,0.1);">';
    if (artUrl) html += '<img src="' + artUrl + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
    else html += '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;">🎵</div>';
    html += '</div>';
  }
  html += '<div class="np-info" style="flex:1;min-width:0;overflow:hidden;">';
  // ★ scroll title — JS driven (หากเปิดไว้ + ข้อความยาวเกิน container)
  html += '<div class="np-title-wrap" style="overflow:hidden;white-space:nowrap;position:relative;">';
  html += '<span class="np-title-text" data-np-scroll="' + (scrollTitle ? '1' : '0') + '" style="display:inline-block;font-size:' + fontSize + 'px;font-weight:600;color:' + textColor + ';white-space:nowrap;will-change:transform;">' + escapeHtml(title || 'ไม่มีเพลง') + '</span>';
  html += '</div>';
  var artistFontSize = w.np_artist_font_size || 12;
  var timeFontSize = w.np_time_font_size || 10;
  html += '<div class="np-artist" style="font-size:' + artistFontSize + 'px;color:rgba(255,255,255,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(artist) + '</div>';
  if (showProgress) {
    html += '<div class="np-progress-row" style="display:flex;align-items:center;gap:6px;margin-top:4px;">';
    html += '<span class="np-time" style="font-size:' + timeFontSize + 'px;color:rgba(255,255,255,0.5);min-width:30px;">' + fmt(pos) + '</span>';
    html += '<div class="np-bar" style="flex:1;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;">';
    html += '<div class="np-bar-fill" style="width:' + pct + '%;height:100%;background:' + accentColor + ';border-radius:2px;transition:width 0.5s linear;"></div>';
    html += '</div>';
    html += '<span class="np-dur" style="font-size:' + timeFontSize + 'px;color:rgba(255,255,255,0.5);min-width:30px;text-align:right;">' + fmt(dur) + '</span>';
    html += '</div>';
  }
  html += '</div></div>';

  inner.innerHTML = html;

  // ★ JS marquee scroll — วัดจริง + เลื่อนสมูท (หยุด 2 วิทั้งสองฝั่ง)
  var wrapEl = inner.querySelector('.np-title-wrap');
  var textEl = inner.querySelector('.np-title-text');
  if (wrapEl && textEl) {
    // ยกเลิก animation เก่า
    if (textEl._npAnim) cancelAnimationFrame(textEl._npAnim);
    textEl.style.transform = 'translateX(0)';

    var doScroll = textEl.getAttribute('data-np-scroll') === '1';
    if (doScroll) {
      requestAnimationFrame(function() {
        var containerW = wrapEl.offsetWidth;
        var textW = textEl.scrollWidth;
        if (textW > containerW + 5) {
          var dist = textW - containerW + 20;  // ระยะเลื่อน + padding
          var pauseStart = 1500;   // หยุด 1.5 วิที่จุดเริ่ม
          var pauseEnd = 1500;     // หยุด 1.5 วิที่ท้าย
          var speed = 30;          // px/วิ (ช้าพออ่านได้)
          var scrollDur = (dist / speed) * 1000;  // ms
          var totalDur = pauseStart + scrollDur + pauseEnd;
          var startT = null;

          function animFrame(ts) {
            if (!startT) startT = ts;
            var elapsed = ts - startT;
            var x = 0;
            if (elapsed < pauseStart) {
              x = 0;  // หยุดที่เริ่ม
            } else if (elapsed < pauseStart + scrollDur) {
              var progress = (elapsed - pauseStart) / scrollDur;
              x = -(progress * dist);  // เลื่อน
            } else if (elapsed < totalDur) {
              x = -dist;  // หยุดที่ท้าย
            } else {
              startT = ts;  // รีสตาร์ท
              x = 0;
            }
            textEl.style.transform = 'translateX(' + x + 'px)';
            textEl._npAnim = requestAnimationFrame(animFrame);
          }
          textEl._npAnim = requestAnimationFrame(animFrame);
        }
      });
    }
  }
}

// ════════════════════════════════════════════════════════════
// Emote Party — ดัก emote จากทุกแพลตฟอร์ม + animation engine
// ════════════════════════════════════════════════════════════
// active emote elements: {el, widgetId, animType, born, ttl, ...physics}
const _epActive = [];   // รายการ emote ที่กำลังแสดงอยู่
let _epRafId = null;     // requestAnimationFrame id (single global loop)

function setupEmoteParty(inner, w) {
  // ★ Emote Party = โปร่งใสเสมอ (ไม่มีพื้นหลัง — emote overlay ปกติไม่ต้องมี bg)
  inner.innerHTML = '';
  inner.style.position = 'relative';
  inner.style.overflow = 'hidden';
  // ★ sync existing active emotes' size ถ้า config เปลี่ยน
  _epActive.forEach(item => {
    if (item.widgetId === w.id && item.config) {
      item.config.ep_emote_size = w.ep_emote_size || 64;
    }
  });
}

// ★ ปุ่มจาก server → handleEmoteParty([{url,text,source}, ...])
function handleEmoteParty(emotes) {
  if (!emotes || !emotes.length) return;
  // ★ หา widget emote_party ที่เปิดอยู่ (อาจมีหลายตัว)
  const epWidgets = (config.widgets || []).filter(w => w.type === 'emote_party' && w.enabled !== false);
  if (!epWidgets.length) return;
  epWidgets.forEach(w => {
    const wid = w.id;
    const maxEmotes = w.ep_max_emotes || 15;
    const emojiEnabled = w.ep_emoji_enabled !== false;
    const inner = document.querySelector('.widget[data-id="' + wid + '"] .widget-inner');
    if (!inner) return;
    // ★ เก็บ reference ไว้ใช้ตอน animate
    emotes.forEach(em => {
      // ข้าม emoji ถ้าปิดอยู่
      if (!em.url && em.text && !emojiEnabled) return;
      // ★ จำกัดจำนวน — เอาเก่าที่สุดออกก่อน
      const mine = _epActive.filter(x => x.widgetId === wid);
      while (mine.length >= maxEmotes) {
        const oldest = _epActive.find(x => x.widgetId === wid);
        if (!oldest) break;
        _removeEmote(oldest);
      }
      _spawnEmote(inner, w, em);
    });
    _ensureRafRunning();
  });
}

// ★ สร้าง emote element + ตั้งค่า physics ตาม animation type
function _spawnEmote(inner, w, em) {
  const size = w.ep_emote_size || 64;
  const animType = w.ep_animation || 'float';
  const ttl = (w.ep_duration || 5) * 1000;  // ms
  const now = performance.now();
  const rect = inner.getBoundingClientRect();
  const W = rect.width || 400;
  const H = rect.height || 300;

  const el = document.createElement('div');
  el.style.cssText = 'position:absolute;will-change:transform,opacity;pointer-events:none;display:flex;align-items:center;justify-content:center;';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  // ★ content — image หรือ text (emoji)
  if (em.url) {
    const img = document.createElement('img');
    img.src = em.url;
    // ★ width/height 100% บังคับให้รูปเต็ม container (ตาม ep_emote_size)
    //    ใช้ max-width/max-height อย่างเดียวไม่พอ — รูปเล็กจะไม่ถูกขยาย
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;';
    img.onerror = () => { try { el.remove(); } catch(e){} };
    el.appendChild(img);
  } else if (em.text) {
    el.textContent = em.text;
    el.style.fontSize = (size * 0.8) + 'px';
    el.style.lineHeight = '1';
  } else {
    return;  // ไม่มี content → skip
  }
  inner.appendChild(el);

  // ★ วัดขนาดจริง (หลัง append) เพื่อคำนวณ physics แบบแม่นยำ
  const ew = el.offsetWidth || size;
  const eh = el.offsetHeight || size;

  // ★ ตั้งค่า physics ตาม animation type
  let item = {
    el: el,
    widgetId: w.id,
    animType: animType,
    born: now,
    ttl: ttl,
    config: w,
  };

  if (animType === 'float') {
    // 🎈 Float — เริ่มจากด้านล่าง ลอยขึ้นบน + แกว่งซ้ายขวา
    item.x = Math.random() * Math.max(1, W - ew);
    item.y = H;  // เริ่มใต้กรอบ
    item.vx = (Math.random() - 0.5) * 30;   // px/s แนวนอน
    item.vy = -(40 + Math.random() * 30);    // px/s ขึ้นบน
    item.swayPhase = Math.random() * Math.PI * 2;
    item.swayAmp = 20 + Math.random() * 20;
  } else if (animType === 'dvd') {
    // 📺 DVD Bounce — เริ่มกลางจอ + ความเร็วคงที่ เด้งติดผนัง
    item.x = (W - ew) / 2 + (Math.random() - 0.5) * Math.min(W * 0.3, 100);
    item.y = (H - eh) / 2 + (Math.random() - 0.5) * Math.min(H * 0.3, 100);
    const speed = 80 + Math.random() * 40;
    const angle = Math.random() * Math.PI * 2;
    item.vx = Math.cos(angle) * speed;
    item.vy = Math.sin(angle) * speed;
    item.W = W; item.H = H; item.ew = ew; item.eh = eh;
  } else if (animType === 'drop') {
    // 💥 Pop & Drop — โผล่กลางจอ (pop) แล้วตกลงข้างล่าง (gravity)
    item.x = Math.random() * Math.max(1, W - ew);
    item.y = Math.random() * Math.max(1, H * 0.4);  // เริ่มด้านบน
    item.vx = (Math.random() - 0.5) * 20;
    item.vy = 0;
    item.gravity = 200;  // px/s²
    item.bounceDamping = 0.5;
    item.W = W; item.H = H; item.ew = ew; item.eh = eh;
    item.popStart = now;
    item.popDur = 200;  // ms — ขยายจาก 0 → 1
  } else if (animType === 'shake') {
    // 🌀 Shake/Spin — สุ่มตำแหน่ง + หมุน + สั่น
    item.x = Math.random() * Math.max(1, W - ew);
    item.y = Math.random() * Math.max(1, H - eh);
    item.rot = 0;
    item.vrot = (Math.random() - 0.5) * 360;  // deg/s
    item.shakePhase = Math.random() * Math.PI * 2;
    item.shakeAmpX = 5 + Math.random() * 10;
    item.shakeAmpY = 5 + Math.random() * 10;
    item.shakeFreq = 8 + Math.random() * 6;  // Hz
  }

  // ★ วาดตำแหน่งเริ่มต้น
  _drawEmote(item, now);
  _epActive.push(item);
}

// ★ วาด emote ตาม physics state (ปัจจุบัน)
function _drawEmote(item, now) {
  const age = now - item.born;
  const lifeRatio = age / item.ttl;
  let opacity = 1;
  // ★ fade-in 10% แรก, fade-out 20% สุดท้าย
  if (lifeRatio < 0.1) opacity = lifeRatio / 0.1;
  else if (lifeRatio > 0.8) opacity = Math.max(0, (1 - lifeRatio) / 0.2);

  let tx = item.x || 0;
  let ty = item.y || 0;
  let rot = item.rot || 0;
  let scale = 1;

  if (item.animType === 'shake') {
    // ★ เพิ่ม shake offset
    const t = (now - item.born) / 1000;
    tx += Math.sin(t * item.shakeFreq * Math.PI + item.shakePhase) * item.shakeAmpX;
    ty += Math.cos(t * item.shakeFreq * Math.PI + item.shakePhase) * item.shakeAmpY;
  }

  if (item.animType === 'drop') {
    // ★ pop-in (scale 0→1) ตอนเริ่ม
    if (item.popStart != null) {
      const popAge = now - item.popStart;
      if (popAge < item.popDur) {
        scale = popAge / item.popDur;
      }
    }
  }

  item.el.style.opacity = opacity.toFixed(3);
  item.el.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg) scale(' + scale.toFixed(3) + ')';
}

// ★ update physics ตามเวลาที่ผ่านไป (dt = seconds)
function _updatePhysics(item, dt, now) {
  if (item.animType === 'float') {
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    // ★ sway แนวนอน
    const swayT = (now - item.born) / 1000;
    const sway = Math.sin(swayT * 2 + item.swayPhase) * item.swayAmp;
    item.el.style.transform = 'translate(' + (item.x + sway).toFixed(1) + 'px,' + item.y.toFixed(1) + 'px)';
  } else if (item.animType === 'dvd') {
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    // ★ เด้งติดผนัง
    if (item.x <= 0) { item.x = 0; item.vx = Math.abs(item.vx); }
    else if (item.x >= item.W - item.ew) { item.x = item.W - item.ew; item.vx = -Math.abs(item.vx); }
    if (item.y <= 0) { item.y = 0; item.vy = Math.abs(item.vy); }
    else if (item.y >= item.H - item.eh) { item.y = item.H - item.eh; item.vy = -Math.abs(item.vy); }
  } else if (item.animType === 'drop') {
    item.vy += item.gravity * dt;
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    // ★ เด้งพื้น (ครั้งเดียว — หลังจากนั้นให้หยุด)
    if (item.y >= item.H - item.eh) {
      item.y = item.H - item.eh;
      if (Math.abs(item.vy) > 30) {
        item.vy = -item.vy * item.bounceDamping;
      } else {
        item.vy = 0;
        item.vx *= 0.8;  // เสียดทาน
      }
    }
  } else if (item.animType === 'shake') {
    item.rot += item.vrot * dt;
  }
}

// ★ main animation loop — เรียก requestAnimationFrame เดียวรันทุก emote
function _epTick(now) {
  const dt = Math.min(0.05, (now - (_epLastTime || now)) / 1000);  // จำกัด dt กันกระตุก
  _epLastTime = now;
  // ★ update ทุก emote
  for (let i = _epActive.length - 1; i >= 0; i--) {
    const item = _epActive[i];
    const age = now - item.born;
    // ★ หมดอายุ → เอาออก
    if (age >= item.ttl) {
      _removeEmote(item);
      _epActive.splice(i, 1);
      continue;
    }
    _updatePhysics(item, dt, now);
    _drawEmote(item, now);
  }
  // ★ ถ้ายังมี emote → รันต่อ
  if (_epActive.length > 0) {
    _epRafId = requestAnimationFrame(_epTick);
  } else {
    _epRafId = null;
  }
}
let _epLastTime = 0;

function _ensureRafRunning() {
  if (_epRafId === null) {
    _epLastTime = performance.now();
    _epRafId = requestAnimationFrame(_epTick);
  }
}

function _removeEmote(item) {
  if (item && item.el) {
    try { item.el.remove(); } catch (e) {}
  }
}

// ════════════════════════════════════════════════════════════
// Color Key (Chroma Key) — ตัดสีพื้นหลังผ่าน Canvas pixel processing
// ════════════════════════════════════════════════════════════
// active color key instances: {widgetId, canvas, ctx, video, rafId, config}
const _ckInstances = {};

// ★ เริ่ม color key สำหรับ widget — สร้าง canvas ซ้อนเหนือ video ต้นฉบับ
function startColorKey(inner, w) {
  const wid = w.id;
  // ★ หยุด instance เดิมก่อน (ถ้ามี)
  stopColorKey(wid);
  // ★ config
  const hex = (w.ck_color || '#00ff00');
  const target = hexToRgb(hex);
  const similarity = w.ck_similarity != null ? w.ck_similarity : 50;
  const smoothness = w.ck_smoothness != null ? w.ck_smoothness : 30;
  // threshold = 0-442 (max RGB distance)
  const threshold = (similarity / 100) * 442;
  const smoothRange = (smoothness / 100) * Math.max(threshold * 0.4, 20);

  // ★ หา video ต้นฉบับใน inner
  const video = inner.querySelector('video');
  if (!video) return;

  // ★ สร้าง canvas (willReadFrequently เพื่อ performance)
  const canvas = document.createElement('canvas');
  canvas.className = 'ck-canvas';
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;';
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  inner.appendChild(canvas);

  // ★ ซ่อน video ต้นฉบับ (แต่ยังเล่นเบื้องหลัง)
  video.style.opacity = '0';
  video.style.position = 'absolute';
  video.style.pointerEvents = 'none';

  const inst = { widgetId: wid, canvas, ctx, video, target, threshold, smoothRange, rafId: null };
  _ckInstances[wid] = inst;

  // ★ resize canvas ตามขนาด widget
  function resizeCanvas() {
    const rect = inner.getBoundingClientRect();
    canvas.width = Math.min(1920, Math.round(rect.width));
    canvas.height = Math.min(1080, Math.round(rect.height));
  }
  resizeCanvas();
  inst.resize = resizeCanvas;

  // ★ animation loop — ประมวลผลทุกเฟรม
  function processFrame() {
    if (video.readyState >= 2 && canvas.width > 0 && canvas.height > 0) {
      // drawImage video → canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      // ดึง pixel data
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const tr = inst.target.r, tg = inst.target.g, tb = inst.target.b;
      const thr = inst.threshold;
      const sr = inst.smoothRange;
      // ★ ประมวลผล pixel — ตัดสีที่ใกล้เคียง
      for (let i = 0; i < data.length; i += 4) {
        const dr = data[i] - tr;
        const dg = data[i + 1] - tg;
        const db = data[i + 2] - tb;
        const dist = Math.sqrt(dr * dr + dg * dg + db * db);
        if (dist < thr - sr) {
          data[i + 3] = 0;  // ตัดเต็มที่
        } else if (dist < thr) {
          // smooth edge — alpha ลดลงตามระยะ
          data[i + 3] = Math.round(((dist - (thr - sr)) / sr) * 255);
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }
    inst.rafId = requestAnimationFrame(processFrame);
  }
  processFrame();
}

// ★ หยุด color key — คืน video ต้นฉบับ + ลบ canvas
function stopColorKey(widgetId) {
  const inst = _ckInstances[widgetId];
  if (!inst) return;
  if (inst.rafId) cancelAnimationFrame(inst.rafId);
  try { inst.canvas.remove(); } catch (e) {}
  // ★ คืน video ต้นฉบับ
  if (inst.video) {
    inst.video.style.opacity = '';
    inst.video.style.position = '';
    inst.video.style.pointerEvents = '';
  }
  delete _ckInstances[widgetId];
}

// ★ อัปเดต color key config (เมื่อ settings เปลี่ยน — ไม่ต้อง restart)
function updateColorKeyConfig(w) {
  const inst = _ckInstances[w.id];
  if (!inst) return;
  const hex = (w.ck_color || '#00ff00');
  inst.target = hexToRgb(hex);
  const similarity = w.ck_similarity != null ? w.ck_similarity : 50;
  const smoothness = w.ck_smoothness != null ? w.ck_smoothness : 30;
  inst.threshold = (similarity / 100) * 442;
  inst.smoothRange = (smoothness / 100) * Math.max(inst.threshold * 0.4, 20);
}

// ★ Eyedropper — เปิดโหมดคลิกที่ canvas เพื่อเก็บสี
function enableColorKeyEyedropper(widgetId, onPick) {
  const inst = _ckInstances[widgetId];
  if (!inst || !inst.canvas) return;
  inst.canvas.style.pointerEvents = 'auto';
  inst.canvas.style.cursor = 'crosshair';
  const handler = (e) => {
    const rect = inst.canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) * inst.canvas.width / rect.width);
    const y = Math.round((e.clientY - rect.top) * inst.canvas.height / rect.height);
    try {
      const px = inst.ctx.getImageData(x, y, 1, 1).data;
      const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
      if (onPick) onPick(hex);
    } catch (err) {}
    // ปิด eyedropper mode
    inst.canvas.style.pointerEvents = 'none';
    inst.canvas.style.cursor = '';
    inst.canvas.removeEventListener('click', handler);
  };
  inst.canvas.addEventListener('click', handler);
}

// ★ helper — hex → {r, g, b}
function hexToRgb(hex) {
  const h = (hex || '#00ff00').replace('#', '');
  return {
    r: parseInt(h.slice(0, 2), 16) || 0,
    g: parseInt(h.slice(2, 4), 16) || 255,
    b: parseInt(h.slice(4, 6), 16) || 0,
  };
}

// ★ render Color Key section HTML (ใช้ใน Video + Playroom settings modal)
function renderColorKeySection(w) {
  const enabled = w.ck_enabled === true;
  const color = w.ck_color || '#00ff00';
