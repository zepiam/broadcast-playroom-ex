  let html = '<div class="section-title">🎨 Color Key (Chroma Key)</div>';
  html += '<p class="hint-text">ตัดสีพื้นหลังออก (เช่น green screen) ทำให้ widget โปร่งใสตรงสีที่เลือก</p>';
  // toggle
  html += fldRow('เปิด Color Key', enabled, 'f-ck_enabled');
  // color picker + eyedropper button (side by side)
  html += '<div class="fld row"><label>สีที่จะตัด</label><div style="display:flex;gap:6px;align-items:center;">'
    + '<input type="color" id="f-ck_color" value="' + color + '" style="width:60px;height:32px;border:1px solid #333;border-radius:6px;background:#1a1a2e;flex-shrink:0;">'
    + '<button type="button" id="f-ck-eyedropper-btn" style="flex:1;padding:8px;background:#4a9eff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;">🎯 คลิกเพื่อเก็บสีจากวิดีโอ</button>'
    + '</div></div>';
  // sliders
  html += fldSlider('Similarity (ความคล้าย)', 'f-ck_similarity', similarity, 0, 100, 1, '%');
  html += fldSlider('Smoothness (ความนุ่มของขอบ)', 'f-ck_smoothness', smoothness, 0, 100, 1, '%');
  return html;
}

// ★ bind eyedropper button — เปิดโหมดคลิกที่ canvas เพื่อเก็บสี
function bindColorKeyEyedropper(w) {
  const btn = document.getElementById('f-ck-eyedropper-btn');
  if (!btn) return;
  btn.onclick = () => {
    // ★ ต้องเปิด color key ก่อนถึงจะมี canvas ให้คลิก
    if (!w.ck_enabled) {
      const cb = document.getElementById('f-ck_enabled');
      if (cb) { cb.checked = true; }
      // trigger readModalFields + re-render
      if (typeof readModalFields === 'function' && typeof renderAll === 'function') {
        readModalFields(w);
        renderAll();
      }
    }
    // ★ รอ render แล้วเปิด eyedropper
    setTimeout(() => {
      enableColorKeyEyedropper(w.id, (hex) => {
        const colorInput = document.getElementById('f-ck_color');
        if (colorInput) colorInput.value = hex;
        // update config + re-process
        w.ck_color = hex;
        updateColorKeyConfig(w);
        // อัปเดต URL params สำหรับ playroom iframe (ถ้าเป็น playroom)
        if (w.type === 'playroom') refreshPlayroomIframe(w);
        btn.textContent = '✓ เก็บสีแล้ว: ' + hex;
        setTimeout(() => { btn.textContent = '🎯 คลิกเพื่อเก็บสีจากวิดีโอ'; }, 2000);
      });
    }, 300);
  };
}

// ★ สร้าง URL สำหรับ playroom iframe (รวม color key params ถ้าเปิดอยู่)
function buildPlayroomSrc(w) {
  let src = `/playroom-widget?id=${encodeURIComponent(w.id)}&_t=${Date.now()}`;
  // ★ color key params (ถ้าเปิดอยู่ → playroom.html จะเปิด canvas processing)
  if (w.ck_enabled) {
    src += '&ck=1';
    src += '&ck_color=' + encodeURIComponent(w.ck_color || '#00ff00');
    src += '&ck_sim=' + (w.ck_similarity != null ? w.ck_similarity : 50);
    src += '&ck_smooth=' + (w.ck_smoothness != null ? w.ck_smoothness : 30);
  }
  return src;
}

// ★ refresh playroom iframe (เมื่อ ck config เปลี่ยน — ต้อง reload iframe เพื่ออ่าน URL params ใหม่)
function refreshPlayroomIframe(w) {
  const el = document.querySelector('.widget[data-id="' + w.id + '"]');
  if (!el) return;
  const iframe = el.querySelector('iframe');
  if (!iframe) return;
  iframe.src = buildPlayroomSrc(w);
}

function selectWidget(id) {
  document.querySelectorAll('.widget.selected').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`.widget[data-id="${id}"]`);
  if (el) {
    el.classList.add('selected');
    selectedWidget = id;
    // bring to front
    const w = config.widgets.find(x => x.id === id);
    if (w) {
      const maxZ = Math.max(...config.widgets.map(x => x.z || 1), 0);
      w.z = maxZ + 1;
      el.style.zIndex = w.z;
    }
  }
  renderLayersList();  // ★ sync layers panel highlight
}

function deleteWidget(id) {
  config.widgets = config.widgets.filter(w => w.id !== id);
  renderAll();
}

// ═══════════════════════════════════════════════════════════════
// ★ Layers Panel — จัดลำดับชั้น widget (drag เพื่อสลับ z-index)
// ═══════════════════════════════════════════════════════════════
const WIDGET_ICONS = {
  chat:'💬', alert:'🔔', viewer:'👥', clock:'🕐',
  image:'🖼️', playroom:'🎮', webcam:'📷', text:'📝', video:'🎬', now_playing:'🎵', emote_party:'🎉'
};
const WIDGET_LABELS = {
  chat:'Chat', alert:'Custom URL', viewer:'Viewer Count', clock:'Clock',
  image:'Image', playroom:'Playroom', webcam:'Webcam', text:'Text', video:'Video', now_playing:'Now Playing', emote_party:'Emote Party'
};

function renderLayersList() {
  const list = document.getElementById('layers-list');
  const count = document.getElementById('layers-count');
  if (!list) return;
  list.innerHTML = '';
  // sort by z descending (highest z = top layer = first in list)
  const sorted = [...config.widgets].sort((a, b) => (b.z || 0) - (a.z || 0));
  count.textContent = `(${sorted.length})`;
  sorted.forEach(w => {
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.dataset.id = w.id;
    row.draggable = true;
    if (selectedWidget === w.id) row.classList.add('selected');
    row.innerHTML = '<span class="layer-icon">' + (WIDGET_ICONS[w.type] || '▣') + '</span>'
      + '<span class="layer-name">' + (WIDGET_LABELS[w.type] || w.type)
      + '<span class="sub">z:' + (w.z || 1) + '</span></span>'
      + '<button class="layer-vis-btn" title="show/hide">' + (w.enabled === false ? '🚫' : '👁') + '</button>';
    // click row → select widget on canvas
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('layer-vis-btn')) return;
      selectWidget(w.id);
    });
    // visibility toggle
    row.querySelector('.layer-vis-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleWidgetVisibility(w.id);
    });
    // HTML5 drag-and-drop
    enableLayerDrag(row);
    list.appendChild(row);
  });
}

function enableLayerDrag(row) {
  row.addEventListener('dragstart', (e) => {
    row.classList.add('dragging');
    e.dataTransfer.setData('text/plain', row.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    document.querySelectorAll('.layer-row').forEach(r => r.classList.remove('drag-over'));
  });
  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.layer-row').forEach(r => r.classList.remove('drag-over'));
    row.classList.add('drag-over');
  });
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const targetId = row.dataset.id;
    if (draggedId === targetId) return;
    reorderLayers(draggedId, targetId);
  });
}

function reorderLayers(draggedId, targetId) {
  // อ่านลำดับจาก DOM (บน→ล่าง = z สูง→ต่ำ)
  const list = document.getElementById('layers-list');
  const draggedRow = list.querySelector(`[data-id="${draggedId}"]`);
  const targetRow = list.querySelector(`[data-id="${targetId}"]`);
  if (!draggedRow || !targetRow) return;
  // ย้าย dragged มาก่อน target ใน DOM
  list.insertBefore(draggedRow, targetRow);
  // ★ reassign z ตามลำดับใหม่ (index 0 = บนสุด = z สูงสุด)
  const newRows = [...list.querySelectorAll('.layer-row')];
  const total = newRows.length;
  // ★ reorder config.widgets array ให้ตรงกับลำดับใหม่ (z ต่ำ→สูง = index สูง→ต่ำ)
  //    สำคัญ: saveLayoutDebounced ส่ง config.widgets ไป server → server reassign z ตาม array order
  //    ถ้า array order ไม่ตรงกับ z ที่ตั้ง → server จะ override z กลับเป็นเดิม
  const newWidgetsOrder = [];
  newRows.forEach((r, i) => {
    const w = config.widgets.find(x => x.id === r.dataset.id);
    if (w) {
      w.z = total - i;
      newWidgetsOrder.push(w);
    }
  });
  // ★ แทนที่ config.widgets ด้วยลำดับใหม่ (เรียง z ต่ำ→สูง เพื่อให้ server reassign ถูก)
  //    DOM list เรียง z สูง→ต่ำ → กลับด้านเป็นต่ำ→สูง ก่อนเก็บ
  config.widgets = newWidgetsOrder.slice().reverse();
  renderAll();           // อัปเดต z-index บน canvas
  renderLayersList();    // อัปเดต label z:N
  saveLayoutDebounced(); // persist
}

function toggleWidgetVisibility(id) {
  const w = config.widgets.find(x => x.id === id);
  if (!w) return;
  w.enabled = w.enabled === false ? true : false;
  renderAll();
  renderLayersList();
  saveLayoutDebounced();
}

// ★ snap distance — ระยะที่ลากใกล้ขอบแล้ว "ดูด" ติด
const SNAP_PX = 12;

function enableDrag(el, w) {
  let startX, startY, origX, origY, dragging = false;
  el.addEventListener('mousedown', (e) => {
    // ไม่ drag ถ้าคลิกที่ handle หรือปุ่มลบ/settings
    if (e.target.classList.contains('resize-handle') ||
        e.target.classList.contains('delete-btn') ||
        e.target.classList.contains('settings-btn')) return;
    const wRef = getWidgetRef(el);   // ★ ใช้ reference ล่าสุดเสมอ
    dragging = true;
    el._isDragging = true;
    _isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    origX = wRef.x;
    origY = wRef.y;
    selectWidget(wRef.id);
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const wRef = getWidgetRef(el);   // ★ reference ล่าสุด
    let nx = origX + (e.clientX - startX);
    let ny = origY + (e.clientY - startY);
    // ★ จำกัดไม่ให้เลยขอบ canvas
    nx = Math.max(0, Math.min(nx, config.canvas_w - wRef.w));
    ny = Math.max(0, Math.min(ny, config.canvas_h - wRef.h));
    // ★ snap ขอบ canvas
    if (nx <= SNAP_PX) nx = 0;
    else if (nx >= config.canvas_w - wRef.w - SNAP_PX) nx = config.canvas_w - wRef.w;
    if (ny <= SNAP_PX) ny = 0;
    else if (ny >= config.canvas_h - wRef.h - SNAP_PX) ny = config.canvas_h - wRef.h;
    wRef.x = nx;   // ★ เขียนลง reference ล่าสุด (config.widgets ปัจจุบัน)
    wRef.y = ny;
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; el._isDragging = false; _isDragging = false; saveLayoutDebounced(); }
  });
}

function enableResize(el, handle, w) {
  let startX, startY, origW, origH, resizing = false;
  handle.addEventListener('mousedown', (e) => {
    const wRef = getWidgetRef(el);   // ★ reference ล่าสุด
    resizing = true;
    el._isResizing = true;
    _isResizing = true;
    startX = e.clientX;
    startY = e.clientY;
    origW = wRef.w;
    origH = wRef.h;
    e.preventDefault();
    e.stopPropagation();
  });
  document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const wRef = getWidgetRef(el);   // ★ reference ล่าสุด
    let nw = Math.max(50, origW + (e.clientX - startX));
    let nh = Math.max(30, origH + (e.clientY - startY));

    if (wRef.type === 'webcam') {
      // webcam — บังคับ ratio ตาม webcam_ratio
      nw = Math.min(nw, config.canvas_w - wRef.x);
      nh = computeRatioHeight(nw, wRef.webcam_ratio);
    } else if (wRef.lock_ratio && wRef.h > 0 && origH > 0 && origW > 0) {
      // ★ ratio lock — คำนวณ ratio จากขนาดเริ่มต้น (ปลอดภัย ไม่พึ่ง _lock_ratio)
      var ratio = origW / origH;
      let deltaX = e.clientX - startX;
      let deltaY = e.clientY - startY;
      let scaleX = (origW + deltaX) / origW;
      let scaleY = (origH + deltaY) / origH;
      let scale = (Math.abs(deltaX) > Math.abs(deltaY)) ? scaleX : scaleY;
      if (scale < 0.15) scale = 0.15;  // อย่าให้เล็กเกินไป
      nw = Math.max(50, Math.round(origW * scale));
      nh = Math.max(30, Math.round(nw / ratio));
      // จำกัดขอบ canvas
      nw = Math.min(nw, config.canvas_w - wRef.x);
      nh = Math.min(nh, config.canvas_h - wRef.y);
      // snap
      if (nw >= config.canvas_w - wRef.x - SNAP_PX) nw = config.canvas_w - wRef.x;
      if (nh >= config.canvas_h - wRef.y - SNAP_PX) nh = config.canvas_h - wRef.y;
      // ปรับให้ตรง ratio หลัง clamp — ใช้ ratio ที่คำนวณ (ไม่ใช้ _lock_ratio)
      nh = Math.max(30, Math.round(nw / ratio));
    } else {
      // อิสระ (ไม่ล็อค ratio)
      nw = Math.min(nw, config.canvas_w - wRef.x);
      nh = Math.min(nh, config.canvas_h - wRef.y);
      if (nw >= config.canvas_w - wRef.x - SNAP_PX) nw = config.canvas_w - wRef.x;
      if (nh >= config.canvas_h - wRef.y - SNAP_PX) nh = config.canvas_h - wRef.y;
    }

    wRef.w = nw;
    wRef.h = nh;
    el.style.width = nw + 'px';
    el.style.height = nh + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (resizing) { resizing = false; el._isResizing = false; _isResizing = false; saveLayoutDebounced(); }
  });
}

// ════════════════════════════════════════════════════════════
// Editor — Add widget + Save
// ════════════════════════════════════════════════════════════
const DEFAULT_SIZE = {

    '<p style="color:#aaa;font-size:13px;margin-bottom:16px;">คุณเล่นเพลงผ่านโปรแกรมอะไร?</p>' +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">' +
      '<button class="np-pick-btn" data-src="spotify" style="padding:12px 16px;background:rgba(29,215,96,0.15);border:1px solid #1ed760;border-radius:8px;color:#1ed760;cursor:pointer;font-size:14px;text-align:left;">🟢 Spotify <span style="color:#666;font-size:12px;">(แอป Spotify)</span></button>' +
      '<button class="np-pick-btn" data-src="ytmusic" style="padding:12px 16px;background:rgba(255,0,0,0.1);border:1px solid #ff0000;border-radius:8px;color:#ff4444;cursor:pointer;font-size:14px;text-align:left;">🔴 YouTube Music <span style="color:#666;font-size:12px;">(ytmdesktop)</span></button>' +
      '<button class="np-pick-btn" data-src="browser" style="padding:12px 16px;background:rgba(100,149,237,0.1);border:1px solid #6495ed;border-radius:8px;color:#6495ed;cursor:pointer;font-size:14px;text-align:left;">🌐 เบราว์เซอร์ <span style="color:#666;font-size:12px;">(Chrome/Edge — YouTube, SoundCloud)</span></button>' +
      '<button class="np-pick-btn" data-src="auto" style="padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid #333;border-radius:8px;color:#aaa;cursor:pointer;font-size:14px;text-align:left;">⚡ อัตโนมัติ <span style="color:#666;font-size:12px;">(จับอันที่กำลังเล่น)</span></button>' +
    '</div>' +
    '<button id="np-pick-cancel" style="padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid #333;border-radius:6px;color:#666;cursor:pointer;font-size:13px;width:100%;">ยกเลิก</button>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  var result = null;
  var buttons = box.querySelectorAll('.np-pick-btn');
  buttons.forEach(function(b) {
    b.onmouseenter = function() { b.style.filter = 'brightness(1.3)'; };
    b.onmouseleave = function() { b.style.filter = ''; };
    b.onclick = function() {
      result = b.dataset.src;
      overlay.remove();
    };
  });
  box.querySelector('#np-pick-cancel').onclick = function() {
    overlay.remove();
  };
  // click นอก box = ยกเลิก
  overlay.onclick = function(e) {
    if (e.target === overlay) overlay.remove();
  };

  // ★ synchronous — ใช้ while loop รอจนกว่า user จะเลือก (block UI)
  // ไม่สมบูรณ์แบบ แต่ใช้ได้กับ composer editor
  // ทางที่ดีกว่า: ใช้ callback แต่ต้อง refactor onclick ทั้งหมด
  // ตอนนี้ใช้วิธี return ค่าจากการรอ
  var start = Date.now();
  while (result === null && Date.now() - start < 100) {
    // ไม่สามารถ block ได้ใน browser — ต้องใช้ async pattern
    break;
  }
  // fallback: ถ้ายังไม่ได้เลือก (async) → default auto
  return result || 'auto';
}

// ════════════════════════════════════════════════════════════
// Per-widget style — apply จาก widget config → CSS
// ════════════════════════════════════════════════════════════
function applyWidgetStyle(inner, w) {
  if (!w) return;
  const fs = w.font_size || 16;
  const fc = w.font_color || '#ffffff';
  const fw = w.font_weight || '600';
  const stroke = w.text_stroke !== false
    ? `0 ${w.text_stroke_width || 2}px ${w.text_stroke_color || '#000000'}, 0 0 2px ${w.text_stroke_color || '#000000'}`
    : 'none';
  if (w.type === 'chat') {
    inner.style.fontSize = fs + 'px';
    inner.style.fontWeight = fw;
    inner.style.color = fc;
    inner.style.textShadow = stroke;
    // พื้นหลัง (ถ้ามี opacity > 0)
    if (w.bg_opacity > 0) {
      const hex = w.bg_color || '#000000';
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      inner.style.background = `rgba(${r},${g},${b},${w.bg_opacity})`;
    }
  } else if (w.type === 'viewer') {
    inner.style.fontSize = fs + 'px';
    inner.style.fontWeight = fw;
    inner.style.color = fc;
    inner.style.textShadow = stroke;
  } else if (w.type === 'clock') {
    // ★ ถ้ามี theme (ไม่ใช่ default) → อย่าใส่ inline color/textShadow ที่ตัว container
    //    แต่ยังอนุญาตให้ผู้ใช้ปรับ สีเวลา (time_color) + สีวันที่ (date_color) ผ่าน settings
    //    โดย apply บน element ย่อย (.clock-time / .clock-date) แทนทั้งกล่อง
    const theme = w.clock_theme || 'default';
    inner.style.fontSize = fs + 'px';
    if (theme === 'default') {
      // default theme → ใช้ inline style ตามที่ผู้ใช้ตั้ง (color/stroke)
      inner.style.fontWeight = fw;
      inner.style.color = fc;
      inner.style.textShadow = stroke;
    } else {
      // theme อื่นๆ → ให้ CSS class คุม container (อย่า override)
      inner.style.color = '';
      inner.style.textShadow = '';
      inner.style.fontWeight = '';
    }
    // ★ ปรับสีเวลา + สีวันที่ แยก (ใช้ได้ทุก theme — รวม pixel-rpg ที่ไม่มี !important แล้ว)
    const timeEl = inner.querySelector('.clock-time');
    if (timeEl && w.time_color) timeEl.style.color = w.time_color;
    const dateEl = inner.querySelector('.clock-date');
    if (dateEl && w.date_color) dateEl.style.color = w.date_color;
  }
}

// ★ helper: สร้าง HTML สำหรับแต่ละ type ของ input
function fld(label, html, id) {
  const idAttr = id ? ` data-fld="${id}"` : '';
  return `<div class="fld"${idAttr}><label>${label}</label>${html}</div>`;
}
function fldRow(label, checked, id) {
  const idAttr = id ? ` data-fld="${id}"` : '';
  return `<div class="fld row"${idAttr}><label>${label}</label><input type="checkbox" id="${id || ''}" ${checked ? 'checked' : ''}></div>`;
}
// ★ slider helper — แสดงค่าปัจจุบันข้าง slider + live update
function fldSlider(label, id, value, min, max, step, unit) {
  const u = unit || '';
  const v = (value != null) ? value : min;
  return `<div class="fld"><label>${label} <span class="slider-val" id="${id}-val">${v}${u}</span></label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step || 1}" value="${v}"
      oninput="document.getElementById('${id}-val').textContent=this.value+'${u}'">
  </div>`;
}
// ★ section wrapper — มี id เพื่อ show/hide ตาม mode
function section(id, title, innerHtml) {
  return `<div id="${id}" class="section-block"><div class="section-title">${title}</div>${innerHtml}</div>`;
}

function updateChatModeSections() {
  const modeSel = document.getElementById('f-appearance_mode');
  const mode = modeSel ? modeSel.value : 'default';
  const themeSel = document.getElementById('f-theme');
  const theme = themeSel ? themeSel.value : 'default';
  const show = (id, condition) => {
    const el = document.getElementById(id);
    if (el) el.style.display = condition ? '' : 'none';
  };
  // Appearance Mode + alpha = แสดงเสมอ
  // Theme picker = เฉพาะ mode=theme
  show('sec-theme', mode === 'theme');
  // Custom CSS = เฉพาะ mode=theme AND theme=custom
  show('sec-custom-css', mode === 'theme' && theme === 'custom');
  // Content/Font/Animation/Box/Event = เฉพาะ default + theme
  show('sec-content', mode === 'default' || mode === 'theme');
  show('sec-font', mode === 'default' || mode === 'theme');
  show('sec-animation', mode === 'default' || mode === 'theme');
  show('sec-box', mode === 'default' || mode === 'theme');
  show('sec-event', mode === 'default' || mode === 'theme');
  // Balloon = เฉพาะ mode=balloon
  show('sec-balloon', mode === 'balloon');
  // Character = เฉพาะ mode=character (รวม Default Image + Job Management ที่อยู่ข้างใน)
  show('sec-character', mode === 'character');
}

// ★ render default image preview
function renderDefaultImagePreview() {
  const container = document.getElementById('default-img-preview');
  if (!container) return;
  const imgPath = config.character_default_image || '';
  if (imgPath) {
    // ★ ใช้ /character/default จาก server (resolve_character_default_image จะจัดการ)
    container.innerHTML = `<img src="/character/default?t=${Date.now()}" title="คลิกเพื่อเปลี่ยน" onclick="openDefaultImagePicker()">` +
      `<div style="flex:1;"><div style="color:#e2e8f0;font-size:13px;font-weight:500;">ภาพที่กำหนดเอง</div><div style="color:#64748b;font-size:11px;">${escapeHtml(imgPath.split(/[/\\]/).pop())}</div></div>`;
  } else {
    container.innerHTML = `<img src="/character/default?t=${Date.now()}" title="คลิกเพื่อเปลี่ยน" onclick="openDefaultImagePicker()">` +
      `<div style="flex:1;"><div style="color:#e2e8f0;font-size:13px;font-weight:500;">avatar.png (default)</div><div style="color:#64748b;font-size:11px;">ภาพ default ของแอป</div></div>`;
  }
}

// ★ เปิด file picker สำหรับ default image
function openDefaultImagePicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/gif';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('job_name', 'default');
    fd.append('image', file);
    try {
      const r = await fetch('/upload-character-image', { method: 'POST', body: fd });
      const data = await r.json();
      if (data.ok) {
        config.character_default_image = data.path;
        renderDefaultImagePreview();
        applySettingsLive();
      } else {
        alert('อัพโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
      }
    } catch (e) {
      alert('อัพโหลดผิดพลาด: ' + e.message);
    }
  };
  input.click();
}

// ★ เปิด file picker (เลือกหลายรูปพร้อมกัน) → upload ทีละรูป
function openImagePicker(widgetId) {
  const w = config.widgets.find(x => x.id === widgetId);
  if (!w) return;
  if (!Array.isArray(w.images)) w.images = [];
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/gif';
  input.multiple = true;
  input.onchange = async () => {
    const files = Array.from(input.files || []);
    if (files.length === 0) return;
    let added = 0;
    for (const file of files) {
      if (w.images.length >= 20) {
        alert('ครบจำนวนสูงสุด 20 รูปแล้ว');
        break;
      }
      const fd = new FormData();
      fd.append('widget_id', widgetId);
      fd.append('image', file);
      try {
        const r = await fetch('/upload-widget-image', { method: 'POST', body: fd });
        const data = await r.json();
        if (data.ok) {
          w.images.push({ id: data.image_id, ext: data.ext });
          added++;
        } else {
          alert('อัพโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
        }
      } catch (e) {
        alert('อัพโหลดผิดพลาด: ' + e.message);
      }
    }
    if (added > 0) {
      // ★ อัปเดต counter + grid + live preview + save
      const titleEl = document.querySelector('#modal-fields .section-title');
      if (titleEl) titleEl.textContent = `🖼️ รูปภาพ (${w.images.length}/20)`;
      renderImageGrid(w);
      applySettingsLive();
    }
  };
  input.click();
}

// ★ render grid preview ของรูปที่อัปโหลด (พร้อมปุ่มลบแต่ละรูป)
function renderImageGrid(w) {
  const grid = document.getElementById('f-image-grid');
  if (!grid) return;
  const images = w.images || [];
  if (images.length === 0) {
    grid.innerHTML = '<p class="hint-text">ยังไม่มีรูป — กดปุ่มด้านบนเพื่อเพิ่ม</p>';
    return;
  }
  grid.innerHTML = images.map((img, i) => {
    const src = `/widget-image/${encodeURIComponent(w.id)}/${encodeURIComponent(img.id)}?t=${Date.now()}`;
    return `<div class="image-grid-item">
      <img src="${src}" alt="รูปที่ ${i+1}">
      <button type="button" class="image-grid-del" data-idx="${i}" title="ลบรูปนี้">✕</button>
      <span class="image-grid-idx">${i+1}</span>
    </div>`;
  }).join('');
  // ★ bind delete buttons
  grid.querySelectorAll('.image-grid-del').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.idx);
      const img = w.images[idx];
      if (!img) return;
      // ★ ลบจาก disk
      try {
        await fetch('/delete-widget-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ widget_id: w.id, image_id: img.id, ext: img.ext || '.png' }),
        });
      } catch (e) {}
      // ★ ลบจาก config
      w.images.splice(idx, 1);
      const titleEl = document.querySelector('#modal-fields .section-title');
      if (titleEl) titleEl.textContent = `🖼️ รูปภาพ (${w.images.length}/20)`;
      renderImageGrid(w);
      applySettingsLive();
    };
  });
}

// ★ render job list ใน modal (character mode)
function renderCharJobsList() {
  const container = document.getElementById('char-jobs-list');
  if (!container) return;
  const jobs = config.character_jobs || [];
  if (jobs.length === 0) {
    container.innerHTML = `<p class="hint-text">ยังไม่มี Job — เพิ่มได้ด้านล่าง</p>`;
    return;
  }
  let html = '';
  for (let i = 0; i < jobs.length; i++) {
    const job = jobs[i];
    // ★ preview รูป — ใช้ cache-bust เพื่อกัน browser cache รูปเก่า
    // (ถ้า job.image เป็น local path → browser ไม่สามารถโหลดได้ → ใช้ placeholder)
    // ★ จริงๆ ต้องใช้ /character/{job} จาก server (เหมือน overlay.html)
    const imgUrl = `/character/${encodeURIComponent(job.name || 'default')}?t=${Date.now()}`;
    const imgHtml = `<div class="char-job-preview" data-job-idx="${i}" title="คลิกเพื่อเปลี่ยนรูป" style="width:48px;height:48px;border-radius:6px;border:2px solid #334155;overflow:hidden;cursor:pointer;position:relative;flex-shrink:0;">
      <img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.innerHTML+='<div style=\\'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:9px;\\'>no img</div>';">
    </div>`;
    html += `<div class="char-job-row" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1e293b;">
      ${imgHtml}
      <span style="flex:1;color:#e2e8f0;font-size:13px;font-weight:500;">${escapeHtml(job.name || '')}</span>
      <button type="button" data-job-idx="${i}" class="upload-job-btn" title="อัพโหลดรูป" style="background:#10b981;color:#fff;border:none;border-radius:4px;padding:5px 9px;cursor:pointer;font-size:12px;">📁</button>
      <button type="button" data-job-idx="${i}" class="del-job-btn" title="ลบ Job" style="background:#ef4444;color:#fff;border:none;border-radius:4px;padding:5px 9px;cursor:pointer;font-size:12px;">🗑</button>
    </div>`;
  }
  container.innerHTML = html;
  // bind upload buttons + preview click
  container.querySelectorAll('.upload-job-btn, .char-job-preview').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.jobIdx);
      if (!isNaN(idx)) openJobImagePicker(idx);
    });
  });
  // bind delete buttons
  container.querySelectorAll('.del-job-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.jobIdx);
      if (!isNaN(idx) && config.character_jobs) {
        config.character_jobs.splice(idx, 1);
        renderCharJobsList();
        applySettingsLive();
      }
    });
  });
}

// ★ เปิด file picker สำหรับอัพโหลดรูป Job → POST /upload-character-image
function openJobImagePicker(idx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/gif';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const job = (config.character_jobs || [])[idx];
    if (!job) return;
    // สร้าง FormData สำหรับ multipart upload
    const fd = new FormData();
    fd.append('job_name', job.name);
    fd.append('image', file);
    try {
      const r = await fetch('/upload-character-image', { method: 'POST', body: fd });
      const data = await r.json();
      if (data.ok) {
        // อัปเดต job.image เป็น path ใหม่
        job.image = data.path;
        renderCharJobsList();
        applySettingsLive();
      } else {
        alert('อัพโหลดไม่สำเร็จ: ' + (data.error || 'unknown'));
      }
    } catch (e) {
      alert('อัพโหลดผิดพลาด: ' + e.message);
    }
  };
  input.click();
}

// ★ add job จาก modal input
function addCharJobFromModal() {
  const input = document.getElementById('f-new-job-name');
  if (!input || !input.value.trim()) return;
  const name = input.value.trim().toLowerCase();
  if (name === 'reset' || name === 'default') { alert('ชื่อ reserved ห้ามใช้'); return; }
  if (!config.character_jobs) config.character_jobs = [];
  if (config.character_jobs.some(j => j.name === name)) { alert('Job นี้มีอยู่แล้ว'); return; }
  config.character_jobs.push({ name, image: '' });
  input.value = '';
  renderCharJobsList();
  applySettingsLive();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ★ modal drag — ลากย้าย modal โดยจับที่ header
(function() {
  const header = document.getElementById('modal-header');
  const modal = document.getElementById('settings-modal');
  if (!header || !modal) return;
  let dragging = false, startX, startY, origLeft, origTop;
  header.addEventListener('mousedown', (e) => {
    // ไม่ drag ถ้าคลิกที่ปุ่ม
    if (e.target.tagName === 'BUTTON') return;
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = modal.getBoundingClientRect();
    origLeft = rect.left;
    origTop = rect.top;
    // ยกเลิก transform (กัน centering รบกวน)
    modal.style.transform = 'none';
    modal.style.left = origLeft + 'px';
    modal.style.top = origTop + 'px';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    let nx = origLeft + (e.clientX - startX);
    let ny = origTop + (e.clientY - startY);
    // จำกัดไม่ให้ออกจอ
    nx = Math.max(0, Math.min(nx, window.innerWidth - 100));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 60));
    modal.style.left = nx + 'px';
    modal.style.top = ny + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; });
})();

function closeSettingsModal() {
  document.getElementById('settings-overlay').classList.remove('active');
  const modal = document.getElementById('settings-modal');
  modal.classList.remove('active');
  // ★ reset position กลับกึ่งกลาง (ครั้งต่อไปที่เปิด)
  modal.style.transform = 'translateX(-50%)';
  modal.style.left = '';
  modal.style.top = '60px';
  modalWidgetId = null;
}

  if (get('f-w-width') !== null) {
    const newW = Math.max(20, parseInt(get('f-w-width')) || w.w);
    const newH = Math.max(20, parseInt(get('f-w-height')) || w.h);
    w.w = newW;
    w.h = newH;
    w.x = parseInt(get('f-w-x'));
    if (isNaN(w.x)) w.x = 0;
    w.y = parseInt(get('f-w-y'));
    if (isNaN(w.y)) w.y = 0;
    w.lock_ratio = getChecked('f-w-lock_ratio');
    if (w.lock_ratio && newH > 0) {
      w._lock_ratio = newW / newH;
    } else if (!w.lock_ratio) {
      delete w._lock_ratio;
    }
    // ★ sync ลง config.widgets ด้วย (resize handler อ่านจาก getWidgetRef)
    var wIdx = config.widgets.findIndex(function(x) { return x.id === w.id; });
    if (wIdx >= 0) {
      config.widgets[wIdx].lock_ratio = w.lock_ratio;
      if (w._lock_ratio) config.widgets[wIdx]._lock_ratio = w._lock_ratio;
      else delete config.widgets[wIdx]._lock_ratio;
    }
  }
}

function saveSettingsModal() {
  if (!modalWidgetId) return;
  const w = config.widgets.find(x => x.id === modalWidgetId);
  if (!w) return;
  readModalFields(w);
  saveLayoutDebounced();   // persist ลง server
  closeSettingsModal();
  renderAll();
}

// ★ live preview — เปลี่ยนค่าใน modal → apply ทันที + debounced save
let _liveSaveTimer = null;
function applySettingsLive() {
  if (!modalWidgetId) return;
  const w = config.widgets.find(x => x.id === modalWidgetId);
  if (!w) return;
  readModalFields(w);
  console.log('[DEBUG] applySettingsLive:', modalWidgetId, 'appearance:', w.appearance_mode, 'font_size:', w.font_size);
  renderAll();
  // re-select widget หลัง render (เพราะ renderAll สร้าง element ใหม่)
  selectWidget(modalWidgetId);
  // debounced save (500ms) — เหมือน settings auto-save ของแอป
  saveLayoutDebounced();
}

function saveLayoutDebounced() {
  if (_liveSaveTimer) clearTimeout(_liveSaveTimer);
  // ★ snapshot ค่าตอนนี้ (กัน WS push config ทับก่อน POST ส่งออก)
  const snapshot = JSON.parse(JSON.stringify({
    widgets: config.widgets,
    canvas_size: config.canvas_size,
    character_jobs: config.character_jobs || [],
    character_default_image: config.character_default_image || ''
  }));
  _liveSaveTimer = setTimeout(() => {
    fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(snapshot),
    }).catch(() => {});
  }, 200);
}

document.getElementById('modal-cancel').onclick = closeSettingsModal;
document.getElementById('modal-save').onclick = saveSettingsModal;
document.getElementById('modal-header-save').onclick = saveSettingsModal;
document.getElementById('settings-overlay').onclick = closeSettingsModal;

// ★ live preview — ทุก input/change/keyup ใน modal → applySettingsLive
document.getElementById('settings-modal').addEventListener('input', applySettingsLive);
document.getElementById('settings-modal').addEventListener('change', applySettingsLive);

// ════════════════════════════════════════════════════════════
// Zoom controls (editor mode)
// ════════════════════════════════════════════════════════════
document.getElementById('zoom-in').onclick = () => {
  zoomLevel = Math.min(2.0, Math.round((zoomLevel + 0.1) * 10) / 10);
  applyZoom();
};
document.getElementById('zoom-out').onclick = () => {
  zoomLevel = Math.max(0.1, Math.round((zoomLevel - 0.1) * 10) / 10);
  applyZoom();
};
document.getElementById('zoom-reset').onclick = () => { zoomLevel = 1.0; applyZoom(); };
document.getElementById('zoom-fit').onclick = zoomFit;

// ★ wheel zoom (Ctrl + scroll) — เหมือน Figma/Photoshop
document.getElementById('canvas').addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;   // ต้องกด Ctrl + scroll (กัน scroll ปกติ)
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  zoomLevel = Math.max(0.1, Math.min(2.0, Math.round((zoomLevel + delta) * 10) / 10));
  applyZoom();
}, { passive: false });

// ════════════════════════════════════════════════════════════
// Preview Mode toggle — ซ่อนกรอบ/handle/ปุ่ม เหลือแค่ widget content
// ════════════════════════════════════════════════════════════
document.getElementById('preview-toggle-btn').onclick = () => {
  const btn = document.getElementById('preview-toggle-btn');
  const isPreview = document.body.classList.toggle('preview-mode');
  if (isPreview) {
    btn.textContent = '✏️ แก้ไข';
    btn.classList.add('active');
  } else {
    btn.textContent = '👁 Preview';
    btn.classList.remove('active');
  }
};

// ════════════════════════════════════════════════════════════
// Keyboard nudge — ขยับ widget ด้วยปุ่มลูกศร (1px / Shift = 20px)
// ════════════════════════════════════════════════════════════
if (isEditor) {
  document.addEventListener('keydown', (e) => {
    // ★ ข้ามถ้ากำลังพิมพ์ใน input/textarea/select หรือ modal เปิดอยู่
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    const modal = document.getElementById('settings-modal');
    if (modal && modal.classList.contains('active')) return;
    // ★ ข้ามถ้าไม่มี widget ที่เลือก
    if (!selectedWidget) return;
    const arrows = { ArrowLeft: true, ArrowRight: true, ArrowUp: true, ArrowDown: true };
    if (!arrows[e.key]) return;
    e.preventDefault();
    const step = e.shiftKey ? 20 : 1;
    const w = config.widgets.find(x => x.id === selectedWidget);
    if (!w) return;
    if (e.key === 'ArrowLeft') w.x = Math.max(0, w.x - step);
    else if (e.key === 'ArrowRight') w.x = Math.min(config.canvas_w - w.w, w.x + step);
    else if (e.key === 'ArrowUp') w.y = Math.max(0, w.y - step);
    else if (e.key === 'ArrowDown') w.y = Math.min(config.canvas_h - w.h, w.y + step);
    // ★ อัปเดต DOM ทันที (ไม่รอ renderAll)
    const el = document.querySelector(`.widget[data-id="${selectedWidget}"]`);
    if (el) { el.style.left = w.x + 'px'; el.style.top = w.y + 'px'; }
    saveLayoutDebounced();
  });
}

// ════════════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════════════
if (isEditor) {
  document.body.classList.add('edit-mode');
} else {
  // ★ overlay mode (OBS) — ซ่อน editor UI ทั้งหมด (กัน cache ค้าง)
  const previewBtn = document.getElementById('preview-toggle-btn');
  if (previewBtn) previewBtn.style.display = 'none';
}
// โหลด config ครั้งแรก
fetch('/config').then(r => r.json()).then(c => {
  config = c;
  renderAll();
  // ★ editor mode → auto fit หลังโหลด (กัน canvas ใหญ่เกิน viewport)
  if (isEditor) setTimeout(zoomFit, 100);
}).catch(() => { renderAll(); });
connectWs();
</script>
</body>
</html>
