<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Viewer Overlay</title>
<style>
:root {
  --icon-size: 24px;
  --font-size: 18px;
  --font-color: #ffffff;
  --font-family: "Kanit", "Leelawadee UI", "Segoe UI", Tahoma, sans-serif;
  --font-weight: 700;
  --text-stroke: 2px #000000;
  --text-shadow: 0 1px 3px #000000;
  --item-gap: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font-family);
  font-weight: var(--font-weight);
}
#viewer {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: var(--align, center);
  gap: var(--item-gap);
  padding: 12px;
}
#viewer .v-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
#viewer .v-item img.v-icon {
  width: var(--icon-size);
  height: var(--icon-size);
  object-fit: contain;
  flex-shrink: 0;
  -webkit-user-drag: none;
}
#viewer .v-item .v-emoji {
  font-size: calc(var(--icon-size) * 1.1);
  line-height: 1;
}
#viewer .v-item .v-count {
  font-size: var(--font-size);
  color: var(--font-color);
  -webkit-text-stroke: var(--text-stroke);
  text-shadow: var(--text-shadow);
  paint-order: stroke fill;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
}
#placeholder {
  color: var(--font-color);
  font-size: var(--font-size);
  opacity: 0.4;
  -webkit-text-stroke: var(--text-stroke);
  paint-order: stroke fill;
}
/* Edit mode border */
body.setup { outline: 2px dashed #ef4444; outline-offset: -2px; }
body.setup #edit-hint {
  position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: #fbbf24; padding: 2px 10px;
  border-radius: 4px; font-size: 11px; font-family: 'Segoe UI', sans-serif;
  font-weight: 400;
}
#edit-hint { display: none; }
body.setup #edit-hint { display: block; }
</style>
</head>
<body>
<div id="edit-hint">⋮⋮ ลากปุ่ม Game Overlay เพื่อย้าย Viewer Overlay</div>
<div id="viewer">
  <span id="placeholder">👥 รอข้อมูล...</span>
</div>
<script>
let config = {
  mode: 'total',
  align: 'center',
  icon_size: 24,
  font_size: 18,
  font_color: '#ffffff',
  font_family: 'Kanit',
  font_weight: '700',
  text_stroke: true,
  text_stroke_color: '#000000',
  text_stroke_width: 2,
  text_shadow: true,
  text_shadow_color: '#000000',
  text_shadow_blur: 3,
};
let lastData = null;

function applyConfig(c) {
  config = Object.assign(config, c);
  const root = document.documentElement.style;
  root.setProperty('--icon-size', (config.icon_size || 24) + 'px');
  root.setProperty('--font-size', (config.font_size || 18) + 'px');
  root.setProperty('--align', config.align || 'center');
  root.setProperty('--font-color', config.font_color || '#ffffff');
  root.setProperty('--font-family', `"${config.font_family || 'Kanit'}","Leelawadee UI","Segoe UI",Tahoma,sans-serif`);
  root.setProperty('--font-weight', config.font_weight || '700');
  root.setProperty('--text-stroke', config.text_stroke
    ? `${config.text_stroke_width || 2}px ${config.text_stroke_color || '#000000'}` : '0 transparent');
  root.setProperty('--text-shadow', config.text_shadow
    ? `0 1px ${config.text_shadow_blur || 3}px ${config.text_shadow_color || '#000000'}` : 'none');
  // re-render ถ้ามีข้อมูลแล้ว (เปลี่ยน config → อัปเดตทันที)
  if (lastData) renderViewers(lastData);
  document.body.style.fontFamily = `"${config.font_family || 'Kanit'}","Leelawadee UI","Segoe UI",Tahoma,sans-serif`;
}

function renderViewers(data) {
  lastData = data;
  const el = document.getElementById('viewer');
  const mode = config.mode || 'total';
  const total = data.total || 0;
  const platforms = data.platforms || {};
  let html = '';
  if (mode === 'total') {
    html = `<span class="v-item"><span class="v-emoji">👥</span><span class="v-count">${total.toLocaleString()}</span></span>`;
  } else if (mode === 'per_platform') {
    const entries = Object.entries(platforms);
    if (entries.length === 0) {
      html = `<span class="v-item"><span class="v-emoji">👥</span><span class="v-count">0</span></span>`;
    } else {
      html = entries.map(([plat, count]) => {
        return `<span class="v-item"><img class="v-icon" src="/logo/${encodeURIComponent(plat)}" onerror="this.style.display='none'"><span class="v-count">${(count || 0).toLocaleString()}</span></span>`;
      }).join('');
    }
  } else {
    html = '';  // mode off → ว่าง
  }
  el.innerHTML = html;
}

// WebSocket
let ws = null;
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onmessage = (ev) => {
    try {
      const data = JSON.parse(ev.data);
      if (data.type === 'config') applyConfig(data.config);
      else if (data.type === 'viewers') renderViewers(data);
    } catch (e) { console.warn('WS error', e); }
  };
  ws.onclose = () => { setTimeout(connectWs, 1500); };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}

// load config on start
async function loadConfig() {
  try {
    const r = await fetch('/config');
    applyConfig(await r.json());
  } catch (e) { console.warn('config load failed', e); }
}

window.setEditMode = function(on) {
  document.body.classList.toggle('setup', on);
};

loadConfig().then(() => connectWs());
</script>
</body>
</html>
